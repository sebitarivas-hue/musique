<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SONORA Library</title>
<meta name="description" content="Des instruments et des effets prêts à l'emploi, écrits en SONORA : on les écoute, on les mesure, on les ouvre dans le Studio.">
<link rel="stylesheet" href="../studio/studio.css">
<link rel="stylesheet" href="../science/science.css">
<link rel="stylesheet" href="bibliotheque.css">
</head>
<body>
<a class="saut" href="#fiche">Aller au programme</a>
<header class="haut">
  <div class="marque"><a href="../../" class="retour" aria-label="Retour au cours">&#8249;</a><span class="nom">SONORA</span><span class="sous">Library</span></div>
  <nav class="actions" aria-label="Espaces SONORA"><a class="lien-bouton" href="../studio/index.html">Studio</a><a class="lien-bouton" href="../science/index.html">Science</a><a class="lien-bouton" href="../academy/index.html">Academy</a><a class="lien-bouton" aria-current="page" href="index.html">Library</a></nav>
  <div class="etat" id="etat" role="status" aria-live="polite">prêt</div>
</header>
<nav class="onglets-mobiles" aria-label="Panneaux" id="onglets-mobiles"><button type="button" data-p="liste" aria-pressed="true">Catalogue</button><button type="button" data-p="fiche" aria-pressed="false">Programme</button></nav>
<main id="sciences" data-actif="liste">
  <aside class="panneau" id="liste" aria-label="Catalogue">
    <div class="onglets" role="tablist" id="vues">
      <button type="button" role="tab" data-v="catalogue" aria-selected="true">Catalogue</button>
      <button type="button" role="tab" data-v="modules" aria-selected="false">Modules</button>
      <button type="button" role="tab" data-v="projets" aria-selected="false">Mes projets</button>
    </div>
    <div id="v-catalogue">
      <label class="champ">Chercher<input type="search" id="q" placeholder="batterie, filtre, stéréo, reverb..." autocomplete="off" aria-controls="resultats"></label>
      <div class="rang">
        <label class="champ" style="flex:1">Type<select id="f-type"><option value="">Tous</option><option value="instrument">Instruments</option><option value="effet">Effets</option></select></label>
        <label class="champ" style="flex:1">Niveau<select id="f-niveau"><option value="">Tous</option><option>Découverte</option><option>Programmation</option><option>Recherche</option></select></label>
      </div>
      <label class="champ">Module employé<select id="f-module"><option value="">Tous</option></select></label>
      <p class="petit" id="compte" role="status" aria-live="polite"></p>
      <ul class="liste-cat" id="resultats" aria-label="Résultats"></ul>
    </div>
    <div id="v-modules" hidden><p class="petit">Tous les modules du langage, avec leur état. Un clic montre où ils sont employés.</p><ul class="liste-cat" id="liste-modules"></ul></div>
    <div id="v-projets" hidden><p class="petit">Les projets enregistrés dans le Studio de ce navigateur.</p><ul class="liste-cat" id="liste-projets"></ul></div>
  </aside>
  <article class="panneau" id="fiche" aria-live="polite"></article>
</main>
<script type="module" src="bibliotheque.js"></script>
</body>
</html>
