<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIMBRE, la salle de jeux de l'oreille</title>
<meta name="description" content="TIMBRE : six jeux pour entraîner son oreille avec de vrais instruments enregistrés. Les questions sont tirées au hasard à chaque partie.">
<meta name="theme-color" content="#06070d">
<link rel="stylesheet" href="timbre.css?v=090ca757ad">
</head>
<body>
<div class="halos" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="fx" aria-hidden="true"></canvas>
<a class="saut" href="#jeu">Aller au jeu</a>
<header class="haut">
  <a class="retour" href="../../choix.html" aria-label="Retour au cours">&#8249;</a>
  <span class="marque">TIMBRE</span>
  <button type="button" class="joueur" id="joueur" aria-label="Mon niveau et ma collection"></button>
</header>
<main id="jeu" tabindex="-1">

  <section id="ecran-accueil" class="ecran" aria-labelledby="t-accueil">
    <h1 id="t-accueil" class="grand">Entraîne ton oreille.</h1>
    <p class="chapo">Six jeux, de vrais instruments. Les questions changent à chaque partie.</p>
    <div class="affiches" id="affiches" role="list"></div>
    <div class="points" id="points" aria-hidden="true"></div>
    <button type="button" class="bande-collection" id="vers-collection"></button>
  </section>

  <section id="ecran-niveaux" class="ecran" hidden aria-labelledby="t-niveaux">
    <button type="button" class="lien-retour" data-accueil>&#8249; Les jeux</button>
    <h2 id="t-niveaux" class="grand">Qui joue ?</h2>
    <div class="onglets" id="onglets" role="tablist" aria-label="Univers"></div>
    <div class="niveaux" id="niveaux"></div>
  </section>

  <section id="ecran-partie" class="ecran" hidden aria-label="Partie en cours">
    <div class="hud">
      <button type="button" class="rond" id="quitter" aria-label="Quitter la partie">&#10005;</button>
      <span class="hud-info" id="hud-info"></span>
      <span class="hud-vies" id="hud-vies"></span>
      <span class="hud-score" id="hud-score">0</span>
    </div>
    <div class="chrono" id="chrono" role="img" aria-label="Temps restant"><span id="chrono-barre"></span></div>
    <div class="zone" id="zone"></div>
    <div class="verdict" id="verdict" role="status" aria-live="polite" hidden></div>
  </section>

  <section id="ecran-fin" class="ecran" hidden aria-labelledby="t-fin">
    <p class="fin-mode" id="fin-mode"></p>
    <h2 id="t-fin" class="grand centre"></h2>
    <div class="etoiles-fin" id="etoiles-fin" role="img"></div>
    <p class="gros-score"><b id="fin-score">0</b><span>points</span></p>
    <p class="fin-detail" id="fin-detail"></p>
    <div class="fin-niveau" id="fin-niveau"></div>
    <div class="actions" id="fin-actions"></div>
    <div id="fin-retenir"></div>
  </section>

  <section id="ecran-collection" class="ecran" hidden aria-labelledby="t-collection">
    <button type="button" class="lien-retour" data-accueil>&#8249; Les jeux</button>
    <h2 id="t-collection" class="grand">Ma collection</h2>
    <p class="chapo" id="collection-bilan"></p>
    <div class="collection" id="collection"></div>
  </section>
</main>
<script type="module" src="timbre.js?v=090ca757ad"></script>
<script src="../barre-cours.js?v=090ca757ad"></script>
<script src="../retour.js?v=090ca757ad"></script>
</body>
</html>
