<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz de l'Atlas</title>
<meta name="description" content="Les quiz de l'Atlas des musiques, en voyage autour d'un globe : d'où vient cette musique, remets dans l'ordre, le mot juste, les musiques du cours, le fil du trajet. Questions tirées au hasard à chaque partie.">
<meta name="theme-color" content="#06070d">
<link rel="stylesheet" href="timbre.css?v=ccc22b0ed5">
<style>
.qa { max-width: 760px; margin: 0 auto; padding: 12px 16px 64px; }
.qa h1 { font: 900 clamp(2.2rem, 9vw, 3.6rem)/.95 var(--f-titre); font-stretch: 75%; text-transform: uppercase; margin: 10px 0 6px; letter-spacing: -.01em; }
.qa h1 span { color: var(--jaune); } .qa .chapo { color: var(--txt2); margin: 0 0 18px; }
.qa-jeux { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
a.qa-jeu { color: inherit; text-decoration: none; }
.qa-jeu { position: relative; display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 16px; border-radius: 20px; border: 2px solid var(--k); background: linear-gradient(160deg, color-mix(in srgb, var(--k) 30%, transparent), var(--verre)); cursor: pointer; box-shadow: 0 6px 0 color-mix(in srgb, var(--k) 55%, #000); transition: transform .12s; }
.qa-jeu:hover, .qa-jeu:focus-visible { transform: translateY(-2px); } .qa-jeu b { font: 800 1.2rem/1.1 var(--f-titre); } .qa-jeu span { color: var(--txt2); font-size: .92rem; }
.qa-jeu .qa-et { display: flex; gap: 4px; margin-top: 4px; } .qa-et i { width: 16px; height: 16px; opacity: .25; } .qa-et i.on { opacity: 1; } .qa-et svg { width: 100%; height: 100%; fill: var(--or); }
.qa-niv { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 0; } .qa-niv button { border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.08); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .85rem; }
.qa-niv button[disabled] { opacity: .45; cursor: not-allowed; }
.qa-hud { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 12px; color: var(--txt2); font-weight: 600; }
.qa-barre { height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; margin: 0 0 16px; } .qa-barre i { display: block; height: 100%; background: var(--c); transition: width .3s; }
.qa-q { background: var(--verre); border: 2px solid var(--neon); border-radius: 22px; padding: 18px; margin: 0 0 14px; }
.qa-q .qa-type { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--cyan); } .qa-q h2 { font: 800 clamp(1.25rem, 4.6vw, 1.7rem)/1.2 var(--f-titre); margin: 6px 0 8px; } .qa-q p { margin: 0; color: var(--txt2); font-size: 1.05rem; }
.qa-rep { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } @media (max-width: 520px) { .qa-rep { grid-template-columns: 1fr; } }
.qa-rep button { min-height: 64px; padding: 12px 14px; border-radius: 16px; border: 2px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); font-weight: 600; font-size: 1.02rem; text-align: left; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.qa-rep button:hover:not([disabled]) { border-color: var(--c); } .qa-rep button.ok { background: var(--vert); border-color: var(--vert); color: #04150b; } .qa-rep button.ko { background: var(--rouge); border-color: var(--rouge); }
.qa-rep button .qa-rang { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; margin-right: .5em; border-radius: 50%; background: var(--jaune); color: #000; font-weight: 800; }
.qa-retour { margin: 14px 0 0; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,.08); } .qa-retour.ok { border-left: 6px solid var(--vert); } .qa-retour.ko { border-left: 6px solid var(--rouge); }
.qa-retour p { margin: 4px 0; } .qa-retour .qa-type { display: block; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--cyan); margin: 0 0 2px; } .qa-retour a { color: var(--cyan); }
.qa-btn { display: inline-flex; align-items: center; gap: 8px; margin: 14px 8px 0 0; padding: 12px 20px; border-radius: 999px; border: 0; background: var(--jaune); color: #000; font-weight: 800; cursor: pointer; text-decoration: none; box-shadow: 0 4px 0 #a07c00; }
.qa-btn.clair { background: rgba(255,255,255,.12); color: #fff; box-shadow: none; border: 1px solid rgba(255,255,255,.35); }
.qa-fin { text-align: center; } .qa-fin .qa-score { font: 900 4rem/1 var(--f-titre); } .qa-fin .qa-et { justify-content: center; } .qa-fin .qa-et i { width: 44px; height: 44px; }
.qa-fin ul { text-align: left; color: var(--txt2); } .qa-ecoute a { margin-right: 10px; }
/* Le globe (globe.js) : la Terre en fond, le jeu par-dessus ; à gauche sur un grand écran, sous le globe sur un téléphone. */
body.globe-on { background: radial-gradient(120% 90% at 70% 30%, #10184a 0%, #060818 60%, #03040c 100%); }
#globe { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; pointer-events: none; }   /* décor : sans cela le globe, plein écran, avale le clic sur « Jouer » et « TIMBRE » (liens du haut, hors du bloc de jeu), 19/11/2026 */
body.globe-on .qa { position: relative; z-index: 2; }
body.globe-on .qa-q, body.globe-on .qa-retour, body.globe-on .qa-jeu, body.globe-on .qa-fin { backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
body.globe-on .qa-retour { background: rgba(9, 13, 52, .82); } body.globe-on .qa-fin { background: rgba(9, 13, 52, .78); border-radius: 26px; padding: 22px 18px; }
body.globe-on .qa-rep button:not(.ok):not(.ko) { background: rgba(9, 13, 52, .72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
@media (min-width: 901px) { body.globe-on .qa { margin: 0 0 0 3vw; max-width: 560px; } }
/* Sur un téléphone, pendant une partie : l'écran en deux, le globe fixé en haut, les questions qui défilent dessous. */
@media (max-width: 900px) { body.globe-on.partie #globe { height: 36vh; bottom: auto; z-index: 3; border-bottom: 1px solid rgba(53,224,255,.35); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  body.globe-on.partie .qa { padding-top: calc(36vh - 40px); } body.globe-on.partie .haut { position: relative; z-index: 5; } body.globe-on.partie .escale { z-index: 4; } }
.escale { position: fixed; z-index: 3; transform: translate(-50%, -100%); pointer-events: none; padding: 8px 14px 9px; border-radius: 14px; background: rgba(6, 9, 30, .86); border: 1.5px solid var(--c, #35e0ff);
  box-shadow: 0 0 24px color-mix(in srgb, var(--c, #35e0ff) 45%, transparent); text-align: center; white-space: nowrap; max-width: 70vw; overflow: hidden; text-overflow: ellipsis; transition: opacity .3s; }
.escale small { display: block; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); } .escale b { font-size: 1rem; } .escale[hidden] { display: none; }
.qa-voyage { display: inline-flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin: 8px 0 4px; padding: 10px 16px; border-radius: 999px; background: rgba(255,210,63,.12); border: 1px solid rgba(255,210,63,.5); color: var(--jaune); font-weight: 700; }
</style>
