<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalogue des scénarios SONORA</title>
<style>body{margin:0;padding:16px;background:#0b0d09;color:#f2efe6;font:15px/1.5 system-ui,sans-serif;max-width:1000px;margin-inline:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}td,th{border-top:1px solid #2e2e2a;padding:5px 6px;text-align:left;vertical-align:top}a{color:#b8f54a}</style></head><body>
<h1>Scénarios de synthèse et de traitement</h1><p><a href="../benchmark-dashboard.html">retour au banc</a>. Liste générée à partir de <code>scenarios.js</code> : ce qui est mesuré, par quel chemin audio, et ce qui ne l'est pas.</p><table id="t"></table>
<script type="module">import { SCENARIOS, PROFILS } from "../scenarios.js"; const prof = id => Object.entries(PROFILS).filter(([k, v]) => v.includes(id)).map(([k]) => k).join(", ") || "";
document.getElementById("t").innerHTML = "<tr><th>Id</th><th>Scénario</th><th>Chemin audio</th><th>Famille</th><th>Instances par défaut</th><th>Profils</th><th>Note</th></tr>" + SCENARIOS.map(s => `<tr><td>${s.id}</td><td>${s.nom}</td><td>${s.mode}</td><td>${s.famille}</td><td>${s.defaut?.instances ?? ""}</td><td>${prof(s.id)}</td><td>${s.raison || (s.mode === "natif" ? "nœuds Web Audio : durée de calcul inaccessible, jugé sur les coupures" : s.mode === "worklet" ? "noyau écrit pour le banc : charge mesurée" : "")}</td></tr>`).join("");</script></body></html>
