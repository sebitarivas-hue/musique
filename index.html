lasse. Expliquer la règle.", "criteres": [["Je respecte la règle du processus", "C1"], ["Notre composition applique une règle claire", "C3"], ["J'explique le lien entre règle et résultat", "C2"]], "attendus": ["Définir rapport, processus, stochastique.", "Citer Pythagore, Xenakis, Reich."]}}, {"fiches": ["histoire", "ecoute"], "objectifs": ["Comprendre la ramification des genres au XXIe siècle.", "Situer un morceau sur l'arbre des genres.", "Réussir l'oral du brevet."], "seances": [{"objectif": "L'arbre des genres", "etapes": [[5, "Échauffement corporel et vocal."], [25, "Du blues aux sous-genres d'aujourd'hui : construire l'arbre de la classe."], [20, "Chaque élève place un morceau et justifie."]]}, {"objectif": "Scènes expérimentales et pops du monde", "etapes": [[5, "Échauffement corporel et vocal."], [25, "Club expérimental, K-pop, pop quechua : industrie, langue, hybridation."], [20, "Choix des sujets d'oral."]]}, {"objectif": "Préparer l'oral", "etapes": [[45, "Méthode : présenter, situer, décrire, analyser, donner son avis. Préparation en binômes."], [5, "Calendrier."]]}, {"objectif": "Évaluation : oraux blancs", "etapes": [[50, "Passages devant la classe avec la grille du brevet."]]}], "trace": ["Depuis le disque et la radio, puis Internet, les genres se ramifient en sous-genres et en scènes.", "L'hybridation mêle les traditions : la pop quechua chante en langue andine sur des productions actuelles.", "La K-pop est à la fois une industrie, un style et une culture de la danse mondialisée.", "Pour présenter une œuvre : présenter, situer, décrire, analyser, donner son avis."], "devoirs": "Préparer et chronométrer sa présentation.", "eval": {"consigne": "Oral blanc de cinq minutes puis questions.", "criteres": [["Je présente et je situe l'œuvre", "C4"], ["Je décris et j'analyse avec le vocabulaire", "C2"], ["Je réponds aux questions avec précision", "C4"]], "attendus": ["Cinq minutes de présentation structurée.", "Au moins cinq mots de vocabulaire musical justes."]}}]}}, "fiches": {"parametres": {"titre": "Les paramètres du son", "niveaux": "6e, et révision pour tous", "html": "<p>Tout son peut être décrit par quatre paramètres. Ce sont les premiers mots de l&#x27;écoute.</p>\n<div class=\"tbl\"><table><thead><tr><th>Paramètre</th><th>Question</th><th>Vocabulaire</th></tr></thead><tbody><tr><td>La hauteur</td><td>Le son est-il grave ou aigu ?</td><td>grave, médium, aigu ; monter, descendre ; registre</td></tr><tr><td>La durée</td><td>Le son est-il long ou court ?</td><td>long, court, tenu, piqué (staccato), lié (legato)</td></tr><tr><td>L&#x27;intensité</td><td>Le son est-il fort ou doux ?</td><td>piano, forte, nuances, crescendo, decrescendo</td></tr><tr><td>Le timbre</td><td>Qui ou quoi produit le son ?</td><td>la couleur du son : voix, instrument, famille, mode de jeu</td></tr></tbody></table></div>\n<h3>Comment s&#x27;en servir à l&#x27;écoute</h3>\n<ul><li>Écouter une première fois sans rien écrire.</li><li>Choisir un paramètre à la fois et noter ce qui change.</li><li>Utiliser le mot juste plutôt qu&#x27;une impression : « c&#x27;est forte » plutôt que « ça fait du bruit ».</li></ul>"}, "nuances": {"titre": "L'intensité et les nuances", "niveaux": "6e à 3e", "html": "<p>Les nuances indiquent l&#x27;intensité du son. Elles s&#x27;écrivent en italien, abrégées, sous la portée.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 370 155\" width=\"100%\" role=\"img\" aria-label=\"Nuances\"><text x=\"30\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" font-weight=\"bold\" font-family=\"Georgia, serif\" fill=\"currentColor\">pp</text><text x=\"92\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" font-weight=\"bold\" font-family=\"Georgia, serif\" fill=\"currentColor\">p</text><text x=\"154\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" font-weight=\"bold\" font-family=\"Georgia, serif\" fill=\"currentColor\">mp</text><text x=\"216\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" font-weight=\"bold\" font-family=\"Georgia, serif\" fill=\"currentColor\">mf</text><text x=\"278\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" font-weight=\"bold\" font-family=\"Georgia, serif\" fill=\"currentColor\">f</text><text x=\"340\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" font-weight=\"bold\" font-family=\"Georgia, serif\" fill=\"currentColor\">ff</text><line x1=\"20\" y1=\"58\" x2=\"350\" y2=\"58\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\".4\"/><text x=\"20\" y=\"76\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\" opacity=\".75\">très doux</text><text x=\"350\" y=\"76\" text-anchor=\"end\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\" opacity=\".75\">très fort</text><path d=\"M30 110 L150 98 M30 110 L150 122\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"/><text x=\"90\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">crescendo</text><path d=\"M220 98 L340 110 M220 122 L340 110\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"/><text x=\"280\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">decrescendo</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Signe</th><th>Nom italien</th><th>Sens</th></tr></thead><tbody><tr><td>pp</td><td>pianissimo</td><td>très doux</td></tr><tr><td>p</td><td>piano</td><td>doux</td></tr><tr><td>mp</td><td>mezzo piano</td><td>moyennement doux</td></tr><tr><td>mf</td><td>mezzo forte</td><td>moyennement fort</td></tr><tr><td>f</td><td>forte</td><td>fort</td></tr><tr><td>ff</td><td>fortissimo</td><td>très fort</td></tr><tr><td>cresc. ou &lt;</td><td>crescendo</td><td>de plus en plus fort</td></tr><tr><td>decresc. ou &gt;</td><td>decrescendo ou diminuendo</td><td>de plus en plus doux</td></tr><tr><td>sf</td><td>sforzando</td><td>une note soudainement accentuée</td></tr><tr><td>&gt;</td><td>accent</td><td>la note est appuyée</td></tr></tbody></table></div>\n<h3>À retenir</h3>\n<ul><li>Une nuance est toujours relative : un forte de flûte n&#x27;a pas la puissance d&#x27;un forte de trompette.</li><li>Les nuances servent l&#x27;expression : le Boléro de Ravel est un long crescendo de quinze minutes.</li></ul>"}, "tempo": {"titre": "Le tempo et la pulsation", "niveaux": "6e à 3e", "html": "<p>La pulsation est le battement régulier de la musique. Le tempo est sa vitesse, mesurée en battements par minute (BPM).</p>\n<div class=\"tbl\"><table><thead><tr><th>Terme</th><th>Caractère</th><th>Ordre d&#x27;idée</th></tr></thead><tbody><tr><td>Largo</td><td>très lent, large</td><td>40 à 60 BPM</td></tr><tr><td>Adagio</td><td>lent</td><td>60 à 75 BPM</td></tr><tr><td>Andante</td><td>allant, à la vitesse de la marche</td><td>75 à 105 BPM</td></tr><tr><td>Moderato</td><td>modéré</td><td>105 à 120 BPM</td></tr><tr><td>Allegro</td><td>rapide, joyeux</td><td>120 à 155 BPM</td></tr><tr><td>Presto</td><td>très rapide</td><td>plus de 170 BPM</td></tr></tbody></table></div>\n<h3>Les changements de tempo</h3>\n<ul><li>Accelerando : en accélérant.</li><li>Ritardando ou rallentando : en ralentissant.</li><li>A tempo : on reprend le tempo de départ.</li><li>Point d&#x27;orgue : une note tenue aussi longtemps que voulu.</li></ul>"}, "figures": {"titre": "Les figures de notes et de silences", "niveaux": "6e, 5e, rappel en 4e et 3e", "html": "<p>Les figures indiquent la durée des sons et des silences. L&#x27;unité de temps la plus courante au collège est la noire.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 440 130\" width=\"100%\" role=\"img\" aria-label=\"Figures de notes\"><ellipse cx=\"40\" cy=\"70\" rx=\"7.5\" ry=\"5.2\" transform=\"rotate(-20 40 70)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"43\" y=\"100\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Ronde</text><text x=\"43\" y=\"117\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">4 temps</text><ellipse cx=\"125\" cy=\"70\" rx=\"7.5\" ry=\"5.2\" transform=\"rotate(-20 125 70)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"131.5\" y1=\"68\" x2=\"131.5\" y2=\"32\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"128\" y=\"100\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Blanche</text><text x=\"128\" y=\"117\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">2 temps</text><ellipse cx=\"210\" cy=\"70\" rx=\"7.5\" ry=\"5.2\" transform=\"rotate(-20 210 70)\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"216.5\" y1=\"68\" x2=\"216.5\" y2=\"32\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"213\" y=\"100\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Noire</text><text x=\"213\" y=\"117\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">1 temps</text><ellipse cx=\"295\" cy=\"70\" rx=\"7.5\" ry=\"5.2\" transform=\"rotate(-20 295 70)\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"301.5\" y1=\"68\" x2=\"301.5\" y2=\"32\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M301.5 32 q14 10 6 26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"/><text x=\"298\" y=\"100\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Croche</text><text x=\"298\" y=\"117\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">1/2 temps</text><ellipse cx=\"380\" cy=\"70\" rx=\"7.5\" ry=\"5.2\" transform=\"rotate(-20 380 70)\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"386.5\" y1=\"68\" x2=\"386.5\" y2=\"32\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M386.5 32 q14 10 6 26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"/><path d=\"M386.5 41 q14 10 6 26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"/><text x=\"383\" y=\"100\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Double croche</text><text x=\"383\" y=\"117\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">1/4 temps</text></svg></figure>\n<figure class=\"fig\"><svg viewBox=\"0 0 340 120\" width=\"100%\" role=\"img\" aria-label=\"Silences\"><line x1=\"22\" y1=\"50\" x2=\"58\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"31\" y=\"50\" width=\"18\" height=\"8\" fill=\"currentColor\"/><text x=\"40\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Pause</text><text x=\"40\" y=\"107\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">4 temps</text><line x1=\"107\" y1=\"50\" x2=\"143\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"116\" y=\"42\" width=\"18\" height=\"8\" fill=\"currentColor\"/><text x=\"125\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Demi-pause</text><text x=\"125\" y=\"107\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">2 temps</text><path d=\"M204 28 l10 11 l-9 9 l10 11 q-12 -4 -7 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linejoin=\"round\"/><text x=\"210\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Soupir</text><text x=\"210\" y=\"107\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">1 temps</text><circle cx=\"290\" cy=\"38\" r=\"4\" fill=\"currentColor\"/><path d=\"M290 41 q8 3 12 -3 l-10 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><text x=\"295\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Demi-soupir</text><text x=\"295\" y=\"107\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">1/2 temps</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Durée</th><th>Note</th><th>Silence correspondant</th></tr></thead><tbody><tr><td>4 temps</td><td>ronde</td><td>pause</td></tr><tr><td>2 temps</td><td>blanche</td><td>demi-pause</td></tr><tr><td>1 temps</td><td>noire</td><td>soupir</td></tr><tr><td>1/2 temps</td><td>croche</td><td>demi-soupir</td></tr><tr><td>1/4 temps</td><td>double croche</td><td>quart de soupir</td></tr></tbody></table></div>\n<h3>Le point et la liaison</h3>\n<ul><li>Un point après une note ajoute la moitié de sa durée : une blanche pointée dure trois temps.</li><li>Une liaison entre deux notes de même hauteur additionne leurs durées.</li><li>Deux croches réunies par une barre (ligature) valent un temps.</li></ul>"}, "plans": {"titre": "Les plans sonores et la texture", "niveaux": "5e à 3e", "html": "<p>Dans une musique, tous les sons n&#x27;ont pas la même importance. On distingue ce qui est au premier plan de ce qui accompagne.</p>\n<div class=\"tbl\"><table><thead><tr><th>Notion</th><th>Définition</th><th>Exemple</th></tr></thead><tbody><tr><td>Premier plan</td><td>ce que l&#x27;oreille suit d&#x27;abord, souvent la mélodie</td><td>la voix dans une chanson</td></tr><tr><td>Arrière-plan</td><td>ce qui accompagne et soutient</td><td>la guitare, la basse, la batterie</td></tr><tr><td>Monodie</td><td>une seule mélodie, sans accompagnement</td><td>chant grégorien</td></tr><tr><td>Homophonie</td><td>une mélodie accompagnée par des accords qui suivent le même rythme</td><td>un choral, un hymne</td></tr><tr><td>Polyphonie</td><td>plusieurs mélodies indépendantes en même temps</td><td>Janequin, un canon</td></tr><tr><td>Bourdon</td><td>une note tenue sous la mélodie</td><td>cornemuse, Douce dame jolie</td></tr><tr><td>Ostinato</td><td>un motif répété sous ou avec la mélodie</td><td>le rythme du Boléro</td></tr></tbody></table></div>\n<h3>Pour l&#x27;écoute</h3>\n<ul><li>Qu&#x27;est-ce que j&#x27;entends en premier ? Qu&#x27;est-ce qui est derrière ?</li><li>Combien de couches sonores ? Changent-elles au cours de l&#x27;extrait ?</li><li>Le premier plan passe-t-il d&#x27;un instrument à un autre ?</li></ul>"}, "instruments": {"titre": "Les familles d'instruments", "niveaux": "6e à 3e", "html": "<p>Les instruments se classent selon la manière dont le son est produit. L&#x27;orchestre symphonique réunit quatre familles.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 400 265\" width=\"100%\" role=\"img\" aria-label=\"Plan de l'orchestre\"><path d=\"M15 215 A185 185 0 0 1 385 215\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"200\" y=\"48\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Percussions</text><path d=\"M55 215 A145 145 0 0 1 345 215\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"200\" y=\"88\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Cuivres</text><path d=\"M95 215 A105 105 0 0 1 305 215\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"200\" y=\"128\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Bois</text><path d=\"M135 215 A65 65 0 0 1 265 215\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"200\" y=\"168\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Cordes</text><line x1=\"0\" y1=\"215\" x2=\"400\" y2=\"215\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\".4\"/><circle cx=\"200\" cy=\"215\" r=\"6\" fill=\"currentColor\"/><text x=\"200\" y=\"237\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">chef d'orchestre</text><text x=\"200\" y=\"255\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">le public</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Famille</th><th>Comment le son est produit</th><th>Instruments</th></tr></thead><tbody><tr><td>Cordes frottées</td><td>un archet frotte les cordes</td><td>violon, alto, violoncelle, contrebasse</td></tr><tr><td>Cordes pincées</td><td>les doigts pincent les cordes</td><td>harpe, guitare, clavecin</td></tr><tr><td>Cordes frappées</td><td>un marteau frappe les cordes</td><td>piano</td></tr><tr><td>Bois</td><td>le souffle passe par un biseau ou une anche</td><td>flûte, hautbois, clarinette, basson, saxophone</td></tr><tr><td>Cuivres</td><td>les lèvres vibrent dans une embouchure</td><td>trompette, cor, trombone, tuba</td></tr><tr><td>Percussions à hauteur déterminée</td><td>on frappe, la note est précise</td><td>timbales, xylophone, glockenspiel</td></tr><tr><td>Percussions à hauteur indéterminée</td><td>on frappe, sans note précise</td><td>caisse claire, grosse caisse, cymbales, triangle</td></tr><tr><td>Électroniques</td><td>le son est produit ou transformé électriquement</td><td>synthétiseur, guitare électrique, ordinateur</td></tr></tbody></table></div>\n<h3>À savoir</h3>\n<ul><li>Le saxophone est en métal mais c&#x27;est un bois : il a une anche.</li><li>La flûte traversière, en métal aussi, est un bois : le son naît d&#x27;un biseau.</li><li>Du plus aigu au plus grave chez les cordes : violon, alto, violoncelle, contrebasse.</li></ul>"}, "voix": {"titre": "Les voix", "niveaux": "6e à 4e", "html": "<p>La tessiture est l&#x27;étendue des notes qu&#x27;une voix peut chanter confortablement.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 400 175\" width=\"100%\" role=\"img\" aria-label=\"Tessitures des voix\"><text x=\"62\" y=\"27\" text-anchor=\"end\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Soprano</text><rect x=\"210\" y=\"15\" width=\"168\" height=\"14\" rx=\"7\" fill=\"currentColor\" opacity=\".75\"/><text x=\"62\" y=\"57\" text-anchor=\"end\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Alto</text><rect x=\"161\" y=\"45\" width=\"168\" height=\"14\" rx=\"7\" fill=\"currentColor\" opacity=\".75\"/><text x=\"62\" y=\"87\" text-anchor=\"end\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Ténor</text><rect x=\"126\" y=\"75\" width=\"168\" height=\"14\" rx=\"7\" fill=\"currentColor\" opacity=\".75\"/><text x=\"62\" y=\"117\" text-anchor=\"end\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Basse</text><rect x=\"70\" y=\"105\" width=\"168\" height=\"14\" rx=\"7\" fill=\"currentColor\" opacity=\".75\"/><line x1=\"70\" y1=\"130\" x2=\"70\" y2=\"136\" stroke=\"currentColor\"/><text x=\"70\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">mi 1</text><line x1=\"126\" y1=\"130\" x2=\"126\" y2=\"136\" stroke=\"currentColor\"/><text x=\"126\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">do 2</text><line x1=\"210\" y1=\"130\" x2=\"210\" y2=\"136\" stroke=\"currentColor\"/><text x=\"210\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">do 3</text><line x1=\"294\" y1=\"130\" x2=\"294\" y2=\"136\" stroke=\"currentColor\"/><text x=\"294\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">do 4</text><line x1=\"378\" y1=\"130\" x2=\"378\" y2=\"136\" stroke=\"currentColor\"/><text x=\"378\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">do 5</text><line x1=\"70\" y1=\"130\" x2=\"388\" y2=\"130\" stroke=\"currentColor\" opacity=\".5\"/><text x=\"70\" y=\"168\" font-size=\"11\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">grave</text><text x=\"388\" y=\"168\" text-anchor=\"end\" font-size=\"11\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">aigu</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Voix</th><th>Qui</th><th>Registre</th></tr></thead><tbody><tr><td>Soprano</td><td>femmes, enfants</td><td>la plus aiguë</td></tr><tr><td>Mezzo-soprano</td><td>femmes</td><td>entre soprano et alto</td></tr><tr><td>Alto (ou contralto)</td><td>femmes, enfants</td><td>grave chez les femmes</td></tr><tr><td>Ténor</td><td>hommes</td><td>aigu chez les hommes</td></tr><tr><td>Baryton</td><td>hommes</td><td>entre ténor et basse</td></tr><tr><td>Basse</td><td>hommes</td><td>la plus grave</td></tr></tbody></table></div>\n<h3>Les ensembles</h3>\n<ul><li>Soliste : un chanteur seul.</li><li>Duo, trio, quatuor : deux, trois, quatre chanteurs.</li><li>Chœur : un groupe de chanteurs, souvent réparti en pupitres (soprano, alto, ténor, basse).</li><li>A cappella : sans instrument.</li><li>La mue : vers 12 à 15 ans, la voix des garçons descend d&#x27;environ une octave.</li></ul>"}, "formes": {"titre": "Les formes musicales", "niveaux": "5e à 3e", "html": "<p>La forme est le plan d&#x27;un morceau : comment ses parties s&#x27;enchaînent et reviennent. On la note avec des lettres.</p>\n<div class=\"tbl\"><table><thead><tr><th>Forme</th><th>Schéma</th><th>Exemple étudié</th></tr></thead><tbody><tr><td>Couplet-refrain</td><td>A B A&#x27; B A&#x27;&#x27; B</td><td>Le Déserteur, la plupart des chansons</td></tr><tr><td>Forme ABA</td><td>A B A</td><td>un air d&#x27;opéra, une danse avec trio</td></tr><tr><td>Rondo</td><td>A B A C A</td><td>un refrain instrumental qui revient entre des couplets différents</td></tr><tr><td>Thème et variations</td><td>A A1 A2 A3</td><td>Mozart, Ah vous dirai-je maman</td></tr><tr><td>Canon</td><td>une mélodie, des départs décalés</td><td>Viva la musica, Pachelbel</td></tr><tr><td>Ostinato</td><td>un motif répété du début à la fin</td><td>Ravel, Boléro</td></tr><tr><td>Grille de blues</td><td>12 mesures, I I I I / IV IV I I / V IV I I</td><td>When the Saints, Robert Johnson</td></tr></tbody></table></div>\n<h3>Repérer une forme</h3>\n<ul><li>Écouter quand un passage revient à l&#x27;identique.</li><li>Noter A pour la première idée, B pour la deuxième, A&#x27; si A revient modifié.</li><li>Compter les mesures ou les phrases si c&#x27;est possible.</li></ul>"}, "gammes": {"titre": "Gammes et modes", "niveaux": "5e à 3e", "html": "<p>Une gamme est une suite de notes rangées du grave à l&#x27;aigu. Elle donne sa couleur à une musique.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 300 170\" width=\"100%\" role=\"img\" aria-label=\"Clavier et gamme pentatonique\"><rect x=\"10\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"30.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">do</text><rect x=\"50\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"70.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">ré</text><rect x=\"90\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"110.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">mi</text><rect x=\"130\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"150.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">fa</text><rect x=\"170\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"190.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">sol</text><rect x=\"210\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"230.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">la</text><rect x=\"250\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"270.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">si</text><rect x=\"38\" y=\"10\" width=\"24\" height=\"80\" fill=\"currentColor\"/><rect x=\"78\" y=\"10\" width=\"24\" height=\"80\" fill=\"currentColor\"/><rect x=\"158\" y=\"10\" width=\"24\" height=\"80\" fill=\"currentColor\"/><rect x=\"198\" y=\"10\" width=\"24\" height=\"80\" fill=\"currentColor\"/><rect x=\"238\" y=\"10\" width=\"24\" height=\"80\" fill=\"currentColor\"/><text x=\"150\" y=\"160\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">Les cinq touches noires forment une gamme pentatonique.</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Gamme</th><th>Notes (exemple)</th><th>Couleur, usage</th></tr></thead><tbody><tr><td>Majeure</td><td>do ré mi fa sol la si do</td><td>souvent lumineuse ; la plupart des hymnes</td></tr><tr><td>Mineure</td><td>la si do ré mi fa sol la</td><td>souvent sombre ou mélancolique</td></tr><tr><td>Pentatonique</td><td>do ré mi sol la (ou les cinq touches noires)</td><td>musiques d&#x27;Asie, d&#x27;Afrique, folk, blues</td></tr><tr><td>Blues</td><td>do mi bémol fa fa dièse sol si bémol do</td><td>blues, jazz, rock ; les « blue notes »</td></tr></tbody></table></div>\n<ul><li>Majeur et mineur ne veulent pas dire gai et triste : ce sont des tendances, pas des règles.</li><li>Une même mélodie jouée en mineur change de caractère : c&#x27;est un procédé de variation.</li></ul>"}, "ecoute": {"titre": "Méthode du commentaire d'écoute", "niveaux": "5e à 3e, et oral du brevet", "html": "<p>Commenter une œuvre, c&#x27;est passer de « j&#x27;aime » à « voici ce que j&#x27;entends, et ce que ça produit ».</p>\n<div class=\"tbl\"><table><thead><tr><th>Étape</th><th>Je me demande</th><th>J&#x27;écris</th></tr></thead><tbody><tr><td>1. Présenter</td><td>Qui ? Quoi ? Quand ?</td><td>titre, compositeur, date, genre</td></tr><tr><td>2. Situer</td><td>Dans quel contexte ?</td><td>époque, lieu, événement, commande</td></tr><tr><td>3. Décrire</td><td>Qu&#x27;est-ce que j&#x27;entends ?</td><td>instruments ou voix, tempo, nuances, plans sonores, forme</td></tr><tr><td>4. Analyser</td><td>Comment la musique produit-elle son effet ?</td><td>un procédé précis relié à une impression</td></tr><tr><td>5. Conclure</td><td>Qu&#x27;est-ce que j&#x27;en pense, et pourquoi ?</td><td>un avis argumenté, une comparaison avec une autre œuvre</td></tr></tbody></table></div>\n<h3>La grille d&#x27;écoute rapide</h3>\n<ul><li>Je repère : un instrument, un retour, un changement.</li><li>Je nomme : avec le vocabulaire de la classe.</li><li>Je relie : à une œuvre étudiée, à un contexte, à une émotion justifiée.</li></ul>"}, "lexique": {"titre": "Lexique de l'année", "niveaux": "6e à 3e", "html": "<div class=\"tbl\"><table><thead><tr><th>Mot</th><th>Définition</th></tr></thead><tbody><tr><td>A cappella</td><td>chant sans accompagnement instrumental</td></tr><tr><td>Accelerando</td><td>en accélérant</td></tr><tr><td>Air</td><td>à l&#x27;opéra, moment chanté qui exprime un sentiment</td></tr><tr><td>Bourdon</td><td>note tenue sous la mélodie</td></tr><tr><td>Boucle</td><td>extrait sonore répété en continu</td></tr><tr><td>Cadence</td><td>dans un concerto, passage où le soliste joue seul</td></tr><tr><td>Canon</td><td>même mélodie avec départs décalés</td></tr><tr><td>Chorus</td><td>solo improvisé en jazz</td></tr><tr><td>Cluster</td><td>agrégat de notes très proches</td></tr><tr><td>Concerto</td><td>œuvre pour soliste et orchestre</td></tr><tr><td>Crescendo</td><td>de plus en plus fort</td></tr><tr><td>Diégétique</td><td>musique que les personnages du film entendent</td></tr><tr><td>Dissonance</td><td>rencontre de notes qui crée une tension</td></tr><tr><td>Distorsion</td><td>son saturé de la guitare électrique</td></tr><tr><td>Flow</td><td>manière de poser le texte sur le rythme en rap</td></tr><tr><td>Improvisation</td><td>musique inventée en la jouant</td></tr><tr><td>Leitmotiv</td><td>thème associé à un personnage ou une idée</td></tr><tr><td>Livret</td><td>texte d&#x27;un opéra</td></tr><tr><td>Monodie</td><td>une seule mélodie</td></tr><tr><td>Ostinato</td><td>motif répété</td></tr><tr><td>Polyphonie</td><td>plusieurs mélodies simultanées</td></tr><tr><td>Pulsation</td><td>battement régulier de la musique</td></tr><tr><td>Récitatif</td><td>à l&#x27;opéra, chant proche de la parole qui fait avancer l&#x27;action</td></tr><tr><td>Sample</td><td>extrait sonore réutilisé</td></tr><tr><td>Swing</td><td>balancement rythmique du jazz</td></tr><tr><td>Tempo</td><td>vitesse de la musique</td></tr><tr><td>Timbre</td><td>couleur du son</td></tr><tr><td>Tutti</td><td>tout l&#x27;orchestre joue</td></tr><tr><td>Unisson</td><td>tous chantent la même mélodie</td></tr><tr><td>Variation</td><td>transformation d&#x27;un thème</td></tr></tbody></table></div>"}, "origines": {"titre": "Aux origines de la musique", "niveaux": "6e", "html": "<p>Le mot musique vient du grec mousikè (technè) : l&#x27;art des Muses. Dans la mythologie, les neuf Muses sont les filles de Zeus et de Mnémosyne, la mémoire.</p>\n<div class=\"tbl\"><table><thead><tr><th>Repère</th><th>Date</th><th>Ce que l&#x27;on sait</th></tr></thead><tbody><tr><td>Flûtes en os de Hohle Fels et de Geissenklösterle (Allemagne)</td><td>environ 40 000 ans</td><td>les plus anciens instruments retrouvés</td></tr><tr><td>Harpes et lyres d&#x27;Ur (Mésopotamie)</td><td>vers 2500 av. J.-C.</td><td>instruments à cordes richement décorés</td></tr><tr><td>Hymne hourrite n° 6 (Ougarit, Syrie)</td><td>vers 1400 av. J.-C.</td><td>la plus ancienne mélodie notée connue</td></tr><tr><td>Épitaphe de Seikilos (Turquie actuelle)</td><td>Ier siècle</td><td>la plus ancienne composition complète connue</td></tr></tbody></table></div>\n<h3>Trois façons de produire un son</h3>\n<ul><li>Souffler : flûte, conque, trompe.</li><li>Frotter ou pincer une corde : arc musical, lyre, harpe.</li><li>Frapper : tambours, bâtons, pierres, gongs.</li></ul>\n<p>La voix est le premier instrument. Certaines traditions orales, comme les polyphonies des Pygmées Aka, se transmettent depuis des siècles sans aucune écriture.</p>"}, "notation": {"titre": "L'histoire de la notation", "niveaux": "6e, rappel en 5e", "html": "<p>Écrire la musique permet de la conserver et de la transmettre sans l&#x27;avoir entendue. La notation occidentale actuelle est née au Moyen Âge, dans les monastères.</p>\n<div class=\"tbl\"><table><thead><tr><th>Étape</th><th>Date</th><th>Principe</th></tr></thead><tbody><tr><td>Notation grecque</td><td>Antiquité</td><td>des lettres au-dessus des syllabes (Épitaphe de Seikilos)</td></tr><tr><td>Neumes</td><td>IXe siècle</td><td>des signes qui montrent si la mélodie monte ou descend</td></tr><tr><td>Portée de Guido d&#x27;Arezzo</td><td>vers 1025</td><td>des lignes pour fixer la hauteur exacte des notes</td></tr><tr><td>Notation mesurée</td><td>XIIIe et XIVe siècles</td><td>des formes de notes pour indiquer les durées</td></tr><tr><td>Notation moderne</td><td>XVIIe siècle</td><td>barres de mesure, figures actuelles, ut devient do</td></tr></tbody></table></div>\n<figure class=\"fig\"><svg viewBox=\"0 0 420 112\" width=\"100%\" role=\"img\" aria-label=\"Les six syllabes de Guido sur la portée\"><line x1=\"10\" y1=\"30\" x2=\"410\" y2=\"30\" stroke=\"currentColor\" stroke-width=\"1\"/><line x1=\"10\" y1=\"40\" x2=\"410\" y2=\"40\" stroke=\"currentColor\" stroke-width=\"1\"/><line x1=\"10\" y1=\"50\" x2=\"410\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"1\"/><line x1=\"10\" y1=\"60\" x2=\"410\" y2=\"60\" stroke=\"currentColor\" stroke-width=\"1\"/><line x1=\"10\" y1=\"70\" x2=\"410\" y2=\"70\" stroke=\"currentColor\" stroke-width=\"1\"/><line x1=\"49\" y1=\"80\" x2=\"71\" y2=\"80\" stroke=\"currentColor\" stroke-width=\"1\"/><ellipse cx=\"60\" cy=\"80\" rx=\"7\" ry=\"5\" transform=\"rotate(-20 60 80)\" fill=\"currentColor\"/><text x=\"60\" y=\"104\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">ut</text><ellipse cx=\"120\" cy=\"75\" rx=\"7\" ry=\"5\" transform=\"rotate(-20 120 75)\" fill=\"currentColor\"/><text x=\"120\" y=\"104\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">ré</text><ellipse cx=\"180\" cy=\"70\" rx=\"7\" ry=\"5\" transform=\"rotate(-20 180 70)\" fill=\"currentColor\"/><text x=\"180\" y=\"104\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">mi</text><ellipse cx=\"240\" cy=\"65\" rx=\"7\" ry=\"5\" transform=\"rotate(-20 240 65)\" fill=\"currentColor\"/><text x=\"240\" y=\"104\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">fa</text><ellipse cx=\"300\" cy=\"60\" rx=\"7\" ry=\"5\" transform=\"rotate(-20 300 60)\" fill=\"currentColor\"/><text x=\"300\" y=\"104\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">sol</text><ellipse cx=\"360\" cy=\"55\" rx=\"7\" ry=\"5\" transform=\"rotate(-20 360 55)\" fill=\"currentColor\"/><text x=\"360\" y=\"104\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">la</text></svg></figure>\n<h3>Ut queant laxis, hymne à saint Jean-Baptiste</h3>\n<p>Guido d&#x27;Arezzo remarque que chaque vers de cet hymne commence une note plus haut. Il nomme les notes avec la première syllabe de chaque vers.</p>\n<div class=\"tbl\"><table><thead><tr><th>Vers latin</th><th>Syllabe</th></tr></thead><tbody><tr><td>Ut queant laxis</td><td>ut (do)</td></tr><tr><td>Resonare fibris</td><td>ré</td></tr><tr><td>Mira gestorum</td><td>mi</td></tr><tr><td>Famuli tuorum</td><td>fa</td></tr><tr><td>Solve polluti</td><td>sol</td></tr><tr><td>Labii reatum</td><td>la</td></tr><tr><td>Sancte Iohannes</td><td>si (ajouté plus tard)</td></tr></tbody></table></div>"}, "histoire": {"titre": "Les grandes époques de la musique", "niveaux": "6e à 3e", "html": "<figure class=\"fig\"><svg viewBox=\"0 0 512 80\" width=\"100%\" role=\"img\" aria-label=\"Frise des grandes époques\"><rect x=\"8\" y=\"30\" width=\"59\" height=\"26\" rx=\"4\" fill=\"currentColor\" opacity=\"0.35\"/><text x=\"37.5\" y=\"22\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-family=\"sans-serif\">Antiquité</text><text x=\"8\" y=\"70\" font-size=\"8.5\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">avant J.-C.</text><rect x=\"70\" y=\"30\" width=\"59\" height=\"26\" rx=\"4\" fill=\"currentColor\" opacity=\"0.43\"/><text x=\"99.5\" y=\"22\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-family=\"sans-serif\">Moyen Âge</text><text x=\"70\" y=\"70\" font-size=\"8.5\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">500</text><rect x=\"132\" y=\"30\" width=\"59\" height=\"26\" rx=\"4\" fill=\"currentColor\" opacity=\"0.51\"/><text x=\"161.5\" y=\"22\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-family=\"sans-serif\">Renaissance</text><text x=\"132\" y=\"70\" font-size=\"8.5\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">1400</text><rect x=\"194\" y=\"30\" width=\"59\" height=\"26\" rx=\"4\" fill=\"currentColor\" opacity=\"0.59\"/><text x=\"223.5\" y=\"22\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-family=\"sans-serif\">Baroque</text><text x=\"194\" y=\"70\" font-size=\"8.5\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">1600</text><rect x=\"256\" y=\"30\" width=\"59\" height=\"26\" rx=\"4\" fill=\"currentColor\" opacity=\"0.67\"/><text x=\"285.5\" y=\"22\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-family=\"sans-serif\">Classique</text><text x=\"256\" y=\"70\" font-size=\"8.5\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">1750</text><rect x=\"318\" y=\"30\" width=\"59\" height=\"26\" rx=\"4\" fill=\"currentColor\" opacity=\"0.75\"/><text x=\"347.5\" y=\"22\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-family=\"sans-serif\">Romantique</text><text x=\"318\" y=\"70\" font-size=\"8.5\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">1820</text><rect x=\"380\" y=\"30\" width=\"59\" height=\"26\" rx=\"4\" fill=\"currentColor\" opacity=\"0.83\"/><text x=\"409.5\" y=\"22\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-family=\"sans-serif\">Moderne</text><text x=\"380\" y=\"70\" font-size=\"8.5\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">1900</text><rect x=\"442\" y=\"30\" width=\"59\" height=\"26\" rx=\"4\" fill=\"currentColor\" opacity=\"0.91\"/><text x=\"471.5\" y=\"22\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-family=\"sans-serif\">Contemporain</text><text x=\"442\" y=\"70\" font-size=\"8.5\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">1945</text><text x=\"504\" y=\"70\" text-anchor=\"end\" font-size=\"8.5\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">auj.</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Époque</th><th>Dates</th><th>Repères</th></tr></thead><tbody><tr><td>Antiquité</td><td>jusqu&#x27;au Ve siècle</td><td>Égypte, Mésopotamie, Grèce, Pythagore</td></tr><tr><td>Moyen Âge</td><td>Ve au XIVe siècle</td><td>chant grégorien, École de Notre-Dame (Léonin, Pérotin), troubadours, Machaut</td></tr><tr><td>Renaissance</td><td>XVe et XVIe siècles</td><td>Josquin des Prez, Janequin, Palestrina ; plus loin : Dufay, Ockeghem</td></tr><tr><td>Baroque</td><td>1600 à 1750</td><td>Monteverdi, Lully, Bach, Vivaldi, Haendel, Rameau ; plus loin : Frescobaldi, Charpentier, Couperin</td></tr><tr><td>Classique</td><td>1750 à 1820</td><td>Gluck, Haydn, Mozart, Beethoven</td></tr><tr><td>Romantique</td><td>XIXe siècle</td><td>Schubert, Berlioz, Chopin, Wagner, Verdi</td></tr><tr><td>Moderne</td><td>1890 à 1945</td><td>Debussy, Stravinsky, Schoenberg, Varèse, Messiaen ; naissance du jazz et du disque</td></tr><tr><td>Contemporain</td><td>depuis 1945</td><td>Schaeffer, Boulez, Xenakis, Ligeti, Reich, Grisey ; rock, rap, électro, genres mondialisés</td></tr></tbody></table></div>\n<p>Les dates sont des repères : les styles se chevauchent et changent progressivement.</p>"}, "physique": {"titre": "Le son, du point de vue de la physique", "niveaux": "4e et 3e", "html": "<p>Un son est une vibration qui se propage dans l&#x27;air sous forme d&#x27;onde. Il ne se propage pas dans le vide.</p>\n<div class=\"tbl\"><table><thead><tr><th>Grandeur</th><th>Unité</th><th>Ce que l&#x27;on entend</th></tr></thead><tbody><tr><td>Fréquence</td><td>hertz (Hz)</td><td>la hauteur : plus la fréquence est grande, plus le son est aigu</td></tr><tr><td>Amplitude</td><td>décibel (dB) pour le niveau sonore</td><td>l&#x27;intensité : fort ou doux</td></tr><tr><td>Spectre (harmoniques)</td><td>fréquences multiples de la fondamentale</td><td>le timbre</td></tr></tbody></table></div>\n<figure class=\"fig\"><svg viewBox=\"0 0 420 158\" width=\"100%\" role=\"img\" aria-label=\"Spectre harmonique\"><line x1=\"30\" y1=\"120\" x2=\"400\" y2=\"120\" stroke=\"currentColor\"/><line x1=\"30\" y1=\"120\" x2=\"30\" y2=\"15\" stroke=\"currentColor\"/><rect x=\"66\" y=\"25.0\" width=\"12\" height=\"95.0\" fill=\"currentColor\" opacity=\".8\"/><text x=\"72\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\" font-family=\"sans-serif\">1f</text><rect x=\"108\" y=\"65.43682813764084\" width=\"12\" height=\"54.56317186235916\" fill=\"currentColor\" opacity=\".8\"/><text x=\"114\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\" font-family=\"sans-serif\">2f</text><rect x=\"150\" y=\"80.55185357884196\" width=\"12\" height=\"39.44814642115804\" fill=\"currentColor\" opacity=\".8\"/><text x=\"156\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\" font-family=\"sans-serif\">3f</text><rect x=\"192\" y=\"88.66168711914376\" width=\"12\" height=\"31.338312880856236\" fill=\"currentColor\" opacity=\".8\"/><text x=\"198\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\" font-family=\"sans-serif\">4f</text><rect x=\"234\" y=\"93.78513643223692\" width=\"12\" height=\"26.21486356776308\" fill=\"currentColor\" opacity=\".8\"/><text x=\"240\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\" font-family=\"sans-serif\">5f</text><rect x=\"276\" y=\"97.34298954916679\" width=\"12\" height=\"22.65701045083321\" fill=\"currentColor\" opacity=\".8\"/><text x=\"282\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\" font-family=\"sans-serif\">6f</text><rect x=\"318\" y=\"99.97164994978823\" width=\"12\" height=\"20.028350050211777\" fill=\"currentColor\" opacity=\".8\"/><text x=\"324\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\" font-family=\"sans-serif\">7f</text><rect x=\"360\" y=\"102.00086577268902\" width=\"12\" height=\"17.999134227310975\" fill=\"currentColor\" opacity=\".8\"/><text x=\"366\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\" font-family=\"sans-serif\">8f</text><text x=\"215\" y=\"152\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">fréquence : la fondamentale f, puis les harmoniques 2f, 3f, 4f…</text><text x=\"34\" y=\"12\" font-size=\"10\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">amplitude</text></svg></figure>\n<ul><li>L&#x27;oreille humaine entend environ de 20 Hz à 20 000 Hz.</li><li>Le la du diapason est fixé à 440 Hz.</li><li>Au-delà de 85 dB, une exposition prolongée abîme l&#x27;audition : se protéger.</li></ul>\n<h3>Les instruments électroniques</h3>\n<ul><li>Thérémine (Léon Theremin, vers 1920) : on joue sans toucher l&#x27;instrument.</li><li>Ondes Martenot (1928).</li><li>Musique concrète (Pierre Schaeffer, 1948) et électronique (Studio de Cologne, années 1950).</li><li>Synthèse par ordinateur (Bell Labs, années 1950 et 1960) ; Ircam (1977).</li></ul>"}, "maths": {"titre": "Musique et mathématiques", "niveaux": "6e (Pythagore), 3e", "html": "<p>Selon la tradition, Pythagore aurait découvert que les intervalles agréables à l&#x27;oreille correspondent à des rapports simples de longueurs de corde.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 470 125\" width=\"100%\" role=\"img\" aria-label=\"Le monocorde de Pythagore\"><line x1=\"20\" y1=\"22\" x2=\"300\" y2=\"22\" stroke=\"currentColor\" stroke-width=\"3\"/><line x1=\"300\" y1=\"22\" x2=\"300\" y2=\"22\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\" opacity=\".5\"/><text x=\"310\" y=\"26\" font-size=\"11\" fill=\"currentColor\" font-family=\"sans-serif\">corde entière, son de départ</text><line x1=\"20\" y1=\"52\" x2=\"160.0\" y2=\"52\" stroke=\"currentColor\" stroke-width=\"3\"/><line x1=\"160.0\" y1=\"52\" x2=\"300\" y2=\"52\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\" opacity=\".5\"/><text x=\"310\" y=\"56\" font-size=\"11\" fill=\"currentColor\" font-family=\"sans-serif\">moitié : 1/2, octave</text><line x1=\"20\" y1=\"82\" x2=\"206.66666666666666\" y2=\"82\" stroke=\"currentColor\" stroke-width=\"3\"/><line x1=\"206.66666666666666\" y1=\"82\" x2=\"300\" y2=\"82\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\" opacity=\".5\"/><text x=\"310\" y=\"86\" font-size=\"11\" fill=\"currentColor\" font-family=\"sans-serif\">deux tiers : 2/3, quinte</text><line x1=\"20\" y1=\"112\" x2=\"230.0\" y2=\"112\" stroke=\"currentColor\" stroke-width=\"3\"/><line x1=\"230.0\" y1=\"112\" x2=\"300\" y2=\"112\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\" opacity=\".5\"/><text x=\"310\" y=\"116\" font-size=\"11\" fill=\"currentColor\" font-family=\"sans-serif\">trois quarts : 3/4, quarte</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Rapport</th><th>Intervalle</th><th>Exemple</th></tr></thead><tbody><tr><td>2/1</td><td>octave</td><td>do grave, do aigu</td></tr><tr><td>3/2</td><td>quinte</td><td>do, sol</td></tr><tr><td>4/3</td><td>quarte</td><td>do, fa</td></tr></tbody></table></div>\n<h3>Composer avec des règles et des probabilités</h3>\n<ul><li>Le canon et la fugue appliquent des règles strictes d&#x27;imitation.</li><li>Jeu de dés musical attribué à Mozart (1792) : des mesures tirées au hasard.</li><li>Iannis Xenakis, ingénieur et architecte, utilise les probabilités pour organiser des masses de sons : c&#x27;est la musique stochastique (Metastaseis, 1954).</li><li>La musique répétitive de Steve Reich applique un processus du début à la fin.</li><li>Aujourd&#x27;hui, des algorithmes recommandent et génèrent de la musique.</li></ul>"}}, "pages": {"partenariats": "<h2>Les lieux de musique autour du collège</h2>\n<h3>À Ablon-sur-Seine</h3>\n<ul><li>Espace culturel Alain-Poher : la salle Charlie-Chaplin (430 places), une petite scène, un studio de danse et un forum d&#x27;exposition, avec une saison de spectacles toute l&#x27;année.</li><li>Médiathèque Jacques-Prévert, avenue Auguste-Duru, dans l&#x27;Espace Alain-Poher : elle fait partie du réseau des dix médiathèques de Grand-Orly Seine Bièvre, avec une carte unique.</li></ul>\n<h3>Les conservatoires du territoire</h3>\n<p>Grand-Orly Seine Bièvre compte douze conservatoires en réseau : Arcueil, Athis-Mons, Cachan, Fresnes, Gentilly, L&#x27;Haÿ-les-Roses, Juvisy-sur-Orge, Le Kremlin-Bicêtre, Savigny-sur-Orge, Villejuif, Villeneuve-Saint-Georges et Viry-Châtillon. Les plus proches d&#x27;Ablon sont Athis-Mons, Villeneuve-Saint-Georges et Juvisy-sur-Orge. Chaque printemps, le Printemps des conservatoires propose concerts et portes ouvertes.</p>\n<h3>Pour aller plus loin</h3>\n<ul><li>Philharmonie de Paris : concerts et ateliers pour les jeunes.</li><li>Radio France : concerts à la Maison de la Radio et de la Musique.</li><li>Orchestre national d&#x27;Île-de-France : concerts dans toute la région.</li><li>Sons d&#x27;hiver : festival de jazz du Val-de-Marne, chaque hiver.</li><li>MAC VAL, Vitry-sur-Seine : le musée d&#x27;art contemporain du Val-de-Marne.</li></ul>\n<p>Les sorties et les concerts organisés avec la classe sont annoncés aux familles par l&#x27;établissement.</p>", "cadre": "<h2>Comment fonctionne le cours</h2>\n<h3>Une heure par semaine, quatre compétences</h3>\n<p>Le cours d&#x27;éducation musicale a lieu une heure par semaine, de la 6e à la 3e. Il travaille quatre compétences, définies par les programmes officiels.</p>\n<p>En 6e (cycle 3) :</p>\n<ul><li>C1 Chanter et interpréter</li><li>C2 Écouter, comparer et commenter</li><li>C3 Explorer, imaginer et créer</li><li>C4 Échanger, partager et argumenter</li></ul>\n<p>De la 5e à la 3e (cycle 4) :</p>\n<ul><li>C1 Réaliser des projets musicaux d&#x27;interprétation ou de création</li><li>C2 Écouter, comparer, construire une culture musicale commune</li><li>C3 Explorer, imaginer, créer et produire</li><li>C4 Échanger, partager, argumenter et débattre</li></ul>\n<h3>Le fil des quatre années</h3>\n<ul><li>6e : aux origines de la musique, jusqu&#x27;à l&#x27;invention de la notation.</li><li>5e : le Moyen Âge et la Renaissance.</li><li>4e : de Versailles au phonographe.</li><li>3e : la modernité, le son électronique et les musiques d&#x27;aujourd&#x27;hui. En 3e, l&#x27;oral du brevet peut porter sur une œuvre étudiée en classe.</li></ul>\n<h3>Comment je suis évalué</h3>\n<p>Chaque séquence se termine par une évaluation qui porte uniquement sur ce qui a été travaillé en classe. Les critères sont connus à l&#x27;avance : ils sont dans la rubrique Réviser.</p>\n<div class=\"tbl\"><table><thead><tr><th>Niveau</th><th>Intitulé</th><th>Ce que cela veut dire</th></tr></thead><tbody><tr><td>1</td><td>Maîtrise insuffisante</td><td>je ne sais pas encore le faire, même aidé</td></tr><tr><td>2</td><td>Maîtrise fragile</td><td>je sais le faire avec de l&#x27;aide</td></tr><tr><td>3</td><td>Maîtrise satisfaisante</td><td>je sais le faire seul</td></tr><tr><td>4</td><td>Très bonne maîtrise</td><td>je sais le faire seul et l&#x27;expliquer aux autres</td></tr></tbody></table></div>\n<p>Le chant est évalué en petit groupe, jamais seul devant la classe.</p>\n<p>Les quiz du site sont des entraînements : ils ne sont pas notés et rien n&#x27;est enregistré.</p>\n<h3>Calendrier 2026-2027 (zone C)</h3>\n<div class=\"tbl\"><table><thead><tr><th>Période</th><th>Semaines de cours</th></tr></thead><tbody><tr><td>1</td><td>du 2 novembre au 18 décembre</td></tr><tr><td>2</td><td>du 4 janvier au 5 février</td></tr><tr><td>3</td><td>du 22 février au 2 avril</td></tr><tr><td>4</td><td>du 19 avril au 21 mai</td></tr><tr><td>5</td><td>du 24 mai au 3 juillet</td></tr></tbody></table></div>", "ressources": "<h2>Pour aller plus loin</h2>\n<h3>Écouter et découvrir</h3>\n<ul><li>Philharmonie de Paris : concerts, ateliers et ressources pour les jeunes.</li><li>Radio France : concerts et émissions sur la musique.</li><li>Lumni : vidéos courtes sur les œuvres et les compositeurs.</li></ul>\n<h3>Partitions libres</h3>\n<ul><li>IMSLP : partitions du domaine public (Machaut, Josquin, Bach, Mozart, Debussy…).</li></ul>\n<h3>Outils gratuits pour créer</h3>\n<ul><li>MuseScore : écrire une partition.</li><li>Audacity : enregistrer et monter du son.</li><li>Chrome Music Lab : expérimenter le rythme, la mélodie et le son, dans le navigateur.</li><li>BandLab : créer des boucles et de la musique électronique en ligne.</li></ul>\n<h3>Programmer le son : Faust</h3>\n<p>Les sons de ce site ont été calculés avec Faust, un langage créé au GRAME, Centre national de création musicale, à Lyon.</p>\n<ul><li>L&#x27;éditeur Faust en ligne : on écrit quelques lignes, on entend le son aussitôt. <a href=\"https://faustide.grame.fr\" target=\"_blank\" rel=\"noopener\">https://faustide.grame.fr</a></li><li>Une première ligne à essayer : <code>import(&quot;stdfaust.lib&quot;); process = os.osc(440) * 0.2;</code> (un son pur à 440 Hz, le la du diapason).</li><li>Le tutoriel progressif de Stéphane Letz (en anglais), du premier son jusqu&#x27;à une réverbération complète : <a href=\"https://sletz.github.io/faust-tutorial/\" target=\"_blank\" rel=\"noopener\">https://sletz.github.io/faust-tutorial/</a></li><li>Le site de Faust : <a href=\"https://faust.grame.fr\" target=\"_blank\" rel=\"noopener\">https://faust.grame.fr</a></li></ul>\n<h3>Bien écouter</h3>\n<p>Au-delà de 85 décibels, une écoute prolongée abîme l&#x27;audition. Avec un casque, garde un volume modéré et fais des pauses.</p>"}, "prive": false, "quiz": {"6e": [[["D'où vient le mot musique ?", ["Du latin musca", "Du grec mousikè, l'art des Muses", "De l'anglais music"], 1, "Mousikè désigne en grec l'art des Muses, filles de Zeus et de Mnémosyne, la mémoire."], ["Quel âge ont environ les plus anciennes flûtes retrouvées ?", ["400 ans", "4 000 ans", "40 000 ans"], 2, "Les flûtes en os de Hohle Fels et de Geissenklösterle ont environ 40 000 ans."], ["Un son grave ou aigu : de quel paramètre parle-t-on ?", ["La hauteur", "La durée", "Le timbre"], 0, "La hauteur dit si un son est grave ou aigu."], ["Qu'est-ce que le timbre ?", ["La force du son", "La couleur du son, qui permet de reconnaître une voix ou un instrument", "La vitesse de la musique"], 1, "Le timbre est la couleur du son. La force du son, c'est l'intensité."]], [["Quelle est la plus ancienne mélodie notée connue ?", ["L'Épitaphe de Seikilos", "L'Hymne hourrite n° 6", "Ut queant laxis"], 1, "L'Hymne hourrite n° 6, gravé à Ougarit vers 1400 avant J.-C."], ["L'Épitaphe de Seikilos est…", ["la plus ancienne composition complète connue", "un instrument grec", "un opéra"], 0, "Elle date du Ier siècle et nous est parvenue avec sa notation complète."], ["Une corde deux fois plus courte fait entendre…", ["la quinte", "l'octave", "le même son"], 1, "Rapport 1/2 : l'octave. C'est l'expérience du monocorde de Pythagore."], ["Quel rapport de longueur donne la quinte ?", ["2/3", "1/4", "3/1"], 0, "Les deux tiers de la corde font entendre la quinte."]], [["Comment notait-on la musique au IXe siècle ?", ["Avec des neumes", "Avec des notes sur une portée de cinq lignes", "On ne la notait pas du tout"], 0, "Les neumes sont des signes au-dessus des paroles qui montrent si la mélodie monte ou descend."], ["Qui a placé les notes sur des lignes, vers 1025 ?", ["Mozart", "Guido d'Arezzo", "Pythagore"], 1, "Guido d'Arezzo invente la portée, vers 1025."], ["D'où viennent les noms ut, ré, mi, fa, sol, la ?", ["De l'hymne à saint Jean-Baptiste, Ut queant laxis", "D'un chant grec", "Des lettres de l'alphabet"], 0, "Chaque vers de l'hymne commence une note plus haut : Guido prend la première syllabe."], ["Quelle est la voix la plus grave ?", ["Le soprano", "Le ténor", "La basse"], 2, "Du grave à l'aigu : basse, ténor, alto, soprano."]], [["Que veut dire transmission orale ?", ["La musique s'apprend d'un musicien à l'autre, sans partition", "La musique est écrite sur un livre", "On écoute la radio"], 0, "Beaucoup de traditions se transmettent de mémoire, de génération en génération."], ["Depuis quand les polyphonies des Pygmées Aka sont-elles au patrimoine de l'Unesco ?", ["1960", "2003", "2020"], 1, "Elles sont inscrites au patrimoine culturel immatériel depuis 2003."], ["Le gamelan de Java est surtout composé de…", ["violons et violoncelles", "gongs et métallophones", "guitares électriques"], 1, "Le gamelan réunit des gongs et des métallophones qui jouent des cycles."], ["Une polyrythmie, c'est…", ["un seul rythme très rapide", "plusieurs rythmes différents superposés", "un silence"], 1, "Poly veut dire plusieurs : plusieurs rythmes en même temps."]], [["Combien de familles réunit l'orchestre symphonique ?", ["Deux", "Quatre", "Huit"], 1, "Cordes, bois, cuivres, percussions."], ["Où sont placées les percussions dans l'orchestre ?", ["Devant, près du chef", "Au fond", "Dans le public"], 1, "Les cordes sont devant, les percussions au fond."], ["Le saxophone est en métal. Dans quelle famille est-il ?", ["Les cuivres", "Les bois", "Les percussions"], 1, "Il a une anche : c'est un bois."], ["Dans le Boléro, Ravel fait passer la même mélodie…", ["d'un timbre à l'autre, dans un long crescendo", "de plus en plus vite", "en changeant de mélodie à chaque fois"], 0, "La mélodie reste la même ; les instruments changent et l'intensité augmente."]]], "5e": [[["Une seule mélodie, chantée à l'unisson, s'appelle…", ["une polyphonie", "une monodie", "un canon"], 1, "Mono : une seule. Le chant grégorien est une monodie."], ["L'organum, c'est…", ["un instrument à clavier", "une voix ajoutée au chant grégorien", "une danse"], 1, "L'organum ajoute une voix au chant grégorien : c'est le début de la polyphonie."], ["Où naît la polyphonie écrite, vers 1200 ?", ["À Notre-Dame de Paris", "À Versailles", "À Rome"], 0, "À Notre-Dame, vers 1160-1250, avec Léonin puis Pérotin."], ["La teneur est…", ["la voix qui tient le chant grégorien en notes longues", "la voix la plus aiguë", "un instrument"], 0, "La teneur tient la mélodie grégorienne, souvent très étirée."]], [["Les troubadours chantaient surtout…", ["la guerre", "l'amour courtois", "la messe"], 1, "L'amour courtois, aux XIIe et XIIIe siècles."], ["Troubadours et trouvères : quelle différence ?", ["Les troubadours sont du sud (langue d'oc), les trouvères du nord (langue d'oïl)", "Aucune", "Les trouvères chantent en latin"], 0, "Même art, deux langues et deux régions."], ["La tenson est…", ["un débat chanté entre deux poètes", "un instrument", "une forme de messe"], 0, "On la compare parfois aux joutes de rap."], ["Quelle œuvre a composé Guillaume de Machaut ?", ["La Messe de Nostre Dame", "La Flûte enchantée", "Le Boléro"], 0, "Poète et musicien, il compose des chansons d'amour et la Messe de Nostre Dame."]], [["Le contrepoint superpose…", ["des voix indépendantes qui s'accordent", "une voix et un silence", "des tambours"], 0, "Chaque voix a sa propre ligne."], ["Dans l'imitation…", ["une voix reprend le motif d'une autre", "toutes les voix chantent la même chose en même temps", "on improvise"], 0, "Le canon est une imitation stricte."], ["Frère Jacques chanté par trois groupes qui commencent l'un après l'autre, c'est…", ["un canon", "une monodie", "un choral"], 0, "La même mélodie, en décalé."], ["Dans le Canon de Pachelbel, qu'est-ce qui revient sans cesse ?", ["la basse", "rien, tout change", "la batterie"], 0, "Une basse de huit notes revient ; au-dessus, trois violons jouent en canon."]], [["Qu'a demandé le concile de Trente pour la musique de la messe ?", ["Que les paroles restent compréhensibles", "Que la musique soit plus rapide", "L'interdiction du chant"], 0, "1545-1563 : les paroles doivent rester intelligibles."], ["Le choral luthérien est…", ["une mélodie simple chantée par tous les fidèles", "un opéra", "une danse de cour"], 0, "Luther fait chanter les fidèles en langue commune."], ["Dans l'homophonie…", ["les voix avancent ensemble, sur le même rythme", "chaque voix est très indépendante", "il n'y a qu'une voix"], 0, "Les mots sont dits ensemble : on les comprend mieux."], ["Que raconte La Guerre de Janequin ?", ["Une bataille", "Une histoire d'amour", "Une messe"], 0, "Les voix imitent les bruits de la bataille de Marignan."]], [["Quel est l'un des premiers opéras ?", ["L'Orfeo de Monteverdi (1607)", "Carmen de Bizet", "La Flûte enchantée"], 0, "Créé à Mantoue en 1607."], ["La basse continue, c'est…", ["une ligne grave et des accords qui soutiennent la voix", "une note tenue tout le morceau", "un instrument à vent"], 0, "Elle soutient toute la musique baroque."], ["Une toccata est…", ["une pièce libre et virtuose pour clavier", "un chant grégorien", "une danse de cour"], 0, "De toccare, toucher : l'art de toucher le clavier, proche de l'improvisation."], ["La monodie accompagnée met au premier plan…", ["une voix seule", "un chœur", "les percussions"], 0, "Vers 1600, une voix seule soutenue par la basse continue."]]], "4e": [[["Qui dirige la musique de Louis XIV ?", ["Lully", "Bach", "Mozart"], 0, "Jean-Baptiste Lully, venu de Florence."], ["L'ouverture à la française enchaîne…", ["une partie lente et majestueuse, puis une partie rapide", "trois parties rapides", "un air chanté et un récitatif"], 0, "Lent et solennel, puis rapide."], ["Pour quel instrument Couperin écrit-il Les Barricades mystérieuses ?", ["Le clavecin", "Le piano", "L'orgue"], 0, "Le clavecin est l'instrument roi du baroque français."], ["Quel prélude sert d'indicatif à l'Eurovision ?", ["Celui du Te Deum de Charpentier", "Celui des Indes galantes", "Celui du Messie"], 0, "Le prélude du Te Deum de Marc-Antoine Charpentier."]], [["Dans une fugue, le sujet est…", ["le thème repris par chaque voix", "le titre de l'œuvre", "le chef d'orchestre"], 0, "Chaque voix entre à son tour avec le sujet."], ["Le concerto baroque alterne…", ["la ritournelle de l'orchestre et le soliste", "deux chœurs", "le chant et la danse"], 0, "Vivaldi en est un maître."], ["Un oratorio est…", ["une œuvre religieuse pour solistes, chœur et orchestre, sans mise en scène", "un opéra comique", "une pièce pour clavecin seul"], 0, "Le Messie de Haendel est un oratorio."], ["Quelles sont les dates de Bach ?", ["1685-1750", "1756-1791", "1810-1849"], 0, "1756-1791, c'est Mozart ; 1810-1849, Chopin."]], [["Que recherche le classicisme ?", ["L'équilibre, la clarté, la symétrie", "Le bruit et le chaos", "L'improvisation libre"], 0, "Vers 1750-1820."], ["Une symphonie est…", ["une grande œuvre pour orchestre en plusieurs mouvements", "une chanson pour une voix", "une danse"], 0, "Haydn en a écrit plus de cent."], ["La forme sonate…", ["oppose deux thèmes, les dévelo \", 440, 100, 1000, 1) : si.smoo;\nmarche = checkbox(\"jouer\") : si.smoo;\nprocess = os.osc(hauteur) * 0.15 * marche;", "lignes": ["On charge la bibliothèque de Faust.", "Un curseur « hauteur », de 100 à 1000 hertz, qui commence à 440 (le la du diapason).", "Un bouton marche ou arrêt.", "Le son : une sinusoïde (os.osc) à la hauteur choisie, à faible volume, multipliée par le bouton."], "ui": [["jouer", "jouer"], ["curseur", "hauteur", "Hauteur", "Hz"]], "defis": [["Le la du diapason", {"hauteur": 440}], ["Une octave plus bas", {"hauteur": 220}], ["Une octave plus haut", {"hauteur": 880}]]}, {"id": "parametres", "titre": "Les quatre paramètres du son", "cours": "6e, séquence 1", "couleur": "#2f6f7a", "texte": "Hauteur, intensité, timbre : trois réglages. La durée, c'est le temps pendant lequel tu appuies.", "code": "import(\"stdfaust.lib\");\nhauteur = hslider(\"hauteur\", 440, 100, 1500, 1) : si.smoo;\nintensite = hslider(\"intensite\", 0.2, 0, 0.5, 0.01) : si.smoo;\ntimbre = nentry(\"timbre\", 0, 0, 3, 1);\nappui = button(\"appui\");\nson = os.osc(hauteur), os.triangle(hauteur), os.square(hauteur), os.sawtooth(hauteur) : ba.selectn(4, timbre);\nprocess = son * intensite * en.adsr(0.01, 0.1, 0.8, 0.3, appui);", "lignes": ["La bibliothèque.", "La hauteur, en hertz.", "L'intensité : le volume.", "Le timbre : quatre formes d'onde, numérotées de 0 à 3.", "Le bouton : le son dure tant qu'on appuie.", "Les quatre ondes : sinus, triangle, carré, dent de scie ; ba.selectn choisit celle du timbre.", "Le son final, avec une enveloppe qui attaque, tient et s'éteint (en.adsr)."], "ui": [["tenir", "appui", "Appuie pour jouer"], ["curseur", "hauteur", "Hauteur", "Hz"], ["curseur", "intensite", "Intensité", ""], ["choix", "timbre", "Timbre", [[0, "Doux (sinus)"], [1, "Clair (triangle)"], [2, "Creux (carré)"], [3, "Brillant (dent de scie)"]]]], "defis": [["Grave, piano, doux", {"hauteur": 150, "intensite": 0.08, "timbre": 0}], ["Aigu, forte, brillant", {"hauteur": 1200, "intensite": 0.45, "timbre": 3}]]}, {"id": "pythagore", "titre": "Le monocorde de Pythagore", "cours": "6e, séquence 2 et 3e, séquence 4", "couleur": "#55669f", "texte": "Deux sons ensemble : une note et la même multipliée par un rapport. Les rapports simples fusionnent, les autres frottent.", "code": "import(\"stdfaust.lib\");\nnote = hslider(\"note\", 220, 110, 440, 1) : si.smoo;\nrapport = hslider(\"rapport\", 1.5, 1, 2, 0.001) : si.smoo;\nmarche = checkbox(\"jouer\") : si.smoo;\nprocess = (os.triangle(note) + os.triangle(note * rapport)) * 0.1 * marche;", "lignes": ["La bibliothèque.", "La note de départ.", "Le rapport entre les deux sons (2 pour l'octave, 1,5 pour la quinte…).", "Marche ou arrêt.", "Deux sons ajoutés : la note, et la note multipliée par le rapport."], "ui": [["jouer", "jouer"], ["choix", "rapport", "Intervalle", [[1, "Unisson 1/1"], [2, "Octave 2/1"], [1.5, "Quinte 3/2"], [1.3333, "Quarte 4/3"], [1.06, "Presque pareil"]]], ["curseur", "rapport", "Rapport", ""], ["curseur", "note", "Note de départ", "Hz"]], "defis": [["Écoute l'octave", {"rapport": 2}], ["Puis la quinte", {"rapport": 1.5}], ["Deux sons qui battent", {"rapport": 1.03}]]}, {"id": "harmoniques", "titre": "Fabriquer un timbre avec des harmoniques", "cours": "6e, séquence 4 et 3e, séquence 3", "couleur": "#94485b", "texte": "Un son musical est fait d'harmoniques : la note et ses multiples. Monte et descends les barres pour sculpter le timbre.", "code": "import(\"stdfaust.lib\");\nnote = hslider(\"note\", 110, 55, 440, 1) : si.smoo;\nh(i) = vslider(\"h%i\", (i == 0), 0, 1, 0.01) : si.smoo;\nmarche = checkbox(\"jouer\") : si.smoo;\nprocess = par(i, 8, os.osc(note * (i + 1)) * h(i)) :> *(0.12 * marche);", "lignes": ["La bibliothèque.", "La note fondamentale.", "Huit curseurs verticaux, un par harmonique ; seul le premier est monté au départ.", "Marche ou arrêt.", "Huit sinusoïdes, à 1, 2, 3… 8 fois la note, chacune à son volume, additionnées (:>)."], "ui": [["jouer", "jouer"], ["barres", ["h0", "h1", "h2", "h3", "h4", "h5", "h6", "h7"], "Harmoniques 1 à 8"], ["curseur", "note", "Note", "Hz"]], "defis": [["Un son pur", {"h0": 1, "h1": 0, "h2": 0, "h3": 0, "h4": 0, "h5": 0, "h6": 0, "h7": 0}], ["Creux comme une clarinette (impaires)", {"h0": 1, "h1": 0, "h2": 0.5, "h3": 0, "h4": 0.3, "h5": 0, "h6": 0.2, "h7": 0}], ["Brillant comme une trompette", {"h0": 1, "h1": 0.8, "h2": 0.7, "h3": 0.6, "h4": 0.5, "h5": 0.4, "h6": 0.3, "h7": 0.25}]]}, {"id": "rythmes", "titre": "La boîte à rythmes", "cours": "6e, séquence 4 et 3e, séquence 4", "couleur": "#a9802f", "texte": "Allume des cases : chaque case allumée est une frappe, chaque case éteinte un silence. La boucle tourne sans fin : c'est un ostinato.", "code": "import(\"stdfaust.lib\");\ntempo = hslider(\"tempo\", 110, 50, 200, 1);\ntaille = nentry(\"taille\", 8, 4, 12, 1);\nmarche = checkbox(\"jouer\");\ncellule(i) = checkbox(\"c%i\");\ncroche = ba.beat(tempo * 2) * marche;\npos = ((croche : + ~ _) + taille - 1) % taille;\nfrappe = croche * (par(i, 12, cellule(i)) : ba.selectn(12, pos));\ntimbre = nentry(\"son\", 0, 0, 2, 1);\ntambour = os.osc(70 + 90 * en.ar(0.001, 0.04, frappe)) * en.ar(0.001, 0.25, frappe);\nbois = os.osc(1400) * en.ar(0.001, 0.05, frappe);\nmains = no.noise : fi.resonbp(1300, 1.5, 1) : *(en.ar(0.001, 0.1, frappe));\nprocess = (tambour, bois, mains : ba.selectn(3, timbre)) * 0.5, (pos : hbargraph(\"position\", 0, 12)) : attach;", "lignes": ["La bibliothèque.", "Le tempo, en battements par minute.", "Le nombre de cases de la boucle.", "Marche ou arrêt.", "Douze cases à cocher.", "Une impulsion à chaque croche (deux par battement).", "Un compteur : la case en cours, de 0 à la taille de la boucle moins 1.", "On frappe si la case en cours est allumée.", "Le choix du son.", "Un tambour : une sinusoïde grave dont la hauteur tombe très vite.", "Un bois : une note aiguë très courte.", "Des mains : un bruit filtré.", "Le son choisi ; la position est envoyée à l'écran pour allumer la case."], "ui": [["jouer", "jouer"], ["pas", ["c0", "c1", "c2", "c3", "c4", "c5", "c6", "c7", "c8", "c9", "c10", "c11"], "position"], ["choix", "taille", "Longueur", [[8, "8 cases"], [12, "12 cases"]]], ["choix", "son", "Son", [[0, "Tambour"], [1, "Bois"], [2, "Mains"]]], ["curseur", "tempo", "Tempo", "bpm"]], "defis": [["Un ostinato simple", {"taille": 8, "c0": 1, "c1": 0, "c2": 1, "c3": 1, "c4": 1, "c5": 0, "c6": 1, "c7": 0}], ["Le motif de Clapping Music", {"taille": 12, "c0": 1, "c1": 1, "c2": 1, "c3": 0, "c4": 1, "c5": 1, "c6": 0, "c7": 1, "c8": 0, "c9": 1, "c10": 1, "c11": 0}], ["Une pulsation régulière", {"taille": 8, "c0": 1, "c1": 0, "c2": 1, "c3": 0, "c4": 1, "c5": 0, "c6": 1, "c7": 0}]]}, {"id": "cloche", "titre": "Une cloche, un gong", "cours": "6e, séquence 4 : le gamelan", "couleur": "#55669f", "texte": "Une cloche a des partiels inharmoniques : ils ne sont pas des multiples de la note. Frappe-la, puis rends-la plus ou moins « métallique ».", "code": "import(\"stdfaust.lib\");\nnote = hslider(\"note\", 330, 100, 1000, 1);\nresonance = hslider(\"resonance\", 2, 0.2, 6, 0.1);\nmetal = hslider(\"metal\", 1, 0, 1, 0.01);\nfrappe = button(\"frapper\");\npartiel(harm, inharm, d, a) = os.osc(note * (harm + metal * (inharm - harm))) * en.ar(0.001, resonance * d, frappe) * a;\nprocess = (partiel(1, 1, 1, 0.5) + partiel(2, 2.76, 0.5, 0.3) + partiel(3, 5.4, 0.25, 0.15) + partiel(4, 8.93, 0.12, 0.08)) * 0.4;", "lignes": ["La bibliothèque.", "La note.", "La durée de la résonance, en secondes.", "Le curseur métal : 0, des harmoniques ordinaires ; 1, des partiels de cloche.", "Le bouton pour frapper.", "Un partiel : sa hauteur glisse entre l'harmonique et le partiel de cloche, et il s'éteint à sa vitesse.", "Quatre partiels additionnés."], "ui": [["tenir", "frapper", "Frappe la cloche"], ["curseur", "metal", "Métallique", ""], ["curseur", "resonance", "Résonance", "s"], ["curseur", "note", "Note", "Hz"]], "defis": [["Une vraie cloche", {"metal": 1}], ["Une corde, pas une cloche", {"metal": te"], ["curseur", "salle", "Taille de la salle", "s"]], "defis": [["Une petite chambre", {"salle": 0.4}], ["Une église", {"salle": 4}], ["Une cathédrale", {"salle": 8}]]}, {"id": "glissandos", "titre": "Une masse de glissandos", "cours": "3e, séquence 4 : Xenakis", "couleur": "#94485b", "texte": "Seize sons qui glissent lentement, chacun à sa vitesse : on n'entend plus des notes, mais une masse sonore qui bouge.", "code": "import(\"stdfaust.lib\");\nvitesse = hslider(\"vitesse\", 0.05, 0.01, 0.5, 0.01);\ndensite = hslider(\"densite\", 8, 1, 16, 1) : si.smoo;\nmarche = checkbox(\"jouer\") : si.smoo;\nvoix(i) = os.sawtooth(200 + i * 45 + 150 * os.osc(vitesse * (1 + i * 0.13))) * (i < densite);\nprocess = par(i, 16, voix(i)) :> fi.lowpass(2, 2500) * 0.03 * marche;", "lignes": ["La bibliothèque.", "La vitesse des glissements.", "Combien de voix on entend, de 1 à 16.", "Marche ou arrêt.", "Une voix : une dent de scie dont la hauteur ondule lentement ; elle se tait si elle dépasse la densité.", "Seize voix additionnées, adoucies par un filtre."], "ui": [["jouer", "jouer"], ["curseur", "densite", "Nombre de voix", ""], ["curseur", "vitesse", "Vitesse", ""]], "defis": [["Une seule voix", {"densite": 1}], ["Toute la masse", {"densite": 16}], ["Une masse qui s'agite", {"densite": 16, "vitesse": 0.4}]]}], "grille": {"rubriques": ["Timbre", "Intensité", "Plan sonore", "Tempo et rythme", "Hauteur et mélodie", "Texture et forme"], "voc": {"6e": {"Timbre": ["voix d'homme, de femme, d'enfant", "cordes, vents, percussions", "orchestre ou instrument du monde"], "Intensité": ["piano (doux), forte (fort)", "crescendo, decrescendo"], "Plan sonore": ["la mélodie devant, l'accompagnement derrière", "seul ou tous ensemble"], "Tempo et rythme": ["lent, modéré, rapide", "pulsation régulière ou non"], "Hauteur et mélodie": ["grave, médium, aigu", "la mélodie monte, descend, se répète"], "Texture et forme": ["une voix ou plusieurs", "unisson, canon", "couplet et refrain"]}, "5e": {"Timbre": ["
