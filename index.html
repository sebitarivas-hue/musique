, {"type": "seance", "seq": 5, "num": 2, "semaine": "31/05", "date": "2027-05-31"}, {"type": "seance", "seq": 5, "num": 3, "semaine": "07/06", "date": "2027-06-07"}, {"type": "tampon", "semaine": "14/06", "date": "2027-06-14"}, {"type": "tampon", "semaine": "21/06", "date": "2027-06-21"}, {"type": "tampon", "semaine": "28/06", "date": "2027-06-28"}], "contenus": [{"fiches": ["ecoute", "plans"], "objectifs": ["Comprendre comment la musique témoigne de l'histoire.", "Découvrir des écritures contemporaines (cluster, voix enregistrées).", "Préparer une fiche d'histoire des arts."], "seances": [{"objectif": "Histoire du Chant des partisans.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Création à Londres en 1943, diffusion par la BBC, l'indicatif sifflé."], [15, "Chant."], [10, "Trace écrite."]]}, {"objectif": "Découvrir le cluster.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Penderecki : l'orchestre de cordes, les clusters, l'histoire du titre."], [15, "Chant."], [10, "Trace écrite."]]}, {"objectif": "Des voix qui deviennent musique.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Different Trains : témoignages enregistrés imités par le quatuor."], [15, "Chant."], [10, "Trace écrite."]]}, {"objectif": "Débattre et préparer l'oral.", "etapes": [[20, "Débat : une musique peut-elle témoigner ?"], [25, "Fiche histoire des arts guidée."], [5, "Annonce."]]}, {"objectif": "Évaluation de fin de séquence.", "etapes": [[20, "Chant."], [30, "Commentaire écrit d'un des trois extraits."]]}], "trace": ["Le Chant des partisans (Anna Marly, Joseph Kessel, Maurice Druon) devient l'hymne de la Résistance en 1943.", "Un cluster est un agrégat de notes très proches jouées ensemble.", "Krzysztof Penderecki dédie son Thrène aux victimes d'Hiroshima (1960).", "Dans Different Trains (1988), Steve Reich transforme des témoignages enregistrés en mélodies."], "devoirs": "Compléter la fiche d'histoire des arts.", "eval": {"consigne": "Chanter Le Chant des partisans. Commenter par écrit un extrait.", "criteres": [["Je chante avec le groupe, juste et expressif", "C1"], ["Je relie l'œuvre à son contexte historique", "C2"], ["Je décris un procédé musical précis", "C2"], ["Ma fiche d'histoire des arts est complète", "C4"]], "attendus": ["Un commentaire de dix lignes : présentation, contexte, description, interprétation.", "Définir cluster et musique contemporaine."]}}, {"fiches": ["instruments", "ecoute"], "objectifs": ["Comprendre pourquoi le rock et le rap ont dérangé.", "Identifier distorsion, sample et flow.", "Présenter une chanson qui a dérangé."], "seances": [{"objectif": "Woodstock 1969.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Hendrix joue et déforme l'hymne américain : pourquoi ?"], [15, "Imagine : apprentissage."], [10, "Trace écrite."]]}, {"objectif": "Le rock et sa contre-culture.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Guitare électrique, distorsion, Revolution des Beatles."], [15, "Chant."], [10, "Trace écrite."]]}, {"objectif": "Le rap.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Naissance dans le Bronx, arrivée en France, texte, flow et sample."], [15, "Chant."], [10, "Trace écrite."]]}, {"objectif": "Exposés.", "etapes": [[40, "Exposés en binômes."], [10, "Chant."]]}, {"objectif": "Évaluation de fin de séquence.", "etapes": [[20, "Chant."], [30, "Suite des exposés."]]}], "trace": ["Le rock apparaît dans les années 1950 ; la guitare électrique et la distorsion durcissent le son.", "Une contre-culture s'oppose aux valeurs dominantes de son époque.", "Le rap naît dans le Bronx, à New York, dans les années 1970.", "Le flow est la manière de poser le texte sur le rythme. Le sample est un extrait réutilisé."], "devoirs": "Préparer l'exposé avec la fiche méthode.", "eval": {"consigne": "Chanter Imagine. Présenter une chanson qui a dérangé.", "criteres": [["Je chante en anglais avec justesse", "C1"], ["J'explique pourquoi la chanson a dérangé", "C4"], ["Je décris un élément musical (distorsion, flow, sample)", "C2"], ["Je m'exprime clairement", "C4"]], "attendus": ["Un exposé avec contexte, procédé musical et réception.", "Définir distorsion, flow, sample, contre-culture."]}}, {"fiches": ["plans", "instruments"], "objectifs": ["Comprendre le leitmotiv.", "Distinguer musique diégétique et extradiégétique.", "Composer un leitmotiv."], "seances": [{"objectif": "Du leitmotiv de Wagner à John Williams.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Chevauchée des Walkyries, Marche impériale : un thème, un personnage."], [15, "Chant."], [10, "Trace écrite."]]}, {"objectif": "Créer la peur.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Psychose : cordes seules, dissonances, rythme."], [15, "Chant."], [10, "Trace écrite."]]}, {"objectif": "Diégétique ou pas.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Trois scènes : qui entend la musique ?"], [15, "Chant."], [10, "Trace écrite."]]}, {"objectif": "Composer un leitmotiv.", "etapes": [[5, "Consignes."], [40, "Quatre mesures pour un personnage inventé."], [5, "Répétition."]]}, {"objectif": "Évaluation de fin de séquence.", "etapes": [[20, "Chant."], [30, "Présentation des leitmotivs et écoute d'une scène inconnue."]]}], "trace": ["Un leitmotiv est un thème associé à un personnage, un lieu ou une idée.", "Wagner invente ce principe pour ses opéras ; John Williams le reprend au cinéma.", "Musique diégétique : les personnages l'entendent. Extradiégétique : seul le spectateur l'entend.", "Une dissonance crée une tension."], "devoirs": "Repérer un leitmotiv dans un film récent.", "eval": {"consigne": "Chanter. Présenter le leitmotiv composé. Analyser une scène.", "criteres": [["Je chante juste avec le groupe", "C1"], ["Mon leitmotiv correspond au caractère du personnage", "C3"], ["Je distingue diégétique et extradiégétique", "C2"]], "attendus": ["Un leitmotiv de quatre mesures, joué ou chanté.", "Définir leitmotiv, diégétique, dissonance."]}}, {"fiches": ["formes", "figures"], "objectifs": ["Découvrir la musique minimaliste.", "Comprendre déphasage et processus.", "Interpréter une pièce de classe par processus."], "seances": [{"objectif": "Presque rien.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Spiegel im Spiegel d'Arvo Pärt : deux instruments, une idée."], [15, "Mad World : apprentissage."], [10, "Trace écrite."]]}, {"objectif": "Pulsation et déphasage.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Reich, Music for 18 Musicians ; déphasage joué en classe."], [15, "Chant."], [10, "Trace écrite."]]}, {"objectif": "Compter, répéter, transformer.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Einstein on the Beach, Knee Play 1 : les chiffres chantés."], [15, "Chant."], [10, "Trace écrite."]]}, {"objectif": "Créer par processus.", "etapes": [[5, "Consignes."], [40, "Une règle simple appliquée par toute la classe."], [5, "Répétition."]]}, {"objectif": "Évaluation de fin de séquence.", "etapes": [[30, "Chant et pièce de classe."], [20, "Écoute."]]}], "trace": ["La musique minimaliste naît aux États-Unis dans les années 1960 (Steve Reich, Philip Glass).", "Elle répète de courts motifs qui se transforment lentement.", "Le déphasage : deux musiciens jouent le même motif et l'un se décale progressivement.", "Un processus est une règle appliquée du début à la fin de la pièce.", "Arvo Pärt invente le style tintinnabuli, inspiré des cloches."], "devoirs": "Revoir la trace écrite et réécouter Spiegel im Spiegel.", "eval": {"consigne": "Chanter. Interpréter la pièce de classe. Répondre à une question d'écoute.", "criteres": [["Je chante en place", "C1"], ["Je respecte la règle du processus", "C3"], ["Je reconnais une musique répétitive et je justifie", "C2"]], "attendus": ["Définir minimalisme, déphasage, processus.", "Citer deux compositeurs minimalistes."]}}, {"fiches": ["ecoute", "lexique"], "objectifs": ["Présenter une œuvre ou un projet en cinq minutes.", "Répondre aux questions du jury.", "Réinvestir le vocabulaire de l'année."], "seances": [{"objectif": "La méthode.", "etapes": [[20, "Présenter, situer, décrire, analyser, donner son avis : exemple modèle."], [25, "Choix des sujets et plan."], [5, "Calendrier."]]}, {"objectif": "Préparation guidée.", "etapes": [[45, "Préparation en binômes, aide individuelle."], [5, "Bilan."]]}, {"objectif": "Oraux blancs.", "etapes": [[50, "Passages devant la classe avec la grille du brevet."]]}], "trace": ["Présenter : titre, auteur, date, genre.", "Situer : contexte historique et artistique.", "Décrire : ce que l'on entend (instruments, tempo, forme).", "Analyser : ce que la musique exprime et comment.", "Donner son avis argumenté."], "devoirs": "Préparer sa présentation et la chronométrer.", "eval": {"consigne": "Oral blanc de cinq minutes puis questions.", "criteres": [["Je présente et je situe l'œuvre", "C4"], ["Je décris et j'analyse avec le vocabulaire", "C2"], ["Je réponds aux questions avec précision", "C4"], ["Je m'exprime clairement, sans lire", "C4"]], "attendus": ["Cinq minutes de présentation structurée.", "Au moins cinq mots de vocabulaire musical justes."]}}]}}, "fiches": {"parametres": {"titre": "Les paramètres du son", "niveaux": "6e, et révision pour tous", "html": "<p>Tout son peut être décrit par quatre paramètres. Ce sont les premiers mots de l&#x27;écoute.</p>\n<div class=\"tbl\"><table><thead><tr><th>Paramètre</th><th>Question</th><th>Vocabulaire</th></tr></thead><tbody><tr><td>La hauteur</td><td>Le son est-il grave ou aigu ?</td><td>grave, médium, aigu ; monter, descendre ; registre</td></tr><tr><td>La durée</td><td>Le son est-il long ou court ?</td><td>long, court, tenu, piqué (staccato), lié (legato)</td></tr><tr><td>L&#x27;intensité</td><td>Le son est-il fort ou doux ?</td><td>piano, forte, nuances, crescendo, decrescendo</td></tr><tr><td>Le timbre</td><td>Qui ou quoi produit le son ?</td><td>la couleur du son : voix, instrument, famille, mode de jeu</td></tr></tbody></table></div>\n<h3>Comment s&#x27;en servir à l&#x27;écoute</h3>\n<ul><li>Écouter une première fois sans rien écrire.</li><li>Choisir un paramètre à la fois et noter ce qui change.</li><li>Utiliser le mot juste plutôt qu&#x27;une impression : « c&#x27;est forte » plutôt que « ça fait du bruit ».</li></ul>"}, "nuances": {"titre": "L'intensité et les nuances", "niveaux": "6e à 3e", "html": "<p>Les nuances indiquent l&#x27;intensité du son. Elles s&#x27;écrivent en italien, abrégées, sous la portée.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 370 155\" width=\"100%\" role=\"img\" aria-label=\"Nuances\"><text x=\"30\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" font-weight=\"bold\" font-family=\"Georgia, serif\" fill=\"currentColor\">pp</text><text x=\"92\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" font-weight=\"bold\" font-family=\"Georgia, serif\" fill=\"currentColor\">p</text><text x=\"154\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" font-weight=\"bold\" font-family=\"Georgia, serif\" fill=\"currentColor\">mp</text><text x=\"216\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" font-weight=\"bold\" font-family=\"Georgia, serif\" fill=\"currentColor\">mf</text><text x=\"278\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" font-weight=\"bold\" font-family=\"Georgia, serif\" fill=\"currentColor\">f</text><text x=\"340\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" font-weight=\"bold\" font-family=\"Georgia, serif\" fill=\"currentColor\">ff</text><line x1=\"20\" y1=\"58\" x2=\"350\" y2=\"58\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\".4\"/><text x=\"20\" y=\"76\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\" opacity=\".75\">très doux</text><text x=\"350\" y=\"76\" text-anchor=\"end\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\" opacity=\".75\">très fort</text><path d=\"M30 110 L150 98 M30 110 L150 122\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"/><text x=\"90\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">crescendo</text><path d=\"M220 98 L340 110 M220 122 L340 110\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"/><text x=\"280\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">decrescendo</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Signe</th><th>Nom italien</th><th>Sens</th></tr></thead><tbody><tr><td>pp</td><td>pianissimo</td><td>très doux</td></tr><tr><td>p</td><td>piano</td><td>doux</td></tr><tr><td>mp</td><td>mezzo piano</td><td>moyennement doux</td></tr><tr><td>mf</td><td>mezzo forte</td><td>moyennement fort</td></tr><tr><td>f</td><td>forte</td><td>fort</td></tr><tr><td>ff</td><td>fortissimo</td><td>très fort</td></tr><tr><td>cresc. ou &lt;</td><td>crescendo</td><td>de plus en plus fort</td></tr><tr><td>decresc. ou &gt;</td><td>decrescendo ou diminuendo</td><td>de plus en plus doux</td></tr><tr><td>sf</td><td>sforzando</td><td>une note soudainement accentuée</td></tr><tr><td>&gt;</td><td>accent</td><td>la note est appuyée</td></tr></tbody></table></div>\n<h3>À retenir</h3>\n<ul><li>Une nuance est toujours relative : un forte de flûte n&#x27;a pas la puissance d&#x27;un forte de trompette.</li><li>Les nuances servent l&#x27;expression : le Boléro de Ravel est un long crescendo de quinze minutes.</li></ul>"}, "tempo": {"titre": "Le tempo et la pulsation", "niveaux": "6e à 3e", "html": "<p>La pulsation est le battement régulier de la musique. Le tempo est sa vitesse, mesurée en battements par minute (BPM).</p>\n<div class=\"tbl\"><table><thead><tr><th>Terme</th><th>Caractère</th><th>Ordre d&#x27;idée</th></tr></thead><tbody><tr><td>Largo</td><td>très lent, large</td><td>40 à 60 BPM</td></tr><tr><td>Adagio</td><td>lent</td><td>60 à 75 BPM</td></tr><tr><td>Andante</td><td>allant, à la vitesse de la marche</td><td>75 à 105 BPM</td></tr><tr><td>Moderato</td><td>modéré</td><td>105 à 120 BPM</td></tr><tr><td>Allegro</td><td>rapide, joyeux</td><td>120 à 155 BPM</td></tr><tr><td>Presto</td><td>très rapide</td><td>plus de 170 BPM</td></tr></tbody></table></div>\n<h3>Les changements de tempo</h3>\n<ul><li>Accelerando : en accélérant.</li><li>Ritardando ou rallentando : en ralentissant.</li><li>A tempo : on reprend le tempo de départ.</li><li>Point d&#x27;orgue : une note tenue aussi longtemps que voulu.</li></ul>"}, "figures": {"titre": "Les figures de notes et de silences", "niveaux": "6e, 5e, rappel en 4e et 3e", "html": "<p>Les figures indiquent la durée des sons et des silences. L&#x27;unité de temps la plus courante au collège est la noire.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 440 130\" width=\"100%\" role=\"img\" aria-label=\"Figures de notes\"><ellipse cx=\"40\" cy=\"70\" rx=\"7.5\" ry=\"5.2\" transform=\"rotate(-20 40 70)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"43\" y=\"100\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Ronde</text><text x=\"43\" y=\"117\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">4 temps</text><ellipse cx=\"125\" cy=\"70\" rx=\"7.5\" ry=\"5.2\" transform=\"rotate(-20 125 70)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"131.5\" y1=\"68\" x2=\"131.5\" y2=\"32\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"128\" y=\"100\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Blanche</text><text x=\"128\" y=\"117\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">2 temps</text><ellipse cx=\"210\" cy=\"70\" rx=\"7.5\" ry=\"5.2\" transform=\"rotate(-20 210 70)\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"216.5\" y1=\"68\" x2=\"216.5\" y2=\"32\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"213\" y=\"100\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Noire</text><text x=\"213\" y=\"117\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">1 temps</text><ellipse cx=\"295\" cy=\"70\" rx=\"7.5\" ry=\"5.2\" transform=\"rotate(-20 295 70)\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"301.5\" y1=\"68\" x2=\"301.5\" y2=\"32\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M301.5 32 q14 10 6 26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"/><text x=\"298\" y=\"100\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Croche</text><text x=\"298\" y=\"117\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">1/2 temps</text><ellipse cx=\"380\" cy=\"70\" rx=\"7.5\" ry=\"5.2\" transform=\"rotate(-20 380 70)\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"386.5\" y1=\"68\" x2=\"386.5\" y2=\"32\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M386.5 32 q14 10 6 26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"/><path d=\"M386.5 41 q14 10 6 26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"/><text x=\"383\" y=\"100\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Double croche</text><text x=\"383\" y=\"117\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">1/4 temps</text></svg></figure>\n<figure class=\"fig\"><svg viewBox=\"0 0 340 120\" width=\"100%\" role=\"img\" aria-label=\"Silences\"><line x1=\"22\" y1=\"50\" x2=\"58\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"31\" y=\"50\" width=\"18\" height=\"8\" fill=\"currentColor\"/><text x=\"40\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Pause</text><text x=\"40\" y=\"107\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">4 temps</text><line x1=\"107\" y1=\"50\" x2=\"143\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"116\" y=\"42\" width=\"18\" height=\"8\" fill=\"currentColor\"/><text x=\"125\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Demi-pause</text><text x=\"125\" y=\"107\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">2 temps</text><path d=\"M204 28 l10 11 l-9 9 l10 11 q-12 -4 -7 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linejoin=\"round\"/><text x=\"210\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Soupir</text><text x=\"210\" y=\"107\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">1 temps</text><circle cx=\"290\" cy=\"38\" r=\"4\" fill=\"currentColor\"/><path d=\"M290 41 q8 3 12 -3 l-10 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><text x=\"295\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Demi-soupir</text><text x=\"295\" y=\"107\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">1/2 temps</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Durée</th><th>Note</th><th>Silence correspondant</th></tr></thead><tbody><tr><td>4 temps</td><td>ronde</td><td>pause</td></tr><tr><td>2 temps</td><td>blanche</td><td>demi-pause</td></tr><tr><td>1 temps</td><td>noire</td><td>soupir</td></tr><tr><td>1/2 temps</td><td>croche</td><td>demi-soupir</td></tr><tr><td>1/4 temps</td><td>double croche</td><td>quart de soupir</td></tr></tbody></table></div>\n<h3>Le point et la liaison</h3>\n<ul><li>Un point après une note ajoute la moitié de sa durée : une blanche pointée dure trois temps.</li><li>Une liaison entre deux notes de même hauteur additionne leurs durées.</li><li>Deux croches réunies par une barre (ligature) valent un temps.</li></ul>"}, "plans": {"titre": "Les plans sonores et la texture", "niveaux": "5e à 3e", "html": "<p>Dans une musique, tous les sons n&#x27;ont pas la même importance. On distingue ce qui est au premier plan de ce qui accompagne.</p>\n<div class=\"tbl\"><table><thead><tr><th>Notion</th><th>Définition</th><th>Exemple</th></tr></thead><tbody><tr><td>Premier plan</td><td>ce que l&#x27;oreille suit d&#x27;abord, souvent la mélodie</td><td>la voix dans une chanson</td></tr><tr><td>Arrière-plan</td><td>ce qui accompagne et soutient</td><td>la guitare, la basse, la batterie</td></tr><tr><td>Monodie</td><td>une seule mélodie, sans accompagnement</td><td>chant grégorien</td></tr><tr><td>Homophonie</td><td>une mélodie accompagnée par des accords qui suivent le même rythme</td><td>un choral, un hymne</td></tr><tr><td>Polyphonie</td><td>plusieurs mélodies indépendantes en même temps</td><td>Janequin, un canon</td></tr><tr><td>Bourdon</td><td>une note tenue sous la mélodie</td><td>cornemuse, Douce dame jolie</td></tr><tr><td>Ostinato</td><td>un motif répété sous ou avec la mélodie</td><td>le rythme du Boléro</td></tr></tbody></table></div>\n<h3>Pour l&#x27;écoute</h3>\n<ul><li>Qu&#x27;est-ce que j&#x27;entends en premier ? Qu&#x27;est-ce qui est derrière ?</li><li>Combien de couches sonores ? Changent-elles au cours de l&#x27;extrait ?</li><li>Le premier plan passe-t-il d&#x27;un instrument à un autre ?</li></ul>"}, "instruments": {"titre": "Les familles d'instruments", "niveaux": "6e à 3e", "html": "<p>Les instruments se classent selon la manière dont le son est produit. L&#x27;orchestre symphonique réunit quatre familles.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 400 265\" width=\"100%\" role=\"img\" aria-label=\"Plan de l'orchestre\"><path d=\"M15 215 A185 185 0 0 1 385 215\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"200\" y=\"48\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Percussions</text><path d=\"M55 215 A145 145 0 0 1 345 215\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"200\" y=\"88\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Cuivres</text><path d=\"M95 215 A105 105 0 0 1 305 215\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"200\" y=\"128\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Bois</text><path d=\"M135 215 A65 65 0 0 1 265 215\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"200\" y=\"168\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Cordes</text><line x1=\"0\" y1=\"215\" x2=\"400\" y2=\"215\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\".4\"/><circle cx=\"200\" cy=\"215\" r=\"6\" fill=\"currentColor\"/><text x=\"200\" y=\"237\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">chef d'orchestre</text><text x=\"200\" y=\"255\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">le public</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Famille</th><th>Comment le son est produit</th><th>Instruments</th></tr></thead><tbody><tr><td>Cordes frottées</td><td>un archet frotte les cordes</td><td>violon, alto, violoncelle, contrebasse</td></tr><tr><td>Cordes pincées</td><td>les doigts pincent les cordes</td><td>harpe, guitare, clavecin</td></tr><tr><td>Cordes frappées</td><td>un marteau frappe les cordes</td><td>piano</td></tr><tr><td>Bois</td><td>le souffle passe par un biseau ou une anche</td><td>flûte, hautbois, clarinette, basson, saxophone</td></tr><tr><td>Cuivres</td><td>les lèvres vibrent dans une embouchure</td><td>trompette, cor, trombone, tuba</td></tr><tr><td>Percussions à hauteur déterminée</td><td>on frappe, la note est précise</td><td>timbales, xylophone, glockenspiel</td></tr><tr><td>Percussions à hauteur indéterminée</td><td>on frappe, sans note précise</td><td>caisse claire, grosse caisse, cymbales, triangle</td></tr><tr><td>Électroniques</td><td>le son est produit ou transformé électriquement</td><td>synthétiseur, guitare électrique, ordinateur</td></tr></tbody></table></div>\n<h3>À savoir</h3>\n<ul><li>Le saxophone est en métal mais c&#x27;est un bois : il a une anche.</li><li>La flûte traversière, en métal aussi, est un bois : le son naît d&#x27;un biseau.</li><li>Du plus aigu au plus grave chez les cordes : violon, alto, violoncelle, contrebasse.</li></ul>"}, "voix": {"titre": "Les voix", "niveaux": "6e à 4e", "html": "<p>La tessiture est l&#x27;étendue des notes qu&#x27;une voix peut chanter confortablement.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 400 175\" width=\"100%\" role=\"img\" aria-label=\"Tessitures des voix\"><text x=\"62\" y=\"27\" text-anchor=\"end\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Soprano</text><rect x=\"210\" y=\"15\" width=\"168\" height=\"14\" rx=\"7\" fill=\"currentColor\" opacity=\".75\"/><text x=\"62\" y=\"57\" text-anchor=\"end\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Alto</text><rect x=\"161\" y=\"45\" width=\"168\" height=\"14\" rx=\"7\" fill=\"currentColor\" opacity=\".75\"/><text x=\"62\" y=\"87\" text-anchor=\"end\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Ténor</text><rect x=\"126\" y=\"75\" width=\"168\" height=\"14\" rx=\"7\" fill=\"currentColor\" opacity=\".75\"/><text x=\"62\" y=\"117\" text-anchor=\"end\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Basse</text><rect x=\"70\" y=\"105\" width=\"168\" height=\"14\" rx=\"7\" fill=\"currentColor\" opacity=\".75\"/><line x1=\"70\" y1=\"130\" x2=\"70\" y2=\"136\" stroke=\"currentColor\"/><text x=\"70\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">mi 1</text><line x1=\"126\" y1=\"130\" x2=\"126\" y2=\"136\" stroke=\"currentColor\"/><text x=\"126\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">do 2</text><line x1=\"210\" y1=\"130\" x2=\"210\" y2=\"136\" stroke=\"currentColor\"/><text x=\"210\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">do 3</text><line x1=\"294\" y1=\"130\" x2=\"294\" y2=\"136\" stroke=\"currentColor\"/><text x=\"294\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">do 4</text><line x1=\"378\" y1=\"130\" x2=\"378\" y2=\"136\" stroke=\"currentColor\"/><text x=\"378\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">do 5</text><line x1=\"70\" y1=\"130\" x2=\"388\" y2=\"130\" stroke=\"currentColor\" opacity=\".5\"/><text x=\"70\" y=\"168\" font-size=\"11\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">grave</text><text x=\"388\" y=\"168\" text-anchor=\"end\" font-size=\"11\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">aigu</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Voix</th><th>Qui</th><th>Registre</th></tr></thead><tbody><tr><td>Soprano</td><td>femmes, enfants</td><td>la plus aiguë</td></tr><tr><td>Mezzo-soprano</td><td>femmes</td><td>entre soprano et alto</td></tr><tr><td>Alto (ou contralto)</td><td>femmes, enfants</td><td>grave chez les femmes</td></tr><tr><td>Ténor</td><td>hommes</td><td>aigu chez les hommes</td></tr><tr><td>Baryton</td><td>hommes</td><td>entre ténor et basse</td></tr><tr><td>Basse</td><td>hommes</td><td>la plus grave</td></tr></tbody></table></div>\n<h3>Les ensembles</h3>\n<ul><li>Soliste : un chanteur seul.</li><li>Duo, trio, quatuor : deux, trois, quatre chanteurs.</li><li>Chœur : un groupe de chanteurs, souvent réparti en pupitres (soprano, alto, ténor, basse).</li><li>A cappella : sans instrument.</li><li>La mue : vers 12 à 15 ans, la voix des garçons descend d&#x27;environ une octave.</li></ul>"}, "formes": {"titre": "Les formes musicales", "niveaux": "5e à 3e", "html": "<p>La forme est le plan d&#x27;un morceau : comment ses parties s&#x27;enchaînent et reviennent. On la note avec des lettres.</p>\n<div class=\"tbl\"><table><thead><tr><th>Forme</th><th>Schéma</th><th>Exemple étudié</th></tr></thead><tbody><tr><td>Couplet-refrain</td><td>A B A&#x27; B A&#x27;&#x27; B</td><td>Le Déserteur, la plupart des chansons</td></tr><tr><td>Forme ABA</td><td>A B A</td><td>un air d&#x27;opéra, une danse avec trio</td></tr><tr><td>Rondo</td><td>A B A C A</td><td>un refrain instrumental qui revient entre des couplets différents</td></tr><tr><td>Thème et variations</td><td>A A1 A2 A3</td><td>Mozart, Ah vous dirai-je maman</td></tr><tr><td>Canon</td><td>une mélodie, des départs décalés</td><td>Viva la musica, Pachelbel</td></tr><tr><td>Ostinato</td><td>un motif répété du début à la fin</td><td>Ravel, Boléro</td></tr><tr><td>Grille de blues</td><td>12 mesures, I I I I / IV IV I I / V IV I I</td><td>When the Saints, Robert Johnson</td></tr></tbody></table></div>\n<h3>Repérer une forme</h3>\n<ul><li>Écouter quand un passage revient à l&#x27;identique.</li><li>Noter A pour la première idée, B pour la deuxième, A&#x27; si A revient modifié.</li><li>Compter les mesures ou les phrases si c&#x27;est possible.</li></ul>"}, "gammes": {"titre": "Gammes et modes", "niveaux": "5e à 3e", "html": "<p>Une gamme est une suite de notes rangées du grave à l&#x27;aigu. Elle donne sa couleur à une musique.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 300 170\" width=\"100%\" role=\"img\" aria-label=\"Clavier et gamme pentatonique\"><rect x=\"10\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"30.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">do</text><rect x=\"50\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"70.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">ré</text><rect x=\"90\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"110.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">mi</text><rect x=\"130\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"150.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">fa</text><rect x=\"170\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"190.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">sol</text><rect x=\"210\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"230.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">la</text><rect x=\"250\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"270.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">si</text><rect x=\"38\" y=\"10\" width=\"24\" height=\"80\" fill=\"currentColor\"/><rect x=\"78\" y=\"10\" width=\"24\" height=\"80\" fill=\"currentColor\"/><rect x=\"158\" y=\"10\" width=\"24\" height=\"80\" fill=\"currentColor\"/><rect x=\"198\" y=\"10\" width=\"24\" height=\"80\" fill=\"currentColor\"/><rect x=\"238\" y=\"10\" width=\"24\" height=\"80\" fill=\"currentColor\"/><text x=\"150\" y=\"160\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">Les cinq touches noires forment une gamme pentatonique.</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Gamme</th><th>Notes (exemple)</th><th>Couleur, usage</th></tr></thead><tbody><tr><td>Majeure</td><td>do ré mi fa sol la si do</td><td>souvent lumineuse ; la plupart des hymnes</td></tr><tr><td>Mineure</td><td>la si do ré mi fa sol la</td><td>souvent sombre ou mélancolique</td></tr><tr><td>Pentatonique</td><td>do ré mi sol la (ou les cinq touches noires)</td><td>musiques d&#x27;Asie, d&#x27;Afrique, folk, blues</td></tr><tr><td>Blues</td><td>do mi bémol fa fa dièse sol si bémol do</td><td>blues, jazz, rock ; les « blue notes »</td></tr></tbody></table></div>\n<ul><li>Majeur et mineur ne veulent pas dire gai et triste : ce sont des tendances, pas des règles.</li><li>Une même mélodie jouée en mineur change de caractère : c&#x27;est un procédé de variation.</li></ul>"}, "ecoute": {"titre": "Méthode du commentaire d'écoute", "niveaux": "5e à 3e, et oral du brevet", "html": "<p>Commenter une œuvre, c&#x27;est passer de « j&#x27;aime » à « voici ce que j&#x27;entends, et ce que ça produit ».</p>\n<div class=\"tbl\"><table><thead><tr><th>Étape</th><th>Je me demande</th><th>J&#x27;écris</th></tr></thead><tbody><tr><td>1. Présenter</td><td>Qui ? Quoi ? Quand ?</td><td>titre, compositeur, date, genre</td></tr><tr><td>2. Situer</td><td>Dans quel contexte ?</td><td>époque, lieu, événement, commande</td></tr><tr><td>3. Décrire</td><td>Qu&#x27;est-ce que j&#x27;entends ?</td><td>instruments ou voix, tempo, nuances, plans sonores, forme</td></tr><tr><td>4. Analyser</td><td>Comment la musique produit-elle son effet ?</td><td>un procédé précis relié à une impression</td></tr><tr><td>5. Conclure</td><td>Qu&#x27;est-ce que j&#x27;en pense, et pourquoi ?</td><td>un avis argumenté, une comparaison avec une autre œuvre</td></tr></tbody></table></div>\n<h3>La grille d&#x27;écoute rapide</h3>\n<ul><li>Je repère : un instrument, un retour, un changement.</li><li>Je nomme : avec le vocabulaire de la classe.</li><li>Je relie : à une œuvre étudiée, à un contexte, à une émotion justifiée.</li></ul>"}, "lexique": {"titre": "Lexique de l'année", "niveaux": "6e à 3e", "html": "<div class=\"tbl\"><table><thead><tr><th>Mot</th><th>Définition</th></tr></thead><tbody><tr><td>A cappella</td><td>chant sans accompagnement instrumental</td></tr><tr><td>Accelerando</td><td>en accélérant</td></tr><tr><td>Air</td><td>à l&#x27;opéra, moment chanté qui exprime un sentiment</td></tr><tr><td>Bourdon</td><td>note tenue sous la mélodie</td></tr><tr><td>Boucle</td><td>extrait sonore répété en continu</td></tr><tr><td>Cadence</td><td>dans un concerto, passage où le soliste joue seul</td></tr><tr><td>Canon</td><td>même mélodie avec départs décalés</td></tr><tr><td>Chorus</td><td>solo improvisé en jazz</td></tr><tr><td>Cluster</td><td>agrégat de notes très proches</td></tr><tr><td>Concerto</td><td>œuvre pour soliste et orchestre</td></tr><tr><td>Crescendo</td><td>de plus en plus fort</td></tr><tr><td>Diégétique</td><td>musique que les personnages du film entendent</td></tr><tr><td>Dissonance</td><td>rencontre de notes qui crée une tension</td></tr><tr><td>Distorsion</td><td>son saturé de la guitare électrique</td></tr><tr><td>Flow</td><td>manière de poser le texte sur le rythme en rap</td></tr><tr><td>Improvisation</td><td>musique inventée en la jouant</td></tr><tr><td>Leitmotiv</td><td>thème associé à un personnage ou une idée</td></tr><tr><td>Livret</td><td>texte d&#x27;un opéra</td></tr><tr><td>Monodie</td><td>une seule mélodie</td></tr><tr><td>Ostinato</td><td>motif répété</td></tr><tr><td>Polyphonie</td><td>plusieurs mélodies simultanées</td></tr><tr><td>Pulsation</td><td>battement régulier de la musique</td></tr><tr><td>Récitatif</td><td>à l&#x27;opéra, chant proche de la parole qui fait avancer l&#x27;action</td></tr><tr><td>Sample</td><td>extrait sonore réutilisé</td></tr><tr><td>Swing</td><td>balancement rythmique du jazz</td></tr><tr><td>Tempo</td><td>vitesse de la musique</td></tr><tr><td>Timbre</td><td>couleur du son</td></tr><tr><td>Tutti</td><td>tout l&#x27;orchestre joue</td></tr><tr><td>Unisson</td><td>tous chantent la même mélodie</td></tr><tr><td>Variation</td><td>transformation d&#x27;un thème</td></tr></tbody></table></div>"}}, "pages": {"partenariats": "<h2>Les lieux de musique autour du collège</h2>\n<h3>À Ablon-sur-Seine</h3>\n<ul><li>Espace culturel Alain-Poher : la salle Charlie-Chaplin (430 places), une petite scène, un studio de danse et un forum d&#x27;exposition, avec une saison de spectacles toute l&#x27;année.</li><li>Médiathèque Jacques-Prévert, avenue Auguste-Duru, dans l&#x27;Espace Alain-Poher : elle fait partie du réseau des dix médiathèques de Grand-Orly Seine Bièvre, avec une carte unique.</li></ul>\n<h3>Les conservatoires du territoire</h3>\n<p>Grand-Orly Seine Bièvre compte douze conservatoires en réseau : Arcueil, Athis-Mons, Cachan, Fresnes, Gentilly, L&#x27;Haÿ-les-Roses, Juvisy-sur-Orge, Le Kremlin-Bicêtre, Savigny-sur-Orge, Villejuif, Villeneuve-Saint-Georges et Viry-Châtillon. Les plus proches d&#x27;Ablon sont Athis-Mons, Villeneuve-Saint-Georges et Juvisy-sur-Orge. Chaque printemps, le Printemps des conservatoires propose concerts et portes ouvertes.</p>\n<h3>Pour aller plus loin</h3>\n<ul><li>Philharmonie de Paris : concerts et ateliers pour les jeunes.</li><li>Radio France : concerts à la Maison de la Radio et de la Musique.</li><li>Orchestre national d&#x27;Île-de-France : concerts dans toute la région.</li><li>Sons d&#x27;hiver : festival de jazz du Val-de-Marne, chaque hiver.</li><li>MAC VAL, Vitry-sur-Seine : le musée d&#x27;art contemporain du Val-de-Marne.</li></ul>\n<p>Les sorties et les concerts organisés avec la classe sont annoncés aux familles par l&#x27;établissement.</p>", "cadre": "<h2>Les programmes officiels</h2>\n<h3>Textes de référence</h3>\n<ul><li>Programmes de cycle 3 (CM1, CM2, 6e) et de cycle 4 (5e, 4e, 3e) : Bulletin officiel spécial n° 11 du 26 novembre 2015, modifiés par le Bulletin officiel n° 31 du 30 juillet 2020.</li><li>Horaire : une heure hebdomadaire d&#x27;éducation musicale de la 6e à la 3e.</li></ul>\n<p>Statut au 23/10/2026 : le Conseil supérieur des programmes a publié un projet de programme d&#x27;éducation musicale pour le cycle 4 (juillet 2025) et un projet pour les enseignements artistiques du cycle 3 (juin 2025, consultation de février à mars 2026). Aucune publication au Bulletin officiel d&#x27;un nouveau programme d&#x27;éducation musicale applicable en 2026-2027 n&#x27;a été trouvée. À vérifier sur la page Eduscol « Enseigner au cycle 3 » et « Enseigner au cycle 4 » avant le 2 novembre : si un nouveau texte s&#x27;applique en 6e, la progression de 6e se réajuste, l&#x27;esprit restant le même (le projet de 6e transforme « Chanter et interpréter » en « Chanter et jouer ensemble »).</p>\n<h3>Les quatre compétences</h3>\n<p>Cycle 3 (6e) :</p>\n<ul><li>C1 Chanter et interpréter</li><li>C2 Écouter, comparer et commenter</li><li>C3 Explorer, imaginer et créer</li><li>C4 Échanger, partager et argumenter</li></ul>\n<p>Cycle 4 (5e, 4e, 3e) :</p>\n<ul><li>C1 Réaliser des projets musicaux d&#x27;interprétation ou de création</li><li>C2 Écouter, comparer, construire une culture musicale commune</li><li>C3 Explorer, imaginer, créer et produire</li><li>C4 Échanger, partager, argumenter et débattre</li></ul>\n<p>Chaque séquence des progressions travaille trois ou quatre de ces compétences, et chaque compétence est évaluée plusieurs fois dans l&#x27;année.</p>\n<h3>Liens avec le reste du collège</h3>\n<ul><li>Socle commun : l&#x27;éducation musicale contribue surtout au domaine 1 (langages des arts et du corps) et au domaine 5 (représentations du monde et activité humaine).</li><li>Parcours d&#x27;éducation artistique et culturelle : sorties, concerts, rencontres d&#x27;artistes.</li><li>Histoire des arts : en 3e, l&#x27;épreuve orale du brevet peut porter sur un projet ou une oeuvre étudiés en éducation musicale. La séquence 5 de 3e y prépare.</li><li>Chant choral : enseignement facultatif, à proposer si l&#x27;établissement le permet.</li></ul><h2>Calendrier 2026-2027, zone C (académie de Créteil)</h2>\n<p>Arrêté du 22 octobre 2025. Prise de poste le lundi 2 novembre 2026.</p>\n<div class=\"tbl\"><table><thead><tr><th>Période</th><th>Semaines de cours</th><th>Nombre</th></tr></thead><tbody><tr><td>P1</td><td>du 2 novembre au 18 décembre</td><td>7</td></tr><tr><td>Vacances de Noël</td><td>du samedi 19 décembre au lundi 4 janvier</td><td></td></tr><tr><td>P2</td><td>du 4 janvier au 5 février</td><td>5</td></tr><tr><td>Vacances d&#x27;hiver</td><td>du samedi 6 février au lundi 22 février</td><td></td></tr><tr><td>P3</td><td>du 22 février au 2 avril</td><td>6</td></tr><tr><td>Vacances de printemps</td><td>du samedi 3 avril au lundi 19 avril</td><td></td></tr><tr><td>P4</td><td>du 19 avril au 21 mai</td><td>5</td></tr><tr><td>P5</td><td>du 24 mai au samedi 3 juillet (fin des cours)</td><td>6</td></tr></tbody></table></div>\n<p>Total : 29 semaines. Jours sans cours à surveiller : mercredi 11 novembre, lundi de Pâques 29 mars, jeudi 6 mai (Ascension) et vendredi 7 mai (pont, sans classe dans les trois zones), lundi de Pentecôte 17 mai. Les classes de 3e se vident avant le brevet, fin juin : leur progression s&#x27;arrête début juin.</p>\n<h3>Répartition dans les progressions</h3>\n<ul><li>Semaine du 2 novembre : séance d&#x27;accueil, la même pour tous les niveaux.</li><li>Une séquence par période, cinq séances chacune (quatre en P5).</li><li>Semaines tampon : 14 décembre, 29 mars, et la fin juin. Elles absorbent les séances perdues.</li></ul><h2>L&#x27;évaluation</h2>\n<h3>Principe</h3>\n<p>Chaque séquence se termine par une évaluation qui porte sur ce qui a été travaillé en classe, et sur rien d&#x27;autre. Les élèves savent dès le début de la séquence ce qui sera évalué : c&#x27;est écrit dans leur plan de l&#x27;année.</p>\n<p>Trois types d&#x27;évaluation, sur l&#x27;année :</p>\n<ul><li>l&#x27;interprétation : le chant de la séquence, en petit groupe plutôt que seul, pour ne pas mettre un élève en difficulté devant la classe ;</li><li>l&#x27;écoute : un extrait inconnu à décrire avec le vocabulaire appris ;</li><li>la création ou l&#x27;argumentation : une réalisation de groupe, un exposé, un débat.</li></ul>\n<h3>Les quatre niveaux de maîtrise (socle commun)</h3>\n<div class=\"tbl\"><table><thead><tr><th>Niveau</th><th>Intitulé</th><th>Pour l&#x27;élève</th></tr></thead><tbody><tr><td>1</td><td>Maîtrise insuffisante</td><td>je ne sais pas encore le faire, même aidé</td></tr><tr><td>2</td><td>Maîtrise fragile</td><td>je sais le faire avec de l&#x27;aide</td></tr><tr><td>3</td><td>Maîtrise satisfaisante</td><td>je sais le faire seul</td></tr><tr><td>4</td><td>Très bonne maîtrise</td><td>je sais le faire seul et l&#x27;expliquer aux autres</td></tr></tbody></table></div>\n<p>Si l&#x27;établissement note sur 20, correspondance indicative : 1 = 5, 2 = 10, 3 = 15, 4 = 20. À ajuster sur la pratique de l&#x27;établissement, à demander à la rentrée.</p>\n<h3>Grille de l&#x27;interprétation (chant)</h3>\n<div class=\"tbl\"><table><thead><tr><th>Critère</th><th>1</th><th>2</th><th>3</th><th>4</th></tr></thead><tbody><tr><td>Justesse et mémorisation</td><td>paroles et mélodie non sues</td><td>avec le support, des erreurs</td><td>su, quelques hésitations</td><td>su, juste et sûr</td></tr><tr><td>Mise en place</td><td>ne suit pas le groupe</td><td>suit avec difficulté</td><td>ensemble avec le groupe</td><td>ensemble et attentif aux autres</td></tr><tr><td>Expression</td><td>aucune nuance</td><td>nuances rares</td><td>nuances respectées</td><td>interprétation personnelle</td></tr></tbody></table></div>\n<h3>Grille de l&#x27;écoute</h3>\n<div class=\"tbl\"><table><thead><tr><th>Critère</th><th>1</th><th>2</th><th>3</th><th>4</th></tr></thead><tbody><tr><td>Repérer</td><td>ne repère rien</td><td>repère un élément</td><td>repère l&#x27;essentiel</td><td>repère et situe dans le temps</td></tr><tr><td>Nommer</td><td>pas de vocabulaire</td><td>vocabulaire approximatif</td><td>vocabulaire juste</td><td>vocabulaire juste et varié</td></tr><tr><td>Relier</td><td>aucun lien</td><td>lien vague</td><td>relie à une oeuvre étudiée</td><td>compare et justifie</td></tr></tbody></table></div>", "ressources": "<h2>Ressources</h2>\n<p>Les liens sont à vérifier depuis un navigateur : ils n&#x27;ont pas pu être ouverts lors de la rédaction (sites publics bloqués par l&#x27;environnement de travail).</p>\n<h3>Officiel et pédagogique</h3>\n<ul><li>Eduscol, éducation musicale : programmes, ressources d&#x27;accompagnement par cycle.</li><li>Sites disciplinaires des académies (Créteil, Paris, Versailles, et d&#x27;autres) : séquences, évaluations, banques d&#x27;écoutes partagées par des professeurs.</li><li>Musique Prim : répertoire de chants avec playbacks, pensé pour l&#x27;école mais utile en 6e.</li><li>Lumni : vidéos courtes pour introduire une oeuvre ou un compositeur.</li></ul>\n<h3>Écouter et voir les oeuvres</h3>\n<ul><li>Philharmonie de Paris, ressources éducatives (accès enseignant via Éduthèque).</li><li>Radio France, ressources pour la classe (Maison de la Radio et de la Musique).</li><li>Opéra national de Paris, ressources pédagogiques (pour la séquence opéra de 4e).</li><li>Plateformes de streaming pour les extraits ; préparer les extraits à l&#x27;avance, sans publicité.</li></ul>\n<h3>Partitions</h3>\n<ul><li>IMSLP : partitions du domaine public (Mozart, Bach, Vivaldi, Machaut, etc.).</li><li>Les chants de variété ne sont pas libres de droits : utiliser une partition éditée ou l&#x27;apprentissage par imitation.</li></ul>\n<h3>Outils numériques gratuits</h3>\n<ul><li>MuseScore : écriture de partitions.</li><li>Audacity : enregistrement et montage du son (séquences de création).</li><li>Chrome Music Lab : expériences simples sur le rythme, la mélodie, le son, très utile en 6e.</li><li>BandLab : studio en ligne pour les boucles et la musique électronique (séquence de 4e).</li></ul>\n<h3>Banques de séquences toutes prêtes (à comparer avec nos progressions)</h3>\n<ul><li>Académie de Bordeaux, séquences de collège par niveau (exemples : musique et civilisation grecque en 6e, art et mémoire en 3e) : <a href=\"https://ent2d.ac-bordeaux.fr/disciplines/musique/college/sequences/6/\" target=\"_blank\" rel=\"noopener\">https://ent2d.ac-bordeaux.fr/disciplines/musique/college/sequences/6/</a></li><li>Académie de Versailles, Educamus, séquence de 6e (interpréter et créer) : <a href=\"https://educamus.ac-versailles.fr/IMG/pdf/sequence_musique_6e.pdf\" target=\"_blank\" rel=\"noopener\">https://educamus.ac-versailles.fr/IMG/pdf/sequence_musique_6e.pdf</a></li><li>Académie de Nancy-Metz, chant choral école et collège, cycle 3 : <a href=\"https://sites.ac-nancy-metz.fr/education-musicale/chant-choral/?p=1014\" target=\"_blank\" rel=\"noopener\">https://sites.ac-nancy-metz.fr/education-musicale/chant-choral/?p=1014</a></li></ul>\n<h3>Ressources envoyées par Sébastien</h3>\n<ul><li>29/10/2026 : <a href=\"https://www.ecoles-colleges.com/séquence-musique-6ème-5ème-4ème-3ème-collège/\" target=\"_blank\" rel=\"noopener\">https://www.ecoles-colleges.com/séquence-musique-6ème-5ème-4ème-3ème-collège/</a> (séquences de la 6e à la 3e). Contenu non lu : le site est hors des domaines autorisés de la session de travail. À ouvrir depuis un navigateur, et à reporter ici ce qui sert.</li></ul>"}};
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = new Date(); today.setHours(0,0,0,0);
const parse = iso => { const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); };
const PER = {P1:"Novembre, décembre",P2:"Janvier, février",P3:"Mars",P4:"Avril, mai",P5:"Fin mai, juin"};
const NIV = Object.keys(D.niveaux);
const get = (k, d) => { try { return localStorage.getItem(k) || d; } catch (_) { return d; } };
const set = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
const EMBLEME = `<svg width="30" height="22" viewBox="0 0 30 22" aria-hidden="true"><g stroke="var(--line)" stroke-width="1"><path d="M0 4h30M0 8h30M0 12h30M0 16h30M0 20h30"/></g><path d="M15 19 C6 13 7 6 11 6 c2 0 3.2 1.4 4 2.8 C15.8 7.4 17 6 19 6 c4 0 5 7 -4 13z" fill="var(--gold)"/></svg>`;
const head = (eyebrow, titre, lead) => `<header class="top"><div class="brand">${EMBLEME}<span>${esc(eyebrow)}</span></div><h1>${esc(titre)}</h1>${lead ? `<p class="lead">${esc(lead)}</p>` : ""}</header>`;
const pdf = (nom, libelle) => `<a class="btn" href="pdf/${nom}" target="_blank" rel="noopener">${esc(libelle)}</a>`;
const gh = chemin => `<a class="alt" href="${D.depot}${chemin}" target="_blank" rel="noopener">ou sur GitHub</a>`;
const levels = (base, k) => `<nav class="levels" aria-label="Niveau">${NIV.map(n => `<a href="#${base}-${n}" aria-current="${n === k}">${n}</a>`).join("")}</nav>`;

function semaineEnCours(cal) {
  for (const e of cal) { const d = parse(e.date), f = new Date(d); f.setDate(f.getDate() + 7); if (today >= d && today < f) return e; }
  return null;
}
function libelle(n, e) {
  if (!e) return "Année terminée";
  if (e.type === "accueil") return "Séance d'accueil";
  if (e.type === "tampon") return "Semaine tampon : rattrapage ou concert";
  const s = n.sequences[e.seq - 1], c = n.contenus[e.seq - 1].seances[e.num - 1];
  return `${s.titre}, séance ${e.num} : ${c.objectif}`;
}

function frise() {
  const per = [["P1","nov.-déc.","2026-11-02","2026-12-19"],["P2","janv.-fév.","2027-01-04","2027-02-06"],["P3","mars","2027-02-22","2027-04-03"],["P4","avril-mai","2027-04-19","2027-05-22"],["P5","juin","2027-05-24","2027-07-03"]];
  const t0 = parse("2026-11-02"), t1 = parse("2027-07-03");
  const pct = Math.max(0, Math.min(100, (today - t0) / (t1 - t0) * 100));
  const on = per.find(p => today >= parse(p[2]) && today < parse(p[3]));
  return `<div class="timeline"><div class="label">L'année en cinq périodes</div><div class="tl-bar">${per.map(p => `<div class="${on && on[0] === p[0] ? "on" : ""}">${p[1]}</div>`).join("")}
    <span class="tl-mark" style="left:calc(${pct}% - 1px)" title="aujourd'hui"></span></div><div class="tl-leg"><span>2 novembre</span><span>3 juillet</span></div></div>`;
}

const WEEKS = D.niveaux[NIV[0]].calendrier.map(e => ({ semaine: e.semaine, date: e.date }));
function indexDuJour() {
  if (today < parse(WEEKS[0].date)) return 0;
  for (let i = WEEKS.length - 1; i >= 0; i--) if (today >= parse(WEEKS[i].date)) return i;
  return 0;
}
const seanceId = (k, e) => `seance-${k}-${e.seq}-${e.num}`;

function vueSemaine(idx) {
  const courant = indexDuJour();
  if (idx === undefined || isNaN(idx)) idx = courant;
  idx = Math.max(0, Math.min(WEEKS.length - 1, idx));
  const w = WEEKS[idx], avant = today < parse(WEEKS[0].date), estCourant = idx === courant && !avant;
  let h = "";
  if (idx === courant) {
    h += `<section class="hero"><div class="hero-in"><div class="id">${D.logo}<div><b>Éducation musicale</b><span>${esc(D.etablissement)}</span></div></div>
      <h1>${avant ? `Première séance <span class="gold">lundi 2 novembre</span>` : `Cette <span class="gold">semaine</span>`}</h1>
      <p>${avant ? "La séance d'accueil, la même pour tous les niveaux. Le plan de l'année est distribué aux élèves." : "Ce qui est prévu dans chaque niveau."}</p></div></section>` + frise();
  } else {
    h += head("Agenda de l'année", `Semaine du ${w.semaine}`, idx < courant ? "Semaine passée." : "Semaine à venir.");
  }
  h += `<div class="weeknav"><a class="wbtn" href="#semaine-${Math.max(0, idx - 1)}" aria-label="Semaine précédente"${idx === 0 ? ' aria-disabled="true"' : ""}>&#8249;</a>
    <div class="wlabel"><span class="meta">Semaine ${idx + 1} sur ${WEEKS.length}</span><b>du ${esc(w.semaine)}</b></div>
    <a class="wbtn" href="#semaine-${Math.min(WEEKS.length - 1, idx + 1)}" aria-label="Semaine suivante"${idx === WEEKS.length - 1 ? ' aria-disabled="true"' : ""}>&#8250;</a></div>
    <div class="strip" id="strip">${WEEKS.map((x, i) => `<a href="#semaine-${i}" class="${i === idx ? "on" : ""}${i === courant ? " today" : ""}">${x.semaine}</a>`).join("")}</div>`;
  if (idx !== courant) h += `<p class="small" style="margin-top:8px"><a href="#semaine">Revenir à cette semaine</a></p>`;
  h += `<div class="stack" style="margin-top:14px">`;
  for (const k of NIV) {
    const n = D.niveaux[k], e = n.calendrier[idx];
    let detail = "", lien = `#cours-${k}`;
    if (e.type === "seance") { detail = n.contenus[e.seq - 1].seances[e.num - 1].etapes.map(([m, t]) => `${m} min, ${t}`).slice(0, 2).join(" "); lien = "#" + seanceId(k, e); }
    if (e.type === "accueil") detail = D.accueil.deroule[0];
    h += `<a class="card${estCourant ? " now" : ""}" href="${lien}"><div class="lvlcard"><div class="lvlbadge" style="background:${D.couleurs[k]}">${k}</div><div class="stack" style="gap:4px">
      <h3>${esc(libelle(n, e))}</h3>${detail ? `<p class="small">${esc(detail)}</p>` : ""}${e.type === "seance" ? `<span class="small" style="color:var(--gold)">Voir la séance &#8250;</span>` : ""}</div></div></a>`;
  }
  h += `</div>`;
  if (idx === courant) h += `<div class="staff"></div><div class="tiles">
    <a class="tile" href="#fiches"><span class="ico">${D.ficheIcons.figures}</span><h3>Fiches de notions</h3><span class="small">Nuances, figures, instruments, voix…</span></a>
    <a class="tile" href="#eval"><span class="ico">${D.ficheIcons.ecoute}</span><h3>Évaluations</h3><span class="small">Grilles et résultats attendus</span></a></div>`;
  return h;
}

function listeSeances(k) { return D.niveaux[k].calendrier.filter(e => e.type === "seance"); }
function vueSeance(k, seq, num) {
  const n = D.niveaux[k], s = n.sequences[seq - 1], c = n.contenus[seq - 1], se = c.seances[num - 1];
  const liste = listeSeances(k), pos = liste.findIndex(e => e.seq === seq && e.num === num), e = liste[pos];
  const prev = liste[pos - 1], next = liste[pos + 1];
  const widx = WEEKS.findIndex(w => w.date === e.date);
  let h = `<header class="top"><div class="brand"><span class="lvlbadge" style="background:${D.couleurs[k]};width:30px;height:30px;font-size:1rem;border-radius:8px">${k}</span><span>Séquence ${seq}, ${esc(s.titre)}</span></div>
    <h1>Séance ${num}</h1><p class="lead">${esc(se.objectif)}</p><p class="meta">Semaine du ${esc(e.semaine)}, séance ${pos + 1} sur ${liste.length} de l'année</p></header>`;
  h += `<div class="pager"><a class="wbtn" href="${prev ? "#" + seanceId(k, prev) : "#cours-" + k}" aria-label="Séance précédente">&#8249;</a>
    <a class="small" href="#semaine-${widx}">Toute la semaine</a><a class="wbtn" href="${next ? "#" + seanceId(k, next) : "#cours-" + k}" aria-label="Séance suivante">&#8250;</a></div>`;
  h += `<div class="stack" style="margin-top:14px"><div class="card"><div class="label">Déroulé, 55 minutes</div><ul class="steps">${se.etapes.map(([m, t]) => `<li><span class="min">${m} min</span><span>${esc(t)}</span></li>`).join("")}</ul></div>
    <div class="card"><div class="label">Chant</div><p>${esc(s.chant)}</p><div class="label" style="margin-top:6px">Œuvres de la séquence</div><ul class="plain">${s.oeuvres.map(o => `<li>${esc(o)}</li>`).join("")}</ul></div>
    <div class="card"><div class="label">Trace écrite de la séquence</div><div class="trace">${c.trace.map(t => `<p>${esc(t)}</p>`).join("")}</div></div>
    <div class="card"><div class="label">Fiches utiles</div><div class="chips">${c.fiches.map(f => `<a class="chip" href="#fiche-${f}">${esc(D.fiches[f].titre)}</a>`).join("")}</div></div></div>`;
  h += `<div class="pager" style="margin-top:16px">${prev ? `<a class="btn2" href="#${seanceId(k, prev)}">&#8249; Séance précédente</a>` : "<span></span>"}${next ? `<a class="btn2" href="#${seanceId(k, next)}">Séance suivante &#8250;</a>` : "<span></span>"}</div>`;
  return h;
}

function vueCours(k) {
  const n = D.niveaux[k], comp = D.competences[n.cycle], cur = semaineEnCours(n.calendrier), mode = get("mode", "prof");
  const dates = {}; n.calendrier.forEach(e => { if (e.type === "seance") dates[e.seq + "-" + e.num] = e.semaine; });
  let h = head(`Cours, ${n.cycle === "cycle3" ? "cycle 3" : "cycle 4"}`, `Classe de ${k}`, n.intro) + levels("cours", k);
  h += `<div class="seg" role="group" aria-label="Vue"><button id="m-prof" aria-pressed="${mode === "prof"}">Le cours détaillé</button><button id="m-eleves" aria-pressed="${mode === "eleves"}">Plan élèves et parents</button></div>`;
  if (mode === "eleves") {
    h += `<div class="dl">${pdf(`Plan_${k}_eleves_parents.pdf`, "Plan à imprimer (1 page)")} ${gh(`${k}/Plan_${k}_eleves_parents.pdf`)}</div><div class="stack" style="margin-top:14px">`;
    n.sequences.forEach((s, i) => {
      h += `<div class="card"><div class="meta">${esc(PER[s.periode])}</div><h3>${i + 1}. ${esc(s.titre)}</h3><p class="q">${esc(s.question)}</p>
        <div><div class="label">Le chant</div><p>${esc(s.chant)}</p></div>
        <div><div class="label">Je dois savoir</div><p>${esc(s.vocabulaire.join(", "))}</p></div>
        <div><div class="label">Je suis évalué sur</div><p>${esc(s.evaluation)}</p></div></div>`;
    });
    h += `</div><div class="staff"></div><div class="prose"><h2>Les quatre compétences</h2><ul>${Object.entries(comp).map(([c, t]) => `<li>${c} : ${esc(t)}</li>`).join("")}</ul>
      <p class="small">Évaluées sur quatre niveaux : maîtrise insuffisante, fragile, satisfaisante, très bonne.</p>
      <h2>Pour les parents</h2><p>Le cours alterne chant, écoute, création et échange. Il n'est pas nécessaire de savoir lire la musique ni de jouer d'un instrument. Le travail à la maison est court : relire la trace écrite et réécouter les œuvres. Matériel : un porte-vues ou un cahier réservé à la musique.</p></div>`;
    return h;
  }
  h += `<div class="dl">${pdf(`Cours_${k}_detaille.pdf`, "Cours détaillé")} ${pdf(`Evaluations_${k}.pdf`, "Fiches d'évaluation")} ${gh(`${k}/Cours_${k}_detaille.pdf`)}</div>`;
  h += `<div class="stack" style="margin-top:14px"><details class="seq"><summary><span class="ico" style="background:var(--gold)">${D.icones.accueil}</span><span class="seqhead"><span class="meta">Semaine du ${esc(D.accueil.semaine)}</span><h3>Séance d'accueil</h3></span><span class="chev">&#8250;</span></summary>
    <div class="body"><ul class="plain">${D.accueil.deroule.map(d => `<li>${esc(d)}</li>`).join("")}</ul></div></details>`;
  n.sequences.forEach((s, i) => {
    const c = n.contenus[i], ouvert = cur && cur.seq === i + 1;
    h += `<details class="seq"${ouvert ? " open" : ""}><summary><span class="ico" style="background:${D.couleurs[k]}">${D.icones[k][i]}</span><span class="seqhead"><span class="meta">Séquence ${i + 1}, ${esc(PER[s.periode])}</span><h3>${esc(s.titre)}</h3></span><span class="chev">&#8250;</span></summary><div class="body"><p class="meta">Semaines du ${esc(s.semaines)}</p>
      <p class="q">${esc(s.question)}</p>
      <div class="chips">${s.competences.map(x => `<span class="chip">${x} ${esc(comp[x])}</span>`).join("")}</div>
      <div><div class="label">Objectifs</div><ul class="plain">${c.objectifs.map(o => `<li>${esc(o)}</li>`).join("")}</ul></div>
      <div><div class="label">Chant</div><p>${esc(s.chant)}</p></div>
      <div><div class="label">Œuvres de référence</div><ul class="plain">${s.oeuvres.map(o => `<li>${esc(o)}</li>`).join("")}</ul></div>
      <div class="stack" style="gap:8px"><div class="label">Séances</div>${c.seances.map((se, j) => {
        const now = cur && cur.seq === i + 1 && cur.num === j + 1;
        return `<div class="seance${now ? " now" : ""}"><div class="meta">Séance ${j + 1}, semaine du ${esc(dates[(i + 1) + "-" + (j + 1)] || "")}${now ? ", cette semaine" : ""}</div><h4><a href="#seance-${k}-${i + 1}-${j + 1}">${esc(se.objectif)}</a></h4>
          <ul class="steps">${se.etapes.map(([m, t]) => `<li><span class="min">${m} min</span><span>${esc(t)}</span></li>`).join("")}</ul></div>`; }).join("")}</div>
      <div><div class="label">Trace écrite</div><div class="trace">${c.trace.map(t => `<p>${esc(t)}</p>`).join("")}</div></div>
      <div><div class="label">Travail à la maison</div><p>${esc(c.devoirs)}</p></div>
      <div><div class="label">Évaluation</div><p>${esc(c.eval.consigne)}</p><p class="small" style="margin-top:4px"><a href="#eval-${k}">Grille et résultats attendus</a></p></div>
      <div><div class="label">Fiches de notions</div><div class="chips" style="margin-top:6px">${c.fiches.map(f => `<a class="chip" href="#fiche-${f}">${esc(D.fiches[f].titre)}</a>`).join("")}</div></div>
    </div></details>`;
  });
  return h + `</div>`;
}

function vueEval(k) {
  const n = D.niveaux[k], comp = D.competences[n.cycle];
  let h = head("Évaluer", `Évaluations de ${k}`, "Pour chaque séquence : la consigne, la grille sur quatre niveaux et les résultats attendus.") + levels("eval", k);
  h += `<div class="dl">${pdf(`Evaluations_${k}.pdf`, "Fiches élèves à imprimer")} ${gh(`${k}/Evaluations_${k}.pdf`)}</div><div class="stack" style="margin-top:14px">`;
  n.sequences.forEach((s, i) => {
    const ev = n.contenus[i].eval;
    h += `<div class="card"><div class="lvlcard"><span class="ico" style="background:${D.couleurs[k]}">${D.icones[k][i]}</span><div><div class="meta">Séquence ${i + 1}, ${esc(PER[s.periode])}</div><h3>${esc(s.titre)}</h3></div></div><p>${esc(ev.consigne)}</p>
      <div class="tbl"><table class="evt"><thead><tr><th>Critère</th><th>Comp.</th><th class="box">1</th><th class="box">2</th><th class="box">3</th><th class="box">4</th></tr></thead><tbody>
      ${ev.criteres.map(([cr, code]) => `<tr><td>${esc(cr)}</td><td title="${esc(comp[code])}">${code}</td><td class="box">&#9633;</td><td class="box">&#9633;</td><td class="box">&#9633;</td><td class="box">&#9633;</td></tr>`).join("")}</tbody></table></div>
      <p class="small">${ev.criteres.map(([, code]) => code).filter((c, j, a) => a.indexOf(c) === j).map(c => `${c} ${esc(comp[c])}`).join(" ; ")}.</p>
      <div><div class="label">Résultats attendus</div><ul class="plain">${ev.attendus.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div></div>`;
  });
  return h + `</div><div class="staff"></div><p class="small">1 maîtrise insuffisante : je ne sais pas encore le faire, même aidé. 2 fragile : avec de l'aide. 3 satisfaisante : seul. 4 très bonne : seul, et je sais l'expliquer.</p>`;
}

function vueFiches() {
  let h = head("Fiches de notions", "Les notions de l'année", "Chaque fiche se consulte ici et s'imprime en PDF pour les élèves.") + `<div class="staff"></div><div class="tiles">`;
  for (const [id, f] of Object.entries(D.fiches)) h += `<a class="tile" href="#fiche-${id}"><span class="ico">${D.ficheIcons[id]}</span><h3>${esc(f.titre)}</h3><span class="meta">${esc(f.niveaux)}</span></a>`;
  return h + `</div>`;
}
function vueFiche(id) {
  const f = D.fiches[id];
  return head("Fiche de notions", f.titre, `Niveaux : ${f.niveaux}.`) + `<div class="dl">${pdf(`fiche_${id}.pdf`, "Fiche à imprimer")} ${gh(`fiches/${id}.pdf`)}</div>
    <div class="staff"></div><div class="prose">${f.html}</div><div class="staff"></div><p><a href="#fiches">Toutes les fiches</a></p>`;
}

const PLUS = [["cafep", "CAFEP 2027", "Le concours, le calendrier, l'inscription pas à pas."], ["partenariats", "Partenaires culturels", "Lieux de musique, conservatoires et concerts autour d'Ablon."],
  ["cadre", "Cadre", "Programmes, calendrier de l'année, grilles d'évaluation."], ["ressources", "Ressources", "Sites, outils, banques de séquences."]];
function vuePlus() {
  const items = PLUS.filter(([id]) => D.pages[id]);
  return head("Plus", "Concours, partenaires, cadre", "") + `<div class="staff"></div><div class="stack">${items.map(([id, t, d]) => `<a class="card" href="#${id}"><h3>${esc(t)}</h3><p class="small">${esc(d)}</p></a>`).join("")}</div>
    <div class="staff"></div><p class="small"><a href="${D.depot.replace("/blob/main/", "")}" target="_blank" rel="noopener">Le dépôt complet sur GitHub</a></p>`;
}
function vuePage(id) {
  const t = PLUS.find(x => x[0] === id);
  return head("Plus", t[1], t[2]) + `<div class="staff"></div><div class="prose">${D.pages[id]}</div><div class="staff"></div><p><a href="#plus">Retour</a></p>`;
}

function rendre() {
  let v = (location.hash || "#semaine").slice(1), tab = "semaine";
  if (v === "cours" || v === "eval") v = v + "-" + get("niv", "6e");
  const m = v.match(/^(cours|eval)-(\w+)$/);
  if (m && D.niveaux[m[2]]) { set("niv", m[2]); app.innerHTML = m[1] === "cours" ? vueCours(m[2]) : vueEval(m[2]); tab = m[1]; }
  else if (v === "fiches") { app.innerHTML = vueFiches(); tab = "fiches"; }
  else if (v.startsWith("fiche-") && D.fiches[v.slice(6)]) { app.innerHTML = vueFiche(v.slice(6)); tab = "fiches"; }
  else if (v === "plus") { app.innerHTML = vuePlus(); tab = "plus"; }
  else if (D.pages[v]) { app.innerHTML = vuePage(v); tab = "plus"; }
  else if (/^seance-\w+-\d+-\d+$/.test(v) && D.niveaux[v.split("-")[1]]) { const [, k, a, b] = v.split("-"); app.innerHTML = vueSeance(k, +a, +b); tab = "cours"; }
  else if (/^semaine-\d+$/.test(v)) app.innerHTML = vueSemaine(+v.split("-")[1]);
  else app.innerHTML = vueSemaine();
  document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.t === tab ? "page" : "false"));
  ["prof", "eleves"].forEach(x => { const b = document.getElementById("m-" + x); if (b) b.onclick = () => { set("mode", x); rendre(); }; });
  window.scrollTo(0, 0);
  const st = document.getElementById("strip"), on = st && st.querySelector(".on");
  if (on) st.scrollLeft = on.offsetLeft - st.clientWidth / 2 + on.clientWidth / 2;
}
window.addEventListener("hashchange", rendre);
rendre();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").then(r => r.update()).catch(() => {});
</script>

</body>
