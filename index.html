<style>
/* Carnet de cours aux couleurs du Sacré-Coeur : bleu nuit et or, portées en séparateur, une colonne, onglets en bas. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --ink: #1b2836;
  --muted: #5d6978;
  --line: #d7dde6;
  --navy: #22364d;
  --navy-soft: #e5ebf3;
  --gold: #a9802f;
  --gold-soft: #f6efe1;
  --on-navy: #ffffff;
  --f-display: "Cormorant Garamond", Garamond, "Times New Roman", serif;
  --f-body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1621; --surface: #172131; --ink: #e8edf4; --muted: #9eabbb; --line: #2a3749;
  --navy: #a9c1de; --navy-soft: #1d2c40; --gold: #d8b46c; --gold-soft: #2d2618; --on-navy: #0f1621; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1621; --surface: #172131; --ink: #e8edf4; --muted: #9eabbb; --line: #2a3749;
  --navy: #a9c1de; --navy-soft: #1d2c40; --gold: #d8b46c; --gold-soft: #2d2618; --on-navy: #0f1621; color-scheme: dark }

html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px);
}
main { max-width: 700px; margin: 0 auto; }
header.top { padding-block: 20px 4px; display: flex; flex-direction: column; gap: 6px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--muted); font: 500 12px/1.3 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; }
.brand svg { flex: none; }
.brand .lvlbadge { text-transform: none; letter-spacing: 0; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; color: var(--navy); }
h1 { font-weight: 700; font-size: 2.2rem; line-height: 1.05; }
h2 { font-weight: 700; font-size: 1.55rem; line-height: 1.15; }
h3 { font-weight: 700; font-size: 1.25rem; line-height: 1.2; }
p { margin: 0; }
a { color: var(--navy); text-decoration-color: var(--gold); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.lead { color: var(--muted); max-width: 62ch; }
.staff { height: 17px; margin-block: 18px; background: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 4px); position: relative; }
.staff::after { content: ""; position: absolute; left: 0; top: 0; width: 28px; height: 17px; background: var(--gold); opacity: .85; border-radius: 2px; }

.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
a.card { text-decoration: none; color: inherit; }
.card.now { border-color: var(--gold); box-shadow: inset 4px 0 0 var(--gold); }
.row { display: grid; grid-template-columns: 50px 1fr; gap: 12px; align-items: start; }
.lvl { font: 700 1.6rem/1 var(--f-display); color: var(--gold); }
.meta { font: 400 12.5px/1.4 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.small { font-size: .93rem; color: var(--muted); }
.label { font: 500 11.5px/1.3 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12.5px/1.2 var(--f-mono); padding: 6px 10px; border-radius: 999px; background: var(--navy-soft); color: var(--navy); text-decoration: none; border: 1px solid transparent; }
a.chip:hover { border-color: var(--navy); }
.levels { display: flex; gap: 6px; margin-block: 14px 2px; }
.levels a { flex: 1; text-align: center; padding: 9px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--navy); font: 700 1.15rem/1 var(--f-display); text-decoration: none; }
.levels a[aria-current="true"] { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.seg { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; margin-top: 10px; }
.seg button { flex: 1; font: 500 .93rem var(--f-body); border: 0; border-radius: 7px; padding: 9px 6px; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); }
.dl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; background: var(--gold-soft); color: var(--ink); border: 1px solid var(--gold); text-decoration: none; font-size: .93rem; }
.btn::before { content: "PDF"; font: 500 10.5px/1 var(--f-mono); color: var(--gold); letter-spacing: .06em; }
.alt { font-size: .82rem; color: var(--muted); }

details.seq { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
details.seq > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: 30px 1fr 18px; gap: 10px; align-items: start; }
details.seq > summary::-webkit-details-marker { display: none; }
.num { font: 500 13px/1.8 var(--f-mono); color: var(--gold); }
.chev { color: var(--muted); font-size: 22px; line-height: 1; text-align: center; transition: transform .15s; }
details[open] > summary .chev { transform: rotate(90deg); }
.body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.q { font-family: var(--f-display); font-size: 1.2rem; font-style: italic; color: var(--ink); line-height: 1.3; }
ul.plain { margin: 0; padding-left: 1.15em; display: flex; flex-direction: column; gap: 4px; }
.seance { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.seance.now { border-color: var(--gold); background: var(--gold-soft); }
.seance h4 { margin: 0; font: 700 .98rem/1.3 var(--f-body); color: var(--navy); }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.steps li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; font-size: .93rem; }
.steps .min { font: 400 12px/1.6 var(--f-mono); color: var(--muted); }
.trace { border-left: 3px solid var(--gold); padding-left: 12px; display: flex; flex-direction: column; gap: 4px; }

.prose { display: flex; flex-direction: column; gap: 10px; }
.prose h2 { margin-top: 12px; } .prose h3 { margin-top: 8px; }
.prose ul, .prose ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.prose li, .prose p { overflow-wrap: anywhere; }
td { overflow-wrap: break-word; }
.fig { margin: 4px 0; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--navy); }
.fig svg { display: block; max-width: 100%; height: auto; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 12px var(--f-mono); color: var(--muted); background: var(--navy-soft); }
td.box, th.box { width: 26px; padding-inline: 4px; text-align: center; color: var(--muted); }
.evt td:nth-child(2), .evt th:nth-child(2) { width: 40px; padding-inline: 6px; }
code { font-family: var(--f-mono); font-size: .88em; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs ul { list-style: none; margin: 0 auto; padding: 0; max-width: 700px; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
nav.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 100%; text-decoration: none; color: var(--muted); font: 500 11.5px var(--f-body); }
nav.tabs svg { width: 22px; height: 22px; }
nav.tabs a[aria-current="page"] { color: var(--navy); }
nav.tabs a[aria-current="page"] svg { color: var(--gold); }
.hero { margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 26px max(16px, env(safe-area-inset-left, 0px)) 72px; background: linear-gradient(160deg, #22364d 0%, #2c4767 60%, #34557a 100%); color: #fff; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: auto 0 16px 0; height: 41px; background: repeating-linear-gradient(to bottom, rgba(255,255,255,.14) 0 1px, transparent 1px 10px); }
.hero-in { position: relative; max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.hero .id { display: flex; align-items: center; gap: 12px; }
.hero .id svg { width: 52px; height: 52px; flex: none; box-shadow: 0 6px 18px rgba(0,0,0,.25); border-radius: 14px; }
.hero .id b { display: block; font: 700 1.35rem/1.1 var(--f-display); }
.hero .id span { font: 500 11.5px/1.3 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; opacity: .8; }
.hero h1 { color: #fff; font-size: 2.3rem; }
.hero p { color: rgba(255,255,255,.82); max-width: 60ch; }
.hero .gold { color: #e3c27c; }
.timeline { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; }
.tl-bar { display: grid; grid-template-columns: 7fr 5fr 6fr 5fr 6fr; gap: 3px; position: relative; height: 34px; }
.tl-bar div { border-radius: 6px; background: var(--navy-soft); display: flex; align-items: center; justify-content: center; font: 500 11px var(--f-mono); color: var(--navy); }
.tl-bar div.on { background: var(--navy); color: var(--on-navy); }
.tl-mark { position: absolute; top: -6px; bottom: -6px; width: 3px; border-radius: 2px; background: var(--gold); }
.tl-leg { display: flex; justify-content: space-between; font: 400 11px var(--f-mono); color: var(--muted); }
.ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none; }
.lvlcard { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
.lvlbadge { font: 700 1.35rem/1 var(--f-display); color: #fff; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
details.seq > summary { grid-template-columns: 44px 1fr 18px; }
.seqhead { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; min-width: 0; }
.tile .ico { width: 38px; height: 38px; border-radius: 10px; background: var(--navy); color: #fff; }
.tile h3 { font-size: 1.1rem; }
.weeknav, .pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
.wbtn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--navy); color: var(--on-navy); text-decoration: none; font-size: 26px; line-height: 1; flex: none; }
.wbtn[aria-disabled="true"] { opacity: .3; pointer-events: none; }
.wlabel { text-align: center; display: flex; flex-direction: column; } .wlabel b { font: 700 1.3rem/1.2 var(--f-display); color: var(--navy); }
.strip { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px 4px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip a { flex: none; font: 500 12.5px/1 var(--f-mono); padding: 8px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); text-decoration: none; }
.strip a.today { border-color: var(--gold); color: var(--ink); }
.strip a.on { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.btn2 { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--navy); color: var(--navy); text-decoration: none; font-size: .93rem; }
.seance h4 a { text-decoration: none; color: inherit; } .seance h4 a::after { content: " \203A"; color: var(--gold); }
.btnproj { padding: 10px 16px; border-radius: 12px; background: var(--gold); color: #fff; text-decoration: none; font-weight: 700; }
.proj { position: fixed; inset: 0; z-index: 50; background: #13202f; color: #f3f5f8; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.p-top { display: flex; align-items: center; gap: 12px; padding: 12px 18px; font: 500 13px var(--f-mono); color: #b9c4d2; }
.p-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-top button, .p-bar button { background: rgba(255,255,255,.08); color: #fff; border: 0; border-radius: 10px; width: 44px; height: 44px; font-size: 22px; cursor: pointer; }
.p-bar button:disabled { opacity: .25; }
.p-stage { flex: 1; display: grid; place-items: center; padding: 8px 5vw; overflow-y: auto; }
.slide { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 2.2vh; }
.s-k { font: 500 clamp(12px, 1.6vw, 18px)/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: #e0bd73; }
.s-h { font: 700 clamp(30px, 5.4vw, 72px)/1.05 var(--f-display); color: #fff; text-wrap: balance; margin: 0; }
.s-p { font-size: clamp(17px, 2.3vw, 30px); line-height: 1.45; color: #dfe5ec; max-width: 40ch; }
.s-l { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 1.2vh; font-size: clamp(17px, 2.3vw, 30px); line-height: 1.35; color: #dfe5ec; }
.s-l li::marker { color: #e0bd73; }
.s-q { border-left: 4px solid #e0bd73; padding-left: 18px; }
.s-q span { font: 500 clamp(11px, 1.3vw, 15px) var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: #b9c4d2; }
.s-q ol { margin: 8px 0 0; padding-left: 1.2em; font-size: clamp(17px, 2.2vw, 28px); line-height: 1.4; color: #fff; }
.s-svg { margin: 0; background: #f4f6f9; color: #22364d; border-radius: 14px; padding: 2vh 2vw; max-width: 760px; }
.s-svg svg { display: block; width: 100%; height: auto; }
.s-yt { display: flex; flex-wrap: wrap; gap: 10px; }
.s-yt a { display: inline-flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; background: #fff; color: #13202f; text-decoration: none; font-size: clamp(14px, 1.6vw, 20px); }
.s-yt .play { width: 30px; height: 30px; border-radius: 50%; background: #c4302b; color: #fff; display: grid; place-items: center; font-size: 12px; flex: none; }
.p-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px 16px; }
.p-dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.p-dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.25); }
.p-dots span.on { background: #e0bd73; }
.sig { max-width: 700px; margin: 28px auto 0; padding-top: 14px; border-top: 1px solid var(--line); font: 400 12px/1.5 var(--f-mono); color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

oix, comment se répondent-elles ?"], [20, "Canon à trois voix."], [5, "Annonce de l'évaluation."]]}, {"objectif": "Évaluation de la séquence", "etapes": [[25, "Passage du canon par petits groupes."], [25, "Écoute d'un extrait inconnu : décrire le son avec les quatre paramètres."]]}], "trace": ["Le mot musique vient du grec mousikè : l'art des Muses, filles de Zeus et de Mnémosyne, la mémoire.", "Les plus anciens instruments retrouvés sont des flûtes en os, vieilles d'environ 40 000 ans.", "On classe les instruments selon la façon de produire le son : souffler, frotter ou pincer une corde, frapper.", "Un son a quatre paramètres : la hauteur (grave, aigu), la durée (long, court), l'intensité (piano, forte), le timbre (sa couleur).", "La voix est le premier instrument : les Pygmées Aka chantent à plusieurs voix depuis des siècles, sans rien écrire."], "devoirs": "Apprendre les quatre paramètres du son et l'origine du mot musique.", "eval": {"consigne": "Chanter le canon en petit groupe. Décrire un son inconnu avec les quatre paramètres.", "criteres": [["Je chante juste et je connais les paroles", "C1"], ["Je tiens ma voix dans le canon", "C1"], ["Je décris hauteur, durée, intensité et timbre", "C2"], ["J'explique l'origine du mot musique", "C4"]], "attendus": ["Utiliser les mots grave, aigu, long, court, piano, forte, timbre.", "Citer un instrument préhistorique et son âge approximatif."]}}, {"fiches": ["histoire", "maths"], "objectifs": ["Situer les musiques de l'Antiquité dans le temps et l'espace.", "Comprendre l'expérience de Pythagore sur les cordes.", "Chanter une mélodie de deux mille ans."], "seances": [{"objectif": "Égypte et Mésopotamie", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Fresques égyptiennes : harpes, sistres, chanteurs. Hymne hourrite n° 6, la plus ancienne mélodie notée connue."], [15, "Épitaphe de Seikilos : découverte."], [10, "Trace écrite."]]}, {"objectif": "La Grèce : lyre, aulos, théâtre", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Instruments grecs et rôle du chœur au théâtre."], [20, "Épitaphe : texte grec et traduction."], [10, "Trace écrite."]]}, {"objectif": "Pythagore et le monocorde", "etapes": [[5, "Échauffement corporel et vocal."], [25, "Expérience : corde entière, moitié (octave), deux tiers (quinte). Lien avec les fractions."], [15, "Épitaphe."], [5, "Trace écrite."]]}, {"objectif": "Créer une mélodie sur des intervalles", "etapes": [[5, "Échauffement corporel et vocal."], [35, "Par groupes, une courte mélodie avec octaves et quintes, jouée ou chantée."], [10, "Répétition."]]}, {"objectif": "Évaluation de la séquence", "etapes": [[20, "Chant de l'Épitaphe."], [30, "Présentation des créations et écoute comparée."]]}], "trace": ["L'Égypte ancienne nous a laissé des images de musiciens et des instruments : harpes, luths, sistres.", "L'Hymne hourrite n° 6, gravé à Ougarit vers 1400 avant J.-C., est la plus ancienne mélodie notée connue.", "L'Épitaphe de Seikilos (Ier siècle) est la plus ancienne composition complète connue, avec sa notation.", "Pythagore découvre que les intervalles correspondent à des rapports simples : 1/2 donne l'octave, 2/3 la quinte."], "devoirs": "Savoir situer l'Hymne hourrite et l'Épitaphe de Seikilos sur la frise.", "eval": {"consigne": "Chanter l'Épitaphe. Présenter la mélodie de groupe et expliquer octave et quinte.", "criteres": [["Je chante l'Épitaphe avec le groupe", "C1"], ["J'utilise octave et quinte dans notre mélodie", "C3"], ["J'explique l'expérience du monocorde", "C2"], ["Je situe trois œuvres antiques", "C2"]], "attendus": ["Définir octave et quinte par un rapport de longueur.", "Placer Égypte, Ougarit et la Grèce sur une frise."]}}, {"fiches": ["notation", "figures"], "objectifs": ["Comprendre comment est née la notation occidentale.", "Lire et écrire quelques notes sur une portée.", "Chanter Ut queant laxis."], "seances": [{"objectif": "Avant la portée : les neumes", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Des signes au-dessus des mots : déchiffrer des neumes."], [15, "Ut queant laxis : premier vers."], [10, "Trace écrite."]]}, {"objectif": "Guido d'Arezzo et la portée", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Vers 1025 : lignes, clé, notes placées."], [20, "Ut queant laxis complet."], [10, "Trace écrite."]]}, {"objectif": "Ut, ré, mi : le nom des notes", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Repérer dans l'hymne les syllabes qui montent. Pourquoi do et si sont venus plus tard."], [15, "Chant en montrant chaque syllabe."], [10, "Trace écrite."]]}, {"objectif": "Écrire une mélodie", "etapes": [[5, "Échauffement corporel et vocal."], [35, "Dictée simple, puis écriture d'une phrase de quatre notes sur portée."], [10, "Lecture croisée."]]}, {"objectif": "Évaluation de la séquence", "etapes": [[20, "Chant d'Ut queant laxis."], [30, "Lire et écrire des notes ; questions sur l'histoire de la notation."]]}], "trace": ["Au IXe siècle, les moines notent la musique avec des neumes : des signes au-dessus des paroles.", "Vers 1025, Guido d'Arezzo place les notes sur des lignes : c'est la portée.", "Il nomme les notes avec le début des vers de l'hymne à saint Jean-Baptiste : Ut queant laxis, Resonare fibris, Mira gestorum, Famuli tuorum, Solve polluti, Labii reatum.", "Le si vient plus tard (Sancte Iohannes) ; ut devient do au XVIIe siècle."], "devoirs": "Savoir l'ordre des notes et l'origine de leurs noms.", "eval": {"consigne": "Chanter Ut queant laxis. Lire et écrire une courte mélodie.", "criteres": [["Je chante l'hymne en montrant les syllabes", "C1"], ["Je lis des notes sur la portée", "C2"], ["J'écris une phrase de quatre notes", "C2"], ["J'explique l'origine du nom des notes", "C4"]], "attendus": ["Nommer les notes de do à si.", "Citer Guido d'Arezzo et la date approximative de la portée."]}}, {"fiches": ["gammes", "figures"], "objectifs": ["Découvrir des traditions musicales transmises oralement.", "Jouer une polyrythmie à plusieurs.", "Situer une tradition à l'écoute."], "seances": [{"objectif": "Les polyphonies Aka", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Écoute : yodel, voix qui se croisent. Accroche : Herbie Hancock."], [20, "Chant à répondre par imitation."], [10, "Trace écrite."]]}, {"objectif": "Le gamelan de Java", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Gongs et métallophones, cycles qui reviennent ; gamme pentatonique."], [15, "Jouer une gamme pentatonique sur les touches noires."], [10, "Trace écrite."]]}, {"objectif": "Le chant diphonique", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Mongolie : une voix, deux sons. Les harmoniques."], [15, "Expérience vocale : faire apparaître des harmoniques avec les voyelles."], [10, "Trace écrite."]]}, {"objectif": "Créer une polyrythmie", "etapes": [[5, "Échauffement corporel et vocal."], [40, "Par groupes, trois rythmes superposés en percussions corporelles."], [5, "Répétition."]]}, {"objectif": "Évaluation de la séquence", "etapes": [[25, "Polyrythmies de groupe."], [25, "Écoute : situer une tradition avec deux indices."]]}], "trace": ["Beaucoup de musiques du monde se transmettent oralement, d'un musicien à l'autre, sans partition.", "Les polyphonies des Pygmées Aka sont inscrites au patrimoine immatériel de l'Unesco depuis 2003.", "Le gamelan de Java est un ensemble de gongs et de métallophones qui joue des cycles.", "Le chant diphonique fait entendre deux sons à la fois : la note et une harmonique.", "Une polyrythmie superpose plusieurs rythmes différents."], "devoirs": "Choisir une tradition entendue et noter deux indices qui permettent de la reconnaître.", "eval": {"consigne": "Jouer la polyrythmie de groupe. Situer un extrait inconnu avec deux indices.", "criteres": [["Je tiens mon rythme sans me laisser entraîner", "C1"], ["Notre polyrythmie superpose trois rythmes", "C3"], ["Je situe une tradition et je donne deux indices", "C2"]], "attendus": ["Définir transmission orale et polyrythmie.", "Reconnaître le gamelan ou le chant diphonique."]}}, {"fiches": ["instruments", "nuances"], "objectifs": ["Reconnaître les familles d'instruments.", "Comprendre la formation de l'orchestre symphonique.", "Chanter un canon à trois voix."], "seances": [{"objectif": "Les familles d'instruments", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Pierre et le loup : un personnage, un instrument."], [20, "Viva la musica."], [10, "Fiche des familles."]]}, {"objectif": "L'orchestre symphonique", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Le Guide de Britten : chaque famille entre à son tour."], [15, "Canon à deux voix."], [10, "Plan de l'orchestre."]]}, {"objectif": "Le Boléro : les timbres un par un", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Ravel : même mélodie, instruments différents, grand crescendo."], [15, "Canon à trois voix."], [10, "Trace écrite."]]}, {"objectif": "Évaluation et bilan de l'année", "etapes": [[25, "Canon par groupes."], [25, "Reconnaître les familles ; frise de l'année complétée ensemble."]]}], "trace": ["L'orchestre symphonique réunit quatre familles : cordes, bois, cuivres, percussions.", "Le chef d'orchestre dirige ; les cordes sont devant, les percussions au fond.", "Dans le Boléro, Ravel fait passer la même mélodie d'un timbre à l'autre dans un long crescendo."], "devoirs": "Revoir les quatre familles et leurs instruments.", "eval": {"consigne": "Chanter le canon. Reconnaître les familles à l'écoute.", "criteres": [["Je tiens ma voix dans le canon", "C1"], ["Je reconnais la famille d'un instrument", "C2"], ["Je situe les familles sur le plan de l'orchestre", "C2"]], "attendus": ["Citer deux instruments par famille.", "Expliquer le principe du Boléro."]}}]}, "5e": {"cycle": "cycle4", "intro": "En cinquième, on traverse le Moyen Âge et la Renaissance, de la naissance de la polyphonie à Notre-Dame jusqu'aux premiers opéras.", "sequences": [{"titre": "Du grégorien à l'École de Notre-Dame", "periode": "P1", "semaines" t l'amour courtois aux XIIe et XIIIe siècles.", "La tenson est un débat chanté entre deux poètes.", "Guillaume de Machaut (vers 1300-1377) compose des chansons profanes et la Messe de Nostre Dame : c'est l'Ars nova.", "Le virelai est une forme de chanson à refrain."], "devoirs": "Revoir troubadour, trouvère, amour courtois, virelai.", "eval": {"consigne": "Chanter Douce dame jolie. Participer au débat.", "criteres": [["Je chante la mélodie avec le bourdon", "C1"], ["Je distingue sacré et profane", "C2"], ["J'argumente dans le débat", "C4"]], "attendus": ["Définir troubadour et amour courtois.", "Citer une œuvre de Machaut."]}}, {"fiches": ["plans", "formes"], "objectifs": ["Comprendre le contrepoint et l'imitation.", "Situer les compositeurs franco-flamands.", "Chanter et écrire un canon."], "seances": [{"objectif": "Dufay et la coupole de Florence", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Nuper rosarum flores, 1436 : une musique pour une cathédrale."], [15, "Mille regretz, voix supérieure."], [10, "Trace écrite."]]}, {"objectif": "L'imitation", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Une voix commence, les autres reprennent : repérer les entrées chez Josquin."], [15, "Canon."], [10, "Trace écrite."]]}, {"objectif": "Ockeghem et le canon savant", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Missa prolationum : la même ligne à des vitesses différentes."], [15, "Canon à trois voix."], [10, "Trace écrite."]]}, {"objectif": "Écrire une imitation", "etapes": [[5, "Échauffement corporel et vocal."], [40, "Par groupes, une phrase de quatre mesures reprise par une autre voix."], [5, "Répétition."]]}, {"objectif": "Évaluation de la séquence", "etapes": [[25, "Canons et imitations des groupes."], [25, "Écoute : repérer les entrées."]]}], "trace": ["Au XVe siècle, les compositeurs venus de Flandre et du nord de la France dominent l'Europe : Dufay, Ockeghem, Josquin des Prez.", "Le contrepoint superpose des voix indépendantes qui s'
