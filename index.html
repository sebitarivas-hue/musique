s musiques de résistance.", "Le rock des années 1960 accompagne une contre-culture ; la distorsion durcit le son.", "Le rap naît dans le Bronx dans les années 1970 ; le flow est la façon de poser le texte, le sample un extrait réutilisé.", "La parole chantée qui critique le pouvoir existe depuis les troubadours."], "devoirs": "Préparer l'exposé avec la fiche méthode.", "eval": {"consigne": "Exposé en binôme. Écoute comparée.", "criteres": [["Je présente le contexte de l'œuvre", "C4"], ["J'explique ce que la musique apporte au texte", "C2"], ["Je m'exprime clairement", "C4"]], "attendus": ["Un exposé avec contexte, procédé musical et réception.", "Définir distorsion, sample, flow, contre-culture."]}}, {"fiches": ["physique", "instruments"], "objectifs": ["Comprendre ce qu'est un son du point de vue physique.", "Suivre l'histoire du son électronique, du thérémine à l'Ircam.", "Créer une courte pièce de sons fixés."], "seances": [{"objectif": "Le son est une onde", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Fréquence, amplitude, harmoniques : voir un son sur un spectrogramme."], [15, "Chant sur les harmoniques."], [10, "Trace écrite."]]}, {"objectif": "Thérémine et musique concrète", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Clara Rockmore ; Pierre Schaeffer et les trains, 1948."], [15, "Enregistrer des sons de la salle."], [10, "Trace écrite."]]}, {"objectif": "L'ordinateur chante", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Stockhausen, Studie II ; Max Mathews et Daisy Bell (1961)."], [15, "Montage des sons."], [10, "Trace écrite."]]}, {"objectif": "L'Ircam et la musique spectrale", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Boulez fonde l'Ircam (1977) ; Grisey, Partiels : composer avec le spectre d'un son."], [20, "Finalisation des pièces."], [5, "Annonce."]]}, {"objectif": "Évaluation de la séquence", "etapes": [[30, "Écoute des pièces de sons fixés."], [20, "Écoute : nommer le procédé."]]}], "trace": ["Un son est une vibration de l'air : sa fréquence donne la hauteur, son amplitude l'intensité.", "Un son musical contient des harmoniques ; leur ensemble forme le spectre, qui donne le timbre.", "La musique concrète (Schaeffer, 1948) travaille des sons enregistrés ; la musique électronique fabrique des sons de synthèse.", "En 1961, aux Bell Labs, un ordinateur chante Daisy Bell ; l'Ircam, fondé par Pierre Boulez, ouvre en 1977."], "devoirs": "Revoir fréquence, harmonique, spectre, musique concrète.", "eval": {"consigne": "Présenter la pièce de sons fixés. Écoute.", "criteres": [["Notre pièce utilise des sons enregistrés ou transformés", "C3"], ["J'explique notre démarche", "C4"], ["Je nomme un procédé à l'écoute", "C2"]], "attendus": ["Définir fréquence, harmonique, spectre.", "Citer Schaeffer, Stockhausen, Grisey et l'Ircam."]}}, {"fiches": ["maths", "figures"], "objectifs": ["Relier intervalles et fractions.", "Comprendre composer par processus et par probabilités.", "Composer collectivement par règles et tirages."], "seances": [{"objectif": "Pythagore et les fractions", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Monocorde : 2/1, 3/2, 4/3. Pourquoi l'octave sonne juste."], [15, "Pièce chorale : présentation des règles."], [10, "Trace écrite."]]}, {"objectif": "Le jeu de dés de Mozart", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Composer une valse en lançant des dés."], [20, "Composition par tirage."], [5, "Trace écrite."]]}, {"objectif": "Xenakis et la stochastique", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Metastaseis : des glissandi dessinés comme des droites ; les probabilités pour des masses de sons."], [15, "Pièce chorale."], [10, "Trace écrite."]]}, {"objectif": "Processus : Reich et Ligeti", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Clapping Music, les cent métronomes."], [25, "Répétition de la pièce de classe."], [5, "Annonce."]]}, {"objectif": "Évaluation de la séquence", "etapes": [[30, "Interprétation de la pièce de classe."], [20, "Expliquer la règle et l'effet obtenu."]]}], "trace": ["Pythagore relie les intervalles à des fractions : 2/1 l'octave, 3/2 la quinte, 4/3 la quarte.", "Un jeu de dés attribué à Mozart (1792) compose des valses par le hasard.", "Iannis Xenakis, ingénieur et architecte, compose avec les probabilités : c'est la musique stochastique.", "Un processus est une règle appliquée du début à la fin (Reich, Ligeti)."], "devoirs": "Savoir expliquer la règle de la pièce de classe.", "eval": {"consigne": "Interpréter la pièce de classe. Expliquer la règle.", "criteres": [["Je respecte la règle du processus", "C1"], ["Notre composition applique une règle claire", "C3"], ["J'explique le lien entre règle et résultat", "C2"]], "attendus": ["Définir rapport, processus, stochastique.", "Citer Pythagore, Xenakis, Reich."]}}, {"fiches": ["histoire", "ecoute"], "objectifs": ["Comprendre la ramification des genres au XXIe siècle.", "Situer un morceau sur l'arbre des genres.", "Réussir l'oral du brevet."], "seances": [{"objectif": "L'arbre des genres", "etapes": [[5, "Échauffement corporel et vocal."], [25, "Du blues aux sous-genres d'aujourd'hui : construire l'arbre de la classe."], [20, "Chaque élève place un morceau et justifie."]]}, {"objectif": "Scènes expérimentales et pops du monde", "etapes": [[5, "Échauffement corporel et vocal."], [25, "Club expérimental, K-pop, pop quechua : industrie, langue, hybridation."], [20, "Choix des sujets d'oral."]]}, {"objectif": "Préparer l'oral", "etapes": [[45, "Méthode : présenter, situer, décrire, analyser, donner son avis. Préparation en binômes."], [5, "Calendrier."]]}, {"objectif": "Oraux blancs", "etapes": [[50, "Passages devant la classe avec la grille du brevet."]]}], "trace": ["Depuis le disque et la radio, puis Internet, les genres se ramifient en sous-genres et en scènes.", "L'hybridation mêle les traditions : la pop quechua chante en langue andine sur des productions actuelles.", "La K-pop est à la fois une industrie, un style et une culture de la danse mondialisée.", "Pour présenter une œuvre : présenter, situer, décrire, analyser, donner son avis."], "devoirs": "Préparer et chronométrer sa présentation.", "eval": {"consigne": "Oral blanc de cinq minutes puis questions.", "criteres": [["Je présente et je situe l'œuvre", "C4"], ["Je décris et j'analyse avec le vocabulaire", "C2"], ["Je réponds aux questions avec précision", "C4"]], "attendus": ["Cinq minutes de présentation structurée.", "Au moins cinq mots de vocabulaire musical justes."]}}]}}, "fiches": {"parametres": {"titre": "Les paramètres du son", "niveaux": "6e, et révision pour tous", "html": "<p>Tout son peut être décrit par quatre paramètres. Ce sont les premiers mots de l&#x27;écoute.</p>\n<div class=\"tbl\"><table><thead><tr><th>Paramètre</th><th>Question</th><th>Vocabulaire</th></tr></thead><tbody><tr><td>La hauteur</td><td>Le son est-il grave ou aigu ?</td><td>grave, médium, aigu ; monter, descendre ; registre</td></tr><tr><td>La durée</td><td>Le son est-il long ou court ?</td><td>long, court, tenu, piqué (staccato), lié (legato)</td></tr><tr><td>L&#x27;intensité</td><td>Le son est-il fort ou doux ?</td><td>piano, forte, nuances, crescendo, decrescendo</td></tr><tr><td>Le timbre</td><td>Qui ou quoi produit le son ?</td><td>la couleur du son : voix, instrument, famille, mode de jeu</td></tr></tbody></table></div>\n<h3>Comment s&#x27;en servir à l&#x27;écoute</h3>\n<ul><li>Écouter une première fois sans rien écrire.</li><li>Choisir un paramètre à la fois et noter ce qui change.</li><li>Utiliser le mot juste plutôt qu&#x27;une impression : « c&#x27;est forte » plutôt que « ça fait du bruit ».</li></ul>"}, "nuances": {"titre": "L'intensité et les nuances", "niveaux": "6e à 3e", "html": "<p>Les nuances indiquent l&#x27;intensité du son. Elles s&#x27;écrivent en italien, abrégées, sous la portée.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 370 155\" width=\"100%\" role=\"img\" aria-label=\"Nuances\"><text x=\"30\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" font-weight=\"bold\" font-family=\"Georgia, serif\" fill=\"currentColor\">pp</text><text x=\"92\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" font-weight=\"bold\" font-family=\"Georgia, serif\" fill=\"currentColor\">p</text><text x=\"154\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" font-weight=\"bold\" font-family=\"Georgia, serif\" fill=\"currentColor\">mp</text><text x=\"216\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" font-weight=\"bold\" font-family=\"Georgia, serif\" fill=\"currentColor\">mf</text><text x=\"278\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" font-weight=\"bold\" font-family=\"Georgia, serif\" fill=\"currentColor\">f</text><text x=\"340\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" font-weight=\"bold\" font-family=\"Georgia, serif\" fill=\"currentColor\">ff</text><line x1=\"20\" y1=\"58\" x2=\"350\" y2=\"58\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\".4\"/><text x=\"20\" y=\"76\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\" opacity=\".75\">très doux</text><text x=\"350\" y=\"76\" text-anchor=\"end\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\" opacity=\".75\">très fort</text><path d=\"M30 110 L150 98 M30 110 L150 122\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"/><text x=\"90\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">crescendo</text><path d=\"M220 98 L340 110 M220 122 L340 110\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"/><text x=\"280\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">decrescendo</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Signe</th><th>Nom italien</th><th>Sens</th></tr></thead><tbody><tr><td>pp</td><td>pianissimo</td><td>très doux</td></tr><tr><td>p</td><td>piano</td><td>doux</td></tr><tr><td>mp</td><td>mezzo piano</td><td>moyennement doux</td></tr><tr><td>mf</td><td>mezzo forte</td><td>moyennement fort</td></tr><tr><td>f</td><td>forte</td><td>fort</td></tr><tr><td>ff</td><td>fortissimo</td><td>très fort</td></tr><tr><td>cresc. ou &lt;</td><td>crescendo</td><td>de plus en plus fort</td></tr><tr><td>decresc. ou &gt;</td><td>decrescendo ou diminuendo</td><td>de plus en plus doux</td></tr><tr><td>sf</td><td>sforzando</td><td>une note soudainement accentuée</td></tr><tr><td>&gt;</td><td>accent</td><td>la note est appuyée</td></tr></tbody></table></div>\n<h3>À retenir</h3>\n<ul><li>Une nuance est toujours relative : un forte de flûte n&#x27;a pas la puissance d&#x27;un forte de trompette.</li><li>Les nuances servent l&#x27;expression : le Boléro de Ravel est un long crescendo de quinze minutes.</li></ul>"}, "tempo": {"titre": "Le tempo et la pulsation", "niveaux": "6e à 3e", "html": "<p>La pulsation est le battement régulier de la musique. Le tempo est sa vitesse, mesurée en battements par minute (BPM).</p>\n<div class=\"tbl\"><table><thead><tr><th>Terme</th><th>Caractère</th><th>Ordre d&#x27;idée</th></tr></thead><tbody><tr><td>Largo</td><td>très lent, large</td><td>40 à 60 BPM</td></tr><tr><td>Adagio</td><td>lent</td><td>60 à 75 BPM</td></tr><tr><td>Andante</td><td>allant, à la vitesse de la marche</td><td>75 à 105 BPM</td></tr><tr><td>Moderato</td><td>modéré</td><td>105 à 120 BPM</td></tr><tr><td>Allegro</td><td>rapide, joyeux</td><td>120 à 155 BPM</td></tr><tr><td>Presto</td><td>très rapide</td><td>plus de 170 BPM</td></tr></tbody></table></div>\n<h3>Les changements de tempo</h3>\n<ul><li>Accelerando : en accélérant.</li><li>Ritardando ou rallentando : en ralentissant.</li><li>A tempo : on reprend le tempo de départ.</li><li>Point d&#x27;orgue : une note tenue aussi longtemps que voulu.</li></ul>"}, "figures": {"titre": "Les figures de notes et de silences", "niveaux": "6e, 5e, rappel en 4e et 3e", "html": "<p>Les figures indiquent la durée des sons et des silences. L&#x27;unité de temps la plus courante au collège est la noire.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 440 130\" width=\"100%\" role=\"img\" aria-label=\"Figures de notes\"><ellipse cx=\"40\" cy=\"70\" rx=\"7.5\" ry=\"5.2\" transform=\"rotate(-20 40 70)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"43\" y=\"100\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Ronde</text><text x=\"43\" y=\"117\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">4 temps</text><ellipse cx=\"125\" cy=\"70\" rx=\"7.5\" ry=\"5.2\" transform=\"rotate(-20 125 70)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"131.5\" y1=\"68\" x2=\"131.5\" y2=\"32\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"128\" y=\"100\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Blanche</text><text x=\"128\" y=\"117\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">2 temps</text><ellipse cx=\"210\" cy=\"70\" rx=\"7.5\" ry=\"5.2\" transform=\"rotate(-20 210 70)\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"216.5\" y1=\"68\" x2=\"216.5\" y2=\"32\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"213\" y=\"100\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Noire</text><text x=\"213\" y=\"117\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">1 temps</text><ellipse cx=\"295\" cy=\"70\" rx=\"7.5\" ry=\"5.2\" transform=\"rotate(-20 295 70)\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"301.5\" y1=\"68\" x2=\"301.5\" y2=\"32\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M301.5 32 q14 10 6 26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"/><text x=\"298\" y=\"100\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Croche</text><text x=\"298\" y=\"117\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">1/2 temps</text><ellipse cx=\"380\" cy=\"70\" rx=\"7.5\" ry=\"5.2\" transform=\"rotate(-20 380 70)\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"386.5\" y1=\"68\" x2=\"386.5\" y2=\"32\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M386.5 32 q14 10 6 26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"/><path d=\"M386.5 41 q14 10 6 26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"/><text x=\"383\" y=\"100\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Double croche</text><text x=\"383\" y=\"117\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">1/4 temps</text></svg></figure>\n<figure class=\"fig\"><svg viewBox=\"0 0 340 120\" width=\"100%\" role=\"img\" aria-label=\"Silences\"><line x1=\"22\" y1=\"50\" x2=\"58\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"31\" y=\"50\" width=\"18\" height=\"8\" fill=\"currentColor\"/><text x=\"40\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Pause</text><text x=\"40\" y=\"107\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">4 temps</text><line x1=\"107\" y1=\"50\" x2=\"143\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"116\" y=\"42\" width=\"18\" height=\"8\" fill=\"currentColor\"/><text x=\"125\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Demi-pause</text><text x=\"125\" y=\"107\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">2 temps</text><path d=\"M204 28 l10 11 l-9 9 l10 11 q-12 -4 -7 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linejoin=\"round\"/><text x=\"210\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Soupir</text><text x=\"210\" y=\"107\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">1 temps</text><circle cx=\"290\" cy=\"38\" r=\"4\" fill=\"currentColor\"/><path d=\"M290 41 q8 3 12 -3 l-10 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><text x=\"295\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Demi-soupir</text><text x=\"295\" y=\"107\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">1/2 temps</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Durée</th><th>Note</th><th>Silence correspondant</th></tr></thead><tbody><tr><td>4 temps</td><td>ronde</td><td>pause</td></tr><tr><td>2 temps</td><td>blanche</td><td>demi-pause</td></tr><tr><td>1 temps</td><td>noire</td><td>soupir</td></tr><tr><td>1/2 temps</td><td>croche</td><td>demi-soupir</td></tr><tr><td>1/4 temps</td><td>double croche</td><td>quart de soupir</td></tr></tbody></table></div>\n<h3>Le point et la liaison</h3>\n<ul><li>Un point après une note ajoute la moitié de sa durée : une blanche pointée dure trois temps.</li><li>Une liaison entre deux notes de même hauteur additionne leurs durées.</li><li>Deux croches réunies par une barre (ligature) valent un temps.</li></ul>"}, "plans": {"titre": "Les plans sonores et la texture", "niveaux": "5e à 3e", "html": "<p>Dans une musique, tous les sons n&#x27;ont pas la même importance. On distingue ce qui est au premier plan de ce qui accompagne.</p>\n<div class=\"tbl\"><table><thead><tr><th>Notion</th><th>Définition</th><th>Exemple</th></tr></thead><tbody><tr><td>Premier plan</td><td>ce que l&#x27;oreille suit d&#x27;abord, souvent la mélodie</td><td>la voix dans une chanson</td></tr><tr><td>Arrière-plan</td><td>ce qui accompagne et soutient</td><td>la guitare, la basse, la batterie</td></tr><tr><td>Monodie</td><td>une seule mélodie, sans accompagnement</td><td>chant grégorien</td></tr><tr><td>Homophonie</td><td>une mélodie accompagnée par des accords qui suivent le même rythme</td><td>un choral, un hymne</td></tr><tr><td>Polyphonie</td><td>plusieurs mélodies indépendantes en même temps</td><td>Janequin, un canon</td></tr><tr><td>Bourdon</td><td>une note tenue sous la mélodie</td><td>cornemuse, Douce dame jolie</td></tr><tr><td>Ostinato</td><td>un motif répété sous ou avec la mélodie</td><td>le rythme du Boléro</td></tr></tbody></table></div>\n<h3>Pour l&#x27;écoute</h3>\n<ul><li>Qu&#x27;est-ce que j&#x27;entends en premier ? Qu&#x27;est-ce qui est derrière ?</li><li>Combien de couches sonores ? Changent-elles au cours de l&#x27;extrait ?</li><li>Le premier plan passe-t-il d&#x27;un instrument à un autre ?</li></ul>"}, "instruments": {"titre": "Les familles d'instruments", "niveaux": "6e à 3e", "html": "<p>Les instruments se classent selon la manière dont le son est produit. L&#x27;orchestre symphonique réunit quatre familles.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 400 265\" width=\"100%\" role=\"img\" aria-label=\"Plan de l'orchestre\"><path d=\"M15 215 A185 185 0 0 1 385 215\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"200\" y=\"48\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Percussions</text><path d=\"M55 215 A145 145 0 0 1 345 215\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"200\" y=\"88\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Cuivres</text><path d=\"M95 215 A105 105 0 0 1 305 215\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"200\" y=\"128\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Bois</text><path d=\"M135 215 A65 65 0 0 1 265 215\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"200\" y=\"168\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Cordes</text><line x1=\"0\" y1=\"215\" x2=\"400\" y2=\"215\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\".4\"/><circle cx=\"200\" cy=\"215\" r=\"6\" fill=\"currentColor\"/><text x=\"200\" y=\"237\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">chef d'orchestre</text><text x=\"200\" y=\"255\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">le public</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Famille</th><th>Comment le son est produit</th><th>Instruments</th></tr></thead><tbody><tr><td>Cordes frottées</td><td>un archet frotte les cordes</td><td>violon, alto, violoncelle, contrebasse</td></tr><tr><td>Cordes pincées</td><td>les doigts pincent les cordes</td><td>harpe, guitare, clavecin</td></tr><tr><td>Cordes frappées</td><td>un marteau frappe les cordes</td><td>piano</td></tr><tr><td>Bois</td><td>le souffle passe par un biseau ou une anche</td><td>flûte, hautbois, clarinette, basson, saxophone</td></tr><tr><td>Cuivres</td><td>les lèvres vibrent dans une embouchure</td><td>trompette, cor, trombone, tuba</td></tr><tr><td>Percussions à hauteur déterminée</td><td>on frappe, la note est précise</td><td>timbales, xylophone, glockenspiel</td></tr><tr><td>Percussions à hauteur indéterminée</td><td>on frappe, sans note précise</td><td>caisse claire, grosse caisse, cymbales, triangle</td></tr><tr><td>Électroniques</td><td>le son est produit ou transformé électriquement</td><td>synthétiseur, guitare électrique, ordinateur</td></tr></tbody></table></div>\n<h3>À savoir</h3>\n<ul><li>Le saxophone est en métal mais c&#x27;est un bois : il a une anche.</li><li>La flûte traversière, en métal aussi, est un bois : le son naît d&#x27;un biseau.</li><li>Du plus aigu au plus grave chez les cordes : violon, alto, violoncelle, contrebasse.</li></ul>"}, "voix": {"titre": "Les voix", "niveaux": "6e à 4e", "html": "<p>La tessiture est l&#x27;étendue des notes qu&#x27;une voix peut chanter confortablement.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 400 175\" width=\"100%\" role=\"img\" aria-label=\"Tessitures des voix\"><text x=\"62\" y=\"27\" text-anchor=\"end\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Soprano</text><rect x=\"210\" y=\"15\" width=\"168\" height=\"14\" rx=\"7\" fill=\"currentColor\" opacity=\".75\"/><text x=\"62\" y=\"57\" text-anchor=\"end\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Alto</text><rect x=\"161\" y=\"45\" width=\"168\" height=\"14\" rx=\"7\" fill=\"currentColor\" opacity=\".75\"/><text x=\"62\" y=\"87\" text-anchor=\"end\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Ténor</text><rect x=\"126\" y=\"75\" width=\"168\" height=\"14\" rx=\"7\" fill=\"currentColor\" opacity=\".75\"/><text x=\"62\" y=\"117\" text-anchor=\"end\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">Basse</text><rect x=\"70\" y=\"105\" width=\"168\" height=\"14\" rx=\"7\" fill=\"currentColor\" opacity=\".75\"/><line x1=\"70\" y1=\"130\" x2=\"70\" y2=\"136\" stroke=\"currentColor\"/><text x=\"70\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">mi 1</text><line x1=\"126\" y1=\"130\" x2=\"126\" y2=\"136\" stroke=\"currentColor\"/><text x=\"126\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">do 2</text><line x1=\"210\" y1=\"130\" x2=\"210\" y2=\"136\" stroke=\"currentColor\"/><text x=\"210\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">do 3</text><line x1=\"294\" y1=\"130\" x2=\"294\" y2=\"136\" stroke=\"currentColor\"/><text x=\"294\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">do 4</text><line x1=\"378\" y1=\"130\" x2=\"378\" y2=\"136\" stroke=\"currentColor\"/><text x=\"378\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">do 5</text><line x1=\"70\" y1=\"130\" x2=\"388\" y2=\"130\" stroke=\"currentColor\" opacity=\".5\"/><text x=\"70\" y=\"168\" font-size=\"11\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">grave</text><text x=\"388\" y=\"168\" text-anchor=\"end\" font-size=\"11\" fill=\"currentColor\" opacity=\".7\" font-family=\"sans-serif\">aigu</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Voix</th><th>Qui</th><th>Registre</th></tr></thead><tbody><tr><td>Soprano</td><td>femmes, enfants</td><td>la plus aiguë</td></tr><tr><td>Mezzo-soprano</td><td>femmes</td><td>entre soprano et alto</td></tr><tr><td>Alto (ou contralto)</td><td>femmes, enfants</td><td>grave chez les femmes</td></tr><tr><td>Ténor</td><td>hommes</td><td>aigu chez les hommes</td></tr><tr><td>Baryton</td><td>hommes</td><td>entre ténor et basse</td></tr><tr><td>Basse</td><td>hommes</td><td>la plus grave</td></tr></tbody></table></div>\n<h3>Les ensembles</h3>\n<ul><li>Soliste : un chanteur seul.</li><li>Duo, trio, quatuor : deux, trois, quatre chanteurs.</li><li>Chœur : un groupe de chanteurs, souvent réparti en pupitres (soprano, alto, ténor, basse).</li><li>A cappella : sans instrument.</li><li>La mue : vers 12 à 15 ans, la voix des garçons descend d&#x27;environ une octave.</li></ul>"}, "formes": {"titre": "Les formes musicales", "niveaux": "5e à 3e", "html": "<p>La forme est le plan d&#x27;un morceau : comment ses parties s&#x27;enchaînent et reviennent. On la note avec des lettres.</p>\n<div class=\"tbl\"><table><thead><tr><th>Forme</th><th>Schéma</th><th>Exemple étudié</th></tr></thead><tbody><tr><td>Couplet-refrain</td><td>A B A&#x27; B A&#x27;&#x27; B</td><td>Le Déserteur, la plupart des chansons</td></tr><tr><td>Forme ABA</td><td>A B A</td><td>un air d&#x27;opéra, une danse avec trio</td></tr><tr><td>Rondo</td><td>A B A C A</td><td>un refrain instrumental qui revient entre des couplets différents</td></tr><tr><td>Thème et variations</td><td>A A1 A2 A3</td><td>Mozart, Ah vous dirai-je maman</td></tr><tr><td>Canon</td><td>une mélodie, des départs décalés</td><td>Viva la musica, Pachelbel</td></tr><tr><td>Ostinato</td><td>un motif répété du début à la fin</td><td>Ravel, Boléro</td></tr><tr><td>Grille de blues</td><td>12 mesures, I I I I / IV IV I I / V IV I I</td><td>When the Saints, Robert Johnson</td></tr></tbody></table></div>\n<h3>Repérer une forme</h3>\n<ul><li>Écouter quand un passage revient à l&#x27;identique.</li><li>Noter A pour la première idée, B pour la deuxième, A&#x27; si A revient modifié.</li><li>Compter les mesures ou les phrases si c&#x27;est possible.</li></ul>"}, "gammes": {"titre": "Gammes et modes", "niveaux": "5e à 3e", "html": "<p>Une gamme est une suite de notes rangées du grave à l&#x27;aigu. Elle donne sa couleur à une musique.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 300 170\" width=\"100%\" role=\"img\" aria-label=\"Clavier et gamme pentatonique\"><rect x=\"10\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"30.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">do</text><rect x=\"50\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"70.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">ré</text><rect x=\"90\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"110.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">mi</text><rect x=\"130\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"150.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">fa</text><rect x=\"170\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"190.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">sol</text><rect x=\"210\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"230.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">la</text><rect x=\"250\" y=\"10\" width=\"40\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"270.0\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">si</text><rect x=\"38\" y=\"10\" width=\"24\" height=\"80\" fill=\"currentColor\"/><rect x=\"78\" y=\"10\" width=\"24\" height=\"80\" fill=\"currentColor\"/><rect x=\"158\" y=\"10\" width=\"24\" height=\"80\" fill=\"currentColor\"/><rect x=\"198\" y=\"10\" width=\"24\" height=\"80\" fill=\"currentColor\"/><rect x=\"238\" y=\"10\" width=\"24\" height=\"80\" fill=\"currentColor\"/><text x=\"150\" y=\"160\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-family=\"sans-serif\">Les cinq touches noires forment une gamme pentatonique.</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Gamme</th><th>Notes (exemple)</th><th>Couleur, usage</th></tr></thead><tbody><tr><td>Majeure</td><td>do ré mi fa sol la si do</td><td>souvent lumineuse ; la plupart des hymnes</td></tr><tr><td>Mineure</td><td>la si do ré mi fa sol la</td><td>souvent sombre ou mélancolique</td></tr><tr><td>Pentatonique</td><td>do ré mi sol la (ou les cinq touches noires)</td><td>musiques d&#x27;Asie, d&#x27;Afrique, folk, blues</td></tr><tr><td>Blues</td><td>do mi bémol fa fa dièse sol si bémol do</td><td>blues, jazz, rock ; les « blue notes »</td></tr></tbody></table></div>\n<ul><li>Majeur et mineur ne veulent pas dire gai et triste : ce sont des tendances, pas des règles.</li><li>Une même mélodie jouée en mineur change de caractère : c&#x27;est un procédé de variation.</li></ul>"}, "ecoute": {"titre": "Méthode du commentaire d'écoute", "niveaux": "5e à 3e, et oral du brevet", "html": "<p>Commenter une œuvre, c&#x27;est passer de « j&#x27;aime » à « voici ce que j&#x27;entends, et ce que ça produit ».</p>\n<div class=\"tbl\"><table><thead><tr><th>Étape</th><th>Je me demande</th><th>J&#x27;écris</th></tr></thead><tbody><tr><td>1. Présenter</td><td>Qui ? Quoi ? Quand ?</td><td>titre, compositeur, date, genre</td></tr><tr><td>2. Situer</td><td>Dans quel contexte ?</td><td>époque, lieu, événement, commande</td></tr><tr><td>3. Décrire</td><td>Qu&#x27;est-ce que j&#x27;entends ?</td><td>instruments ou voix, tempo, nuances, plans sonores, forme</td></tr><tr><td>4. Analyser</td><td>Comment la musique produit-elle son effet ?</td><td>un procédé précis relié à une impression</td></tr><tr><td>5. Conclure</td><td>Qu&#x27;est-ce que j&#x27;en pense, et pourquoi ?</td><td>un avis argumenté, une comparaison avec une autre œuvre</td></tr></tbody></table></div>\n<h3>La grille d&#x27;écoute rapide</h3>\n<ul><li>Je repère : un instrument, un retour, un changement.</li><li>Je nomme : avec le vocabulaire de la classe.</li><li>Je relie : à une œuvre étudiée, à un contexte, à une émotion justifiée.</li></ul>"}, "lexique": {"titre": "Lexique de l'année", "niveaux": "6e à 3e", "html": "<div class=\"tbl\"><table><thead><tr><th>Mot</th><th>Définition</th></tr></thead><tbody><tr><td>A cappella</td><td>chant sans accompagnement instrumental</td></tr><tr><td>Accelerando</td><td>en accélérant</td></tr><tr><td>Air</td><td>à l&#x27;opéra, moment chanté qui exprime un sentiment</td></tr><tr><td>Bourdon</td><td>note tenue sous la mélodie</td></tr><tr><td>Boucle</td><td>extrait sonore répété en continu</td></tr><tr><td>Cadence</td><td>dans un concerto, passage où le soliste joue seul</td></tr><tr><td>Canon</td><td>même mélodie avec départs décalés</td></tr><tr><td>Chorus</td><td>solo improvisé en jazz</td></tr><tr><td>Cluster</td><td>agrégat de notes très proches</td></tr><tr><td>Concerto</td><td>œuvre pour soliste et orchestre</td></tr><tr><td>Crescendo</td><td>de plus en plus fort</td></tr><tr><td>Diégétique</td><td>musique que les personnages du film entendent</td></tr><tr><td>Dissonance</td><td>rencontre de notes qui crée une tension</td></tr><tr><td>Distorsion</td><td>son saturé de la guitare électrique</td></tr><tr><td>Flow</td><td>manière de poser le texte sur le rythme en rap</td></tr><tr><td>Improvisation</td><td>musique inventée en la jouant</td></tr><tr><td>Leitmotiv</td><td>thème associé à un personnage ou une idée</td></tr><tr><td>Livret</td><td>texte d&#x27;un opéra</td></tr><tr><td>Monodie</td><td>une seule mélodie</td></tr><tr><td>Ostinato</td><td>motif répété</td></tr><tr><td>Polyphonie</td><td>plusieurs mélodies simultanées</td></tr><tr><td>Pulsation</td><td>battement régulier de la musique</td></tr><tr><td>Récitatif</td><td>à l&#x27;opéra, chant proche de la parole qui fait avancer l&#x27;action</td></tr><tr><td>Sample</td><td>extrait sonore réutilisé</td></tr><tr><td>Swing</td><td>balancement rythmique du jazz</td></tr><tr><td>Tempo</td><td>vitesse de la musique</td></tr><tr><td>Timbre</td><td>couleur du son</td></tr><tr><td>Tutti</td><td>tout l&#x27;orchestre joue</td></tr><tr><td>Unisson</td><td>tous chantent la même mélodie</td></tr><tr><td>Variation</td><td>transformation d&#x27;un thème</td></tr></tbody></table></div>"}, "origines": {"titre": "Aux origines de la musique", "niveaux": "6e", "html": "<p>Le mot musique vient du grec mousikè (technè) : l&#x27;art des Muses. Dans la mythologie, les neuf Muses sont les filles de Zeus et de Mnémosyne, la mémoire.</p>\n<div class=\"tbl\"><table><thead><tr><th>Repère</th><th>Date</th><th>Ce que l&#x27;on sait</th></tr></thead><tbody><tr><td>Flûtes en os de Hohle Fels et de Geissenklösterle (Allemagne)</td><td>environ 40 000 ans</td><td>les plus anciens instruments retrouvés</td></tr><tr><td>Harpes et lyres d&#x27;Ur (Mésopotamie)</td><td>vers 2500 av. J.-C.</td><td>instruments à cordes richement décorés</td></tr><tr><td>Hymne hourrite n° 6 (Ougarit, Syrie)</td><td>vers 1400 av. J.-C.</td><td>la plus ancienne mélodie notée connue</td></tr><tr><td>Épitaphe de Seikilos (Turquie actuelle)</td><td>Ier siècle</td><td>la plus ancienne composition complète connue</td></tr></tbody></table></div>\n<h3>Trois façons de produire un son</h3>\n<ul><li>Souffler : flûte, conque, trompe.</li><li>Frotter ou pincer une corde : arc musical, lyre, harpe.</li><li>Frapper : tambours, bâtons, pierres, gongs.</li></ul>\n<p>La voix est le premier instrument. Certaines traditions orales, comme les polyphonies des Pygmées Aka, se transmettent depuis des siècles sans aucune écriture.</p>"}, "notation": {"titre": "L'histoire de la notation", "niveaux": "6e, rappel en 5e", "html": "<p>Écrire la musique permet de la conserver et de la transmettre sans l&#x27;avoir entendue. La notation occidentale actuelle est née au Moyen Âge, dans les monastères.</p>\n<div class=\"tbl\"><table><thead><tr><th>Étape</th><th>Date</th><th>Principe</th></tr></thead><tbody><tr><td>Notation grecque</td><td>Antiquité</td><td>des lettres au-dessus des syllabes (Épitaphe de Seikilos)</td></tr><tr><td>Neumes</td><td>IXe siècle</td><td>des signes qui montrent si la mélodie monte ou descend</td></tr><tr><td>Portée de Guido d&#x27;Arezzo</td><td>vers 1025</td><td>des lignes pour fixer la hauteur exacte des notes</td></tr><tr><td>Notation mesurée</td><td>XIIIe et XIVe siècles</td><td>des formes de notes pour indiquer les durées</td></tr><tr><td>Notation moderne</td><td>XVIIe siècle</td><td>barres de mesure, figures actuelles, ut devient do</td></tr></tbody></table></div>\n<figure class=\"fig\"><svg viewBox=\"0 0 420 112\" width=\"100%\" role=\"img\" aria-label=\"Les six syllabes de Guido sur la portée\"><line x1=\"10\" y1=\"30\" x2=\"410\" y2=\"30\" stroke=\"currentColor\" stroke-width=\"1\"/><line x1=\"10\" y1=\"40\" x2=\"410\" y2=\"40\" stroke=\"currentColor\" stroke-width=\"1\"/><line x1=\"10\" y1=\"50\" x2=\"410\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"1\"/><line x1=\"10\" y1=\"60\" x2=\"410\" y2=\"60\" stroke=\"currentColor\" stroke-width=\"1\"/><line x1=\"10\" y1=\"70\" x2=\"410\" y2=\"70\" stroke=\"currentColor\" stroke-width=\"1\"/><line x1=\"49\" y1=\"80\" x2=\"71\" y2=\"80\" stroke=\"currentColor\" stroke-width=\"1\"/><ellipse cx=\"60\" cy=\"80\" rx=\"7\" ry=\"5\" transform=\"rotate(-20 60 80)\" fill=\"currentColor\"/><text x=\"60\" y=\"104\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">ut</text><ellipse cx=\"120\" cy=\"75\" rx=\"7\" ry=\"5\" transform=\"rotate(-20 120 75)\" fill=\"currentColor\"/><text x=\"120\" y=\"104\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">ré</text><ellipse cx=\"180\" cy=\"70\" rx=\"7\" ry=\"5\" transform=\"rotate(-20 180 70)\" fill=\"currentColor\"/><text x=\"180\" y=\"104\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">mi</text><ellipse cx=\"240\" cy=\"65\" rx=\"7\" ry=\"5\" transform=\"rotate(-20 240 65)\" fill=\"currentColor\"/><text x=\"240\" y=\"104\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">fa</text><ellipse cx=\"300\" cy=\"60\" rx=\"7\" ry=\"5\" transform=\"rotate(-20 300 60)\" fill=\"currentColor\"/><text x=\"300\" y=\"104\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">sol</text><ellipse cx=\"360\" cy=\"55\" rx=\"7\" ry=\"5\" transform=\"rotate(-20 360 55)\" fill=\"currentColor\"/><text x=\"360\" y=\"104\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\" font-family=\"sans-serif\">la</text></svg></figure>\n<h3>Ut queant laxis, hymne à saint Jean-Baptiste</h3>\n<p>Guido d&#x27;Arezzo remarque que chaque vers de cet hymne commence une note plus haut. Il nomme les notes avec la première syllabe de chaque vers.</p>\n<div class=\"tbl\"><table><thead><tr><th>Vers latin</th><th>Syllabe</th></tr></thead><tbody><tr><td>Ut queant laxis</td><td>ut (do)</td></tr><tr><td>Resonare fibris</td><td>ré</td></tr><tr><td>Mira gestorum</td><td>mi</td></tr><tr><td>Famuli tuorum</td><td>fa</td></tr><tr><td>Solve polluti</td><td>sol</td></tr><tr><td>Labii reatum</td><td>la</td></tr><tr><td>Sancte Iohannes</td><td>si (ajouté plus tard)</td></tr></tbody></table></div>"}, "histoire": {"titre": "Les grandes époques de la musique", "niveaux": "6e à 3e", "html": "<figure class=\"fig\"><svg viewBox=\"0 0 512 80\" width=\"100%\" role=\"img\" aria-label=\"Frise des grandes époques\"><rect x=\"8\" y=\"30\" width=\"59\" height=\"26\" rx=\"4\" fill=\"currentColor\" opacity=\"0.35\"/><text x=\"37.5\" y=\"22\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-family=\"sans-serif\">Antiquité</text><text x=\"8\" y=\"70\" font-size=\"8.5\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">avant J.-C.</text><rect x=\"70\" y=\"30\" width=\"59\" height=\"26\" rx=\"4\" fill=\"currentColor\" opacity=\"0.43\"/><text x=\"99.5\" y=\"22\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-family=\"sans-serif\">Moyen Âge</text><text x=\"70\" y=\"70\" font-size=\"8.5\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">500</text><rect x=\"132\" y=\"30\" width=\"59\" height=\"26\" rx=\"4\" fill=\"currentColor\" opacity=\"0.51\"/><text x=\"161.5\" y=\"22\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-family=\"sans-serif\">Renaissance</text><text x=\"132\" y=\"70\" font-size=\"8.5\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">1400</text><rect x=\"194\" y=\"30\" width=\"59\" height=\"26\" rx=\"4\" fill=\"currentColor\" opacity=\"0.59\"/><text x=\"223.5\" y=\"22\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-family=\"sans-serif\">Baroque</text><text x=\"194\" y=\"70\" font-size=\"8.5\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">1600</text><rect x=\"256\" y=\"30\" width=\"59\" height=\"26\" rx=\"4\" fill=\"currentColor\" opacity=\"0.67\"/><text x=\"285.5\" y=\"22\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-family=\"sans-serif\">Classique</text><text x=\"256\" y=\"70\" font-size=\"8.5\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">1750</text><rect x=\"318\" y=\"30\" width=\"59\" height=\"26\" rx=\"4\" fill=\"currentColor\" opacity=\"0.75\"/><text x=\"347.5\" y=\"22\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-family=\"sans-serif\">Romantique</text><text x=\"318\" y=\"70\" font-size=\"8.5\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">1820</text><rect x=\"380\" y=\"30\" width=\"59\" height=\"26\" rx=\"4\" fill=\"currentColor\" opacity=\"0.83\"/><text x=\"409.5\" y=\"22\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-family=\"sans-serif\">Moderne</text><text x=\"380\" y=\"70\" font-size=\"8.5\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">1900</text><rect x=\"442\" y=\"30\" width=\"59\" height=\"26\" rx=\"4\" fill=\"currentColor\" opacity=\"0.91\"/><text x=\"471.5\" y=\"22\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-family=\"sans-serif\">Contemporain</text><text x=\"442\" y=\"70\" font-size=\"8.5\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">1945</text><text x=\"504\" y=\"70\" text-anchor=\"end\" font-size=\"8.5\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">auj.</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Époque</th><th>Dates</th><th>Repères</th></tr></thead><tbody><tr><td>Antiquité</td><td>jusqu&#x27;au Ve siècle</td><td>Égypte, Mésopotamie, Grèce, Pythagore</td></tr><tr><td>Moyen Âge</td><td>Ve au XIVe siècle</td><td>chant grégorien, École de Notre-Dame (Léonin, Pérotin), troubadours, Machaut</td></tr><tr><td>Renaissance</td><td>XVe et XVIe siècles</td><td>Dufay, Ockeghem, Josquin, Janequin, Palestrina</td></tr><tr><td>Baroque</td><td>1600 à 1750</td><td>Monteverdi, Frescobaldi, Lully, Charpentier, Couperin, Rameau, Bach, Vivaldi, Haendel</td></tr><tr><td>Classique</td><td>1750 à 1820</td><td>Gluck, Haydn, Mozart, Beethoven</td></tr><tr><td>Romantique</td><td>XIXe siècle</td><td>Schubert, Berlioz, Chopin, Wagner, Verdi</td></tr><tr><td>Moderne</td><td>1890 à 1945</td><td>Debussy, Stravinsky, Schoenberg, Varèse, Messiaen ; naissance du jazz et du disque</td></tr><tr><td>Contemporain</td><td>depuis 1945</td><td>Schaeffer, Boulez, Xenakis, Ligeti, Reich, Grisey ; rock, rap, électro, genres mondialisés</td></tr></tbody></table></div>\n<p>Les dates sont des repères : les styles se chevauchent et changent progressivement.</p>"}, "physique": {"titre": "Le son, du point de vue de la physique", "niveaux": "4e et 3e", "html": "<p>Un son est une vibration qui se propage dans l&#x27;air sous forme d&#x27;onde. Il ne se propage pas dans le vide.</p>\n<div class=\"tbl\"><table><thead><tr><th>Grandeur</th><th>Unité</th><th>Ce que l&#x27;on entend</th></tr></thead><tbody><tr><td>Fréquence</td><td>hertz (Hz)</td><td>la hauteur : plus la fréquence est grande, plus le son est aigu</td></tr><tr><td>Amplitude</td><td>décibel (dB) pour le niveau sonore</td><td>l&#x27;intensité : fort ou doux</td></tr><tr><td>Spectre (harmoniques)</td><td>fréquences multiples de la fondamentale</td><td>le timbre</td></tr></tbody></table></div>\n<figure class=\"fig\"><svg viewBox=\"0 0 420 158\" width=\"100%\" role=\"img\" aria-label=\"Spectre harmonique\"><line x1=\"30\" y1=\"120\" x2=\"400\" y2=\"120\" stroke=\"currentColor\"/><line x1=\"30\" y1=\"120\" x2=\"30\" y2=\"15\" stroke=\"currentColor\"/><rect x=\"66\" y=\"25.0\" width=\"12\" height=\"95.0\" fill=\"currentColor\" opacity=\".8\"/><text x=\"72\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\" font-family=\"sans-serif\">1f</text><rect x=\"108\" y=\"65.43682813764084\" width=\"12\" height=\"54.56317186235916\" fill=\"currentColor\" opacity=\".8\"/><text x=\"114\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\" font-family=\"sans-serif\">2f</text><rect x=\"150\" y=\"80.55185357884196\" width=\"12\" height=\"39.44814642115804\" fill=\"currentColor\" opacity=\".8\"/><text x=\"156\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\" font-family=\"sans-serif\">3f</text><rect x=\"192\" y=\"88.66168711914376\" width=\"12\" height=\"31.338312880856236\" fill=\"currentColor\" opacity=\".8\"/><text x=\"198\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\" font-family=\"sans-serif\">4f</text><rect x=\"234\" y=\"93.78513643223692\" width=\"12\" height=\"26.21486356776308\" fill=\"currentColor\" opacity=\".8\"/><text x=\"240\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\" font-family=\"sans-serif\">5f</text><rect x=\"276\" y=\"97.34298954916679\" width=\"12\" height=\"22.65701045083321\" fill=\"currentColor\" opacity=\".8\"/><text x=\"282\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\" font-family=\"sans-serif\">6f</text><rect x=\"318\" y=\"99.97164994978823\" width=\"12\" height=\"20.028350050211777\" fill=\"currentColor\" opacity=\".8\"/><text x=\"324\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\" font-family=\"sans-serif\">7f</text><rect x=\"360\" y=\"102.00086577268902\" width=\"12\" height=\"17.999134227310975\" fill=\"currentColor\" opacity=\".8\"/><text x=\"366\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\" font-family=\"sans-serif\">8f</text><text x=\"215\" y=\"152\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">fréquence : la fondamentale f, puis les harmoniques 2f, 3f, 4f…</text><text x=\"34\" y=\"12\" font-size=\"10\" fill=\"currentColor\" opacity=\".75\" font-family=\"sans-serif\">amplitude</text></svg></figure>\n<ul><li>L&#x27;oreille humaine entend environ de 20 Hz à 20 000 Hz.</li><li>Le la du diapason est fixé à 440 Hz.</li><li>Au-delà de 85 dB, une exposition prolongée abîme l&#x27;audition : se protéger.</li></ul>\n<h3>Les instruments électroniques</h3>\n<ul><li>Thérémine (Léon Theremin, vers 1920) : on joue sans toucher l&#x27;instrument.</li><li>Ondes Martenot (1928).</li><li>Musique concrète (Pierre Schaeffer, 1948) et électronique (Studio de Cologne, années 1950).</li><li>Synthèse par ordinateur (Bell Labs, années 1950 et 1960) ; Ircam (1977).</li></ul>"}, "maths": {"titre": "Musique et mathématiques", "niveaux": "6e (Pythagore), 3e", "html": "<p>Selon la tradition, Pythagore aurait découvert que les intervalles agréables à l&#x27;oreille correspondent à des rapports simples de longueurs de corde.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 470 125\" width=\"100%\" role=\"img\" aria-label=\"Le monocorde de Pythagore\"><line x1=\"20\" y1=\"22\" x2=\"300\" y2=\"22\" stroke=\"currentColor\" stroke-width=\"3\"/><line x1=\"300\" y1=\"22\" x2=\"300\" y2=\"22\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\" opacity=\".5\"/><text x=\"310\" y=\"26\" font-size=\"11\" fill=\"currentColor\" font-family=\"sans-serif\">corde entière, son de départ</text><line x1=\"20\" y1=\"52\" x2=\"160.0\" y2=\"52\" stroke=\"currentColor\" stroke-width=\"3\"/><line x1=\"160.0\" y1=\"52\" x2=\"300\" y2=\"52\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\" opacity=\".5\"/><text x=\"310\" y=\"56\" font-size=\"11\" fill=\"currentColor\" font-family=\"sans-serif\">moitié : 1/2, octave</text><line x1=\"20\" y1=\"82\" x2=\"206.66666666666666\" y2=\"82\" stroke=\"currentColor\" stroke-width=\"3\"/><line x1=\"206.66666666666666\" y1=\"82\" x2=\"300\" y2=\"82\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\" opacity=\".5\"/><text x=\"310\" y=\"86\" font-size=\"11\" fill=\"currentColor\" font-family=\"sans-serif\">deux tiers : 2/3, quinte</text><line x1=\"20\" y1=\"112\" x2=\"230.0\" y2=\"112\" stroke=\"currentColor\" stroke-width=\"3\"/><line x1=\"230.0\" y1=\"112\" x2=\"300\" y2=\"112\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\" opacity=\".5\"/><text x=\"310\" y=\"116\" font-size=\"11\" fill=\"currentColor\" font-family=\"sans-serif\">trois quarts : 3/4, quarte</text></svg></figure>\n<div class=\"tbl\"><table><thead><tr><th>Rapport</th><th>Intervalle</th><th>Exemple</th></tr></thead><tbody><tr><td>2/1</td><td>octave</td><td>do grave, do aigu</td></tr><tr><td>3/2</td><td>quinte</td><td>do, sol</td></tr><tr><td>4/3</td><td>quarte</td><td>do, fa</td></tr></tbody></table></div>\n<h3>Composer avec des règles et des probabilités</h3>\n<ul><li>Le canon et la fugue appliquent des règles strictes d&#x27;imitation.</li><li>Jeu de dés musical attribué à Mozart (1792) : des mesures tirées au hasard.</li><li>Iannis Xenakis, ingénieur et architecte, utilise les probabilités pour organiser des masses de sons : c&#x27;est la musique stochastique (Metastaseis, 1954).</li><li>La musique répétitive de Steve Reich applique un processus du début à la fin.</li><li>Aujourd&#x27;hui, des algorithmes recommandent et génèrent de la musique.</li></ul>"}}, "pages": {"partenariats": "<h2>Les lieux de musique autour du collège</h2>\n<h3>À Ablon-sur-Seine</h3>\n<ul><li>Espace culturel Alain-Poher : la salle Charlie-Chaplin (430 places), une petite scène, un studio de danse et un forum d&#x27;exposition, avec une saison de spectacles toute l&#x27;année.</li><li>Médiathèque Jacques-Prévert, avenue Auguste-Duru, dans l&#x27;Espace Alain-Poher : elle fait partie du réseau des dix médiathèques de Grand-Orly Seine Bièvre, avec une carte unique.</li></ul>\n<h3>Les conservatoires du territoire</h3>\n<p>Grand-Orly Seine Bièvre compte douze conservatoires en réseau : Arcueil, Athis-Mons, Cachan, Fresnes, Gentilly, L&#x27;Haÿ-les-Roses, Juvisy-sur-Orge, Le Kremlin-Bicêtre, Savigny-sur-Orge, Villejuif, Villeneuve-Saint-Georges et Viry-Châtillon. Les plus proches d&#x27;Ablon sont Athis-Mons, Villeneuve-Saint-Georges et Juvisy-sur-Orge. Chaque printemps, le Printemps des conservatoires propose concerts et portes ouvertes.</p>\n<h3>Pour aller plus loin</h3>\n<ul><li>Philharmonie de Paris : concerts et ateliers pour les jeunes.</li><li>Radio France : concerts à la Maison de la Radio et de la Musique.</li><li>Orchestre national d&#x27;Île-de-France : concerts dans toute la région.</li><li>Sons d&#x27;hiver : festival de jazz du Val-de-Marne, chaque hiver.</li><li>MAC VAL, Vitry-sur-Seine : le musée d&#x27;art contemporain du Val-de-Marne.</li></ul>\n<p>Les sorties et les concerts organisés avec la classe sont annoncés aux familles par l&#x27;établissement.</p>", "cadre": "<h2>Les programmes officiels</h2>\n<h3>Textes de référence</h3>\n<ul><li>Programmes de cycle 3 (CM1, CM2, 6e) et de cycle 4 (5e, 4e, 3e) : Bulletin officiel spécial n° 11 du 26 novembre 2015, modifiés par le Bulletin officiel n° 31 du 30 juillet 2020.</li><li>Horaire : une heure hebdomadaire d&#x27;éducation musicale de la 6e à la 3e.</li></ul>\n<p>Statut au 23/10/2026 : le Conseil supérieur des programmes a publié un projet de programme d&#x27;éducation musicale pour le cycle 4 (juillet 2025) et un projet pour les enseignements artistiques du cycle 3 (juin 2025, consultation de février à mars 2026). Aucune publication au Bulletin officiel d&#x27;un nouveau programme d&#x27;éducation musicale applicable en 2026-2027 n&#x27;a été trouvée. À vérifier sur la page Eduscol « Enseigner au cycle 3 » et « Enseigner au cycle 4 » avant le 2 novembre : si un nouveau texte s&#x27;applique en 6e, la progression de 6e se réajuste, l&#x27;esprit restant le même (le projet de 6e transforme « Chanter et interpréter » en « Chanter et jouer ensemble »).</p>\n<h3>Les quatre compétences</h3>\n<p>Cycle 3 (6e) :</p>\n<ul><li>C1 Chanter et interpréter</li><li>C2 Écouter, comparer et commenter</li><li>C3 Explorer, imaginer et créer</li><li>C4 Échanger, partager et argumenter</li></ul>\n<p>Cycle 4 (5e, 4e, 3e) :</p>\n<ul><li>C1 Réaliser des projets musicaux d&#x27;interprétation ou de création</li><li>C2 Écouter, comparer, construire une culture musicale commune</li><li>C3 Explorer, imaginer, créer et produire</li><li>C4 Échanger, partager, argumenter et débattre</li></ul>\n<p>Chaque séquence des progressions travaille trois ou quatre de ces compétences, et chaque compétence est évaluée plusieurs fois dans l&#x27;année.</p>\n<h3>Liens avec le reste du collège</h3>\n<ul><li>Socle commun : l&#x27;éducation musicale contribue surtout au domaine 1 (langages des arts et du corps) et au domaine 5 (représentations du monde et activité humaine).</li><li>Parcours d&#x27;éducation artistique et culturelle : sorties, concerts, rencontres d&#x27;artistes.</li><li>Histoire des arts : en 3e, l&#x27;épreuve orale du brevet peut porter sur un projet ou une oeuvre étudiés en éducation musicale. La séquence 5 de 3e y prépare.</li><li>Chant choral : enseignement facultatif, à proposer si l&#x27;établissement le permet.</li></ul><h2>Calendrier 2026-2027, zone C (académie de Créteil)</h2>\n<p>Arrêté du 22 octobre 2025. Prise de poste le lundi 2 novembre 2026.</p>\n<div class=\"tbl\"><table><thead><tr><th>Période</th><th>Semaines de cours</th><th>Nombre</th></tr></thead><tbody><tr><td>P1</td><td>du 2 novembre au 18 décembre</td><td>7</td></tr><tr><td>Vacances de Noël</td><td>du samedi 19 décembre au lundi 4 janvier</td><td></td></tr><tr><td>P2</td><td>du 4 janvier au 5 février</td><td>5</td></tr><tr><td>Vacances d&#x27;hiver</td><td>du samedi 6 février au lundi 22 février</td><td></td></tr><tr><td>P3</td><td>du 22 février au 2 avril</td><td>6</td></tr><tr><td>Vacances de printemps</td><td>du samedi 3 avril au lundi 19 avril</td><td></td></tr><tr><td>P4</td><td>du 19 avril au 21 mai</td><td>5</td></tr><tr><td>P5</td><td>du 24 mai au samedi 3 juillet (fin des cours)</td><td>6</td></tr></tbody></table></div>\n<p>Total : 29 semaines. Jours sans cours à surveiller : mercredi 11 novembre, lundi de Pâques 29 mars, jeudi 6 mai (Ascension) et vendredi 7 mai (pont, sans classe dans les trois zones), lundi de Pentecôte 17 mai. Les classes de 3e se vident avant le brevet, fin juin : leur progression s&#x27;arrête début juin.</p>\n<h3>Répartition dans les progressions</h3>\n<ul><li>Semaine du 2 novembre : séance d&#x27;accueil, la même pour tous les niveaux.</li><li>Une séquence par période, cinq séances chacune (quatre en P5).</li><li>Semaines tampon : 14 décembre, 29 mars, et la fin juin. Elles absorbent les séances perdues.</li></ul><h2>L&#x27;évaluation</h2>\n<h3>Principe</h3>\n<p>Chaque séquence se termine par une évaluation qui porte sur ce qui a été travaillé en classe, et sur rien d&#x27;autre. Les élèves savent dès le début de la séquence ce qui sera évalué : c&#x27;est écrit dans leur plan de l&#x27;année.</p>\n<p>Trois types d&#x27;évaluation, sur l&#x27;année :</p>\n<ul><li>l&#x27;interprétation : le chant de la séquence, en petit groupe plutôt que seul, pour ne pas mettre un élève en difficulté devant la classe ;</li><li>l&#x27;écoute : un extrait inconnu à décrire avec le vocabulaire appris ;</li><li>la création ou l&#x27;argumentation : une réalisation de groupe, un exposé, un débat.</li></ul>\n<h3>Les quatre niveaux de maîtrise (socle commun)</h3>\n<div class=\"tbl\"><table><thead><tr><th>Niveau</th><th>Intitulé</th><th>Pour l&#x27;élève</th></tr></thead><tbody><tr><td>1</td><td>Maîtrise insuffisante</td><td>je ne sais pas encore le faire, même aidé</td></tr><tr><td>2</td><td>Maîtrise fragile</td><td>je sais le faire avec de l&#x27;aide</td></tr><tr><td>3</td><td>Maîtrise satisfaisante</td><td>je sais le faire seul</td></tr><tr><td>4</td><td>Très bonne maîtrise</td><td>je sais le faire seul et l&#x27;expliquer aux autres</td></tr></tbody></table></div>\n<p>Si l&#x27;établissement note sur 20, correspondance indicative : 1 = 5, 2 = 10, 3 = 15, 4 = 20. À ajuster sur la pratique de l&#x27;établissement, à demander à la rentrée.</p>\n<h3>Grille de l&#x27;interprétation (chant)</h3>\n<div class=\"tbl\"><table><thead><tr><th>Critère</th><th>1</th><th>2</th><th>3</th><th>4</th></tr></thead><tbody><tr><td>Justesse et mémorisation</td><td>paroles et mélodie non sues</td><td>avec le support, des erreurs</td><td>su, quelques hésitations</td><td>su, juste et sûr</td></tr><tr><td>Mise en place</td><td>ne suit pas le groupe</td><td>suit avec difficulté</td><td>ensemble avec le groupe</td><td>ensemble et attentif aux autres</td></tr><tr><td>Expression</td><td>aucune nuance</td><td>nuances rares</td><td>nuances respectées</td><td>interprétation personnelle</td></tr></tbody></table></div>\n<h3>Grille de l&#x27;écoute</h3>\n<div class=\"tbl\"><table><thead><tr><th>Critère</th><th>1</th><th>2</th><th>3</th><th>4</th></tr></thead><tbody><tr><td>Repérer</td><td>ne repère rien</td><td>repère un élément</td><td>repère l&#x27;essentiel</td><td>repère et situe dans le temps</td></tr><tr><td>Nommer</td><td>pas de vocabulaire</td><td>vocabulaire approximatif</td><td>vocabulaire juste</td><td>vocabulaire juste et varié</td></tr><tr><td>Relier</td><td>aucun lien</td><td>lien vague</td><td>relie à une oeuvre étudiée</td><td>compare et justifie</td></tr></tbody></table></div>", "ressources": "<h2>Ressources</h2>\n<p>Les liens sont à vérifier depuis un navigateur : ils n&#x27;ont pas pu être ouverts lors de la rédaction (sites publics bloqués par l&#x27;environnement de travail).</p>\n<h3>Officiel et pédagogique</h3>\n<ul><li>Eduscol, éducation musicale : programmes, ressources d&#x27;accompagnement par cycle.</li><li>Sites disciplinaires des académies (Créteil, Paris, Versailles, et d&#x27;autres) : séquences, évaluations, banques d&#x27;écoutes partagées par des professeurs.</li><li>Musique Prim : répertoire de chants avec playbacks, pensé pour l&#x27;école mais utile en 6e.</li><li>Lumni : vidéos courtes pour introduire une oeuvre ou un compositeur.</li></ul>\n<h3>Écouter et voir les oeuvres</h3>\n<ul><li>Philharmonie de Paris, ressources éducatives (accès enseignant via Éduthèque).</li><li>Radio France, ressources pour la classe (Maison de la Radio et de la Musique).</li><li>Opéra national de Paris, ressources pédagogiques (pour la séquence opéra de 4e).</li><li>Plateformes de streaming pour les extraits ; préparer les extraits à l&#x27;avance, sans publicité.</li></ul>\n<h3>Partitions</h3>\n<ul><li>IMSLP : partitions du domaine public (Mozart, Bach, Vivaldi, Machaut, etc.).</li><li>Les chants de variété ne sont pas libres de droits : utiliser une partition éditée ou l&#x27;apprentissage par imitation.</li></ul>\n<h3>Outils numériques gratuits</h3>\n<ul><li>MuseScore : écriture de partitions.</li><li>Audacity : enregistrement et montage du son (séquences de création).</li><li>Chrome Music Lab : expériences simples sur le rythme, la mélodie, le son, très utile en 6e.</li><li>BandLab : studio en ligne pour les boucles et la musique électronique (séquence de 4e).</li></ul>\n<h3>Banques de séquences toutes prêtes (à comparer avec nos progressions)</h3>\n<ul><li>Académie de Bordeaux, séquences de collège par niveau (exemples : musique et civilisation grecque en 6e, art et mémoire en 3e) : <a href=\"https://ent2d.ac-bordeaux.fr/disciplines/musique/college/sequences/6/\" target=\"_blank\" rel=\"noopener\">https://ent2d.ac-bordeaux.fr/disciplines/musique/college/sequences/6/</a></li><li>Académie de Versailles, Educamus, séquence de 6e (interpréter et créer) : <a href=\"https://educamus.ac-versailles.fr/IMG/pdf/sequence_musique_6e.pdf\" target=\"_blank\" rel=\"noopener\">https://educamus.ac-versailles.fr/IMG/pdf/sequence_musique_6e.pdf</a></li><li>Académie de Nancy-Metz, chant choral école et collège, cycle 3 : <a href=\"https://sites.ac-nancy-metz.fr/education-musicale/chant-choral/?p=1014\" target=\"_blank\" rel=\"noopener\">https://sites.ac-nancy-metz.fr/education-musicale/chant-choral/?p=1014</a></li></ul>\n<h3>Ressources envoyées par Sébastien</h3>\n<ul><li>29/10/2026 : <a href=\"https://www.ecoles-colleges.com/séquence-musique-6ème-5ème-4ème-3ème-collège/\" target=\"_blank\" rel=\"noopener\">https://www.ecoles-colleges.com/séquence-musique-6ème-5ème-4ème-3ème-collège/</a> (séquences de la 6e à la 3e). Contenu non lu : le site est hors des domaines autorisés de la session de travail. À ouvrir depuis un navigateur, et à reporter ici ce qui sert.</li></ul>"}, "diapos": {"accueil": [{"k": "Bienvenue", "h": "Éducation musicale", "p": ["Une heure par semaine pour chanter, écouter, créer et comprendre la musique, des premières flûtes en os jusqu'à aujourd'hui."]}, {"k": "Le cours", "h": "Quatre façons de faire de la musique", "l": ["Chanter et jouer ensemble.", "Écouter avec précision et nommer ce que l'on entend.", "Inventer et créer.", "Échanger et argumenter."]}, {"k": "Les règles", "h": "Écouter, c'est un travail", "l": ["Le silence avant l'écoute.", "On lève la main pour parler.", "On respecte la voix de chacun : personne ne se moque.", "Un porte-vues ou un cahier réservé à la musique."]}, {"k": "L'année", "h": "Une histoire de la musique en quatre ans", "l": ["6e : aux origines, de la préhistoire à l'invention de la notation.", "5e : le Moyen Âge et la Renaissance.", "4e : de Versailles au phonographe.", "3e : la modernité, le son électronique et la musique d'aujourd'hui."]}, {"k": "Écoute", "h": "Quatre musiques, mille ans d'écart", "q": ["Que remarques-tu ?", "Lesquelles se ressemblent ?", "Laquelle préfères-tu, et pourquoi ?"], "yt": [["Pérotin, Viderunt omnes (Paris, 1198)", "Perotin Viderunt omnes Hilliard Ensemble"], ["Polyphonie des Pygmée const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = new Date(); today.setHours(0,0,0,0);
const parse = iso => { const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); };
const PER = {P1:"Novembre, décembre",P2:"Janvier, février",P3:"Mars",P4:"Avril, mai",P5:"Fin mai, juin"};

const EMBLEME = `<svg width="30" height="22" viewBox="0 0 30 22" aria-hidden="true"><g stroke="var(--line)" stroke-width="1"><path d="M0 4h30M0 8h30M0 12h30M0 16h30M0 20h30"/></g><path d="M15 19 C6 13 7 6 11 6 c2 0 3.2 1.4 4 2.8 C15.8 7.4 17 6 19 6 c4 0 5 7 -4 13z" fill="var(--gold)"/></svg>`;

const pdf = (nom, libelle) => `<a class="btn" href="pdf/${nom}" target="_blank" rel="noopener">${esc(libelle)}</a>`;

function semaineEnCours(cal) {
  for (const e of cal) { const d = parse(e.date), f = new Date(d); f.setDate(f.getDate() + 7); if (today >= d && today < f) return e; }
  return null;
}
function libelle(n, e) {
  if (!e) return "Année terminée";
  if (e.type === "accueil") return "Séance d'accueil";
  if (e.type === "tampon") return "Semaine tampon : rattrapage ou concert";
  const s = n.sequences[e.seq - 1], c = n.contenus[e.seq - 1].seances[e.num - 1];
  return `${s.titre}, séance ${e.num} : ${c.objectif}`;
}

function frise() {
  const per = [["P1","nov.-déc.","2026-11-02","2026-12-19"],["P2","janv.-fév.","2027-01-04","2027-02-06"],["P3","mars","2027-02-22","2027-04-03"],["P4","avril-mai","2027-04-19","2027-05-22"],["P5","juin","2027-05-24","2027-07-03"]];
  const t0 = parse("2026-11-02"), t1 = parse("2027-07-03");
  const pct = Math.max(0, Math.min(100, (today - t0) / (t1 - t0) * 100));
  const on = per.find(p => today >= parse(p[2]) && today < parse(p[3]));
  return `<div class="timeline"><div class="label">L'année en cinq périodes</div><div class="tl-bar">${per.map(p => `<div class="${on && on[0] === p[0] ? "on" : ""}">${p[1]}</div>`).join("")}

}

const WEEKS = D.niveaux[NIV[0]].calendrier.map(e => ({ semaine: e.semaine, date: e.date }));
function indexDuJour() {
  if (today < parse(WEEKS[0].date)) return 0;
  for (let i = WEEKS.length - 1; i >= 0; i--) if (today >= parse(WEEKS[i].date)) return i;
  return 0;
}
const seanceId = (k, e) => `seance-${k}-${e.seq}-${e.num}`;

function vueSemaine(idx) {

    h += head("Agenda de l'année", `Semaine du ${w.semaine}`, idx < courant ? "Semaine passée." : "Semaine à venir.");

  h += `<div class="weeknav"><a class="wbtn" href="#semaine-${Math.max(0, idx - 1)}" aria-label="Semaine précédente"${idx === 0 ? ' aria-disabled="true"' : ""}>&#8249;</a>

  if (idx !== courant) h += `<p class="small" style="margin-top:8px"><a href="#semaine">Revenir à cette semaine</a></p>`;
  h += `<div class="stack" style="margin-top:14px">`;
  for (const k of NIV) {
    const n = D.niveaux[k], e = n.calendrier[idx];
    let detail = "", lien = `#cours-${k}`;

      <h3>${esc(libelle(n, e))}</h3>${detail ? `<p class="small">${esc(detail)}</p>` : ""}${e.type === "seance" ? `<span class="small" style="color:var(--gold)">Voir la séance &#8250;</span>` : ""}${e.type === "accueil" ? `<span class="small" style="color:var(--gold)">&#9655; Projeter la séance d'accueil</span>` : ""}</div></div></a>`;
  }
  h += `</div>`;
  if (idx === courant) h += `<div class="staff"></div><div class="tiles">
    <a class="tile" href="#fiches"><span class="ico">${D.ficheIcons.figures}</span><h3>Fiches de notions</h3><span class="small">Nuances, figures, instruments, voix…</span></a>

      <div class="tbl"><table class="evt"><thead><tr><th>Critère</th><th>Comp.</th><th class="box">1</th><th class="box">2</th><th class="box">3</th><th class="box">4</th></tr></thead><tbody>
      ${ev.criteres.map(([cr, code]) => `<tr><td>${esc(cr)}</td><td title="${esc(comp[code])}">${code}</td><td class="box">&#9633;</td><td class="box">&#9633;</td><td class="box">&#9633;</td><td class="box">&#9633;</td></tr>`).join("")}</tbody></table></div>
      <p class="small">${ev.criteres.map(([, code]) => code).filter((c, j, a) => a.indexOf(c) === j).map(c => `${c} ${esc(comp[c])}`).join(" ; ")}.</p>
      <div><div class="label">Résultats attendus</div><ul class="plain">${ev.attendus.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div></div>`;
  });
  return h + `</div><div class="staff"></div><p class="small">1 maîtrise insuffisante : je ne sais pas encore le faire, même aidé. 2 fragile : avec de l'aide. 3 satisfaisante : seul. 4 très bonne : seul, et je sais l'expliquer.</p>`;
}

function vueFiches() {
  let h = head("Fiches de notions", "Les notions de l'année", "Chaque fiche se consulte ici et s'imprime en PDF pour les élèves.") + `<div class="staff"></div><div class="tiles">`;
  for (const [id, f] of Object.entries(D.fiches)) h += `<a class="tile" href="#fiche-${id}"><span class="ico">${D.ficheIcons[id]}</span><h3>${esc(f.titre)}</h3><span class="meta">${esc(f.niveaux)}</span></a>`;
  return h + `</div>`;
}
function vueFiche(id) {
  const f = D.fiches[id];
  return head("Fiche de notions", f.titre, `Niveaux : ${f.niveaux}.`) + `<div class="dl">${pdf(`fiche_${id}.pdf`, "Fiche à imprimer")} ${gh(`fiches/${id}.pdf`)}</div>
    <div class="staff"></div><div class="prose">${f.html}</div><div class="staff"></div><p><a href="#fiches">Toutes les fiches</a></p>`;
}

const PLUS = [["cafep", "CAFEP 2027", "Le concours, le calendrier, l'inscription pas à pas."], ["partenariats", "Partenaires culturels", "Lieux de musique, conservatoires et concerts autour d'Ablon."],
  ["cadre", "Cadre", "Programmes, calendrier de l'année, grilles d'évaluation."], ["ressources", "Ressources", "Sites, outils, banques de séquences."]];
function vuePlus() {
  const items = PLUS.filter(([id]) => D.pages[id]);
  return head("Plus", "Concours, partenaires, cadre", "") + `<div class="staff"></div><div class="stack">${items.map(([id, t, d]) => `<a class="card" href="#${id}"><h3>${esc(t)}</h3><p class="small">${esc(d)}</p></a>`).join("")}</div>
    <div class="staff"></div><p class="small"><a href="${D.depot.replace("/blob/main/", "")}" target="_blank" rel="noopener">Le dépôt complet sur GitHub</a></p>`;
}
function vuePage(id) {
  const t = PLUS.find(x => x[0] === id);
  return head("Plus", t[1], t[2]) + `<div class="staff"></div><div class="prose">${D.pages[id]}</div><div class="staff"></div><p><a href="#plus">Retour</a></p>`;
}


const YT = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
function diaposSeance(k, seq, num) {
  const n = D.niveaux[k], s = n.sequences[seq - 1], c = n.contenus[seq - 1], se = c.seances[num - 1];
  let vues = (D.diapos[k] && D.diapos[k][seq + "-" + num]) ? D.diapos[k][seq + "-" + num].slice() : null;
  if (!vues) {
    vues = [{ k: `Séquence ${seq}, séance ${num}`, h: se.objectif, p: [s.question] }];
    if (num === 1 && s.accroche) vues.push({ k: "Accroche", h: "Pour commencer", p: [s.accroche] });
    vues.push({ k: "Déroulé", h: "Aujourd'hui", l: se.etapes.map(([m, t]) => `${m} min : ${t}`) });
    vues.push({ k: "Écoute", h: "Les œuvres de la séquence", q: ["Que remarques-tu ?", "Quels instruments ou quelles voix ?", "Quel caractère, et par quels moyens ?"], yt: s.oeuvres.map(o => [o, o]) });
    vues.push({ k: "Chant", h: s.chant });
  }
  vues.push({ k: "Trace écrite", h: "Je retiens", l: c.trace });
  vues.push({ k: "À la maison", h: "Pour la prochaine fois", p: [c.devoirs] });
  return vues;
}
function vueVue(v, i, total) {
  let h = `<div class="slide"><div class="s-k">${esc(v.k || "")}</div><h2 class="s-h">${esc(v.h || "")}</h2>`;
  (v.p || []).forEach(t => h += `<p class="s-p">${esc(t)}</p>`);
  if (v.l) h += `<ul class="s-l">${v.l.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`;
  if (v.q) h += `<div class="s-q"><span>Questions d'écoute</span><ol>${v.q.map(t => `<li>${esc(t)}</li>`).join("")}</ol></div>`;
  if (v.svg && D.svgs[v.svg]) h += `<figure class="s-svg">${D.svgs[v.svg]}</figure>`;
  if (v.yt) h += `<div class="s-yt">${v.yt.map(([lib, q]) => `<a href="${YT(q)}" target="_blank" rel="noopener"><span class="play">&#9654;</span>${esc(lib)}</a>`).join("")}</div>`;
  return h + `</div>`;
}
let PROJ = null;
function ouvrirProj(vues, titre, retour) {
  PROJ = { vues, i: 0, titre, retour };
  dessinerProj();
}
function dessinerProj() {
  if (!PROJ) return;
  let el = document.getElementById("proj");
  if (!el) { el = document.createElement("div"); el.id = "proj"; el.className = "proj"; document.body.appendChild(el); }
  const { vues, i, titre } = PROJ;
  el.innerHTML = `<div class="p-top"><span class="p-t">Sebastian Rivas, ${esc(titre)}</span><span class="p-n">${i + 1} / ${vues.length}</span>
      <button id="p-fs" aria-label="Plein écran">&#9974;</button><button id="p-x" aria-label="Fermer">&#10005;</button></div>
    <div class="p-stage">${vueVue(vues[i], i, vues.length)}</div>
    <div class="p-bar"><button id="p-prev" aria-label="Vue précédente"${i === 0 ? " disabled" : ""}>&#8249;</button>
      <div class="p-dots">${vues.map((_, j) => `<span class="${j === i ? "on" : ""}"></span>`).join("")}</div>
      <button id="p-next" aria-label="Vue suivante"${i === vues.length - 1 ? " disabled" : ""}>&#8250;</button></div>`;
  el.querySelector("#p-prev").onclick = () => allerProj(-1);
  el.querySelector("#p-next").onclick = () => allerProj(1);
  el.querySelector("#p-x").onclick = fermerProj;
  el.querySelector("#p-fs").onclick = () => { try { (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen()).catch(() => {}); } catch (_) {} };
}
function allerProj(d) { if (!PROJ) return; PROJ.i = Math.max(0, Math.min(PROJ.vues.length - 1, PROJ.i + d)); dessinerProj(); }
function fermerProj() { const el = document.getElementById("proj"); if (el) el.remove(); try { if (document.fullscreenElement) document.exitFullscreen(); } catch (_) {} const r = PROJ && PROJ.retour; PROJ = null; if (r) location.hash = r; }
document.addEventListener("keydown", e => { if (!PROJ) return; if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); allerProj(1); } if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); allerProj(-1); } if (e.key === "Escape") fermerProj(); });
let tx = null;
document.addEventListener("touchstart", e => { if (PROJ) tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", e => { if (PROJ && tx !== null) { const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 50) allerProj(d < 0 ? 1 : -1); tx = null; } });

function rendre() {
  let v = (location.hash || "#semaine").slice(1), tab = "semaine";
  if (v === "cours" || v === "eval") v = v + "-" + get("niv", "6e");
  const m = v.match(/^(cours|eval)-(\w+)$/);
  if (m && D.niveaux[m[2]]) { set("niv", m[2]); app.innerHTML = m[1] === "cours" ? vueCours(m[2]) : vueEval(m[2]); tab = m[1]; }
  else if (v === "fiches") { app.innerHTML = vueFiches(); tab = "fiches"; }
  else if (v.startsWith("fiche-") && D.fiches[v.slice(6)]) { app.innerHTML = vueFiche(v.slice(6)); tab = "fiches"; }
  else if (v === "plus") { app.innerHTML = vuePlus(); tab = "plus"; }
  else if (D.pages[v]) { app.innerHTML = vuePage(v); tab = "plus"; }
  else if (/^seance-\w+-\d+-\d+$/.test(v) && D.niveaux[v.split("-")[1]]) { const [, k, a, b] = v.split("-"); app.innerHTML = vueSeance(k, +a, +b); tab = "cours"; }
  else if (/^semaine-\d+$/.test(v)) app.innerHTML = vueSemaine(+v.split("-")[1]);
  else if (/^proj-\w+-\d+-\d+$/.test(v) && D.niveaux[v.split("-")[1]]) { const [, k, a, b] = v.split("-"); app.innerHTML = vueSeance(k, +a, +b); tab = "cours"; ouvrirProj(diaposSeance(k, +a, +b), `${k}, séquence ${a}, séance ${b}`, `seance-${k}-${a}-${b}`); }
  else if (v === "proj-accueil") { app.innerHTML = vueSemaine(0); ouvrirProj(D.diapos.accueil, "Séance d'accueil", "semaine"); }
  else app.innerHTML = vueSemaine();
  document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.t === tab ? "page" : "false"));
  ["prof", "eleves"].forEach(x => { const b = document.getElementById("m-" + x); if (b) b.onclick = () => { set("mode", x); rendre(); }; });
  window.scrollTo(0, 0);
  const st = document.getElementById("strip"), on = st && st.querySelector(".on");
  if (on) st.scrollLeft = on.offsetLeft - st.clientWidth / 2 + on.clientWidth / 2;
}
window.addEventListener("hashchange", rendre);
rendre();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").then(r => r.update()).catch(() => {});
</script>
