<style>
/* Carnet de cours aux couleurs du Sacré-Coeur : bleu nuit et or, portées en séparateur, une colonne, onglets en bas. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --ink: #1b2836;
  --muted: #5d6978;
  --line: #d7dde6;
  --navy: #22364d;
  --navy-soft: #e5ebf3;
  --gold: #a9802f;
  --gold-soft: #f6efe1;
  --on-navy: #ffffff;
  --f-display: "Cormorant Garamond", Garamond, "Times New Roman", serif;
  --f-body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1621; --surface: #172131; --ink: #e8edf4; --muted: #9eabbb; --line: #2a3749;
  --navy: #a9c1de; --navy-soft: #1d2c40; --gold: #d8b46c; --gold-soft: #2d2618; --on-navy: #0f1621; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1621; --surface: #172131; --ink: #e8edf4; --muted: #9eabbb; --line: #2a3749;
  --navy: #a9c1de; --navy-soft: #1d2c40; --gold: #d8b46c; --gold-soft: #2d2618; --on-navy: #0f1621; color-scheme: dark }

html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px);
}
main { max-width: 700px; margin: 0 auto; }
header.top { padding-block: 20px 4px; display: flex; flex-direction: column; gap: 6px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--muted); font: 500 12px/1.3 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; }
.brand svg { flex: none; }
.brand .lvlbadge { text-transform: none; letter-spacing: 0; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; color: var(--navy); }
h1 { font-weight: 700; font-size: 2.2rem; line-height: 1.05; }
h2 { font-weight: 700; font-size: 1.55rem; line-height: 1.15; }
h3 { font-weight: 700; font-size: 1.25rem; line-height: 1.2; }
p { margin: 0; }
a { color: var(--navy); text-decoration-color: var(--gold); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.lead { color: var(--muted); max-width: 62ch; }
.staff { height: 17px; margin-block: 18px; background: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 4px); position: relative; }
.staff::after { content: ""; position: absolute; left: 0; top: 0; width: 28px; height: 17px; background: var(--gold); opacity: .85; border-radius: 2px; }

.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
a.card { text-decoration: none; color: inherit; }
.card.now { border-color: var(--gold); box-shadow: inset 4px 0 0 var(--gold); }
.row { display: grid; grid-template-columns: 50px 1fr; gap: 12px; align-items: start; }
.lvl { font: 700 1.6rem/1 var(--f-display); color: var(--gold); }
.meta { font: 400 12.5px/1.4 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.small { font-size: .93rem; color: var(--muted); }
.label { font: 500 11.5px/1.3 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12.5px/1.2 var(--f-mono); padding: 6px 10px; border-radius: 999px; background: var(--navy-soft); color: var(--navy); text-decoration: none; border: 1px solid transparent; }
a.chip:hover { border-color: var(--navy); }
.levels { display: flex; gap: 6px; margin-block: 14px 2px; }
.levels a { flex: 1; text-align: center; padding: 9px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--navy); font: 700 1.15rem/1 var(--f-display); text-decoration: none; }
.levels a[aria-current="true"] { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.seg { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; margin-top: 10px; }
.seg button { flex: 1; font: 500 .93rem var(--f-body); border: 0; border-radius: 7px; padding: 9px 6px; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); }
.dl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; background: var(--gold-soft); color: var(--ink); border: 1px solid var(--gold); text-decoration: none; font-size: .93rem; }
.btn::before { content: "PDF"; font: 500 10.5px/1 var(--f-mono); color: var(--gold); letter-spacing: .06em; }
.alt { font-size: .82rem; color: var(--muted); }

details.seq { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
details.seq > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: 30px 1fr 18px; gap: 10px; align-items: start; }
details.seq > summary::-webkit-details-marker { display: none; }
.num { font: 500 13px/1.8 var(--f-mono); color: var(--gold); }
.chev { color: var(--muted); font-size: 22px; line-height: 1; text-align: center; transition: transform .15s; }
details[open] > summary .chev { transform: rotate(90deg); }
.body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.q { font-family: var(--f-display); font-size: 1.2rem; font-style: italic; color: var(--ink); line-height: 1.3; }
ul.plain { margin: 0; padding-left: 1.15em; display: flex; flex-direction: column; gap: 4px; }
.seance { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.seance.now { border-color: var(--gold); background: var(--gold-soft); }
.seance h4 { margin: 0; font: 700 .98rem/1.3 var(--f-body); color: var(--navy); }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.steps li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; font-size: .93rem; }
.steps .min { font: 400 12px/1.6 var(--f-mono); color: var(--muted); }
.trace { border-left: 3px solid var(--gold); padding-left: 12px; display: flex; flex-direction: column; gap: 4px; }

.prose { display: flex; flex-direction: column; gap: 10px; }
.prose h2 { margin-top: 12px; } .prose h3 { margin-top: 8px; }
.prose ul, .prose ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.prose li, .prose p { overflow-wrap: anywhere; }
td { overflow-wrap: break-word; }
.fig { margin: 4px 0; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--navy); }
.fig svg { display: block; max-width: 100%; height: auto; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 12px var(--f-mono); color: var(--muted); background: var(--navy-soft); }
td.box, th.box { width: 26px; padding-inline: 4px; text-align: center; color: var(--muted); }
.evt td:nth-child(2), .evt th:nth-child(2) { width: 40px; padding-inline: 6px; }
code { font-family: var(--f-mono); font-size: .88em; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs ul { list-style: none; margin: 0 auto; padding: 0; max-width: 700px; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
nav.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 100%; text-decoration: none; color: var(--muted); font: 500 11.5px var(--f-body); }
nav.tabs svg { width: 22px; height: 22px; }
nav.tabs a[aria-current="page"] { color: var(--navy); }
nav.tabs a[aria-current="page"] svg { color: var(--gold); }
.hero { margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 26px max(16px, env(safe-area-inset-left, 0px)) 72px; background: linear-gradient(160deg, #22364d 0%, #2c4767 60%, #34557a 100%); color: #fff; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: auto 0 16px 0; height: 41px; background: repeating-linear-gradient(to bottom, rgba(255,255,255,.14) 0 1px, transparent 1px 10px); }
.hero-in { position: relative; max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.hero .id { display: flex; align-items: center; gap: 12px; }
.hero .id svg { width: 52px; height: 52px; flex: none; box-shadow: 0 6px 18px rgba(0,0,0,.25); border-radius: 14px; }
.hero .id b { display: block; font: 700 1.35rem/1.1 var(--f-display); }
.hero .id span { font: 500 11.5px/1.3 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; opacity: .8; }
.hero h1 { color: #fff; font-size: 2.3rem; }
.hero p { color: rgba(255,255,255,.82); max-width: 60ch; }
.hero .gold { color: #e3c27c; }
.timeline { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; }
.tl-bar { display: grid; grid-template-columns: 7fr 5fr 6fr 5fr 6fr; gap: 3px; position: relative; height: 34px; }
.tl-bar div { border-radius: 6px; background: var(--navy-soft); display: flex; align-items: center; justify-content: center; font: 500 11px var(--f-mono); color: var(--navy); }
.tl-bar div.on { background: var(--navy); color: var(--on-navy); }
.tl-mark { position: absolute; top: -6px; bottom: -6px; width: 3px; border-radius: 2px; background: var(--gold); }
.tl-leg { display: flex; justify-content: space-between; font: 400 11px var(--f-mono); color: var(--muted); }
.ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none; }
.lvlcard { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
.lvlbadge { font: 700 1.35rem/1 var(--f-display); color: #fff; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
details.seq > summary { grid-template-columns: 44px 1fr 18px; }
.seqhead { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; min-width: 0; }
.tile .ico { width: 38px; height: 38px; border-radius: 10px; background: var(--navy); color: #fff; }
.tile h3 { font-size: 1.1rem; }
.weeknav, .pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
.wbtn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--navy); color: var(--on-navy); text-decoration: none; font-size: 26px; line-height: 1; flex: none; }
.wbtn[aria-disabled="true"] { opacity: .3; pointer-events: none; }
.wlabel { text-align: center; display: flex; flex-direction: column; } .wlabel b { font: 700 1.3rem/1.2 var(--f-display); color: var(--navy); }
.strip { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px 4px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip a { flex: none; font: 500 12.5px/1 var(--f-mono); padding: 8px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); text-decoration: none; }
.strip a.today { border-color: var(--gold); color: var(--ink); }
.strip a.on { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.btn2 { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--navy); color: var(--navy); text-decoration: none; font-size: .93rem; }
.seance h4 a { text-decoration: none; color: inherit; } .seance h4 a::after { content: " \203A"; color: var(--gold); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/><path d=\"M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6\"/></svg>", "formes": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 4h11v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2h3\"/><path d=\"M7 4a2 2 0 0 0-2 2v10M10 8h5M10 12h5\"/></svg>", "gammes": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 4v16M12 4v16M18 4v16\"/><rect x=\"4\" y=\"13\" width=\"4\" height=\"3\" rx=\"1\"/><rect x=\"10\" y=\"7\" width=\"4\" height=\"3\" rx=\"1\"/><rect x=\"16\" y=\"11\" width=\"4\" height=\"3\" rx=\"1\"/></svg>", "ecoute": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5h16v10H9l-5 4z\"/><path d=\"M8 9h8M8 12h5\"/></svg>", "lexique": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z\"/><path d=\"M12 6v14\"/></svg>"}, "niveaux": {"6e": {"cycle": "cycle3", "intro": "En sixième, on apprend à écouter avec précision, à chanter ensemble et à décrire ce que l'on entend avec les bons mots.", "sequences": [{"titre": "Le son et ses paramètres", "periode": "P1", "semaines": "09/11 au 07/12", "question": "Avec quoi le musicien fabrique-t-il de la musique ?", "competences": ["C1", "C2", "C4"], "chant": "Le Lion est mort ce soir (adaptation française de The Lion Sleeps Tonight), ou un canon simple au choix", "oeuvres": ["Camille Saint-Saëns, Le Carnaval des animaux (L'Éléphant, Aquarium, Le Cygne)", "Sergueï Prokofiev, Pierre et le loup (présentation des personnages)", "Benjamin Britten, The Young Person's Guide to the Orchestra (extrait)"], "vocabulaire": ["hauteur (grave, aigu)", "durée (long, court)", "intensité (piano, forte, crescendo)", "timbre", "familles d'instruments (cordes, bois, cuivres, percussions)"], "seances": ["Les quatre paramètres du son : jeu d'écoute à l'aveugle (grave ou aigu, long ou court, fort ou doux). Lancement du chant, premier couplet.", "Le timbre : reconnaître les instruments de Pierre et le loup. Fiche des familles d'instruments. Chant : refrain et justesse.", "L'intensité : nuances et crescendo, chanter le refrain avec des nuances écrites au tableau. Écoute de L'Éléphant et Aquarium : comparer.", "L'orchestre : le Guide de Britten, chaque famille entre à son tour. Chant : mise en place complète, deux groupes.", "Évaluation : chant par petits groupes (justesse, nuances), puis écoute d'un extrait inconnu à décrire avec le vocabulaire de la séquence."], "evaluation": "Chant en petit groupe (C1). Écoute guidée d'un extrait inconnu avec le vocabulaire (C2)."}, {"titre": "La musique qui raconte", "periode": "P2", "semaines": "04/01 au 01/02", "question": "Comment la musique peut-elle raconter une histoire sans paroles ?", "competences": ["C1", "C2", "C3"], "chant": "La Mer (Charles Trenet), ou une chanson descriptive au choix", "oeuvres": ["Paul Dukas, L'Apprenti sorcier", "Modeste Moussorgski, Tableaux d'une exposition (Promenade, La Grande Porte de Kiev)", "Antonio Vivaldi, Les Quatre Saisons, L'Hiver (1er mouvement)"], "vocabulaire": ["musique descriptive", "thème", "orchestre symphonique", "tempo (lent, rapide, accelerando)", "mouvement"], "seances": ["Écoute de L'Apprenti sorcier sans titre : imaginer l'histoire, puis découvrir le récit. Lancement du chant.", "Le thème qui revient : repérer le thème du balai, le chanter, le reconnaître quand il change d'instrument.", "Moussorgski : une musique pour des tableaux. Promenade et Grande Porte de Kiev, tempo et caractère. Chant : couplets.", "Création : par groupes, sonoriser une courte histoire avec voix, corps et objets (cinq paramètres imposés).", "Évaluation : présentation des créations, puis écoute de L'Hiver de Vivaldi, relever ce qui décrit le froid."], "evaluation": "Création sonore de groupe (C3). Commentaire d'écoute de L'Hiver (C2). Chant (C1)."}, {"titre": "Les voix et le chœur", "periode": "P3", "semaines": "22/02 au 22/03", "question": "Que peut faire une voix, et que peuvent faire plusieurs voix ensemble ?", "competences": ["C1", "C2", "C4"], "chant": "Dona nobis pacem (canon à trois voix), ou Vois sur ton chemin (Bruno Coulais, Les Choristes)", "oeuvres": ["Wolfgang Amadeus Mozart, La Flûte enchantée, air de la Reine de la nuit", "Gabriel Fauré, Cantique de Jean Racine", "Bobby McFerrin, Don't Worry Be Happy (une seule voix, plusieurs couches)"], "vocabulaire": ["soprano, alto, ténor, basse", "soliste, chœur", "a cappella", "canon", "polyphonie, unisson"], "seances": ["Classer les voix : écoute de quatre voix solistes, du plus aigu au plus grave. Lancement du canon à l'unisson.", "La Reine de la nuit : la voix virtuose. Chant : canon à deux voix.", "Le chœur : Fauré, repérer quand toutes les voix chantent ensemble et quand une seule chante. Canon à trois voix.", "Une voix, plusieurs couches : Bobby McFerrin. Discussion : qu'est-ce qui fait une belle voix ? Chant : nuances et départs.", "Évaluation : canon par groupes de trois, puis question d'écoute sur un chœur inconnu (combien de voix, a cappella ou accompagné)."], "evaluation": "Canon en groupe (C1). Écoute d'un chœur inconnu (C2). Participation au débat (C4)."}, {"titre": "Rythme, pulsation et danse", "periode": "P4", "semaines": "19/04 au 17/05", "question": "Pourquoi certaines musiques donnent-elles envie de bouger ?", "competences": ["C1", "C2", "C3"], "chant": "Shosholoza (chant traditionnel d'Afrique du Sud), avec percussions corporelles", "oeuvres": ["Maurice Ravel, Boléro (début)", "Jean-Sébastien Bach, Suite pour orchestre n° 3, Gigue", "Stomp (extrait de spectacle de percussions sur objets)"], "vocabulaire": ["pulsation", "tempo", "rythme", "ostinato", "percussions corporelles"], "seances": ["Trouver la pulsation : marcher, frapper, compter sur différentes musiques. Lancement de Shosholoza.", "L'ostinato : le Boléro, repérer le rythme de la caisse claire qui ne change jamais. Le frapper toute la classe.", "La danse : la Gigue de Bach, tempo et carrure. Chant avec ostinato frappé par la moitié de la classe.", "Création : chaque groupe invente un ostinato de percussions corporelles et le superpose aux autres (inspiration Stomp).", "Évaluation : Shosholoza avec percussions, puis reconnaissance pulsation et ostinato sur trois extraits courts."], "evaluation": "Chant et percussions (C1). Création d'ostinato (C3). Test d'écoute court (C2)."}, {"titre": "La musique de film", "periode": "P5", "semaines": "24/05 au 14/06", "question": "Que change la musique à ce que l'on voit ?", "competences": ["C2", "C3", "C4"], "chant": "Vois sur ton chemin (si non chanté en P3), ou un thème de film au choix", "oeuvres": ["John Williams, Star Wars (thème principal), Les Dents de la mer (thème du requin)", "Joe Hisaishi, Mon voisin Totoro (thème principal)", "Une même scène projetée avec deux musiques différentes"], "vocabulaire": ["musique de film", "thème associé à un personnage", "bruitage", "ambiance", "synchronisation"], "seances": ["Une scène, deux musiques : ce qui change. Lancement du chant de fin d'année.", "Les Dents de la mer : deux notes suffisent pour faire peur (grave, répétition, accélération).", "Création sonore : par groupes, sonoriser une scène muette de 30 secondes (voix, objets, ou logiciel libre si la salle le permet).", "Évaluation : présentation des créations, chaque groupe explique ses choix avec le vocabulaire de l'année."], "evaluation": "Création sonore (C3). Explication orale des choix (C4)."}], "calendrier": [{"type": "accueil", "semaine": "02/11", "date": "2026-11-02"}, {"type": "seance", "seq": 1, "num": 1, "semaine": "09/11", "date": "2026-11-09"}, {"type": "seance", "seq": 1, "num": 2, "semaine": "16/11", "date": "2026-11-16"}, {"type": "seance", "seq": 1, "num": 3, "semaine": "23/11", "date": "2026-11-23"}, {"type": "seance", "seq": 1, "num": 4, "semaine": "30/11", "date": "2026-11-30"}, {"type": "seance", "seq": 1, "num": 5, "semaine": "07/12", "date": "2026-12-07"}, {"type": "tampon", "semaine": "14/12", "date": "2026-12-14"}, {"type": "seance", "seq": 2, "num": 1, "semaine": "04/01", "date": "2027-01-04"}, {"type": "seance", "seq": 2, "num": 2, "semaine": "11/01", "date": "2027-01-11"}, {"type": "seance", "seq": 2, "num": 3, "semaine": "18/01", "date": "2027-01-18"}, {"type": "seance", "seq": 2, "num": 4, "semaine": "25/01", "date": "2027-01-25"}, {"type": "seance", "seq": 2, "num": 5, "semaine": "01/02", "date": "2027-02-01"}, {"type": "seance", "seq": 3, "num": 1, "semaine": "22/02", "date": "2027-02-22"}, {"type": "seance", "seq": 3, "num": 2, "semaine": "01/03", "date": "2027-03-01"}, {"type": "seance", "seq": 3, "num": 3, "semaine": "08/03", "date": "2027-03-08"}, {"type": "seance", "seq": 3, "num": 4, "semaine": "15/03", "date": "2027-03-15"}, {"type": "seance", "seq": 3, "num": 5, "semaine": "22/03", "date": "2027-03-22"}, {"type": "tampon", "semaine": "29/03", "date": "2027-03-29"}, {"type": "seance", "seq": 4, "num": 1, "semaine": "19/04", "date": "2027-04-19"}, {"type": "seance", "seq": 4, "num": 2, "semaine": "26/04", "date": "2027-04-26"}, {"type": "seance", "seq": 4, "num": 3, "semaine": "03/05", "date": "2027-05-03"}, {"type": "seance", "seq": 4, "num": 4, "semaine": "10/05", "date": "2027-05-10"}, {"type": "seance", "seq": 4, "num": 5, "semaine": "17/05", "date": "2027-05-17"}, {"type": "seance", "seq": 5, "num": 1, "semaine": "24/05", "date": "2027-05-24"}, {"type": "seance", "seq": 5, "num": 2, "semaine": "31/05", "date": "2027-05-31"}, {"type": "seance", "seq": 5, "num": 3, "semaine": "07/06", "date": "2027-06-07"}, {"type": "seance", "seq": 5, "num": 4, "semaine": "14/06", "date": "2027-06-14"}, {"type": "tampon", "semaine": "21/06", "date": "2027-06-21"}, {"type": "tampon", "semaine": "28/06", "date": "2027-06-28"}], "contenus": [{"fiches": ["parametres", "nuances", "instruments"], "objectifs": ["Distinguer les quatre paramètres du son : hauteur, durée, intensité, timbre.", "Reconnaître les quatre familles d'instruments de l'orchestre.", "Chanter juste à l'unisson en respectant des nuances."], "seances": [{"objectif": "Découvrir les quatre paramètres du son par le jeu.", "etapes": [[5, "Échauffement corporel et vocal : respiration, sirènes du grave à l'aigu."], [15, "Jeu à l'aveugle : le professeur joue des sons, les élèves lèvent la main (aigu), la baissent (grave), tendent les bras (long), claquent (court)."], [20, "Chant : apprentissage du premier couplet par imitation, phrase par phrase."], [10, "Trace écrite : les quatre paramètres et leur vocabulaire."]]}, {"objectif": "Identifier un instrument par son timbre.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Pierre et le loup : chaque personnage, son instrument. Les élèves associent images et extraits."], [20, "Chant : refrain, travail de la justesse sur les notes tenues."], [10, "Fiche des familles d'instruments à compléter."]]}, {"objectif": "Comprendre et appliquer les nuances.", "etapes": [[5, "Échauffement corporel et vocal : chanter une même note de pianissimo à fortissimo."], [15, "L'Éléphant et Aquarium de Saint-Saëns : comparer hauteur, intensité et timbre dans un tableau."], [20, "Chant : refrain avec les nuances écrites au tableau (p, f, crescendo)."], [10, "Trace écrite : l'échelle des nuances."]]}, {"objectif": "Situer les familles dans l'orchestre symphonique.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Le Guide de l'orchestre de Britten : lever la carte de la famille qui joue."], [20, "Chant : mise en place complète, deux groupes qui se répondent."], [10, "Plan de l'orchestre à légender."]]}, {"objectif": "Évaluation de fin de séquence.", "etapes": [[5, "Échauffement corporel et vocal."], [25, "Passage du chant par groupes de quatre ou cinq."], [20, "Écoute d'un extrait inconnu, questions écrites : hauteur, intensité, timbre, famille."]]}], "trace": ["Un son a quatre paramètres.", "La hauteur : un son est grave ou aigu.", "La durée : un son est long ou court.", "L'intensité : un son est faible (piano) ou fort (forte). Les nuances indiquent l'intensité.", "Le timbre : c'est la couleur du son, ce qui permet de reconnaître un instrument ou une voix.", "L'orchestre symphonique réunit quatre familles : les cordes, les bois, les cuivres et les percussions."], "devoirs": "Apprendre les quatre paramètres et les quatre familles. Réécouter Pierre et le loup.", "eval": {"consigne": "Chanter en petit groupe le refrain avec les nuances. Puis, à l'écoute d'un extrait inconnu, répondre à quatre questions avec le vocabulaire de la séquence.", "criteres": [["Je chante juste et je connais les paroles", "C1"], ["Je respecte les nuances demandées", "C1"], ["Je nomme la hauteur, l'intensité et le timbre d'un son", "C2"], ["Je reconnais la famille d'un instrument", "C2"]], "attendus": ["Utiliser les mots grave, aigu, long, court, piano, forte, timbre.", "Reconnaître au moins trois familles sur quatre.", "Chanter le refrain en entier, avec au moins une nuance audible."]}}, {"fiches": ["tempo", "ecoute"], "objectifs": ["Comprendre comment la musique peut décrire sans paroles.", "Repérer un thème et ses retours.", "Utiliser les paramètres du son pour créer une illustration sonore."], "seances": [{"objectif": "Imaginer une histoire à partir de la musique seule.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "L'Apprenti sorcier sans titre : chacun note ce qu'il imagine, mise en commun, puis lecture du poème de Goethe."], [15, "Chant : découverte de La Mer, premier couplet."], [10, "Trace écrite : définition de la musique descriptive."]]}, {"objectif": "Reconnaître un thème quand il change d'instrument.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Chanter le thème du balai, puis lever la main à chacun de ses retours."], [20, "Chant : couplet 2 et refrain."], [10, "Trace écrite : le thème et le tempo."]]}, {"objectif": "Relier tempo et caractère.", "etapes": [[5, "Échauffement corporel et vocal : marcher au tempo de différents extraits."], [15, "Tableaux d'une exposition : Promenade et Grande Porte de Kiev. Comparer tempo, nuances, instruments."], [20, "Chant : mise en place complète."], [10, "Constitution des groupes de création et choix de l'histoire."]]}, {"objectif": "Créer une illustration sonore de groupe.", "etapes": [[5, "Échauffement corporel et vocal."], [35, "Création : sonoriser une histoire de cinq actions avec voix, corps et objets. Chaque groupe note ses choix sur une fiche."], [10, "Répétition rapide de chaque groupe."]]}, {"objectif": "Évaluation de fin de séquence.", "etapes": [[25, "Présentation des créations, la classe nomme les paramètres utilisés."], [20, "Écoute de L'Hiver de Vivaldi : relever trois éléments musicaux qui évoquent le froid."], [5, "Bilan de séquence."]]}], "trace": ["Une musique descriptive raconte une histoire ou décrit une image sans paroles.", "Un thème est une mélodie que l'on reconnaît et qui revient.", "Le tempo est la vitesse de la musique : lent, modéré, rapide. Accelerando : on accélère.", "L'orchestre symphonique utilise les timbres, les nuances et le tempo pour raconter."], "devoirs": "Réécouter L'Apprenti sorcier et compter les retours du thème du balai.", "eval": {"consigne": "Présenter la création de groupe et expliquer deux choix. Puis commenter L'Hiver de Vivaldi.", "criteres": [["Notre création raconte l'histoire de façon compréhensible", "C3"], ["J'utilise au moins deux paramètres du son volontairement", "C3"], ["Je relève trois éléments musicaux qui décrivent", "C2"], ["Je chante La Mer avec le groupe", "C1"]], "attendus": ["Une création de 30 secondes à une minute, avec un début et une fin.", "Citer le tempo, les nuances ou le timbre pour justifier une impression.", "Reconnaître un thème qui revient."]}}, {"fiches": ["voix", "plans"], "objectifs": ["Classer les voix du plus aigu au plus grave.", "Distinguer soliste et chœur, unisson et polyphonie.", "Chanter un canon à trois voix."], "seances": [{"objectif": "Classer les voix.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Écoute de quatre voix solistes : les ranger de la plus aiguë à la plus grave."], [20, "Canon : apprentissage à l'unisson."], [10, "Trace écrite : les quatre voix."]]}, {"objectif": "Découvrir la voix virtuose.", "etapes": [[5, "Échauffement corporel et vocal : vocalises rapides."], [15, "La Reine de la nuit : les notes très aiguës, l'expression de la colère."], [20, "Canon à deux voix."], [10, "Trace écrite : soprano colorature, l'air d'opéra."]]}, {"objectif": "Entendre plusieurs voix ensemble.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Cantique de Jean Racine : lever la main quand toutes les voix chantent ensemble."], [20, "Canon à trois voix."], [10, "Trace écrite : unisson, polyphonie, a cappella."]]}, {"objectif": "Argumenter sur la voix.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Bobby McFerrin : une voix, plusieurs couches. Débat : qu'est-ce qu'une belle voix ?"], [25, "Canon : départs et nuances, répétition par groupes de trois."], [5, "Annonce de l'évaluation."]]}, {"objectif": "Évaluation de fin de séquence.", "etapes": [[30, "Passage du canon par groupes de trois."], [20, "Écoute d'un chœur inconnu : nombre de voix, a cappella ou accompagné, unisson ou polyphonie."]]}], "trace": ["Les voix se classent de la plus aiguë à la plus grave : soprano, alto (voix de femmes ou d'enfants), ténor, basse (voix d'hommes).", "Un soliste chante seul. Un chœur chante à plusieurs.", "Unisson : tout le monde chante la même mélodie. Polyphonie : plusieurs mélodies en même temps.", "A cappella : sans accompagnement instrumental.", "Un canon : la même mélodie, chantée avec des départs décalés."], "devoirs": "Apprendre les quatre voix et les mots unisson, polyphonie, a cappella.", "eval": {"consigne": "Chanter le canon à trois voix en tenant sa partie. Répondre à trois questions sur un chœur inconnu.", "criteres": [["Je tiens ma voix dans le canon sans me laisser entraîner", "C1"], ["Je pars au bon moment", "C1"], ["Je reconnais unisson ou polyphonie", "C2"], ["Je participe au débat en donnant une raison", "C4"]], "attendus": ["Tenir sa partie au moins une fois en entier.", "Classer correctement soprano et basse, et situer alto et ténor.", "Dire si un chœur chante a cappella."]}}, {"fiches": ["figures", "tempo"], "objectifs": ["Trouver et garder la pulsation.", "Repérer et jouer un ostinato.", "Lire et frapper des rythmes simples (noire, croches, blanche, soupir)."], "seances": [{"objectif": "Ressentir la pulsation.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Marcher sur la pulsation de trois musiques au tempo différent."], [20, "Shosholoza : apprentissage de l'appel et de la réponse."], [10, "Trace écrite : pulsation et tempo."]]}, {"objectif": "Repérer un ostinato.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Boléro : le rythme de la caisse claire, le frapper avec la classe."], [20, "Écriture du rythme de l'ostinato avec noires et croches."], [10, "Trace écrite : l'ostinato, les figures de notes."]]}, {"objectif": "Relier danse et carrure.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Gigue de Bach : compter les temps, repérer les phrases."], [20, "Shosholoza avec un ostinato frappé par la moitié de la classe."], [10, "Lecture de rythmes au tableau."]]}, {"objectif": "Créer un ostinato de percussions corporelles.", "etapes": [[5, "Échauffement corporel et vocal."], [10, "Extrait de Stomp : quels objets, quels rythmes ?"], [30, "Création par groupes : un ostinato de quatre temps, écrit puis superposé aux autres."], [5, "Répétition générale."]]}, {"objectif": "Évaluation de fin de séquence.", "etapes": [[25, "Shosholoza avec percussions, par groupes."], [20, "Test d'écoute : pulsation, ostinato, tempo sur trois extraits courts."], [5, "Bilan."]]}], "trace": ["La pulsation est le battement régulier de la musique, celui que l'on frappe du pied.", "Le tempo est la vitesse de la pulsation.", "Le rythme est l'enchaînement de sons longs et courts.", "Un ostinato est un motif court répété sans arrêt.", "Figures : la blanche dure deux temps, la noire un temps, deux croches un temps. Le soupir est un silence d'un temps."], "devoirs": "Savoir frapper l'ostinato du Boléro et reconnaître noire, croches, blanche et soupir.", "eval": {"consigne": "Interpréter Shosholoza avec l'ostinato de son groupe. Répondre au test d'écoute.", "criteres": [["Je garde la pulsation sans accélérer", "C1"], ["Je joue mon ostinato en même temps que le chant", "C1"], ["Notre ostinato est régulier et écrit correctement", "C3"], ["Je repère un ostinato à l'écoute", "C2"]], "attendus": ["Tenir la pulsation sur seize temps au moins.", "Écrire un rythme de quatre temps avec noires, croches et soupirs.", "Distinguer pulsation et rythme."]}}, {"fiches": ["plans", "ecoute"], "objectifs": ["Comprendre le rôle de la musique au cinéma.", "Associer un thème à un personnage.", "Réaliser et expliquer une création sonore."], "seances": [{"objectif": "Mesurer l'effet de la musique sur l'image.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Une même scène avec deux musiques : relever ce qui change."], [20, "Chant de fin d'année : découverte."], [10, "Trace écrite : rôle de la musique de film."]]}, {"objectif": "Analyser un thème de film.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Les Dents de la mer : deux notes graves, répétées, de plus en plus rapides et fortes."], [20, "Chant : mise en place."], [10, "Trace écrite : thème et personnage."]]}, {"objectif": "Sonoriser une scène muette.", "etapes": [[5, "Consignes et répartition."], [40, "Création par groupes sur une scène de 30 secondes."], [5, "Répétition."]]}, {"objectif": "Évaluation de fin de séquence.", "etapes": [[35, "Présentation des créations, chaque groupe explique deux choix."], [15, "Bilan de l'année et chant final."]]}], "trace": ["Au cinéma, la musique crée une ambiance, annonce ce qui va arriver et fait ressentir des émotions.", "Un thème peut être associé à un personnage : on le reconnaît dès qu'il revient.", "La musique joue avec tous les paramètres : hauteur, durée, intensité, timbre, tempo."], "devoirs": "Choisir une scène de film et dire en trois lignes ce que fait la musique.", "eval": {"consigne": "Présenter la sonorisation de groupe et expliquer deux choix avec le vocabulaire de l'année.", "criteres": [["Notre musique correspond à l'action et à l'ambiance", "C3"], ["Le son est synchronisé avec l'image", "C3"], ["J'explique deux choix avec les bons mots", "C4"], ["J'écoute et je respecte le travail des autres groupes", "C4"]], "attendus": ["Une création synchronisée sur au moins deux moments de la scène.", "Utiliser au moins trois mots de vocabulaire de l'année."]}}]}, "5e": {"cycle": "cycle4", "intro": "En cinquième, on découvre comment la musique s'organise : la répétition, la variation, l'espace, et des musiques d'autres époques et d'autres pays.", "sequences": [{"titre": "Répéter et varier", "periode": "P1", "semaines": "09/11 au 07/12", "question": "Comment un compositeur fait-il durer une idée sans lasser ?", "competences": ["C1", "C2", "C4"], "chant": "Viva la musica (canon de Michael Praetorius), ou Hallelujah (Leonard Cohen)", "oeuvres": ["Wolfgang Amadeus Mozart, Variations sur Ah vous dirai-je maman", "Johann Pachelbel, Canon en ré", "Steve Reich, Clapping Music"], "vocabulaire": ["thème", "variation", "ostinato", "basse obstinée", "canon", "répétition"], "seances": ["Reconnaître un thème caché : les Variations de Mozart, le thème puis trois variations. Lancement du chant.", "Qu'est-ce qui change d'une variation à l'autre ? Tableau : rythme, tempo, mode, ornements.", "Pachelbel : la basse qui tourne. La chanter, la repérer dans des chansons actuelles construites sur la même suite d'accords.", "Clapping Music : jouer en binôme le motif de Reich et son décalage. Chant : mise en place.", "Évaluation : chant, puis écoute d'une variation inconnue, dire ce qui a été transformé."], "evaluation": "Chant (C1). Écoute comparée thème et variation (C2)."}, {"titre": "Musique et espace", "periode": "P2", "semaines": "04/01 au 01/02", "question": "Comment la place des musiciens et des sons change-t-elle l'écoute ?", "competences": ["C1", "C2", "C3"], "chant": "Un canon à placer dans l'espace de la salle (Dona nobis pacem ou Viva la musica)", "oeuvres": ["Giovanni Gabrieli, Sonata pian' e forte (chœurs d'instruments qui se répondent)", "Hector Berlioz, Requiem, Tuba mirum (orchestres de cuivres dispersés)", "Un extrait de musique électronique spatialisée ou une écoute binaurale"], "vocabulaire": ["écho", "spatialisation", "question-réponse", "stéréo", "piano, forte"], "seances": ["L'écho et la question-réponse : Gabrieli. Lancement du canon, chanté de deux coins de la salle.", "Berlioz : une musique pensée pour un lieu immense. Ce que l'on entend, et d'où.", "La stéréo et le casque : écoute binaurale, repérer la position des sons. Chant en trois groupes répartis.", "Création : par groupes, une pièce vocale ou corporelle qui circule dans la salle selon un plan dessiné.", "Évaluation : présentation des créations, puis question écrite sur l'effet de l'espace dans un extrait inconnu."], "evaluation": "Création spatialisée (C3). Écoute et commentaire (C2). Chant (C1)."}, {"titre": "Le Moyen Âge et la Renaissance", "periode": "P3", "semaines": "22/02 au 22/03", "question": "Que chantait-on il y a sept cents ans, et pour qui ?", "competences": ["C1", "C2", "C4"], "chant": "Douce dame jolie (Guillaume de Machaut)", "oeuvres": ["Chant grégorien, Kyrie (extrait)", "Guillaume de Machaut, Douce dame jolie", "Clément Janequin, La Guerre (La Bataille de Marignan)"], "vocabulaire": ["chant grégorien", "monodie", "polyphonie", "troubadour", "musique sacrée, musique profane"], "seances": ["Le chant grégorien : une seule ligne, en latin, sans mesure. Lancement de Douce dame jolie.", "Musique sacrée, musique profane : comparer un Kyrie et une chanson de Machaut.", "Janequin : la bataille racontée par des voix seules, onomatopées et polyphonie. Lien avec le cours d'histoire.", "Chant : Douce dame jolie, mise en place avec bourdon. Débat : peut-on encore aimer une musique de 1350 ?", "Évaluation : chant, puis écoute : sacrée ou profane, monodie ou polyphonie, justifier."], "evaluation": "Chant (C1). Écoute justifiée (C2). Débat (C4)."}, {"titre": "Musiques du monde, musique et voyage", "periode": "P4", "semaines": "19/04 au 17/05", "question": "Comment une musique révèle-t-elle d'où elle vient ?", "competences": ["C1", "C2", "C3"], "chant": "Ederlezi (chant traditionnel des Balkans), ou un chant traditionnel au choix", "oeuvres": ["Gamelan de Java ou de Bali (extrait)", "Claude Debussy, Estampes, Pagodes (influence du gamelan)", "Flamenco (extrait de palmas et de guitare)"], "vocabulaire": ["gamme pentatonique", "musique traditionnelle", "transmission orale", "instrument traditionnel", "métissage"], "seances": ["Un tour du monde en cinq extraits : situer sur une carte et justifier. Lancement du chant.", "Le gamelan, puis Debussy : ce que Debussy a emprunté après l'Exposition universelle de 1889.", "La gamme pentatonique : la jouer sur les touches noires, improviser à plusieurs.", "Le flamenco : palmas et compas. Création : un accompagnement rythmique pour le chant.", "Évaluation : chant accompagné, puis écoute : retrouver l'origine d'un extrait et justifier par deux indices."], "evaluation": "Chant accompagné (C1). Écoute justifiée (C2). Improvisation pentatonique (C3)."}, {"titre": "Le soliste et le groupe : le concerto", "periode": "P5", "semaines": "24/05 au 14/06", "question": "Comment un instrument seul dialogue-t-il avec tout un orchestre ?", "competences": ["C1", "C2", "C4"], "chant": "Les Champs-Élysées (Joe Dassin) : couplets solistes, refrain en tutti", "oeuvres": ["Antonio Vivaldi, Les Quatre Saisons, Le Printemps (1er mouvement)", "Wolfgang Amadeus Mozart, Concerto pour clarinette, 2e mouvement", "Joaquín Rodrigo, Concierto de Aranjuez, 2e mouvement"], "vocabulaire": ["concerto", "soliste", "tutti", "cadence", "mouvement"], "seances": ["Soliste ou tutti ? Repérer l'alternance dans Vivaldi. Lancement du chant, solistes volontaires.", "Mozart et Rodrigo : un instrument qui chante. Comparer le caractère des deux mouvements lents.", "La cadence : le moment où le soliste joue seul. Chant : mise en place couplets et refrains.", "Évaluation et concert de classe : le chant avec solistes, puis écoute : repérer soliste, tutti et cadence."], "evaluation": "Interprétation en soliste ou en tutti (C1). Écoute (C2)."}], "calendrier": [{"type": "accueil", "semaine": "02/11", "date": "2026-11-02"}, {"type": "seance", "seq": 1, "num": 1, "semaine": "09/11", "date": "2026-11-09"}, {"type": "seance", "seq": 1, "num": 2, "semaine": "16/11", "date": "2026-11-16"}, {"type": "seance", "seq": 1, "num": 3, "semaine": "23/11", "date": "2026-11-23"}, {"type": "seance", "seq": 1, "num": 4, "semaine": "30/11", "date": "2026-11-30"}, {"type": "seance", "seq": 1, "num": 5, "semaine": "07/12", "date": "2026-12-07"}, {"type": "tampon", "semaine": "14/12", "date": "2026-12-14"}, {"type": "seance", "seq": 2, "num": 1, "semaine": "04/01", "date": "2027-01-04"}, {"type": "seance", "seq": 2, "num": 2, "semaine": "11/01", "date": "2027-01-11"}, {"type": "seance", "seq": 2, "num": 3, "semaine": "18/01", "date": "2027-01-18"}, {"type": "seance", "seq": 2, "num": 4, "semaine": "25/01", "date": "2027-01-25"}, {"type": "seance", "seq": 2, "num": 5, "semaine": "01/02", "date": "2027-02-01"}, {"type": "seance", "seq": 3, "num": 1, "semaine": "22/02", "date": "2027-02-22"}, {"type": "seance", "seq": 3, "num": 2, "semaine": "01/03", "date": "2027-03-01"}, {"type": "seance", "seq": 3, "num": 3, "semaine": "08/03", "date": "2027-03-08"}, {"type": "seance", "seq": 3, "num": 4, "semaine": "15/03", "date": "2027-03-15"}, {"type": "seance", "seq": 3, "num": 5, "semaine": "22/03", "date": "2027-03-22"}, {"type": "tampon", "semaine": "29/03", "date": "2027-03-29"}, {"type": "seance", "seq": 4, "num": 1, "semaine": "19/04", "date": "2027-04-19"}, {"type": "seance", "seq": 4, "num": 2, "semaine": "26/04", "date": "2027-04-26"}, {"type": "seance", "seq": 4, "num": 3, "semaine": "03/05", "date": "2027-05-03"}, {"type": "seance", "seq": 4, "num": 4, "semaine": "10/05", "date": "2027-05-10"}, {"type": "seance", "seq": 4, "num": 5, "semaine": "17/05", "date": "2027-05-17"}, {"type": "seance", "seq": 5, "num": 1, "semaine": "24/05", "date": "2027-05-24"}, {"type": "seance", "seq": 5, "num": 2, "semaine": "31/05", "date": "2027-05-31"}, {"type": "seance", "seq": 5, "num": 3, "semaine": "07/06", "date": "2027-06-07"}, {"type": "seance", "seq": 5, "num": 4, "semaine": "14/06", "date": "2027-06-14"}, {"type": "tampon", "semaine": "21/06", "date": "2027-06-21"}, {"type": "tampon", "semaine": "28/06", "date": "2027-06-28"}], "contenus": [{"fiches": ["formes", "figures"], "objectifs": ["Reconnaître un thème et ses variations.", "Identifier ce qui change d'une variation à l'autre.", "Comprendre l'ostinato, la basse obstinée et le canon."], "seances": [{"objectif": "Reconnaître un thème caché.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Mozart : le thème, puis trois variations, lever la main quand on entend le thème."], [20, "Chant : apprentissage."], [10, "Trace écrite : thème et variation."]]}, {"objectif": "Analyser les transformations.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Tableau des variations : rythme, tempo, mode, ornements, nuances."], [15, "Chant : suite."], [10, "Trace écrite : les procédés de variation."]]}, {"objectif": "Découvrir la basse obstinée.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Canon de Pachelbel : chanter la basse, puis la repérer dans deux chansons actuelles."], [20, "Chant : mise en place."], [10, "Trace écrite : basse obstinée, canon."]]}, {"objectif": "Jouer un processus de décalage.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Clapping Music en binômes : motif fixe et motif décalé."], [20, "Chant : nuances et interprétation."], [5, "Annonce de l'évaluation."]]}, {"objectif": "Évaluation de fin de séquence.", "etapes": [[25, "Passage du chant par groupes."], [25, "Écoute d'une variation inconnue : dire ce qui a changé par rapport au thème."]]}], "trace": ["Un thème est une mélodie de départ. Une variation le transforme tout en le gardant reconnaissable.", "On peut varier le rythme, le tempo, le mode (majeur ou mineur), les nuances, l'accompagnement ou ajouter des ornements.", "Un ostinato est un motif répété. Une basse obstinée est un ostinato joué à la basse.", "Un canon superpose une même mélodie avec des départs décalés."], "devoirs": "Revoir les procédés de variation et réécouter les Variations de Mozart.", "eval": {"consigne": "Chanter avec le groupe. Écouter un thème et une variation inconnus, nommer deux transformations.", "criteres": [["Je chante juste et en place avec le groupe", "C1"], ["Je repère le thème dans la variation", "C2"], ["Je nomme deux procédés de variation", "C2"], ["J'argumente mon écoute avec le vocabulaire", "C4"]], "attendus": ["Nommer deux procédés parmi rythme, tempo, mode, nuances, ornements.", "Distinguer ostinato et variation."]}}, {"fiches": ["plans", "nuances"], "objectifs": ["Comprendre l'effet de la place des sons dans l'espace.", "Identifier écho et question-réponse.", "Créer une pièce spatialisée."], "seances": [{"objectif": "Découvrir écho et question-réponse.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Gabrieli : deux groupes d'instruments qui se répondent, piano et forte."], [20, "Canon chanté depuis deux coins de la salle."], [10, "Trace écrite."]]}, {"objectif": "Entendre une musique pensée pour un lieu.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Berlioz, Tuba mirum : d'où viennent les cuivres ? Lecture d'un plan de disposition."], [15, "Canon en trois groupes."], [10, "Trace écrite : spatialisation."]]}, {"objectif": "Écouter au casque.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Écoute stéréo ou binaurale : dessiner la position des sons."], [20, "Canon réparti dans la salle."], [10, "Préparation des plans de création."]]}, {"objectif": "Créer une pièce spatialisée.", "etapes": [[5, "Consignes."], [40, "Création par groupes selon un plan dessiné."], [5, "Répétition."]]}, {"objectif": "Évaluation de fin de séquence.", "etapes": [[30, "Présentation des créations dans l'espace."], [20, "Question écrite sur un extrait inconnu."]]}], "trace": ["La spatialisation consiste à placer les sons dans l'espace.", "Écho : un motif repris plus doucement, comme une réponse lointaine.", "Question-réponse : deux groupes qui alternent.", "La stéréo répartit les sons entre la gauche et la droite."], "devoirs": "Écouter une chanson au casque et noter la position de trois instruments.", "eval": {"consigne": "Interpréter la création spatialisée. Commenter l'effet de l'espace dans un extrait.", "criteres": [["Notre plan de spatialisation est respecté", "C3"], ["J'utilise écho ou question-réponse", "C3"], ["Je décris l'effet de l'espace à l'écoute", "C2"], ["Je chante ma partie du canon", "C1"]], "attendus": ["Une création qui se déplace dans au moins deux zones de la salle.", "Employer les mots écho, question-réponse, stéréo."]}}, {"fiches": ["plans", "voix"], "objectifs": ["Situer la musique médiévale et renaissante.", "Distinguer musique sacrée et profane, monodie et polyphonie.", "Chanter une chanson de Machaut."], "seances": [{"objectif": "Découvrir le chant grégorien.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Kyrie grégorien : une seule ligne, en latin, sans pulsation marquée."], [20, "Douce dame jolie : apprentissage."], [10, "Trace écrite : monodie, musique sacrée."]]}, {"objectif": "Comparer sacré et profane.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Kyrie et Machaut : tableau comparatif (langue, lieu, sujet, instruments)."], [20, "Chant avec bourdon."], [10, "Trace écrite."]]}, {"objectif": "Découvrir une polyphonie descriptive.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Janequin, La Guerre : onomatopées, polyphonie, récit d'une bataille de 1515."], [15, "Chant."], [10, "Trace écrite : polyphonie."]]}, {"objectif": "Débattre et interpréter.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Débat : peut-on encore aimer une musique de 1350 ?"], [25, "Chant : mise en place finale."], [5, "Annonce de l'évaluation."]]}, {"objectif": "Évaluation de fin de séquence.", "etapes": [[25, "Chant par groupes."], [25, "Écoute : sacré ou profane, monodie ou polyphonie, en justifiant."]]}], "trace": ["Au Moyen Âge, le chant grégorien est une musique sacrée, en latin, à une seule voix : c'est une monodie.", "Les troubadours et Guillaume de Machaut composent aussi des chansons profanes, sur l'amour.", "À la Renaissance, la polyphonie se développe : plusieurs voix chantent des mélodies différentes.", "Un bourdon est une note tenue sous la mélodie."], "devoirs": "Savoir définir monodie, polyphonie, sacré et profane.", "eval": {"consigne": "Chanter Douce dame jolie. Classer un extrait inconnu et justifier.", "criteres": [["Je chante la mélodie avec le bourdon", "C1"], ["Je distingue monodie et polyphonie", "C2"], ["Je justifie sacré ou profane par un indice", "C2"], ["Je donne mon avis argumenté dans le débat", "C4"]], "attendus": ["Deux indices pour justifier (langue, nombre de voix, sujet, instruments).", "Situer Moyen Âge et Renaissance dans le temps."]}}, {"fiches": ["gammes", "instruments"], "objectifs": ["Situer des musiques traditionnelles.", "Découvrir la gamme pentatonique.", "Comprendre l'influence d'une culture sur une autre."], "seances": [{"objectif": "Situer des musiques sur une carte.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Cinq extraits, cinq indices à relever, placer sur une carte."], [15, "Chant : apprentissage."], [10, "Trace écrite."]]}, {"objectif": "Comprendre un emprunt.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Gamelan, puis Pagodes de Debussy : ce qu'il a emprunté après 1889."], [15, "Chant."], [10, "Trace écrite : métissage."]]}, {"objectif": "Jouer la gamme pentatonique.", "etapes": [[5, "Échauffement corporel et vocal."], [25, "Gamme sur les touches noires, improvisation à plusieurs."], [15, "Chant."], [5, "Trace écrite."]]}, {"objectif": "Créer un accompagnement rythmique.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Flamenco : palmas, guitare, chant."], [25, "Création d'un accompagnement pour le chant."], [5, "Répétition."]]}, {"objectif": "Évaluation de fin de séquence.", "etapes": [[25, "Chant accompagné par groupes."], [25, "Écoute : origine d'un extrait avec deux indices."]]}], "trace": ["Une musique traditionnelle se transmet souvent oralement, de génération en génération.", "Les instruments, les gammes et les rythmes donnent des indices sur l'origine d'une musique.", "La gamme pentatonique a cinq notes. On la trouve en Asie, en Afrique, en Europe.", "Le métissage : une musique en influence une autre, comme le gamelan a influencé Debussy."], "devoirs": "Retrouver une musique d'un autre pays et noter deux indices.", "eval": {"consigne": "Chanter avec l'accompagnement du groupe. Retrouver l'origine d'un extrait avec deux indices.", "criteres": [["Je chante en place avec l'accompagnement", "C1"], ["J'improvise sur la gamme pentatonique", "C3"], ["Je donne deux indices d'origine", "C2"], ["Je situe l'extrait sur la carte", "C2"]], "attendus": ["Deux indices parmi instruments, langue, gamme, rythme.", "Définir pentatonique et métissage."]}}, {"fiches": ["instruments", "formes"], "objectifs": ["Comprendre le dialogue soliste et orchestre.", "Repérer tutti, solo et cadence.", "Interpréter en soliste ou en groupe."], "seances": [{"objectif": "Repérer soliste et tutti.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Le Printemps de Vivaldi : lever une main pour le soliste, deux pour le tutti."], [20, "Chant, solistes volontaires."], [10, "Trace écrite."]]}, {"objectif": "Comparer deux mouvements lents.", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Mozart et Rodrigo : instrument soliste, caractère, tempo."], [15, "Chant."], [10, "Trace écrite."]]}, {"objectif": "Découvrir la cadence.", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Écoute d'une cadence : le soliste seul montre sa virtuosité."], [25, "Chant : couplets solistes, refrains en tutti."], [5, "Annonce."]]}, {"objectif": "Évaluation et concert de classe.", "etapes": [[30, "Concert de classe."], [20, "Écoute : soliste, tutti, cadence."]]}], "trace": ["Un concerto est une œuvre pour un instrument soliste et un orchestre.", "Tutti : tout l'orchestre joue. Solo : le soliste joue seul ou presque.", "La cadence est le moment où le soliste joue seul pour montrer sa virtuosité.", "Un concerto comporte souvent trois mouvements : rapide, lent, rapide."], "devoirs": "Réécouter le Printemps et compter les alternances tutti et solo.", "eval": {"consigne": "Interpréter le chant (en soliste ou en tutti). Écouter un extrait de concerto et repérer soliste, tutti et cadence.", "criteres": [["Je chante ma partie en soliste ou en tutti", "C1"], ["Je repère l'alternance soliste et tutti", "C2"], ["Je reconnais l'instrument soliste", "C2"]], "attendus": ["Définir concerto, tutti, cadence.", "Reconnaître le violon, la clarinette ou la guitare comme soliste."]}}]}, "4e": {"cycle": "cycle4", "intro": "En quatrième, on étudie la musique dans la société : au service du pouvoir, de l'engagement, de la scène, et des nouvelles technologies.", "sequences": [{"titre": "Musique et pouvoir", "periode": "P1", "semaines": "09/11 au 07/12", "question": "Comment la musique sert-elle à montrer la puissance ?", "competences": ["C1", "C2", "C4"], "chant": "La Marseillaise (premier couplet et refrain), étudiée comme un hymne", "oeuvres": ["Jean-Baptiste Lully, Marche pour la cérémonie des Turcs", "Georg Friedrich Haendel, Zadok the Priest", "Georg Friedrich Haendel, Water Music, Hornpipe"], "vocabulaire": ["musique de cour", "hymne", "fanfare", "cuivres et timbales", "commande"], "seances": ["Qu'est-ce qui sonne solennel ? Trois extraits, relever les indices (instruments, tempo, nuances). Lancement du chant.", "Lully à Versailles : la musique au service de Louis XIV.", "Haendel et le couronnement : Zadok the Priest, la longue attente avant l'entrée du chœur.", "L'hymne national : histoire de La Marseillaise, ses usages, ses reprises. Débat.", "Évaluation : chant, puis commentaire écrit court d'un extrait solennel inconnu."], "evaluation": "Chant (C1). Commentaire écrit (C2). Débat argumenté (C4)."}, {"titre": "La chanson engagée", "periode": "P2", "semaines": "04/01 au 01/02", "question": "Une chanson peut-elle changer quelque chose ?", "competences": ["C1", "C2", "C4"], "chant": "Le Déserteur (Boris Vian)", "oeuvres": ["Boris Vian, Le Déserteur", "Nina Simone, Strange Fruit (version de Billie Holiday en comparaison)", "Bob Dylan, Blowin' in the Wind"], "vocabulaire": ["chanson à texte", "couplet, refrain", "engagement", "censure", "reprise"], "seances": ["Le Déserteur : le texte d'abord, puis la musique, puis l'histoire de sa censure. Lancement du chant.", "Quand la musique sert le texte : simplicité de la mélodie, place de la voix.", "Strange Fruit : écoute guidée et contexte. Comment la musique porte la gravité du sujet.", "Exposé en binômes : une chanson
