<style>
/* Carnet de cours aux couleurs du Sacré-Coeur : bleu nuit et or, portées en séparateur, une colonne, onglets en bas. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --ink: #1b2836;
  --muted: #5d6978;
  --line: #d7dde6;
  --navy: #22364d;
  --navy-soft: #e5ebf3;
  --gold: #a9802f;
  --gold-soft: #f6efe1;
  --gold-text: #835e1c;
  --on-navy: #ffffff;
  --f-display: "Cormorant Garamond", Garamond, "Times New Roman", serif;
  --f-body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1621; --surface: #172131; --ink: #e8edf4; --muted: #9eabbb; --line: #2a3749;
  --navy: #a9c1de; --navy-soft: #1d2c40; --gold: #d8b46c; --gold-text: #d8b46c; --gold-soft: #2d2618; --on-navy: #0f1621; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1621; --surface: #172131; --ink: #e8edf4; --muted: #9eabbb; --line: #2a3749;
  --navy: #a9c1de; --navy-soft: #1d2c40; --gold: #d8b46c; --gold-text: #d8b46c; --gold-soft: #2d2618; --on-navy: #0f1621; color-scheme: dark }

html { -webkit-text-size-adjust: 100%; scroll-padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 16px); }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px);
}
main { max-width: 700px; margin: 0 auto; }
header.top { padding-block: 20px 4px; display: flex; flex-direction: column; gap: 6px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--muted); font: 500 12px/1.3 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; }
.brand svg { flex: none; }
.brand .lvlbadge { text-transform: none; letter-spacing: 0; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; color: var(--navy); }
h1 { font-weight: 700; font-size: 2.2rem; line-height: 1.05; }
h2 { font-weight: 700; font-size: 1.55rem; line-height: 1.15; }
h3 { font-weight: 700; font-size: 1.25rem; line-height: 1.2; }
p { margin: 0; }
a { color: var(--navy); text-decoration-color: var(--gold); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.lead { color: var(--muted); max-width: 62ch; }
.staff { height: 17px; margin-block: 18px; background: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 4px); position: relative; }
.staff::after { content: ""; position: absolute; left: 0; top: 0; width: 28px; height: 17px; background: var(--gold); opacity: .85; border-radius: 2px; }

.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
a.card { text-decoration: none; color: inherit; }
.card.now { border-color: var(--gold); box-shadow: inset 4px 0 0 var(--gold); }
.row { display: grid; grid-template-columns: 50px 1fr; gap: 12px; align-items: start; }
.lvl { font: 700 1.6rem/1 var(--f-display); color: var(--gold-text); }
.meta { font: 400 12.5px/1.4 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.small { font-size: .93rem; color: var(--muted); }
.label { font: 500 11.5px/1.3 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--gold-text); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12.5px/1.2 var(--f-mono); padding: 6px 10px; border-radius: 999px; background: var(--navy-soft); color: var(--navy); text-decoration: none; border: 1px solid transparent; }
a.chip:hover { border-color: var(--navy); }
.levels { display: flex; gap: 6px; margin-block: 14px 2px; }
.levels a { flex: 1; text-align: center; padding: 9px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--navy); font: 700 1.15rem/1 var(--f-display); text-decoration: none; }
.levels a[aria-current="page"] { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.seg { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; margin-top: 10px; }
.seg button { flex: 1; font: 500 .93rem var(--f-body); border: 0; border-radius: 7px; padding: 9px 6px; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); }
.dl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; background: var(--gold-soft); color: var(--ink); border: 1px solid var(--gold); text-decoration: none; font-size: .93rem; }
.btn::before { content: "PDF"; font: 500 10.5px/1 var(--f-mono); color: var(--gold-text); letter-spacing: .06em; }
.alt { font-size: .82rem; color: var(--muted); }

details.seq { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
details.seq > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: 30px 1fr 18px; gap: 10px; align-items: start; }
details.seq > summary::-webkit-details-marker { display: none; }
details.seq.sans-ic > summary { grid-template-columns: 1fr 18px !important; }
.num { font: 500 13px/1.8 var(--f-mono); color: var(--gold-text); }
.chev { color: var(--muted); font-size: 22px; line-height: 1; text-align: center; transition: transform .15s; }
details[open] > summary .chev { transform: rotate(90deg); }
.body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.q { font-family: var(--f-display); font-size: 1.2rem; font-style: italic; color: var(--ink); line-height: 1.3; }
ul.plain { margin: 0; padding-left: 1.15em; display: flex; flex-direction: column; gap: 4px; }
.seance { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.seance.now { border-color: var(--gold); background: var(--gold-soft); }
.seance h4 { margin: 0; font: 700 .98rem/1.3 var(--f-body); color: var(--navy); }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.steps li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; font-size: .93rem; }
.steps .min { font: 400 12px/1.6 var(--f-mono); color: var(--muted); }
.trace { border-left: 3px solid var(--gold); padding-left: 12px; display: flex; flex-direction: column; gap: 4px; }

.prose { display: flex; flex-direction: column; gap: 10px; }
.prose h2 { margin-top: 12px; } .prose h3 { margin-top: 8px; }
.prose ul, .prose ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.prose li, .prose p { overflow-wrap: anywhere; }
td { overflow-wrap: break-word; }
.fig { margin: 4px 0; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--navy); }
.fig svg { display: block; max-width: 100%; height: auto; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 12px var(--f-mono); color: var(--muted); background: var(--navy-soft); }
td.box, th.box { width: 26px; padding-inline: 4px; text-align: center; color: var(--muted); }
.evt td:nth-child(2), .evt th:nth-child(2) { width: 40px; padding-inline: 6px; }
code { font-family: var(--f-mono); font-size: .88em; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs ul { list-style: none; margin: 0 auto; padding: 0; max-width: 700px; display: grid; grid-template-columns: repeat(6, 1fr); height: var(--nav-h); }
nav.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 100%; text-decoration: none; color: var(--muted); font: 500 11.5px var(--f-body); }
nav.tabs svg { width: 22px; height: 22px; }
nav.tabs a[aria-current="page"] { color: var(--navy); }
nav.tabs a[aria-current="page"] svg { color: var(--gold); }
.hero { margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 26px max(16px, env(safe-area-inset-left, 0px)) 72px; background: linear-gradient(160deg, #22364d 0%, #2c4767 60%, #34557a 100%); color: #fff; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: auto 0 16px 0; height: 41px; background: repeating-linear-gradient(to bottom, rgba(255,255,255,.14) 0 1px, transparent 1px 10px); }
.hero-in { position: relative; max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.hero .id { display: flex; align-items: center; gap: 12px; }
.hero .id svg { width: 52px; height: 52px; flex: none; box-shadow: 0 6px 18px rgba(0,0,0,.25); border-radius: 14px; }
.hero .id b { display: block; font: 700 1.35rem/1.1 var(--f-display); }
.hero .id span { font: 500 11.5px/1.3 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; opacity: .8; }
.hero h1 { color: #fff; font-size: 2.3rem; }
.hero p { color: rgba(255,255,255,.82); max-width: 60ch; }
.hero .gold { color: #e3c27c; }
.timeline { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; }
.tl-bar { display: grid; grid-template-columns: 7fr 5fr 6fr 5fr 6fr; gap: 3px; position: relative; height: 34px; }
.tl-bar div { border-radius: 6px; background: var(--navy-soft); display: flex; align-items: center; justify-content: center; font: 500 11px var(--f-mono); color: var(--navy); }
.tl-bar div.on { background: var(--navy); color: var(--on-navy); }
.tl-mark { position: absolute; top: -6px; bottom: -6px; width: 3px; border-radius: 2px; background: var(--gold); }
.tl-leg { display: flex; justify-content: space-between; font: 400 11px var(--f-mono); color: var(--muted); }
.tl-bar { height: auto; min-height: 44px; } .tl-bar div { flex-direction: column; gap: 1px; padding: 5px 2px; text-align: center; line-height: 1.15; min-width: 0; }
.tl-bar div b { font: 700 12px var(--f-mono); } .tl-bar div span { font-size: 10.5px; overflow-wrap: anywhere; }
.tl-bar div.on { box-shadow: 0 0 0 2px var(--gold); } .timeline .tl-mark { top: -9px; bottom: auto; height: 9px; width: 3px; } .timeline .tl-bar { margin-top: 9px; } .tl-etat { margin: 2px 0 0; font-size: .9rem; color: var(--navy); font-weight: 600; }
.ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none; }
.lvlcard { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
.lvlbadge { font: 700 1.35rem/1 var(--f-display); color: #fff; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
details.seq > summary { grid-template-columns: 44px 1fr 18px; }
.seqhead { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; min-width: 0; }
.tile .ico { width: 38px; height: 38px; border-radius: 10px; background: var(--navy); color: #fff; }
.tile h3 { font-size: 1.1rem; }
.weeknav, .pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
.wbtn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--navy); color: var(--on-navy); text-decoration: none; font-size: 26px; line-height: 1; flex: none; }
.wbtn[aria-disabled="true"] { opacity: .3; pointer-events: none; }
.wlabel { text-align: center; display: flex; flex-direction: column; } .wlabel b { font: 700 1.3rem/1.2 var(--f-display); color: var(--navy); }
.strip { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px 4px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip a { flex: none; font: 500 12.5px/1 var(--f-mono); padding: 8px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); text-decoration: none; }
.strip a.today { border-color: var(--gold); color: var(--ink); }
.strip a.on { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.btn2 { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--navy); color: var(--navy); text-decoration: none; font-size: .93rem; }
.seance h4 a { text-decoration: none; color: inherit; } .seance h4 a::after { content: " \203A"; color: var(--gold); }
.btnproj { padding: 10px 16px; border-radius: 12px; background: var(--gold-text); color: #fff; text-decoration: none; font-weight: 700; }
.proj { position: fixed; inset: 0; z-index: 50; background: #13202f; color: #f3f5f8; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.p-top { display: flex; align-items: center; gap: 12px; padding: 12px 18px; font: 500 13px var(--f-mono); color: #b9c4d2; }
.p-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-top button, .p-bar button { background: rgba(255,255,255,.08); color: #fff; border: 0; border-radius: 10px; width: 44px; height: 44px; font-size: 22px; cursor: pointer; }
.p-bar button:disabled { opacity: .25; }
.p-stage { flex: 1; display: grid; place-items: center; padding: 8px 5vw; overflow-y: auto; }
.slide { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 2.2vh; }
.s-k { font: 500 clamp(12px, 1.6vw, 18px)/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: #e0bd73; }
.s-h { font: 700 clamp(30px, 5.4vw, 72px)/1.05 var(--f-display); color: #fff; text-wrap: balance; margin: 0; }
.s-p { font-size: clamp(17px, 2.3vw, 30px); line-height: 1.45; color: #dfe5ec; max-width: 40ch; }
.s-l { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 1.2vh; font-size: clamp(17px, 2.3vw, 30px); line-height: 1.35; color: #dfe5ec; }
.s-l li::marker { color: #e0bd73; }
.s-q { border-left: 4px solid #e0bd73; padding-left: 18px; }
.s-q span { font: 500 clamp(11px, 1.3vw, 15px) var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: #b9c4d2; }
.s-q ol { margin: 8px 0 0; padding-left: 1.2em; font-size: clamp(17px, 2.2vw, 28px); line-height: 1.4; color: #fff; }
.s-svg { margin: 0; background: #f4f6f9; color: #22364d; border-radius: 14px; padding: 2vh 2vw; max-width: 760px; }
.s-svg svg { display: block; width: 100%; height: auto; }
.s-yt { display: flex; flex-wrap: wrap; gap: 10px; }
.s-yt a { display: inline-flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; background: #fff; color: #13202f; text-decoration: none; font-size: clamp(14px, 1.6vw, 20px); }
.s-yt .play { width: 30px; height: 30px; border-radius: 50%; background: #c4302b; color: #fff; display: grid; place-items: center; font-size: 12px; flex: none; }
.p-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px 16px; }
.p-dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.p-dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.25); }
.p-dots span.on { background: #e0bd73; }
.sig { max-width: 700px; margin: 28px auto 0; padding-top: 14px; border-top: 1px solid var(--line); font: 400 12px/1.5 var(--f-mono); color: var(--muted); text-align: center; }
.home { padding-top: 34px; padding-bottom: 20px; text-align: center; }
.home::before { display: none; }
.home .hero-in { align-items: center; gap: 10px; }
.home-mark svg { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.home-name { font: 500 13px/1.3 var(--f-mono); letter-spacing: .22em; text-transform: uppercase; color: #e3c27c; margin-top: 6px; }
.home-title { color: #fff; font-size: clamp(2.6rem, 11vw, 4rem); line-height: 1; }
.home-sub { color: rgba(255,255,255,.85); max-width: 34ch; font-size: 1.05rem; }
.home-school { font: 400 12px/1.4 var(--f-mono); color: rgba(255,255,255,.6); }
.home-staff { width: 100%; height: 70px; margin-top: 8px; }
.ages { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.age { position: relative; background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--c); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; min-width: 0; }
.age-n { font: 700 1.6rem/1 var(--f-display); color: var(--c); }
.age-ico { position: absolute; top: 14px; right: 14px; color: var(--c); }
.age b { font: 700 1.12rem/1.2 var(--f-display); color: var(--navy); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Refonte élève (octobre 2026) */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.gt { color: var(--gold-text); }
h2.sec { margin-top: 22px; margin-bottom: 4px; }
h2.h3 { font-size: 1.25rem; line-height: 1.2; }
.pick { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.pick-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pick-b { font: 700 1.35rem/1 var(--f-display); padding: 12px 0; min-height: 48px; border-radius: 12px; border: 2px solid var(--c); background: var(--surface); color: var(--ink); cursor: pointer; }
.pick-b[aria-pressed="true"] { background: var(--c); color: #fff; }
.mine { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--c); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.mine-top { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
.blk { display: flex; flex-direction: column; gap: 6px; }
.blk-t { font: 700 .82rem/1.3 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--navy); margin: 0; }
.due { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn-main { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 16px; border-radius: 12px; background: var(--navy); color: var(--on-navy); text-decoration: none; font-weight: 700; border: 0; font-size: 1rem; font-family: var(--f-body); cursor: pointer; }
.btn2 { display: inline-flex; align-items: center; min-height: 44px; background: var(--surface); font-family: var(--f-body); cursor: pointer; }
.listens { display: flex; flex-direction: column; gap: 6px; }
.listen { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface); }
.listen:hover { border-color: var(--navy); }

/* ================= Design pédagogique (novembre 2026) : clair, coloré, lisible ================= */
:root { --bg: #f4f6fb; --surface: #ffffff; --ink: #1d2433; --muted: #586174; --line: #e1e5ee; --rule: #e1e5ee; --navy: #243b6b; --navy-soft: #e8eefb;

:root[data-theme="dark"] { --bg: #10141c; --surface: #19202c; --ink: #edf0f6; --muted: #a9b2c3; --line: #2b3546; --rule: #2b3546; --navy: #9db8ef; --navy-soft: #1f2a3d; --gold: #f0b25a; --gold-text: #f5c27a; --gold-soft: #2a2215; --on-navy: #10141c; --ombre: none; }

/* ================= Direction SIGNAL (essai, octobre 2026) : le son comme matière =================
   Noir et papier, vert acide en accent ; rouge et bleu secondaires. Archivo Black pour l'affichage,
   Instrument Sans pour le texte et la navigation, IBM Plex Mono pour les données. Aplats, filets, pas d'ombre.
   Active seulement sur html.signal (adresse ?signal, ou interrupteur dans Plus) : le reste du site n'est pas touché.
   Contrastes : le vert acide n'est jamais du texte sur papier, seulement un aplat sous du noir ou du texte sur noir. */
@font-face { font-family: "Archivo Black"; src: url("polices/archivo-black-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Archivo"; src: url("polices/archivo-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Instrument Sans"; src: url("polices/instrument-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Instrument Sans"; src: url("polices/instrument-sans-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Plex Mono Local"; src: url("polices/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Plex Mono Local"; src: url("polices/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: swap; }
html.signal { color-scheme: light; background: #F0EFE8; }
html.signal body { --noir: #11110F; --papier: #F0EFE8; --acide: #D6FF00; --rouge: #FF5638; --bleu: #4658FF; --gris: #4B4A44; --filet: #11110F; --tint: #E3E2D9;
  --bg: var(--papier); --surface: var(--papier); --ink: var(--noir); --muted: var(--gris); --line: var(--filet); --rule: var(--filet);
  --navy: var(--noir); --navy-soft: var(--tint); --gold: var(--acide); --gold-text: var(--noir); --gold-soft: var(--acide); --on-navy: var(--papier); --ombre: none;
  --f-display: "Archivo Black", "Arial Black", Arial, sans-serif; --f-titre: "Archivo", Arial, sans-serif; --f-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif; --f-mono: "Plex Mono Local", "IBM Plex Mono", ui-monospace, Menlo, monospace;
  background: var(--papier); color: var(--noir); font-family: var(--f-body); }
html.signal ::selection { background: var(--acide); color: var(--noir); }
html.signal a { color: var(--noir); text-decoration-thickness: 1px; text-underline-offset: 3px; }
html.signal :focus-visible { outline: 3px solid var(--bleu) !important; outline-offset: 2px; }
/* Typographie : l'affichage est monumental, serré, asymétrique ; les données sont en mono. */
html.signal h1 { font: 400 clamp(2.5rem, 11.5vw, 5.2rem)/.9 var(--f-display); letter-spacing: -.035em; color: var(--noir); text-wrap: balance; }
html.signal h2, html.signal .h3 { font: 400 1.45rem/1.05 var(--f-display); letter-spacing: -.02em; color: var(--noir); }
html.signal h3, html.signal h4, html.signal h5, html.signal .blk-t { font-family: var(--f-titre); font-weight: 700; letter-spacing: -.01em; color: var(--noir); }
html.signal .label, html.signal .meta, html.signal .small.meta { font: 500 11px/1.35 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--noir); }
html.signal .meta { color: var(--gris); font-weight: 400; }
html.signal .lead { font-size: 1.05rem; max-width: 46ch; color: var(--noir); }
html.signal header.top { padding-block: 26px 10px; border-bottom: 2px solid var(--noir); margin-bottom: 14px; }
html.signal header.top .label { display: inline-block; background: var(--noir); color: var(--acide); padding: 3px 7px; align-self: flex-start; }
html.signal .q { background: none; border-left: 8px solid var(--acide); border-radius: 0; padding: 2px 0 2px 12px; font: 700 1.3rem/1.2 var(--f-titre); color: var(--noir); box-shadow: inset 8px 0 0 var(--noir); padding-left: 22px; border-left: 0; background: linear-gradient(90deg, var(--noir) 0 4px, var(--acide) 4px 12px, transparent 12px); }
/* Les cartes deviennent des blocs éditoriaux : filet noir en tête, pas de coin arrondi ni d'ombre. */
html.signal .card, html.signal details.seq, html.signal .tool, html.signal .mine, html.signal .partition, html.signal fieldset.qq, html.signal .echo-c, html.signal .tile, html.signal .listen, html.signal .ligne-prof-bloc {
  background: transparent; border: 0; border-top: 2px solid var(--noir); border-radius: 0; box-shadow: none; }
html.signal .card, html.signal .tool, html.signal .mine { padding: 14px 0 16px; }

html.signal .stack { gap: 0; } html.signal .stack > * + * { margin-top: 0; }
html.signal .note { background: var(--acide); color: var(--noir); border-radius: 0; border: 0; }
html.signal .due { background: transparent; border: 0; border-left: 8px solid var(--rouge); border-radius: 0; }
html.signal .trace { background: var(--tint); border: 0; border-left: 4px solid var(--noir); border-radius: 0; color: var(--noir); }
html.signal .echo-c { border-left: 0; padding: 12px 0; } html.signal .echo-c .rel { font-family: var(--f-mono); background: var(--noir); color: var(--acide); padding: 2px 6px; }
/* Commandes : aplats, angles droits. */
html.signal .btn-main { background: var(--noir); color: var(--papier); border-radius: 0; font: 600 1rem var(--f-body); letter-spacing: .01em; border: 2px solid var(--noir); }
html.signal .btn-main:hover { background: var(--acide); color: var(--noir); }
html.signal .btn2, html.signal .sonbtn, html.signal .retour, html.signal .btn { border-radius: 0; border: 2px solid var(--noir); background: transparent; color: var(--noir); }
html.signal .btn::before { color: var(--noir); background: var(--acide); padding: 2px 4px; }
html.signal .chip, html.signal .tag { border-radius: 0; border: 1px solid var(--noir); background: transparent; color: var(--noir); font: 500 12px/1.2 var(--f-mono); }
html.signal .chip[aria-pressed="true"], html.signal .chip[aria-selected="true"] { background: var(--noir); color: var(--acide); }
html.signal .play, html.signal .listen .play { background: var(--noir); color: var(--acide); border-radius: 0; }
html.signal .lvlbadge { background: var(--noir) !important; color: var(--acide); border-radius: 0; font-family: var(--f-display); font-weight: 400; letter-spacing: -.03em; }
html.signal .ico, html.signal .ico.vign { border-radius: 0; }
html.signal .ico.vign.pleine, html.signal .age-img.pleine, html.signal .gimg img { filter: grayscale(1) contrast(1.12); }
html.signal .levels a { border-radius: 0; border: 2px solid var(--noir); background: transparent; font: 400 1.25rem/1 var(--f-display); color: var(--noir); }
html.signal .levels a[aria-current="page"] { background: var(--noir); color: var(--acide); }
html.signal .sous-onglets a { border-radius: 0; border: 2px solid var(--noir); background: transparent; font: 500 12px var(--f-mono); text-transform: uppercase; letter-spacing: .05em; }

/* Barre du haut et navigation du bas : noir mat, l'onglet actif en vert acide. */
html.signal .barre { background: var(--papier); border-bottom: 2px solid var(--noir); box-shadow: none; }
html.signal .fil a { color: var(--noir); } html.signal .fil { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
html.signal nav.tabs { background: var(--noir); border-top: 0; box-shadow: none; }
html.signal nav.tabs a { color: #BEBDB4; font: 600 10.5px/1.1 var(--f-body); letter-spacing: .02em; border-radius: 0; }
html.signal nav.tabs a svg { color: currentColor; }
html.signal nav.tabs a[aria-current="page"] { color: var(--noir); background: var(--acide); }
html.signal nav.tabs a[aria-current="page"] svg { color: var(--noir); background: none; }
html.signal footer.sig { font-family: var(--f-mono); color: var(--gris); border-top: 2px solid var(--noir); }
html.signal footer.sig .faust { color: var(--noir); background: var(--acide); padding: 1px 5px; text-decoration: none; }

/* ---------- Semaine : un calendrier éditorial ---------- */
html.signal .accueil { padding-top: 14px; }
html.signal .choix-haut::before { border-radius: 0; box-shadow: none; background-color: var(--noir); }
html.signal .choix-liens li { border-radius: 0; border: 1px solid var(--noir); background: transparent; padding: 5px 8px; }
html.signal .choix-liens span, html.signal .choix-liens a { border: 0 !important; background: transparent !important; font: 500 11px var(--f-mono) !important; text-transform: uppercase; letter-spacing: .06em; color: var(--noir) !important; }
html.signal .choix-titre { font: 400 clamp(2.9rem, 14vw, 6rem)/.86 var(--f-display); letter-spacing: -.045em; margin: 8px 0 14px; max-width: 9ch; }
html.signal h2.sec { font: 500 11px/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: .1em; border-top: 2px solid var(--noir); padding-top: 8px; margin-top: 18px; }
html.signal h2.sec .gt { display: block; font: 400 clamp(1.9rem, 9vw, 3rem)/.95 var(--f-display); text-transform: none; letter-spacing: -.03em; color: var(--noir); background: var(--acide); width: fit-content; padding: 2px 6px 4px; margin-top: 6px; }
html.signal .weeknav { align-items: stretch; border-bottom: 2px solid var(--noir); padding-bottom: 10px; }
html.signal .wbtn { border-radius: 0; background: var(--noir); color: var(--acide); }
html.signal .wlabel { text-align: left; flex: 1; } html.signal .wlabel .meta { order: -1; }
html.signal .wlabel b { font: 400 clamp(2.2rem, 12vw, 4rem)/.9 var(--f-display); letter-spacing: -.04em; color: var(--noir); font-variant-numeric: tabular-nums; }
html.signal .strip a { border-radius: 0; border: 1px solid var(--noir); background: transparent; font: 500 12px/1 var(--f-mono); color: var(--noir); }
html.signal .strip a.today { box-shadow: inset 0 -4px 0 var(--rouge), inset 0 -6px 0 var(--noir); }
html.signal .strip a.on { background: var(--noir); color: var(--acide); border-color: var(--noir); }
html.signal .liste-proj { gap: 0; }
html.signal .ligne-prof-bloc { padding: 10px 0 4px; }
html.signal .ligne-prof .lvlbadge { width: 64px; height: 64px; font-size: 1.9rem; }
html.signal .ligne-proj b { font: 700 1.05rem/1.2 var(--f-titre); }
html.signal .ligne-prof-bloc details.others > summary { font: 500 11.5px/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--noir); }
/* Les quatre années : composition asymétrique, numéros monumentaux, images documentaires en noir et blanc. */
html.signal .ages { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; border-top: 2px solid var(--noir); }
html.signal .age { grid-column: span 3; border: 0; border-radius: 0; box-shadow: none; background: transparent; padding: 0 10px 16px 0; border-bottom: 1px solid var(--noir); }
html.signal .age:nth-child(1) { grid-column: span 4; } html.signal .age:nth-child(2) { grid-column: span 2; } html.signal .age:nth-child(3) { grid-column: span 2; } html.signal .age:nth-child(4) { grid-column: span 4; }
html.signal .age:nth-child(even) { padding: 0 0 16px 10px; border-left: 1px solid var(--noir); }
html.signal .age-img { margin: 0 0 8px !important; border-radius: 0 !important; height: 120px !important; background: var(--noir) !important; color: var(--acide); }
html.signal .age-img svg { opacity: 1; }
html.signal .age-n { font: 400 clamp(3rem, 13vw, 5rem)/.85 var(--f-display); letter-spacing: -.05em; color: var(--noir) !important; }
html.signal .age b { font: 700 1.05rem/1.15 var(--f-titre); } html.signal .age .small { font-family: var(--f-mono); font-size: 11.5px; color: var(--gris); }
html.signal .age-ico { display: none; }
@media (max-width: 520px) { html.signal .age:nth-child(1), html.signal .age:nth-child(4) { grid-column: span 6; padding: 0 0 14px; border-left: 0; }
  html.signal .age:nth-child(2) { grid-column: span 3; padding: 0 8px 14px 0; border-left: 0; } html.signal .age:nth-child(3) { grid-column: span 3; padding: 0 0 14px 8px; border-left: 1px solid var(--noir); }
  html.signal .age:nth-child(2) .age-img, html.signal .age:nth-child(3) .age-img { height: 84px !important; } html.signal .age:nth-child(4) { margin-top: 0; }
  html.signal .age:nth-child(2) .age-n, html.signal .age:nth-child(3) .age-n { font-size: 3rem; } }
/* La frise : cinq aplats, la période en cours en vert acide, les dates en mono. */
html.signal .tl-bar { gap: 0; border: 2px solid var(--noir); }
html.signal .tl-bar div { border-radius: 0; background: transparent; color: var(--noir); border-right: 1px solid var(--noir); }

html.signal .tl-etat { color: var(--noir); font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }

/* ---------- Cours : une publication ---------- */
html.signal details.seq > summary { grid-template-columns: 64px 1fr 18px; }
html.signal details.seq > summary .ico.vign { width: 64px; height: 64px; background-color: var(--noir) !important; color: var(--acide); }
html.signal details.seq .seqhead h3 { font: 400 1.35rem/1.02 var(--f-display); letter-spacing: -.02em; }
html.signal details.seq[open] > summary { border-bottom: 1px solid var(--noir); margin-bottom: 12px; }
html.signal .chev { color: var(--noir); }
html.signal .seance { border-left: 0; border-top: 1px solid var(--noir); padding: 10px 0 0; border-radius: 0; background: transparent; }

ées Aka", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Écoute d'une polyphonie Aka : combien de voix, comment se répondent-elles ?"], [20, "Canon à trois voix."], [5, "Annonce de l'évaluation."]]}, {"objectif": "Évaluation de la séquence", "etapes": [[25, "Passage du canon par petits groupes."], [25, "Écoute d'un extrait inconnu : décrire le son avec les quatre paramètres."]]}], "trace": ["Le mot musique vient du grec mousikè : l'art des Muses, filles de Zeus et de Mnémosyne, la mémoire.", "Les plus anciens instruments retrouvés sont des flûtes en os, vieilles d'environ 40 000 ans.", "On classe les instruments selon la façon de produire le son : souffler, frotter ou pincer une corde, frapper.", "Un son a quatre paramètres : la hauteur (grave, aigu), la durée (long, court), l'intensité (piano, forte), le timbre (sa couleur).", "La voix est le premier instrument : les Pygmées Aka chantent à plusieurs voix depuis des siècles, sans rien écrire."], "devoirs": "Apprendre les quatre paramètres du son et l'origine du mot musique.", "eval": {"consigne": "Chanter le canon en petit groupe. Décrire un son inconnu avec les quatre paramètres.", "criteres": [["Je chante juste et je connais les paroles", "C1"], ["Je tiens ma voix dans le canon", "C1"], ["Je décris hauteur, durée, intensité et timbre", "C2"], ["J'explique l'origine du mot musique", "C4"]], "attendus": ["Utiliser les mots grave, aigu, long, court, piano, forte, timbre.", "Citer un instrument préhistorique et son âge approximatif."]}}, {"fiches": ["histoire", "maths"], "objectifs": ["Situer les musiques de l'Antiquité dans le temps et l'espace.", "Comprendre l'expérience de Pythagore sur les cordes.", "Chanter une mélodie de deux mille ans."], "seances": [{"objectif": "Égypte et Mésopotamie", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Fresques égyptiennes : harpes, sistres, chanteurs. Hymne hourrite n° 6, la plus ancienne mélodie notée connue."], [15, "Épitaphe de Seikilos : découverte."], [10, "Trace écrite."]]}, {"objectif": "La Grèce : lyre, aulos, théâtre", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Instruments grecs et rôle du chœur au théâtre."], [20, "Épitaphe : texte grec et traduction."], [10, "Trace écrite."]]}, {"objectif": "Pythagore et le monocorde", "etapes": [[5, "Échauffement corporel et vocal."], [25, "Expérience : corde entière, moitié (octave), deux tiers (quinte). Lien avec les fractions."], [15, "Épitaphe."], [5, "Trace écrite."]]}, {"objectif": "Créer une mélodie sur des intervalles", "etapes": [[5, "Échauffement corporel et vocal."], [35, "Par groupes, une courte mélodie avec octaves et quintes, jouée ou chantée."], [10, "Répétition."]]}, {"objectif": "Évaluation de la séquence", "etapes": [[20, "Chant de l'Épitaphe."], [30, "Présentation des créations et écoute comparée."]]}], "trace": ["L'Égypte ancienne nous a laissé des images de musiciens et des instruments : harpes, luths, sistres.", "L'Hymne hourrite n° 6, gravé à Ougarit vers 1400 avant J.-C., est la plus ancienne mélodie notée connue.", "L'Épitaphe de Seikilos (Ier siècle) est la plus ancienne composition complète connue, avec sa notation.", "Pythagore découvre que les intervalles correspondent à des rapports simples : 1/2 donne l'octave, 2/3 la quinte."], "devoirs": "Savoir situer l'Hymne hourrite et l'Épitaphe de Seikilos sur la frise.", "eval": {"consigne": "Chanter l'Épitaphe. Présenter la mélodie de groupe et expliquer octave et quinte.", "criteres": [["Je chante l'Épitaphe avec le groupe", "C1"], ["J'utilise octave et quinte dans notre mélodie", "C3"], ["J'explique l'expérience du monocorde", "C2"], ["Je situe trois œuvres antiques", "C2"]], "attendus": ["Définir octave et quinte par un rapport de longueur.", "Placer Égypte, Ougarit et la Grèce sur une frise."]}}, {"fiches": ["notation", "voix", "nuances"], "objectifs": ["Savoir d'où viennent la portée et le nom des notes.", "Reconnaître et classer les voix : soprano, alto, ténor, basse.", "Chanter ensemble : unisson, canon, deux voix.", "Dire ce qui est au premier plan et ce qui accompagne."], "seances": [{"objectif": "Des neumes à la portée, en une séance", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Les neumes au-dessus des paroles, puis la portée de Guido d'Arezzo (vers 1025), puis ut, ré, mi, fa, sol, la : les six vers de l'hymne."], [15, "Ut queant laxis à l'unisson, en montrant les syllabes."], [10, "Trace écrite."]]}, {"objectif": "Classer les voix", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Écouter des voix d'hommes, de femmes, d'enfants, et les classer du grave à l'aigu : basse, ténor, alto, soprano."], [15, "Trouver sa voix et chanter dans son registre."], [10, "Trace écrite."]]}, {"objectif": "Chanter en chœur : du canon aux deux voix", "etapes": [[5, "Échauffement corporel et vocal."], [15, "Écouter un chœur : tout le monde chante-t-il la même chose ?"], [25, "Frère Jacques en canon à trois groupes, puis un chant à deux voix."], [5, "Bilan."]]}, {"objectif": "Plan sonore et intensité", "etapes": [[5, "Échauffement corporel et vocal."], [20, "Qui est devant, qui accompagne ? Mélodie et accompagnement, soliste et tutti, piano et forte."], [15, "Atelier Faust : régler la hauteur et l'intensité d'un son."], [10, "Trace écrite."]]}, {"objectif": "Évaluation de la séquence", "etapes": [[25, "Chant en canon ou à deux voix, par groupes."], [25, "Écoute : classer des voix et dire ce qui est au premier plan."]]}], "trace": ["Au IXe siècle, les moines notent la musique avec des neumes ; vers 1025, Guido d'Arezzo place les notes sur des lignes : la portée.", "Les noms ut, ré, mi, fa, sol, la viennent des vers de l'hymne Ut queant laxis ; ut devient do au XVIIe siècle.", "On classe les voix du grave à l'aigu : basse et ténor pour les hommes, alto et soprano pour les femmes et les enfants.", "Chanter ensemble : à l'unisson (tous la même mélodie), en canon (départs décalés), à deux voix (deux mélodies en même temps).", "Le plan sonore :
