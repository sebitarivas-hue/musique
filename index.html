tien ancien, avec des cymbales et un triangle.", "Coptic liturgy chant cymbals"]], "4-1": [["Mélodie", "Ali Farka Touré et Ry Cooder, Talking Timbuktu (1994)", "Mali, États-Unis", "Des mélodies pentatoniques du nord du Mali, apprises d'oreille, qui rencontrent le blues : la transmission orale traverse l'océan.", "Ali Farka Toure Talking Timbuktu"], ["Mélodie", "Le flamenco : Paco de Lucía, Entre dos aguas (1973)", "Espagne", "Le flamenco d'Andalousie, patrimoine de l'Unesco depuis 2010, s'apprend d'oreille, de musicien à musicien.", "Paco de Lucia Entre dos aguas"], ["Sujet", "Les chants de quête d'Italie (canti di questua), la Pasquella", "Italie", "Des groupes vont de porte en porte, l'hiver, chanter pour demander à manger : une musique de tradition orale, enregistrée sur le terrain par Alan Lomax et Diego Carpitella en 1954-1955.", "Pasquella canto di questua"]], "1-4": [["Timbre", "Camille, Ta douleur (2005)", "France", "La voix et le corps font toute la musique : chant, souffle et percussions corporelles, presque sans instrument.", "Camille Ta douleur"], ["Timbre", "Ladysmith Black Mambazo, Homeless (1986)", "Afrique du Sud", "Un chœur d'hommes a cappella, sans aucun instrument, sur l'album Graceland de Paul Simon.", "Ladysmith Black Mambazo Homeless"], ["Timbre", "Bobby McFerrin, Don't Worry, Be Happy (1988)", "États-Unis", "Tout est fait avec la voix et le corps : mélodie, basse, percussions. La voix reste le premier instrument.", "Bobby McFerrin Don't Worry Be Happy"]], "2-2": [["Sujet", "Charles Aznavour, Hier encore (1964)", "France", "Une chanson sur le temps qui passe trop vite : le même sujet que l'Épitaphe de Seikilos, deux mille ans plus tard.", "Charles Aznavour Hier encore"], ["Sujet", "Kansas, Dust in the Wind (1977)", "États-Unis", "Comme l'Épitaphe de Seikilos, la chanson dit que la vie est brève : « tout ce que nous sommes n'est que poussière dans le vent ».", "Kansas Dust in the Wind"]], "2-3": [["Mélodie", "The Kinks, You Really Got Me (1964)", "Royaume-Uni", "Le riff est joué en accords de puissance : une note et sa quinte. Le rapport 3/2 de Pythagore est au cœur du rock.", "The Kinks You Really Got Me"]], "3-1": [["Mélodie", "Moines de Santo Domingo de Silos, Chant (1994)", "Espagne", "Un disque de chant grégorien chanté par des moines bénédictins, vendu à des millions d'exemplaires dans le monde.", "Benedictine Monks Santo Domingo de Silos Chant 1994"], ["Mélodie", "Enigma, Sadeness (Part I) (1990)", "Allemagne", "Le morceau reprend un enregistrement de chant grégorien et le pose sur un rythme de danse.", "Enigma Sadeness Part I"]], "4-3": [["Timbre", "The HU, Wolf Totem (2019)", "Mongolie", "Un groupe de rock mongol qui chante en khöömii, le chant diphonique, avec la vièle à tête de cheval.", "The HU Wolf Totem"]], "4-4": [["Rythme", "Buena Vista Social Club, Chan Chan (1997)", "Cuba", "Le son cubain : la clave, un motif de cinq frappes, tourne sans arrêt sous la guitare et la voix. Un ostinato.", "Buena Vista Social Club Chan Chan"], ["Rythme", "Fela Kuti, Water No Get Enemy (1975)", "Nigeria", "L'afrobeat superpose des ostinatos de guitares, de cuivres et de percussions : une polyrythmie qui dure.", "Fela Kuti Water No Get Enemy"], ["Rythme", "Les Gnawa du Maroc", "Maroc", "Les crotales de métal (qraqeb) répètent un motif sans fin sous le guembri et les voix : patrimoine de l'Unesco depuis 2019.", "Gnawa Maroc guembri qraqeb"]], "5-1": [["Timbre", "Michel Legrand, Les Parapluies de Cherbourg (1964)", "France", "Un film entièrement chanté, porté par un grand orchestre : cordes, bois, cuivres et percussions.", "Michel Legrand Les Parapluies de Cherbourg"], ["Timbre", "A. R. Rahman, Jai Ho (2008)", "Inde", "Un orchestre de cordes, des percussions indiennes et des voix : le film Slumdog Millionaire réunit deux mondes de timbres.", "A R Rahman Jai Ho"], ["Timbre", "John Williams, Star Wars, thème principal (1977)", "États-Unis", "Un orchestre symphonique complet pour un film : les cuivres annoncent le thème, les cordes et les bois répondent.", "Star Wars main theme London Symphony Orchestra"]], "5-3": [["Forme", "Maurice Béjart, Boléro (1961)", "France, Belgique", "Le ballet de Béjart sur le Boléro de Ravel : la danse grandit avec le crescendo, jusqu'à la fin.", "Bejart Bolero Jorge Donn"], ["Forme", "The Beatles, A Day in the Life (1967)", "Royaume-Uni", "Au milieu et à la fin, un orchestre monte de la note la plus grave à la plus aiguë : un immense crescendo, comme dans le Boléro.", "The Beatles A Day in the Life"]], "1-1": [["Timbre", "Les Tambours du Bronx (depuis 1987)", "France", "Des percussionnistes qui frappent sur des bidons de métal : le bruit devient musique quand on l'organise en rythmes.", "Les Tambours du Bronx"], ["Timbre", "Stomp (1991)", "Royaume-Uni", "Un spectacle de percussions où balais, poubelles et boîtes d'allumettes deviennent des instruments : où commence la musique ?", "Stomp live percussion"]], "1-2": [["Timbre", "Björk, Biophilia (2011)", "Islande", "Björk fait construire des instruments nouveaux pour son album, comme on a taillé les premières flûtes.", "Bjork Biophilia instruments"], ["Rythme", "Queen, We Will Rock You (1977)", "Royaume-Uni", "Deux frappes de pieds, un claquement de mains : le rythme le plus connu du monde se joue sans instrument, avec le corps.", "Queen We Will Rock You"]], "1-3": [["Rythme", "La tarentelle, Italie du Sud", "Italie", "Une danse très rapide, à trois temps, menée par le tambourin : le tempo fait tout le caractère.", "tarantella tamburello Italia tradizionale"], ["Timbre", "Billie Eilish, bad guy (2019)", "États-Unis", "Une voix chuchotée, piano, sur une basse très grave et forte : la hauteur et l'intensité jouent l'une contre l'autre.", "Billie Eilish bad guy"]], "5-2": [["Timbre", "Arturo Márquez, Danzón n° 2 (1994)", "Mexique", "Une danse de salon mexicaine pour grand orchestre, rendue célèbre par l'Orchestre Simón Bolívar du Venezuela.", "Marquez Danzon No 2 Simon Bolivar Dudamel"], ["Timbre", "Metallica, S&M (1999)", "États-Unis", "Un groupe de heavy metal joue avec l'Orchestre symphonique de San Francisco : guitares électriques et quatre familles d'instruments.", "Metallica S&M San Francisco Symphony"]], "4-2": [["Mélodie", "El cóndor pasa (Daniel Alomía Robles, 1913)", "Pérou", "Une mélodie des Andes sur une gamme pentatonique, jouée à la flûte de Pan et au charango, reprise ensuite dans le monde entier.", "El condor pasa Andes quena"]]}, "5e": {"1-1": [["Mélodie", "Moines de Santo Domingo de Silos, Chant (1994)", "Espagne", "Un disque de chant grégorien chanté par des moines bénédictins, vendu à des millions d'exemplaires dans le monde.", "Benedictine Monks Santo Domingo de Silos Chant 1994"], ["Mélodie", "Enigma, Sadeness (Part I) (1990)", "Allemagne", "Un chant grégorien enregistré devient la couche principale d'un morceau de danse.", "Enigma Sadeness Part I"]], "1-2": [["Forme", "Camille, Le Fil (2005)", "France", "Tout l'album est traversé par une seule note tenue, un bourdon, sous les chansons : comme sous les premiers organums.", "Camille Le Fil album"], ["Forme", "Le chant byzantin", "Grèce", "Une voix chante la mélodie pendant que les autres tiennent l'ison, une note fixe : un bourdon, comme dans l'organum.", "Byzantine chant ison"], ["Forme", "The Beatles, Tomorrow Never Knows (1966)", "Royaume-Uni", "Tout le morceau repose sur une note tenue au grave, un bourdon, comme sous les premiers organums.", "The Beatles Tomorrow Never Knows"], ["Timbre", "George Harrison, Within You Without You (1967)", "Royaume-Uni, Inde", "Avec des musiciens indiens : sitar, tabla et le bourdon continu du tanpura sous la mélodie.", "The Beatles Within You Without You"]], "2-2": [["Forme", "Les battles de rap a cappella, Rap Contenders (Paris, depuis 2010)", "France", "Deux rappeurs s'affrontent à tour de rôle, sans musique, devant un public : la tenson d'aujourd'hui.", "Rap Contenders battle"], ["Forme", "Eminem, 8 Mile, les joutes du film (2002)", "États-Unis", "Deux rappeurs s'affrontent à tour de rôle devant un public : c'est la tenson des troubadours.", "8 Mile final rap battle"]], "2-4": [["Sujet", "Boris Vian, Le Déserteur (1954)", "France", "Une lettre au président, en chanson, contre la guerre : la chanson engagée, héritière du sirventès des troubadours.", "Boris Vian Le Deserteur"], ["Sujet", "Bob Marley, Redemption Song (1980)", "Jamaïque", "Une voix et une guitare seules pour une chanson de liberté : un chanteur engagé, comme le troubadour du sirventès.", "Bob Marley Redemption Song"]], "3-2": [["Forme", "Daft Punk, Around the World (1997)", "France", "Une seule phrase répétée et superposée à d'autres boucles : la répétition construit tout le morceau.", "Daft Punk Around the World"], ["Forme", "The Beach Boys, God Only Knows (1966)", "États-Unis", "À la fin, les voix reprennent la même phrase avec des départs décalés : une imitation en canon.", "The Beach Boys God Only Knows"]], "4-2": [["Sujet", "Les Choristes, Vois sur ton chemin (2004)", "France", "Un chœur d'enfants chante ensemble une mélodie simple, chacun à sa place : la force du chant collectif.", "Les Choristes Vois sur ton chemin"], ["Sujet", "The Edwin Hawkins Singers, Oh Happy Day (1969)", "États-Unis", "Un chœur de gospel où toute l'assemblée chante ensemble une mélodie simple, comme dans le choral de Luther.", "Edwin Hawkins Singers Oh Happy Day"]], "4-3": [["Sujet", "Jacques Brel, Ne me quitte pas (1959)", "Belgique", "Chaque mot s'entend, la musique est au service du texte : la question du concile de Trente, posée à la chanson.", "Jacques Brel Ne me quitte pas"], ["Forme", "Queen, Bohemian Rhapsody (1975)", "Royaume-Uni", "L'introduction est chantée a cappella, les voix avancent ensemble sur les mêmes syllabes : de l'homophonie, et chaque mot se comprend.", "Queen Bohemian Rhapsody"]], "5-1": [["Forme", "Barbara, Göttingen (1964)", "France", "Une voix seule et un piano : la monodie accompagnée, au service d'un texte qui réconcilie la France et l'Allemagne.", "Barbara Gottingen"], ["Forme", "Tracy Chapman, Fast Car (1988)", "États-Unis", "Une voix seule au premier plan, un accompagnement de guitare qui se répète : la monodie accompagnée de 1600.", "Tracy Chapman Fast Car"]], "5-2": [["Forme", "Mercedes Sosa, Gracias a la vida (1971)", "Argentine, Chili", "Une chanson de Violeta Parra : une voix, une guitare qui soutient, et l'émotion du texte.", "Mercedes Sosa Gracias a la vida"], ["Sujet", "Cesária Évora, Sodade (1992)", "Cap-Vert", "Une voix seule, un accompagnement simple, et la nostalgie de ceux qui sont partis : un lamento d'aujourd'hui.", "Cesaria Evora Sodade"]], "5-3": [["Rythme", "Astor Piazzolla, Libertango (1974)", "Argentine", "Le tango nuevo : un motif de basse répété en boucle, et le bandonéon qui chante par-dessus.", "Astor Piazzolla Libertango"], ["Rythme", "Ray Charles, Hit the Road Jack (1961)", "États-Unis", "Une basse de quatre notes qui descend et revient sans cesse : une basse répétée sur laquelle on improvise.", "Ray Charles Hit the Road Jack"]], "1-3": [["Timbre", "Le chant en paghjella, Corse (patrimoine de l'Unesco depuis 2009)", "France (Corse)", "Trois voix d'hommes, chacune avec son rôle, chantent ensemble : une polyphonie transmise de bouche à oreille.", "paghjella corse A Filetta"], ["Timbre", "Le Mystère des voix bulgares (1975)", "Bulgarie", "Un chœur de femmes et ses polyphonies aux voix tendues, devenu un succès mondial dans les années 1980.", "Le Mystere des Voix Bulgares"], ["Timbre", "Le canto a tenore, Sardaigne", "Italie (Sardaigne)", "Quatre voix d'hommes, dont deux chantent de la gorge : une polyphonie inscrite au patrimoine de l'Unesco en 2005.", "canto a tenore Sardegna"]], "2-1": [["Sujet", "Massilia Sound System (Marseille, depuis 1984)", "France", "Un groupe qui chante en occitan, la langue des troubadours, sur des rythmes de reggae.", "Massilia Sound System"], ["Sujet", "Amália Rodrigues, Barco Negro (1955)", "Portugal", "Le fado chante l'amour et l'absence, d'une voi /* ---------- Calendrier ---------- */
function semaineEnCours(cal) {
  for (const e of cal) { const d = parse(e.date), f = new Date(d); f.setDate(f.getDate() + 7); if (today >= d && today < f) return e; }
  return null;
}
const WEEKS = D.niveaux[NIV[0]].calendrier.map(e => ({ semaine: e.semaine, date: e.date }));
function indexDuJour() {
  if (today < parse(WEEKS[0].date)) return 0;
  for (let i = WEEKS.length - 1; i >= 0; i--) if (today >= parse(WEEKS[i].date)) return i;
  return 0;
}
const seanceId = (k, e) => `seance-${k}-${e.seq}-${e.num}`;
const estEval = (k, seq, num) => /évaluation/i.test(D.niveaux[k].contenus[seq - 1].seances[num - 1].objectif);
function prochaineEval(k, depuis) {
  const cal = D.niveaux[k].calendrier;
  for (let i = depuis; i < cal.length; i++) { const e = cal[i]; if (e.type === "seance" && estEval(k, e.seq, e.num)) return e; }

}
function libelle(n, e) {
  if (!e) return "Année terminée";
  if (e.type === "accueil") return "Séance d'accueil";
  if (e.type === "tampon") return "Pas de nouvelle séance : rattrapage ou concert";
  return n.contenus[e.seq - 1].seances[e.num - 1].objectif;
}
/* Écoutes d'une séance : celles du diaporama si elles existent, sinon les œuvres de la séquence. */
/* Les écoutes d'une séance, dans l'ordre pédagogique : d'abord les œuvres du cours (écoutes, chant),
   puis les accroches et les liens vers d'autres musiques (ext), en prolongement. Les échos ont leur propre rubrique. */
function ecoutesSeance(k, seq, num) {
  const d = (D.diapos[k] && D.diapos[k][seq + "-" + num]) || [], out = [], vus = new Set();
  const ajouter = (lib, q, questions, ext) => { if (vus.has(q)) return; vus.add(q); out.push({ lib, q, questions: questions || [], ext }); };
  d.filter(v => !v.echo && /^(Écout|Chant|Lire)/.test(v.k || "")).forEach(v => (v.yt || []).forEach(([lib, q]) => ajouter(lib, q, v.q, false)));
  d.filter(v => !v.echo && v.k !== "Accroche" && v.k !== "Pour aller plus loin" && !/^(Écout|Chant|Lire)/.test(v.k || "")).forEach(v => (v.yt || []).forEach(([lib, q]) => ajouter(lib, q, v.q, false)));
  if (!out.length) D.niveaux[k].sequences[seq - 1].oeuvres.forEach(o => ajouter(o, o, [], false));
  d.filter(v => !v.echo && (v.k === "Accroche" || v.k === "Pour aller plus loin")).forEach(v => (v.yt || []).forEach(([lib, q]) => ajouter(lib, q, v.q, true)));
  return out;
}
const ecoutesHtml = ec => { const a = ec.filter(x => !x.ext), principal = a.slice(0, 2), plus = a.slice(2).concat(ec.filter(x => x.ext));

    ${v.q ? `<div class="consigne"><span class="label">Questions</span><ol>${v.q.map(t => `<li>${esc(t)}</li>`).join("")}</ol></div>` : ""}
    ${v.svg && D.svgs[v.svg] ? `<figure class="fig">${D.svgs[v.svg]}</figure>` : ""}
    ${v.grille ? grilleHtml(v.grille) : ""}${v.partition ? partitionHtml(v.partition) : ""}${sonsHtml(v.son)}${v.img ? galerieHtml(v.img) : ""}${v.web ? liensHtml(v.web) : ""}${v.yt ? `<div class="listens">${v.yt.map(([lib, q]) => ecoute(lib, q)).join("")}</div>` : ""}</div>`).join("");

  P.ressources = (P.ressources || "") + ressources(k, c.fiches, seq);
  const tout = ["apprends", "deroule", "chant", "partitions", "ecoute", "classer", "comparer", "cours", "echo", "sons", "faust", "retiens", "devoirs", "eval", "ressources"].map(x => P[x] || "").join("");

  if (q) return `<a class="mission" href="${q[3]}"><span class="label">Ta prochaine mission</span><b>${esc(q[0])}</b><span class="mission-go">C'est parti, +${q[1]} XP &#8250;</span></a>`;
  const m = missions(1)[0]; if (!m) return "";
  return lienCible(m.cible, `<span class="label">Ta prochaine mission</span><b>${esc(m.cond)}</b><span class="small">Pour gagner le badge « ${esc(m.nom)} »${m.pr[1] > 1 ? `, tu en es à ${Math.min(m.pr[0], m.pr[1])} sur ${m.pr[1]}` : ""}.</span><span class="mission-go">C'est parti &#8250;</span>`, "mission");
}

function guide() {
  const el = document.createElement("div"); el.className = "fete guide"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-label", "Comment ça marche");
  el.innerHTML = `<div class="fete-carte"><div class="label">Comment ça marche</div><b>Ton cours est un jeu</b>
    <ol class="guide-l"><li><span class="et-n">1</span><span><b>Choisis ta classe</b> sur la page Ma semaine.</span></li>
    <li><span class="et-n">2</span><span><b>Touche « Ta prochaine mission »</b> : le site t'emmène au bon endroit.</span></li>
    <li><span class="et-n">3</span><span><b>Écoute, joue, réponds aux quiz</b> : tu gagnes des XP, des niveaux et des badges.</span></li></ol>
    <p class="small">Tout ce qui ressemble à un bouton se touche. Ta progression est dans l'onglet Parcours.</p><button type="button" class="btn-main">C'est parti</button></div>`;
  document.body.appendChild(el); const b = el.querySelector("button"); b.onclick = () => el.remove(); b.focus();
}
function vueParcours() {
  const j = jeu(), n = niveauDe(j.xp), bas = NIVEAUX_JEU[n][0], haut = (NIVEAUX_JEU[n + 1] || [bas + 1])[0], q = quetes();
  let h = head("Mon parcours", `Niveau ${n + 1} : ${NIVEAUX_JEU[n][1]}`, NIVEAUX_JEU[n][2]);
  h += `<section class="niveau-carte"><div class="nc-n">${n + 1}</div><div class="nc-t"><div class="label">${j.xp} XP${NIVEAUX_JEU[n + 1] ? `, encore ${haut - j.xp} pour le niveau ${n + 2} (${esc(NIVEAUX_JEU[n + 1][1])})` : ", niveau maximum"}</div>
    <div class="nc-b"><span style="width:${Math.min(100, (j.xp - bas) / (haut - bas) * 100)}%"></span></div><div class="nc-s"><span>${medaille("flamme", j.serie > 0, "#c2410c")} ${j.serie} jour${j.serie > 1 ? "s" : ""} d'affilée</span><span>${medaille("coupe", true)} ${Object.keys(j.badges).length} badge${Object.keys(j.badges).length > 1 ? "s" : ""} sur ${BADGES.length}</span></div></div></section>`;
  h += carteMission();
  h += `<h2 class="sec" id="quetes" tabindex="-1">Quêtes de la semaine</h2>`;
  if (!maClasse()) h += `<p class="small">Choisis ta classe sur la page <a href="#semaine">Ma semaine</a> pour recevoir tes quêtes.</p>`;
  else if (!q.length) h += `<p class="small">Pas de séance cette semaine. Voici tes missions de départ : touche une mission pour y aller.</p><ol class="quetes">${missions(4).map(m => `<li>${lienCible(m.cible, `<span class="qc" aria-hidden="true"></span><span>${esc(m.cond)}</span><span class="qx">Vas-y &#8250;</span>`, "")}</li>`).join("")}</ol>`;
  else h += `<ol class="quetes">${q.map(([t, xp, fait, lien]) => `<li class="${fait ? "fait" : ""}"><a href="${lien}"><span class="qc" aria-hidden="true">${fait ? "&#10003;" : ""}</span><span>${esc(t)}</span><span class="qx">${fait ? "fait" : `+${xp} XP`}</span></a></li>`).join("")}</ol><p class="small">Toutes les quêtes terminées : +50 XP et le badge Semaine parfaite.</p>`;
  h += `<h2 class="sec">Badges</h2><p class="small">Touche un badge pour savoir comment le gagner et y aller directement.</p><div class="badges">${BADGES.map(([id, nom, cond, g]) => { const on = !!j.badges[id], [a, b] = progresBadge(id, j), cible = cibleBadge(id);
      return lienCible(on ? null : cible, `${medaille(g, on)}<b>${esc(nom)}</b><span class="small">${esc(cond)}</span>${on ? `<span class="b-ok">Gagné</span>` : `${b > 1 ? `<span class="b-bar"><span style="width:${Math.min(100, a / b * 100)}%"></span></span><span class="b-pr">${Math.min(a, b)} sur ${b}</span>` : ""}<span class="b-go">${cible ? "Vas-y &#8250;" : "Reviens demain"}</span>`}`, "badge" + (on ? " on" : "")); }).join("")}</div>`;
  h += `<h2 class="sec">Les niveaux</h2><ol class="niveaux-l">${NIVEAUX_JEU.map(([x, nom, d], i) => `<li class="${i <= n ? "atteint" : ""}"><span class="lvlbadge" style="background:${i <= n ? "#0b0b0b" : "transparent"};color:${i <= n ? "#fff" : "var(--muted)"};border:1.5px solid ${i <= n ? "#0b0b0b" : "var(--line)"}">${i + 1}</span><span><b>${esc(nom)}</b><span class="small">${x} XP. ${esc(d)}</span></span></li>`).join("")}</ol>`;
  h += `<h2 class="sec">Comment gagner des XP</h2><ul class="plain"><li>Ouvrir une séance : 10 XP. Écouter une œuvre ou un écho : 5 XP.</li><li>Un exemple sonore : 5 XP. Suivre une partition jusqu'au bout : 15 XP.</li><li>Une bonne réponse au quiz : 10 XP, et 30 XP de bonus pour un quiz sans faute.</li><li>Les jeux : chaque réussite compte. Un atelier Faust : 10 XP. Une fiche : 5 XP.</li><li>Venir chaque jour : 5 XP, et la série de jours augmente.</li></ul>`;
  h += `<p style="margin-top:14px"><button type="button" class="btn2" onclick="guide()">Revoir « Comment ça marche »</button></p>`;
  h += `<p class="small" style="margin-top:14px">Ton parcours reste sur cet appareil : rien n'est envoyé, personne d'autre ne le voit. <button type="button" class="lien-btn" id="raz-jeu">Tout recommencer à zéro</button></p>`;
  h += `<p style="margin-top:14px"><a class="btn2" href="#plus">Plus de ressources</a></p>`;
  return h;
}
/* Écouter un lien YouTube ou un écho rapporte des points */
document.addEventListener("click", e => { const a = e.target.closest && e.target.closest("a[data-ancre]"); if (!a) return;
  try { sessionStorage.setItem("ancre", a.dataset.ancre); } catch (_) {} if (a.getAttribute("href") === location.hash) { e.preventDefault(); rendre(); } });
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href*="youtube.com/results"]'); if (!a || !jeuActif()) return;
  const q = decodeURIComponent((a.href.split("search_query=")[1] || "")), m = location.hash.match(/^#seance-(\w+)-(\d+)-(\d+)$/);
  gagner("yt:" + q, 5);
  if (m) gagner(`q-ecoute:${m[1]}-${m[2]}-${m[3]}`, 10);
  const c = a.closest(".echo-c");
  if (c) { const pays = (c.querySelector(".rel") || {}).textContent || ""; pays.split(",").slice(1).join(",").split(",").map(x => x.trim()).filter(Boolean).forEach(p => jeu().pays[p] = 1);
    if (m) gagner(`q-echo:${m[1]}-${m[2]}-${m[3]}`, 10); else gagner(null, 0); }
  verifierSemaine();
});

/* ---------- Routage ---------- */
function rendre() {
  if (METRO) { clearInterval(METRO); METRO = null; }
  if (PROJ && !/^#proj-/.test(location.hash)) { const el = document.getElementById("proj"); if (el) el.remove(); PROJ = null; }
  toutArreter(); arreterLabo();
  let v = (location.hash || "#semaine").slice(1), tab = "semaine";
  if (v === "accueil" || (!role() && !/^(proj|seance|fiche|quiz|faust)/.test(v))) { PILE.length = 0; barre("semaine"); menu(""); app.innerHTML = vueChoix();
    app.querySelectorAll(".choix-b").forEach(b => b.onclick = () => { set("role", b.dataset.role); location.hash = "#semaine"; if (location.hash === "#semaine") rendre(); });
    window.scrollTo(0, 0); return; }
  if (PILE[PILE.length - 2] === v) PILE.pop(); else if (PILE[PILE.length - 1] !== v) PILE.push(v);
  barre(v);
  const defaut = maClasse() || get("niv", "6e");
  if (["cours", "eval", "pratiquer", "reviser"].includes(v)) v = v + "-" + defaut;
  let m;
  if ((m = v.match(/^pratiquer-(\w+)-(oeuvres|jeux|partitions|sons|playlist|atelier)$/)) && D.niveaux[m[1]]) { set("niv", m[1]); app.innerHTML = vuePratiquer(m[1], m[2]); tab = "pratiquer"; }
  else if ((m = v.match(/^(saisie|bilan)-(\w+)$/)) && D.niveaux[m[2]] && role() === "prof") { set("niv", m[2]); tab = "eval";
    if (m[1] === "saisie") { app.innerHTML = vueSaisie(m[2]); brancherSaisie(m[2]); } else { app.innerHTML = vueBilan(m[2]); brancherBilan(m[2]); } }
  else if ((m = v.match(/^cours-(\w+)-(\d+)$/)) && D.niveaux[m[1]] && D.niveaux[m[1]].sequences[+m[2] - 1]) { set("niv", m[1]); app.innerHTML = vueCours(m[1], +m[2]); tab = "cours"; }
  else if ((m = v.match(/^(cours|eval|pratiquer|reviser)-(\w+)$/)) && D.niveaux[m[2]]) {
    set("niv", m[2]);
    if (m[1] === "cours") { app.innerHTML = vueCours(m[2]); tab = "cours"; }
    else if (m[1] === "pratiquer") { app.innerHTML = vuePratiquer(m[2]); tab = "pratiquer"; }
    else if (m[1] === "eval" && role() === "prof") { app.innerHTML = vueEval(m[2]); tab = "eval"; brancherEval(); }
    else { app.innerHTML = vueReviser(m[2]); tab = "reviser"; }
  }
  else if ((m = v.match(/^quiz-(\w+)-(\d+)$/)) && D.niveaux[m[1]] && D.quiz[m[1]][+m[2] - 1]) { app.innerHTML = vueQuiz(m[1], +m[2]); tab = "reviser"; }
  else if (v === "fiches") { app.innerHTML = vueFiches(); tab = "reviser"; }
  else if (v.startsWith("fiche-") && D.fiches[v.slice(6)]) { app.innerHTML = vueFiche(v.slice(6)); tab = "reviser"; }
  else if (v === "projeter") { app.innerHTML = vueProjeter(); tab = "projeter"; }
  else if (v === "vocabulaire") { app.innerHTML = vueVocabulaire(); tab = "cours"; }
  else if (v === "fils" || (v.startsWith("fils-") && D.fils.defs[v.slice(5)])) { app.innerHTML = vueFils(v.slice(5)); tab = "cours"; }
  else if (v === "parcours") { app.innerHTML = vueParcours(); tab = "parcours"; }
  else if (v === "faust") { app.innerHTML = vueFaust(); tab = "faust"; }
  else if (v.startsWith("faust-") && D.ateliers.some(a => a.id === v.slice(6))) { app.innerHTML = vueAtelier(v.slice(6)); tab = "faust"; }
  else if (v === "plus") { app.innerHTML = vuePlus(); tab = "plus"; }
  else if (D.pages[v]) { app.innerHTML = vuePage(v); tab = "plus"; }
  else if (/^seance-\w+-\d+-\d+$/.test(v) && D.niveaux[v.split("-")[1]]) { const [, k, a, b] = v.split("-"); app.innerHTML = vueSeance(k, +a, +b); tab = "cours"; }
  else if (/^semaine-\d+$/.test(v)) app.innerHTML = vueSemaine(+v.split("-")[1]);
  else if (/^proj-\w+-\d+-\d+$/.test(v) && D.niveaux[v.split("-")[1]]) { const [, k, a, b] = v.split("-"); app.innerHTML = vueSeance(k, +a, +b); tab = "cours"; ouvrirProj(diaposSeance(k, +a, +b), `${k}, séquence ${a}, séance ${b}`, `seance-${k}-${a}-${b}`, D.couleurs[k]); PROJ.fils = filsDe(k, +a, +b); dessinerProj(); }
  else if (v === "seance-accueil") { app.innerHTML = vueAccueil(); tab = "cours"; }
  else if (v === "proj-accueil") { app.innerHTML = vueAccueil(); tab = "cours"; ouvrirProj(D.diapos.accueil, "Séance d'accueil", "seance-accueil"); }
  else app.innerHTML = vueSemaine();
  menu(tab);
  { const b = document.getElementById("b-signal"); if (b) b.onclick = () => { const on = !document.documentElement.classList.contains("signal"); set("signal", on ? "1" : "0"); document.documentElement.classList.toggle("signal", on); rendre(); }; }
  ["eleve", "prof"].forEach(x => { const b = document.getElementById("m-" + x); if (b) b.onclick = () => { set("mode-" + (role() || "eleve"), x); rendre(); }; });
  document.querySelectorAll(".pick-b").forEach(b => b.onclick = () => { set("classe", b.dataset.classe); set("niv", b.dataset.classe); rendre(); });
  const oth = document.getElementById("others"); if (oth) oth.addEventListener("toggle", () => set("tout", oth.open ? "1" : ""));
  journee(); majPuce();
  app.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { app.querySelectorAll("[data-theme]").forEach(x => x.setAttribute("aria-selected", x === b)); app.querySelectorAll("[data-theme-p]").forEach(p => p.hidden = p.dataset.themeP !== b.dataset.theme); });
  if (jeuActif() && !get("guide-vu", "")) { set("guide-vu", "1"); setTimeout(guide, 300); }
  { const anc = sessionStorage.getItem("ancre"); if (anc) { sessionStorage.removeItem("ancre"); setTimeout(() => { const el = document.getElementById(anc) || app.querySelector("." + anc);
      if (el) { if (el.tagName === "DETAILS") el.open = true; el.scrollIntoView({ block: "start" }); const f = el.matches("h2,h3,section") ? el : el.querySelector("h2,h3,summary"); if (f) { f.tabIndex = -1; f.focus({ preventScroll: true }); } el.classList.add("cible-vue"); setTimeout(() => el.classList.remove("cible-vue"), 2200); } }, 60); } }
  app.querySelectorAll("[data-aller-etape]").forEach(a => a.addEventListener("click", () => set("etape:" + a.dataset.seance, a.dataset.allerEtape)));
  app.querySelectorAll("[data-etape]").forEach(b => b.onclick = () => { const id = b.dataset.etape; set("etape:" + location.hash.replace("#seance-", ""), id);
    app.querySelectorAll(".etapes [role=tab]").forEach(t => t.setAttribute("aria-selected", t.dataset.etape === id));
    app.querySelectorAll(".panneau").forEach(p => p.hidden = p.id !== "pa-" + id);
    if (b.closest(".suite")) { const nav = app.querySelector(".etapes"); nav.scrollIntoView({ block: "start" }); document.getElementById("et-" + id).focus({ preventScroll: true }); } });
  { const z = document.getElementById("raz-jeu"); if (z) z.onclick = () => { if (confirm("Effacer tout ton parcours (XP, badges) sur cet appareil ?")) { PARC = JEU_VIDE(); sauverJeu(); rendre(); } }; }
  { let m; if ((m = v.match(/^seance-(\w+)-(\d+)-(\d+)$/))) { gagner(`seance:${m[1]}-${m[2]}-${m[3]}`, 10, "seances"); verifierSemaine(); }
    if (v.startsWith("fiche-")) gagner("fiche:" + v.slice(6), 5, "fiches");
    if (v.startsWith("faust-")) gagner("faust:" + v.slice(6), 10, "faust"); }
  brancherAtelier(); brancherJeux(); brancherQuiz(); if (v.startsWith("faust-")) brancherAtelier2(v.slice(6)); remplirGaleries(app);
  const ouverte = /^cours-\w+-\d+$/.test(v) && app.querySelector("details.seq[open]");
  if (ouverte && !PROJ) { setTimeout(() => ouverte.scrollIntoView({ block: "start" }), 0); }
  else if (!PROJ) { window.scrollTo(0, 0); const h1 = app.querySelector("h1"); if (h1 && document.activeElement && document.activeElement !== document.body) { h1.tabIndex = -1; h1.focus({ preventScroll: true }); } }
  const st = document.getElementById("strip"), on = st && st.querySelector(".on");
  if (on) st.scrollLeft = on.offsetLeft - st.clientWidth / 2 + on.clientWidth / 2;
}
window.addEventListener("hashchange", rendre);
rendre();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").then(r => r.update()).catch(() => {});
</script>
