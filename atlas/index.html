/* ---------- Laboratoire des techniques ---------- */
function vueTechniques() {
  const instr = D.entries.filter(e => e.type === "instrument").sort((a, b) => a.period.start - b.period.start);
  return `<span class="etiq">Laboratoire des techniques</span><h1>Ce qui rend les musiques possibles</h1><p class="lead">Des idées d'écriture, des façons de fabriquer le son, des rythmes, des machines. Une idée traverse souvent des musiques très éloignées.</p>
  ${D.rubriques.map(r => `<h2>${esc(r.nom)}</h2><div class="concepts">${r.concepts.map(i => conceptHtml(CO[i])).join("")}</div>`).join("")}
  <h2>Les instruments et les machines</h2><div class="grille">${instr.map(e => `<a class="carte" style="--c:${coul(e)}" href="#e/${e.id}"><b>${esc(e.name)}</b><span>${e.period.start}, ${esc(e.region)}</span><span>${esc(e.description)}</span></a>`).join("")}</div>
  <h2>Les techniques</h2><div class="pastilles">${D.entries.filter(e => e.type === "technique").map(e => `<a class="pastille" style="--c:${coul(e)}" href="#e/${e.id}">${esc(e.name)}</a>`).join("")}</div>
  <h2>Essayer soi-même</h2><p>Le Labo du cours permet de fabriquer et de transformer des sons avec Faust : <a href="../eleves/#labo">ouvrir le Labo</a>.</p>`;
}

/* ---------- Bibliothèque d'écoute ---------- */
function vueEcoute() {
  return `<span class="etiq">Bibliothèque d'écoute</span><h1>Comparer pour comprendre</h1><p class="lead">Deux morceaux, une question. Les liens ouvrent une recherche sur YouTube dans un nouvel onglet : choisis une version officielle ou un enregistrement d'archive.</p>
  ${D.ecoutes.map(c => `<section class="comparaison"><h3>${esc(c.titre)}</h3><div class="duo">${c.morceaux.map(([t, q]) => `<a href="${yt(q)}" target="_blank" rel="noopener">${esc(t)}<span>Chercher sur YouTube (recherche externe, nouvel onglet)</span></a>`).join("")}</div>
   <p class="question">${esc(c.question)}</p><div class="pastilles">${c.entrees.map(i => `<a class="pastille" style="--c:${coul(E[i])}" href="#e/${i}">${esc(E[i].name)}</a>`).join("")}</div></section>`).join("")}`;
}

/* ---------- Trajets ---------- */
function vueParcoursListe() {
  const cadre = D.families.map(fa => {
    const L = D.entries.filter(e => e.family === fa.id), racines = L.filter(e => !e.parent || !E[e.parent] || E[e.parent].family !== fa.id).length;
    const comp = L.filter(e => e.type === "composer" || e.type === "artist").length;
    return `<a class="carte" style="--c:${coul({family: fa.id})}" href="#f/${fa.id}"><b>${esc(fa.name)}</b><span>${esc(fa.description)}</span><span class="suite">${L.length} entrées, ${comp} compositeurs et artistes &#8250;</span></a>`;
  }).join("");
  return `<span class="etiq">Trajets</span><h1>D'abord le cadre, ensuite les chemins</h1>
  <p class="lead">L'Atlas est organisé en ${D.families.length} grandes familles musicologiques, qui couvrent les musiques écrites, le jazz, le rock, la pop, les musiques urbaines, électroniques, d'Amérique latine, d'Afrique, des Caraïbes, d'Asie et du Moyen-Orient. Chaque trajet ci-dessous n'est qu'un chemin à travers ce cadre.</p>
  <h2>Le cadre : toutes les familles</h2><div class="grille">${cadre}</div>
  <div class="pastilles" style="margin-top:12px"><a class="pastille" style="--c:#11110F" href="#tout">Toutes les entrées de A à Z</a><a class="pastille" style="--c:#11110F" href="#arbre">Arbre des genres</a><a class="pastille" style="--c:#11110F" href="#frise">Frise chronologique</a></div>
  <p class="avis">Ce corpus n'est pas encore exhaustif : ${D.entries.length} entrées pour un cadre qui en demandera des milliers. Les familles sont musicologiques (pratiques, esthétiques, régions), non des catégories de plateformes. Les trajets sont des interprétations et le disent à chaque étape.</p>
  <h2>Trajets guidés (${D.parcours.length})</h2><p class="petit">Ils montrent ce qui change à chaque étape. Ce sont des chemins possibles, pas les seuls.</p>
  <div class="grille">${D.parcours.map(p => `<a class="carte" style="--c:${coul(E[p.etapes[0].id])}" href="#p/${p.id}"><b>${esc(p.titre)}</b><span>${esc(p.intro)}</span><span class="suite">${p.etapes.length} étapes &#8250;</span></a>`).join("")}</div>`;
}
function vueParcours(id) {
  const p = D.parcours.find(x => x.id === id); if (!p) return vueParcoursListe();
  return `<span class="etiq">Trajet</span><h1>${esc(p.titre)}</h1><p class="lead">${esc(p.intro)}</p>
  <ol class="etapes">${p.etapes.map((s, i) => { const e = E[s.id], suiv = p.etapes[i + 1], r = suiv && REL.ent[s.id].find(x => FILI.includes(x.type) && x.source === suiv.id), t = r && texteRel(r);
    return `<li style="--c:${coul(e)}">${nomLien(s.id)}<div class="petit">${esc(periode(e))}, ${esc(e.region)}</div><p>${esc(s.texte)}</p>${r ? `<p class="petit">${TNOM[r.type]}, ${statutHtml(r)} : ${esc(t)}</p>` : ""}</li>`; }).join("")}</ol>
  <div class="pastilles"><a class="pastille" style="--c:#11110F" href="#frise/${p.etapes[0].id}">Voir sur la frise</a><a class="pastille clair" href="#parcours">Les autres trajets</a></div>${AVIS}`;
}

/* ---------- Sources et méthode ---------- */
function vueSources() {
  return `<span class="etiq">Sources et méthode</span><h1>Ce que l'Atlas sait, et comment il le sait</h1>
  <p class="lead">Version ${esc(D.meta.version)}. ${esc(D.meta.scope)}.</p><p>${esc(D.meta.methodology)}</p>
  <h2>Trois niveaux de confiance</h2><ul><li><span class="statut etabli">Fait établi</span> : un fait daté dont la source est citée (un enregistrement, une rencontre, un échantillon repris). Aucun lien ne porte encore ce statut : les rapprochements autrefois présentés comme établis sont affichés « Interprétation, à sourcer » jusqu'à ce que leur référence soit ajoutée.</li><li><span class="statut interpretation">Interprétation</span> : un rapprochement généralement admis, qui demande à être documenté.</li><li><span class="statut hypothese">Hypothèse</span> : une piste à vérifier. Aucune n'est utilisée pour l'instant.</li></ul>
  <div class="avis">Aucune entrée de ce corpus de départ n'a encore été confrontée aux sources de référence ci-dessous : il manque, pour chaque entrée, la source précise, son adresse, son auteur, la date de consultation et les affirmations qu'elle appuie. Cette étape reste à faire avant de présenter l'Atlas comme une référence.</div>
  <h2>Sources de référence à consulter</h2><p class="petit">Elles n'ont pas le même statut scientifique : on privilégie les publications universitaires et les archives institutionnelles pour les affirmations historiques. Les catégories d'une plateforme commerciale ne sont pas des catégories musicologiques.</p>
  <ul class="liens">${D.sources.map(s => `<li><span class="nat">${esc(s.genre)}</span><span><a class="nom" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.nom)}</a></span><p>Fiabilité : ${esc(s.fiabilite)}.</p></li>`).join("")}</ul>
  <h2>Les relations</h2><p>${Object.entries(TNOM).map(([k, n]) => `${n} (${k}) : ${D.relations.filter(r => r.type === k).length}`).join(" ; ")}.</p>`;
}

/* ---------- Routes ---------- */
function rendre() {
  let h = (location.hash || "#").slice(1); try { h = decodeURIComponent(h); } catch (_) {}
  const [r, a] = h.split("/");
  let html, apres = null, onglet = "accueil";
  if (r === "e") { html = vueEntree(a); onglet = ""; apres = () => brancherFiche(a); }
  else if (r === "f") { html = vueFamille(a); onglet = ""; }
  else if (r === "arbre") { html = vueArbre(a); onglet = "arbre"; }
  else if (r === "graphe") { html = vueGraphe(a); onglet = "graphe"; apres = () => dessinerGraphe(a); }
  else if (r === "frise" || r === "carte") { html = vueFrise(a); apres = brancherFrise; onglet = "frise"; }
  else if (r === "monde") { html = vueMonde(a); apres = brancherMonde; onglet = "monde"; }
  else if (r === "techniques" || r === "idees") { html = vueTechniques(); onglet = "techniques"; }
  else if (r === "ecoute") { html = vueEcoute(); onglet = "ecoute"; }
  else if (r === "p") { html = vueParcours(a); onglet = "parcours"; }
  else if (r === "parcours") { html = vueParcoursListe(); onglet = "parcours"; }
  else if (r === "tout") { html = vueTout(a); onglet = ""; }
  else if (r === "sources") { html = vueSources(); onglet = ""; }
  else if (r === "hasard") { const L = D.entries.filter(e => !["artist", "group", "composer", "instrument"].includes(e.type)); location.replace("#e/" + L[Math.floor(Math.random() * L.length)].id); return; }
  else { html = vueAccueil(); apres = brancherAccueil; }
  app.innerHTML = html; if (apres) apres();
  document.querySelectorAll("header.haut nav a").forEach(x => x.toggleAttribute("aria-current", x.dataset.n === onglet));
  const nom = r === "e" && E[a] ? E[a].name + ", " : ""; document.title = nom + "Atlas mondial des musiques";
  window.scrollTo(0, 0);
}
/* En-tête commun : les éléments de tête (étiquette, titre, phrase) sont rassemblés dans le bandeau noir, et le titre est coupé en deux lignes. */
function habillerAtlas() {
  const prem = app.firstElementChild; if (!prem || prem.classList.contains("bande") || prem.classList.contains("fiche-tete") && prem.querySelector("h1.ph")) return;
  const sepH1 = h => { if (h.children.length || h.classList.contains("ph")) return; const m = h.textContent.trim().split(" "), k = m.length < 2 ? 1 : Math.ceil(m.length / 2); h.classList.add("ph"); h.innerHTML = `<span>${esc(m.slice(0, k).join(" "))}</span>${m.length > 1 ? ` <span class="l2">${esc(m.slice(k).join(" "))}</span>` : ""}`; };
  if (prem.classList.contains("fiche-tete")) { const h = prem.querySelector("h1"); if (h) sepH1(h); return; }
  if (!prem.classList.contains("etiq")) return;
  const b = document.createElement("header"); b.className = "bande"; let n = prem;
  while (n && (n.classList.contains("etiq") || n.tagName === "H1" || n.classList.contains("lead")) && b.children.length < 3) { const s = n.nextElementSibling; b.appendChild(n); n = s; }
  const h = b.querySelector("h1"); if (h) sepH1(h); app.insertBefore(b, n);
}
new MutationObserver(habillerAtlas).observe(app, { childList: true });
/* Liens externes : ils s'ouvrent dans une fenêtre embarquée au-dessus de la page (aussi au-dessus d'un diaporama projeté), avec toujours un bouton pour les ouvrir dans un onglet.
   Certains sites interdisent d'être affichés dans une autre page (YouTube, Google, réseaux sociaux...) : pour ceux-là, une vraie petite fenêtre s'ouvre, qui ne quitte pas le cours. */
const HOTES_SANS_CADRE = /(^|\.)(youtube\.com|youtu\.be|youtube-nocookie\.com|google\.[a-z.]+|facebook\.com|instagram\.com|x\.com|twitter\.com|spotify\.com|deezer\.com|apple\.com|bandcamp\.com|soundcloud\.com)$/i;
function ouvrirFenetreExterne(url, titre) {
  let h; try { h = new URL(url, location.href).hostname; } catch (_) { return false; }
  if (HOTES_SANS_CADRE.test(h)) { const f = window.open(url, "externe", "popup=yes,width=1000,height=720"); if (f) { try { f.opener = null; } catch (_) {} return true; } return false; }
  document.getElementById("fenetre-ext")?.remove();
  const el = document.createElement("div"); el.id = "fenetre-ext"; el.className = "fenetre-ext"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-label", titre || "Page externe");
  el.innerHTML = `<div class="fe-boite"><div class="fe-haut"><span class="fe-titre">${esc(titre || h)}</span><span class="fe-hote">${esc(h)}</span><a class="fe-onglet" href="${esc(url)}" target="_blank" rel="noopener" data-sans-fenetre>Ouvrir dans un onglet</a><button type="button" class="fe-fermer" aria-label="Fermer la fenêtre">Fermer</button></div>
    <iframe class="fe-cadre" src="${esc(url)}" title="${esc(titre || h)}" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-presentation" allow="autoplay; fullscreen"></iframe>
    <p class="fe-aide">Si la page reste vide, ce site refuse d'être affiché ici : utilise « Ouvrir dans un onglet ».</p></div>`;
  document.body.appendChild(el); const retour = document.activeElement;
  const fermer = () => { el.remove(); document.removeEventListener("keydown", clavier, true); if (retour && retour.focus) try { retour.focus(); } catch (_) {} };
  const clavier = e => { if (e.key === "Escape") { e.stopPropagation(); e.preventDefault(); fermer(); } };
  document.addEventListener("keydown", clavier, true); el.querySelector(".fe-fermer").onclick = fermer; el.addEventListener("click", e => { if (e.target === el) fermer(); }); el.querySelector(".fe-fermer").focus();
  return true;
}
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[target="_blank"][href^="http"]'); if (!a || a.hasAttribute("data-sans-fenetre") || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
  let u; try { u = new URL(a.href); } catch (_) { return; } if (u.origin === location.origin) return;
  if (ouvrirFenetreExterne(a.href, (a.textContent || "").replace(/\s+/g, " ").trim().slice(0, 80))) e.preventDefault();
}, true);
brancherRecherche(); window.addEventListener("hashchange", rendre); rendre();
</script>
