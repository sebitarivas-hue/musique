sur les contretemps, tempo autour de 120 battements par minute.","timbres":"Cordes d'orchestre, cuivres, basse mobile, guitare funk, synthétiseurs.","reperes":[[1975,"Donna Summer enregistre Love to Love You Baby avec Giorgio Moroder et Pete Bellotte."],[1977,"Donna Summer, I Feel Love, produit par Giorgio Moroder presque entièrement au synthétiseur."],[1979,"Chic, Good Times ; Disco Demolition Night à Chicago."]],"ecoute":[["Donna Summer, I Feel Love (1977)","Donna Summer I Feel Love"],["Chic, Good Times (1979)","Chic Good Times"],["Bee Gees, Stayin' Alive (1977)","Bee Gees Stayin Alive"]],"questions":["Peux-tu compter les battements par minute avec la grosse caisse ?","Quel instrument fait la boucle de basse et qu'est-ce qui la rend entêtante ?"],"statut":"brouillon"},"rock-roll":{"origines":"Le rock and roll se forme dans les années 1950 aux États-Unis à partir du rhythm and blues, du country, du gospel et du boogie-woogie.","contexte":"Il se diffuse par la radio, les juke-box et le disque, auprès d'un public adolescent, dans un pays encore ségrégué où des artistes noirs (Chuck Berry, Little Richard, Fats Domino) et blancs (Elvis Presley, Jerry Lee Lewis) font entendre une musique commune. La maison de disques Sun, à Memphis, dirigée par Sam Phillips, joue un rôle important.","rythme":"Pulsation à quatre temps avec accent sur les deuxième et quatrième temps (le backbeat), souvent en croches de boogie.","harmonie":"Grille de blues de douze mesures ou formes simples sur trois accords.","timbres":"Guitare électrique, contrebasse puis basse électrique, batterie, piano ; voix criée ou murmurée.","reperes":[[1951,"Rocket 88, par Jackie Brenston and his Delta Cats (le groupe d'Ike Turner), est souvent cité comme l'un des premiers disques de rock and roll."],[1954,"Elvis Presley enregistre That's All Right chez Sun, à Memphis."],[1955,"Chuck Berry, Maybellene ; Little Richard, Tutti Frutti ; Bill Haley, Rock Around the Clock, numéro un aux États-Unis."]],"ecoute":[["Chuck Berry, Johnny B. Goode (1958)","Chuck Berry Johnny B Goode"],["Little Richard, Tutti Frutti (1955)","Little Richard Tutti Frutti"],["Jerry Lee Lewis, Great Balls of Fire (1957)","Jerry Lee Lewis Great Balls of Fire"]],"questions":["Où tombe l'accent : sur les temps 1 et 3, ou sur 2 et 4 ?","Quel instrument tient le rôle principal : la voix, la guitare ou le piano ?"],"statut":"brouillon"},"psychedelic-rock":{"origines":"Le rock psychédélique apparaît au milieu des années 1960 à San Francisco, à Londres et au Texas.","contexte":"Il accompagne la contre-culture et l'usage du LSD ; les musiciens cherchent à représenter ou provoquer des états de conscience modifiés. Le studio devient un instrument : bandes inversées, échos, superpositions.","timbres":"Guitare avec fuzz, wah-wah et réverbération, orgue, sitar (chez les Beatles et les Rolling Stones), effets de studio.","formes":"Morceaux plus longs, improvisations collectives sur scène, albums conçus comme un tout.","reperes":[[1966,"The Beatles, Revolver, dont Tomorrow Never Knows ; The 13th Floor Elevators, The Psychedelic Sounds of the 13th Floor Elevators."],[1967,"Sgt. Pepper's Lonely Hearts Club Band (Beatles) ; Are You Experienced (Jimi Hendrix) ; The Piper at the Gates of Dawn (Pink Floyd) ; Summer of Love à San Francisco."]],"ecoute":[["The Beatles, Tomorrow Never Knows (1966)","The Beatles Tomorrow Never Knows"],["Jimi Hendrix Experience, Purple Haze (1967)","Jimi Hendrix Purple Haze"],["Pink Floyd, Interstellar Overdrive (1967)","Pink Floyd Interstellar Overdrive"]],"questions":["Quels effets de studio reconnais-tu : écho, inversion, superposition ?","Cette musique cherche-t-elle à raconter une histoire ou à créer une atmosphère ?"],"statut":"brouillon"},"progressive-rock":{"origines":"Le rock progressif se forme à la fin des années 1960 au Royaume-Uni, autour de King Crimson, Pink Floyd, Yes, Genesis et Emerson, Lake and Palmer.","contexte":"Des musiciens issus du rock, souvent formés à la musique classique, cherchent à élargir ses formes : morceaux de plus de dix minutes, albums conceptuels, influences classiques et jazz.","rythme":"Mesures irrégulières (5/4, 7/8) et changements de métrique fréquents.","timbres":"Mellotron, orgue, synthétiseurs analogiques, flûte, guitares électriques, basse très présente.","formes":"Suites en plusieurs mouvements, parfois occupant une face entière de disque.","reperes":[[1969,"King Crimson, In the Court of the Crimson King."],[1972,"Yes, Close to the Edge."],[1973,"Pink Floyd, The Dark Side of the Moon."]],"ecoute":[["King Crimson, 21st Century Schizoid Man (1969)","King Crimson 21st Century Schizoid Man"],["Yes, Roundabout (1971)","Yes Roundabout"],["Pink Floyd, Time (1973)","Pink Floyd Time Dark Side of the Moon"]],"questions":["Peux-tu battre la pulsation tout au long du morceau ? Où devient-elle difficile ?","Quels instruments sont inhabituels dans le rock ?"],"statut":"brouillon"},"punk":{"origines":"Le punk rock naît au milieu des années 1970 à New York (autour du club CBGB, ouvert en 1973) et à Londres.","contexte":"Dans un Royaume-Uni en crise économique, le punk exprime la colère d'une partie de la jeunesse. Le principe est de tout faire soi-même (DIY) : on enregistre vite, on édite sur de petits labels, on joue sans virtuosité. Malcolm McLaren, manager des Sex Pistols, joue un rôle important à Londres.","rythme":"Tempo rapide, croches droites, batterie simple et frappée fort.","harmonie":"Trois ou quatre accords, souvent des accords de puissance (quinte sans tierce).","formes":"Chansons de deux ou trois minutes, strophes et refrains très directs.","reperes":[[1976,"Premier album des Ramones (avril) ; Sex Pistols, Anarchy in the U.K. (novembre)."],[1977,"Premier album des Clash ; Sex Pistols, Never Mind the Bollocks, Here's the Sex Pistols."],[1979,"The Clash, London Calling."]],"ecoute":[["Ramones, Blitzkrieg Bop (1976)","Ramones Blitzkrieg Bop"],["Sex Pistols, God Save the Queen (1977)","Sex Pistols God Save the Queen"],["The Clash, London Calling (1979)","The Clash London Calling"]],"questions":["Combien d'accords entends-tu ?","Que veut dire le chanteur, et comment le dit-il : par les mots, par la voix ?"],"statut":"brouillon"},"post-punk":{"origines":"Le post-punk se forme entre 1978 et 1982, surtout au Royaume-Uni (Manchester, Londres, Leeds, Sheffield), après le punk.","contexte":"Des musiciens gardent l'énergie du punk mais en refusent les codes : ils cherchent des sons nouveaux, des influences du dub, du funk, de la musique électronique et du krautrock. De petits labels (Factory à Manchester, Rough Trade à Londres) soutiennent ces projets.","rythme":"Basses mélodiques proéminentes, batteries sèches, rythmes inspirés du funk et du dub.","timbres":"Guitares métalliques et dissonantes, synthétiseurs, voix froides ou scandées.","reperes":[[1977,"Wire, Pink Flag."],[1979,"Joy Division, Unknown Pleasures ; Gang of Four, Entertainment! ; Public Image Ltd, Metal Box."],[1980,"Mort du chanteur de Joy Division, Ian Curtis."]],"ecoute":[["Joy Division, Love Will Tear Us Apart (1980)","Joy Division Love Will Tear Us Apart"],["Gang of Four, Damaged Goods (1978)","Gang of Four Damaged Goods"],["Public Image Ltd, Public Image (1978)","Public Image Ltd Public Image"]],"questions":["Quel instrument mène la musique : la basse, la guitare, la voix ?","Quelle différence entends-tu avec un morceau punk de 1977 ?"],"statut":"brouillon"},"heavy-metal":{"origines":"Le heavy metal naît en Angleterre à la fin des années 1960 et au début des années 1970, à Birmingham notamment, avec Black Sabbath, et avec Led Zeppelin et Deep Purple pour le hard rock voisin.","contexte":"Black Sabbath, groupe d'une ville industrielle, mêle riffs lourds et thèmes sombres. À la fin des années 1970 et au début des années 1980, la Nouvelle Vague du heavy metal britannique (Iron Maiden, Judas Priest) puis le thrash metal américain (Metallica) le durcissent et l'accélèrent.","harmonie":"Riffs construits sur des accords de puissance et sur le triton, appelé autrefois diabolus in musica.","timbres":"Guitares très saturées, basse puissante, batterie lourde, voix hautes ou rauques.","reperes":[[1970,"Black Sabbath publie Black Sabbath (février) puis Paranoid (septembre)."],[1980,"Judas Priest, British Steel."],[1983,"Metallica, Kill 'Em All."]],"ecoute":[["Black Sabbath, Black Sabbath (1970)","Black Sabbath Black Sabbath 1970"],["Judas Priest, Breaking the Law (1980)","Judas Priest Breaking the Law"],["Metallica, Master of Puppets (1986)","Metallica Master of Puppets"]],"questions":["Peux-tu chanter le riff principal ?","Quel rôle joue la distorsion dans la couleur du morceau ?"],"statut":"brouillon"},"grunge":{"origines":"Le grunge se développe à Seattle, dans l'État de Washington, du milieu des années 1980 au début des années 1990.","contexte":"Le label local Sub Pop, fondé en 1986, diffuse Mudhoney, Soundgarden et Nirvana. En 1991, Nevermind, de Nirvana, atteint un public mondial ; le chanteur Kurt Cobain meurt en avril 1994.","harmonie":"Accords de puissance, enchaînements simples, alternance de couplets calmes et de refrains saturés.","timbres":"Guitares très saturées, voix rauque ou cassée, batterie lourde.","reperes":[[1986,"Fondation de Sub Pop à Seattle."],[1991,"Pearl Jam, Ten (août) ; Nirvana, Nevermind (septembre) ; Soundgarden, Badmotorfinger (octobre)."],[1994,"Mort de Kurt Cobain."]],"ecoute":[["Nirvana, Smells Like Teen Spirit (1991)","Nirvana Smells Like Teen Spirit"],["Pearl Jam, Alive (1991)","Pearl Jam Alive"],["Soundgarden, Black Hole Sun (1994)","Soundgarden Black Hole Sun"]],"questions":["Comment la dynamique passe-t-elle du calme au bruit ?","Qu'est-ce que la voix exprime : la colère, la fatigue, autre chose ?"],"statut":"brouillon"},"shoegaze":{"origines":"Le shoegaze apparaît à la fin des années 1980 au Royaume-Uni. Le nom, qui veut dire « regarder ses chaussures », vient de la posture des guitaristes concentrés sur leurs pédales d'effets.","contexte":"My Bloody Valentine, Slowdive et Ride en sont les figures principales. Le genre cherche un mur de son où guitares et voix se fondent.","timbres":"Guitares très effectuées (réverbération, chorus, distorsion, tremolo), voix murmurées mêlées aux instruments.","production":"Le son vient du travail en studio et des pédales : My Bloody Valentine passe plusieurs années à enregistrer Loveless.","reperes":[[1988,"My Bloody Valentine, Isn't Anything."],[1990,"Ride, Nowhere."],[1991,"My Bloody Valentine, Loveless."],[1993,"Slowdive, Souvlaki."]],"ecoute":[["My Bloody Valentine, Only Shallow (1991)","My Bloody Valentine Only Shallow"],["Slowdive, Alison (1993)","Slowdive Alison"],["Ride, Vapour Trail (1990)","Ride Vapour Trail"]],"questions":["Peux-tu distinguer la voix des guitares ? Pourquoi est-ce difficile ?","Quels effets entends-tu : écho, réverbération, vibrato ?"],"statut":"brouillon"},"rap":{"origines":"Le rap est l'art de la voix rythmée sur un beat, l'un des quatre éléments du hip-hop avec le DJing, le graffiti et la danse. Il naît dans le Bronx, à New York, dans les années 1970.","contexte":"Les premiers rappeurs animent des fêtes de quartier, puis le rap entre dans l'industrie du disque à la fin des années 1970. Il devient au fil des décennies un moyen d'expression sociale et politique, et l'un des premiers genres commerciaux du monde.","rythme":"Le flow : la manière de poser les syllabes sur la pulsation, par groupes, avec rimes internes et déplacements d'accents.","formes":"Couplets de seize mesures, refrain, pont.","reperes":[[1979,"The Sugarhill Gang, Rapper's Delight, l'un des premiers rap commerciaux."],[1982,"Grandmaster Flash and the Furious Five, The Message."],[1986,"Run-DMC et Aerosmith, Walk This Way."],[1988,"Public Enemy, It Takes a Nation of Millions to Hold Us Back."],[1994,"Nas, Illmatic."]],"ecoute":[["Grandmaster Flash and the Furious Five, The Message (1982)","Grandmaster Flash The Message"],["Public Enemy, Fight the Power (1989)","Public Enemy Fight the Power"],["Nas, N.Y. State of Mind (1994)","Nas N.Y. State of Mind"]],"questions":["Où le rappeur place-t-il les accents par rapport à la pulsation ?","Quelles rimes entends-tu à l'intérieur des phrases ?"],"statut":"brouillon"},"boom-bap":{"origines":"Le boom bap désigne un style de production du rap de la côte Est américaine, surtout new-yorkais, de la fin des années 1980 aux années 1990. Le nom imite le son de la grosse caisse (boom) et de la caisse claire (bap).","contexte":"Des producteurs comme DJ Premier, Pete Rock, Large Professor et RZA fabriquent des beats en découpant des disques de jazz, de funk et de soul avec des échantillonneurs (E-mu SP-1200, Akai MPC60).","rythme":"Tempo entre 85 et 95 battements par minute en général, grosse caisse sur le temps 1, caisse claire sur le temps 2 et 4, charleston discret.","production":"Samples de disques (cuivres, pianos, basses) bouclés et filtrés, parfois détériorés volontairement pour garder un grain.","reperes":[[1987,"Boogie Down Productions, Criminal Minded."],[1993,"Wu-Tang Clan, Enter the Wu-Tang (36 Chambers), produit par RZA."],[1994,"Nas, Illmatic, avec des productions de DJ Premier, Pete Rock et Large Professor."]],"ecoute":[["Gang Starr, Mass Appeal (1994)","Gang Starr Mass Appeal"],["Pete Rock and CL Smooth, T.R.O.Y. (1992)","Pete Rock CL Smooth T.R.O.Y."],["Wu-Tang Clan, C.R.E.A.M. (1993)","Wu-Tang Clan C.R.E.A.M."]],"questions":["Quel instrument est échantillonné ? Peux-tu en deviner l'origine ?","Quel est le tempo ? Tape-le sur la table."],"statut":"brouillon"},"gangsta-rap":{"origines":"Le gangsta rap se développe dans la seconde moitié des années 1980 aux États-Unis, d'abord à Philadelphie (Schoolly D) et à Los Angeles (Ice-T, N.W.A).","contexte":"Il raconte la vie dans des quartiers marqués par la pauvreté, le trafic de drogue et la violence policière, sur un ton souvent brutal. Il suscite une forte controverse : des responsables politiques et des associations l'accusent d'incitation à la violence, d'autres y voient un témoignage. L'autocollant d'avertissement « Parental Advisory » apparaît en 1990.","reperes":[[1986,"Ice-T, 6 in the Mornin'."],[1988,"N.W.A, Straight Outta Compton."],[1992,"Dr. Dre, The Chronic."]],"ecoute":[["Ice-T, 6 in the Mornin' (1986)","Ice-T 6 in the Mornin"],["N.W.A, Straight Outta Compton (1988)","N.W.A Straight Outta Compton"],["Dr. Dre, Nuthin' but a 'G' Thang (1992)","Dr. Dre Nuthin but a G Thang"]],"questions":["Quel est le point de vue du narrateur ? Raconte-t-il, accuse-t-il, se vante-t-il ?","Pourquoi un témoignage sur la violence peut-il être entendu comme une apologie de la violence ?"],"statut":"brouillon"},"g-funk":{"origines":"Le G-funk (gangsta funk) naît à Los Angeles au début des années 1990 avec Dr. Dre, pour qui le funk de George Clinton et de Parliament-Funkadelic est une source principale.","contexte":"Le style adoucit la violence du gangsta rap par des productions chaudes, mélodiques et lentes. The Chronic (1992) et Doggystyle de Snoop Dogg (1993) en sont les albums fondateurs.","rythme":"Tempo lent, autour de 90 à 100 battements par minute, groove relâché.","timbres":"Ligne de synthétiseur aiguë et glissante (le « whine »), basse funk, chœurs féminins, samples de P-Funk.","reperes":[[1992,"Dr. Dre, The Chronic."],[1993,"Snoop Dogg, Doggystyle."],[1994,"Warren G, Regulate."]],"ecoute":[["Dr. Dre, Let Me Ride (1992)","Dr. Dre Let Me Ride"],["Snoop Dogg, Gin and Juice (1993)","Snoop Dogg Gin and Juice"],["Warren G et Nate Dogg, Regulate (1994)","Warren G Regulate"]],"questions":["Peux-tu repérer la ligne aiguë de synthétiseur ?","Quelle différence entends-tu avec un beat de boom bap new-yorkais ?"],"statut":"brouillon"},"trap":{"origines":"La trap naît à Atlanta, en Géorgie, dans les années 1990 et 2000. Le mot désigne en argot un lieu de vente de drogue, et par extension la vie qu'on y associe.","contexte":"Des rappeurs comme T.I., Young Jeezy et Gucci Mane, et des producteurs comme Shawty Redd, Zaytoven, Lex Luger et Metro Boomin, forgent un son sombre et dépouillé qui se répand dans le monde entier dans les années 2010.","rythme":"Pulsation lente ressentie (en demi-temps), caisse claire ou clap sur le troisième temps, avec des roulements de charleston très rapides, en triolets et en subdivisions fines.","timbres":"Grosse caisse longue et grave (inspirée de la Roland TR-808), caisse claire ou clap sec, synthétiseurs sombres, cuivres ou cordes de synthèse, voix doublées.","reperes":[[2003,"T.I., Trap Muzik."],[2005,"Young Jeezy, Let's Get It: Thug Motivation 101."],[2013,"Migos, Versace."]],"ecoute":[["T.I., Rubber Band Man (2003)","T.I. Rubber Band Man"],["Young Jeezy, And Then What (2005)","Young Jeezy And Then What"],["Migos, Versace (2013)","Migos Versace"]],"questions":["Entends-tu les roulements de charleston ? À quelle vitesse sont-ils ?","En quoi la grosse caisse diffère-t-elle de celle d'un morceau de rock ?"],"statut":"brouillon"},"drill":{"origines":"La drill naît à Chicago au début des années 2010, avec des rappeurs comme Chief Keef et des producteurs comme Young Chop. Elle se diffuse ensuite à Londres (UK drill) et dans de nombreuses villes du monde.","contexte":"Elle décrit sans détour la violence de rues touchées par la pauvreté et les conflits entre quartiers, ce qui provoque des débats sur la censure et sur la responsabilité des artistes et des plateformes.","rythme":"Tempo lent, grosse caisse en motifs syncopés, roulements de charleston, voix sur un ton froid et monocorde.","timbres":"Basses profondes, cordes ou pianos sombres, rythmes très secs.","reperes":[[2012,"Chief Keef, I Don't Like, produit par Young Chop, sorti avec la participation de Lil Reese."],[2012,"Le groupe 67, de Brixton, est associé aux débuts de la UK drill."]],"ecoute":[["Chief Keef, I Don't Like (2012)","Chief Keef I Don't Like"],["Chief Keef, Love Sosa (2012)","Chief Keef Love Sosa"],["67, Let's Lurk (2015)","67 Lets Lurk"]],"questions":["Quel est le rôle du silence entre les sons ?","Comment la voix est-elle placée : en avant, en retrait, froide, chaleureuse ?"],"statut":"brouillon"},"french-rap":{"origines":"Le rap français s'installe en France au début des années 1980 avec l'arrivée du hip-hop américain, puis se développe dans les banlieues de Paris, de Marseille et d'autres villes.","contexte":"L'émission H.I.P. H.O.P. de Sidney sur TF1 (1984) fait découvrir la culture hip-hop au grand public. Au tournant des années 1990, la compilation Rapattitude (1990) puis MC Solaar rendent le rap visible dans l'industrie du disque. Les années 1990 voient s'affirmer deux écoles : Marseille (IAM) et Paris et sa banlieue (Suprême NTM).","reperes":[[1984,"H.I.P. H.O.P., émission de Sidney sur TF1."],[1990,"Compilation Rapattitude."],[1991,"MC Solaar, Qui sème le vent récolte le tempo."],[1995,"Suprême NTM, Paris sous les bombes."],[1997,"IAM, L'école du micro d'argent."]],"ecoute":[["MC Solaar, Bouge de là (1991)","MC Solaar Bouge de là"],["Suprême NTM, Paris sous les bombes (1995)","Suprême NTM Paris sous les bombes"],["IAM, Demain c'est loin (1997)","IAM Demain c'est loin"]],"questions":["Quels sujets le texte aborde-t-il ? Comment le style des mots (langue, argot, images) les porte-t-il ?","Compare la manière de poser la voix chez deux rappeurs différents."],"statut":"brouillon"},"jazz-rap":{"origines":"Le jazz rap naît au début des années 1990 aux États-Unis, quand des rappeurs et des producteurs bâtissent leurs beats avec des samples de disques de jazz et invitent des musiciens de jazz.","contexte":"A Tribe Called Quest, Gang Starr et Guru lient deux traditions afro-américaines, et font entendre le jazz à un public qui ne l'écoutait pas.","reperes":[[1991,"A Tribe Called Quest, The Low End Theory, avec le contrebassiste Ron Carter sur Verses from the Abstract."],[1993,"Guru, Jazzmatazz Vol. 1 ; US3, Cantaloop (Flip Fantasia), construit sur Cantaloupe Island de Herbie Hancock."]],"ecoute":[["A Tribe Called Quest, Jazz (We've Got) (1991)","A Tribe Called Quest Jazz We've Got"],["US3, Cantaloop (Flip Fantasia) (1993)","US3 Cantaloop"],["Guru, Loungin' (1993)","Guru Loungin Jazzmatazz"]],"questions":["Quel instrument de jazz entends-tu ?","Qu'est-ce que le sample apporte que le rappeur n'apporte pas ?"],"statut":"brouillon"},"house":{"origines":"La house naît à Chicago au début des années 1980, dans des clubs fréquentés surtout par des Noirs et des gays. Le nom viendrait du Warehouse, club où le DJ Frankie Knuckles passait ses disques.","contexte":"Quand le disco est rejeté à la fin des années 1970, des DJ de Chicago continuent à passer des disques de disco, de soul et d'électro, puis fabriquent leurs propres morceaux avec des boîtes à rythmes et des synthétiseurs bon marché.","rythme":"Grosse caisse sur chaque temps (four on the floor), charleston sur les contretemps, tempo autour de 120 à 125 battements par minute.","timbres":"Boîtes à rythmes Roland (TR-808, TR-909), basses de synthétiseur, pianos, voix de gospel ou de soul.","reperes":[[1984,"Jesse Saunders, On and On, l'un des premiers disques de house."],[1986,"Marshall Jefferson, Move Your Body (The House Music Anthem) ; Farley Jackmaster Funk, Love Can't Turn Around."],[1987,"Phuture, Acid Tracks, début de l'acid house."]],"ecoute":[["Marshall Jefferson, Move Your Body (1986)","Marshall Jefferson Move Your Body"],["Frankie Knuckles, Your Love (1987)","Frankie Knuckles Your Love"],["Phuture, Acid Tracks (1987)","Phuture Acid Tracks"]],"questions":["Peux-tu compter les battements par minute avec la grosse caisse ?","Quels éléments viennent du disco, lesquels viennent des machines ?"],"statut":"brouillon"},"techno":{"origines":"La techno naît à Detroit au milieu des années 1980 (Juan Atkins, Derrick May, Kevin Saunderson) et se développe en Europe, surtout en Allemagne et au Royaume-Uni, à partir de la fin des années 1980.","contexte":"Le mot est popularisé par la compilation Techno! The New Dance Sound of Detroit (1988). À Berlin, après la chute du Mur, la fête devient un moyen de se retrouver : la Love Parade commence en 1989, le club Tresor ouvre en 1991. Le collectif Underground Resistance, de Detroit, lie la techno à un discours politique.","rythme":"Four on the floor, tempos de 125 à 140 battements par minute ou plus, motifs répétés qui évoluent lentement.","timbres":"Boîtes à rythmes, séquenceurs, synthétiseurs analogiques, sons métalliques et industriels.","reperes":[[1988,"Compilation Techno! The New Dance Sound of Detroit."],[1989,"Première Love Parade à Berlin ; Underground Resistance se forme à Detroit."],[1991,"Ouverture du club Tresor à Berlin."]],"ecoute":[["Rhythim Is Rhythim, Strings of Life (1987)","Rhythim Is Rhythim Strings of Life"],["Inner City, Big Fun (1988)","Inner City Big Fun"],["Jeff Mills, The Bells (1996)","Jeff Mills The Bells"]],"questions":["Qu'est-ce qui change au fil du morceau, puisque le motif ne change presque pas ?","Quel effet produit la répétition sur ton écoute et sur ton corps ?"],"statut":"brouillon"},"acid-house":{"origines":"L'acid house naît à Chicago en 1987 avec Phuture (DJ Pierre, Spanky, Herb J) et leur disque Acid Tracks, fondé sur la basse de synthétiseur Roland TB-303.","contexte":"En 1988, la musique arrive au Royaume-Uni, où l'été 1988 est appelé le Second Summer of Love : des fêtes en entrepôts, un nouveau public, et une médiatisation très hostile.","timbres":"Ligne de basse acide, filtre résonnant dont on ouvre et ferme la fréquence de coupure pendant le morceau, boîte à rythmes TR-909 ou TR-808.","reperes":[[1987,"Phuture, Acid Tracks."],[1988,"Second Summer of Love au Royaume-Uni."]],"ecoute":[["Phuture, Acid Tracks (1987)","Phuture Acid Tracks"],["A Guy Called Gerald, Voodoo Ray (1988)","A Guy Called Gerald Voodoo Ray"],["808 State, Pacific State (1989)","808 State Pacific State"]],"questions":["Quelle partie du son bouge : la hauteur de la note ou le timbre ?","Comment le filtre change-t-il la couleur du son ?"],"statut":"brouillon"},"ambient":{"origines":"Le mot ambient est associé à Brian Eno, qui publie en 1978 Ambient 1: Music for Airports. Eno décrit cette musique comme aussi ignorable qu'intéressante : on peut l'écouter attentivement ou la laisser en fond.","contexte":"Il a des précurseurs : Erik Satie propose dès 1917 une « musique d'ameublement », à entendre sans écouter ; et le minimalisme américain et la musique de studio des années 1970 préparent le terrain.","rythme":"Peu ou pas de pulsation marquée ; la musique évolue lentement.","timbres":"Nappes de synthétiseur, pianos, boucles de bande, sons de la nature, réverbérations longues.","reperes":[[1917,"Erik Satie conçoit la « musique d'ameublement »."],[1975,"Brian Eno, Discreet Music."],[1978,"Brian Eno, Ambient 1: Music for Airports."],[1991,"The Orb, The Orb's Adventures Beyond the Ultraworld."]],"ecoute":[["Brian Eno, 1/1 (Music for Airports) (1978)","Brian Eno Music for Airports 1/1"],["Brian Eno, Discreet Music (1975)","Brian Eno Discreet Music"],["Aphex Twin, Xtal (1992)","Aphex Twin Xtal"]],"questions":["Peux-tu l'écouter attentivement puis l'oublier ? Que change l'attention ?","Quel rôle joue la réverbération dans l'espace que tu imagines ?"],"statut":"brouillon"},"jungle":{"origines":"La jungle naît à Londres au début des années 1990, dans les communautés caribéennes et noires britanniques, en mêlant breakbeats accélérés, basses de reggae et de dub, et voix de ragga.","contexte":"Le rythme célèbre le plus souvent est tiré de l'Amen break, un solo de batterie d'environ six secondes du disque Amen, Brother des Winstons (1969), échantillonné, découpé et accéléré par d'innombrables producteurs.","rythme":"Tempo de 160 à 170 battements par minute, breakbeats découpés et réarrangés, basse lente par-dessous.","reperes":[[1969,"The Winstons enregistrent Amen, Brother, d'où vient l'Amen break (batteur Gregory C. Coleman)."],[1994,"Shy FX, Original Nuttah."],[1995,"Goldie, Timeless."]],"ecoute":[["Shy FX et UK Apachi, Original Nuttah (1994)","Shy FX Original Nuttah"],["Goldie, Inner City Life (1994)","Goldie Inner City Life"],["The Winstons, Amen, Brother (1969)","The Winstons Amen Brother"]],"questions":["Quelle différence entends-tu entre la vitesse des breaks et celle de la basse ?","Comment un solo de batterie de 1969 devient-il le rythme d'un autre morceau ?"],"statut":"brouillon"},"drum-and-bass":{"origines":"La drum and bass se forme au milieu des années 1990 au Royaume-Uni à partir de la jungle, dont elle garde les breakbeats rapides et les basses profondes.","contexte":"Des producteurs comme LTJ Bukem, Goldie, Roni Size, et des labels comme Metalheadz et V Recordings, en font un genre de club et de radio. En 1997, l'album New Forms de Roni Size et Reprazent remporte le Mercury Prize.","rythme":"Tempo de 165 à 180 battements par minute, caisse claire sur les temps 2 et 4 d'une mesure ressentie à moitié vitesse.","timbres":"Basses de synthèse très graves (dont la reese bass), breaks découpés, nappes, parfois contrebasse et voix de jazz.","reperes":[[1996,"LTJ Bukem, Logical Progression."],[1997,"Roni Size and Reprazent, New Forms, Mercury Prize."]],"ecoute":[["Roni Size and Reprazent, Brown Paper Bag (1997)","Roni Size Reprazent Brown Paper Bag"],["LTJ Bukem, Horizons (1995)","LTJ Bukem Horizons"],["Goldie, Timeless (1995)","Goldie Timeless"]],"questions":["Peux-tu entendre les deux vitesses en même temps, celle des breaks et celle de la basse ?","Que devient la basse quand elle est plus grave que ce que ton haut-parleur peut jouer ?"],"statut":"brouillon"},"dubstep":{"origines":"Le dubstep naît au début des années 2000 dans le sud de Londres, autour de Croydon et du magasin de disques Big Apple, à partir du UK garage, du dub et de la jungle.","contexte":"La scène se structure autour de la radio pirate Rinse FM et de soirées comme DMZ à Brixton (à partir de 2005), avec Digital Mystikz (Mala et Coki), Skream, Benga et Burial. À partir de 2010, une version plus agressive, le brostep, devient populaire aux États-Unis, notamment avec Skrillex.","rythme":"Tempo autour de 140 battements par minute, mais senti en demi-temps : la caisse claire tombe sur le troisième temps, ce qui donne une impression de lenteur.","timbres":"Sub-basses très graves, espaces vides, réverbérations, basses modulées (wobble) dans les versions plus récentes.","reperes":[[2005,"Skream, Midnight Request Line."],[2007,"Burial, Untrue."],[2010,"Skrillex, Scary Monsters and Nice Sprites."]],"ecoute":[["Skream, Midnight Request Line (2005)","Skream Midnight Request Line"],["Burial, Archangel (2007)","Burial Archangel"],["Digital Mystikz, Anti War Dub (2005)","Digital Mystikz Anti War Dub"]],"questions":["Où se trouve le silence dans cette musique, et que fait-il ?","Peux-tu sentir la basse sans l'entendre vraiment ?"],"statut":"brouillon"},"kraftwerk":{"origines":"Kraftwerk est formé à Düsseldorf, en Allemagne, par Ralf Hütter et Florian Schneider, au début des années 1970. Ils travaillent dans leur studio Kling Klang.","contexte":"Le groupe fait de la machine un sujet et un instrument : voyage en autoroute, en train, ordinateurs, robots. Sa musique influence la synth-pop, le hip-hop (Afrika Bambaataa samplait Trans-Europe Express et Numbers dans Planet Rock, 1982) et la techno de Detroit.","timbres":"Synthétiseurs (Minimoog, Moog modulaire), boîtes à rythmes, vocodeur, voix traitée, batterie électronique à pads construite par le groupe.","reperes":[[1974,"Autobahn."],[1977,"Trans-Europe Express."],[1978,"The Man-Machine."],[1981,"Computer World."]],"ecoute":[["Kraftwerk, Autobahn (1974)","Kraftwerk Autobahn"],["Kraftwerk, Trans-Europe Express (1977)","Kraftwerk Trans-Europe Express"],["Kraftwerk, Numbers (1981)","Kraftwerk Numbers"]],"questions":["Quels sons imitent le monde réel (route, train, machine) ?","En quoi la voix est-elle traitée comme un instrument ?"],"statut":"brouillon"},"aphex-twin":{"origines":"Aphex Twin est le nom de scène de Richard D. James, né en 1971 en Irlande et élevé en Cornouailles, en Angleterre. Il se fait connaître au début des années 1990.","contexte":"Il appartient à la scène IDM (intelligent dance music), liée au label Warp, qui détourne la techno vers l'écoute chez soi : rythmes brisés, timbres inventés, ambiances. Il construit lui-même une partie de son matériel.","timbres":"Synthèse analogique et numérique, rythmes programmés très rapides, ambiances de piano et de nappes.","reperes":[[1992,"Selected Ambient Works 85-92."],[1994,"Selected Ambient Works Volume II."],[1996,"Richard D. James Album."],[1999,"Windowlicker, avec un clip réalisé par Chris Cunningham."]],"ecoute":[["Aphex Twin, Xtal (1992)","Aphex Twin Xtal"],["Aphex Twin, Windowlicker (1999)","Aphex Twin Windowlicker"],["Aphex Twin, Alberto Balsalm (1996)","Aphex Twin Alberto Balsalm"]],"questions":["Comment un même musicien peut-il faire une musique calme et une musique frénétique ?","Quels sons te semblent impossibles à jouer avec un instrument traditionnel ?"],"statut":"brouillon"},"sampling":{"origines":"L'échantillonnage consiste à enregistrer un son pour le rejouer, le découper ou le transformer. Pierre Schaeffer en pose les bases avec la musique concrète en 1948.","contexte":"L'échantillonneur numérique se démocratise avec le Fairlight CMI (1979), l'E-mu Emulator (1981) puis l'Akai S900 (1986) et l'Akai MPC60 (1988). Le hip-hop, la house, la jungle et la musique électronique en font leur méthode de composition.","production":"On choisit un fragment (un break de batterie, une note, une phrase), on le boucle, on le transpose, on le filtre, puis on le met en rythme sur un séquenceur.","reperes":[[1948,"Pierre Schaeffer, Études de bruits."],[1989,"Beastie Boys, Paul's Boutique ; John Oswald, Plunderphonic."],[1991,"Un tribunal américain juge illégal l'échantillon non autorisé de Gilbert O'Sullivan dans un titre de Biz Markie (Grand Upright v. Warner)."],[1996,"DJ Shadow, Endtroducing....."]],"ecoute":[["Pierre Schaeffer, Étude aux chemins de fer (1948)","Pierre Schaeffer Étude aux chemins de fer"],["Beastie Boys, Shake Your Rump (1989)","Beastie Boys Shake Your Rump"],["DJ Shadow, Midnight in a Perfect World (1996)","DJ Shadow Midnight in a Perfect World"]],"questions":["Quel est le matériau d'origine ? Peux-tu en deviner la source ?","Un sample, est-ce de la citation, de la copie ou de la création ? Quels arguments donnes-tu ?"],"statut":"brouillon"},"fm-synthesis":{"origines":"La synthèse par modulation de fréquence (FM) est découverte par John Chowning, à l'université Stanford, à la fin des années 1960 (1967). Il la publie en 1973.","contexte":"Yamaha acquiert la licence et lance en 1983 le DX7, premier synthétiseur numérique grand public, qui fait de la FM le son de la décennie.","timbres":"Deux oscillateurs ou plus : un porteur et un modulateur ; on obtient des sons de cloche, de piano électrique, de cuivre ou de basse selon le rapport des fréquences et l'indice de modulation.","reperes":[[1967,"John Chowning découvre la synthèse FM."],[1973,"Chowning publie The Synthesis of Complex Audio Spectra by Means of Frequency Modulation."],[1977,"John Chowning, Stria."],[1983,"Yamaha DX7."]],"ecoute":[["John Chowning, Stria (1977)","John Chowning Stria"],["John Chowning, Turenas (1972)","John Chowning Turenas"],["John Chowning, Phoné (1981)","John Chowning Phone"]],"questions":["Quand on change l'indice de modulation, qu'entend-on : la hauteur ou le timbre ?","Pourquoi les sons FM peuvent-ils ressembler à des cloches ?"],"statut":"brouillon"},"granular-synthesis":{"origines":"La synthèse granulaire repose sur l'idée que le son est fait de très petits grains de quelques dizaines de millisecondes. Elle remonte au physicien Dennis Gabor, qui parle de quanta acoustiques en 1946-1947.","contexte":"Iannis Xenakis la développe en composition (Analogique A-B, 1958-1959). Curtis Roads l'implémente par ordinateur au milieu des années 1970 et publie en 1978. Barry Truax la réalise en temps réel au milieu des années 1980 (Riverrun, 1986).","timbres":"Nuages de grains dont on règle la durée, la densité, la hauteur et la position dans le son d'origine : on obtient des textures, étirements et gels de sons.","reperes":[[1946,"Dennis Gabor décrit le son comme formé de grains."],[1958,"Iannis Xenakis, Analogique A-B."],[1978,"Curtis Roads publie sur la synthèse granulaire automatisée."],[1986,"Barry Truax, Riverrun."]],"ecoute":[["Barry Truax, Riverrun (1986)","Barry Truax Riverrun"],["Iannis Xenakis, Concret PH (1958)","Xenakis Concret PH"],["Curtis Roads, Clang-tint (1994)","Curtis Roads Clang-tint"]],"questions":["Quand les grains sont longs, quand sont-ils courts ? Qu'entends-tu changer ?","Comment un son peut-il être étiré sans changer de hauteur ?"],"statut":"brouillon"},"theremin":{"origines":"Le thérémine est inventé en 1920 par le physicien russe Lev Termen, à Petrograd. On le joue sans le toucher : la main droite règle la hauteur, la gauche le volume, en s'approchant de deux antennes.","contexte":"Termen le fait connaître en Europe puis aux États-Unis dans les années 1920 et 1930. La virtuose Clara Rockmore en est l'interprète de référence. Le cinéma de science-fiction des années 1950 popularise son son glissant et plaintif.","timbres":"Un son de sinusoïde enrichie, au vibrato expressif, avec des glissandos continus sans touches ni frettes.","reperes":[[1920,"Lev Termen invente l'instrument."],[1928,"Brevet américain du thérémine."],[1951,"Bernard Herrmann l'emploie dans la musique du film The Day the Earth Stood Still."]],"ecoute":[["Clara Rockmore, Vocalise de Rachmaninov (1977)","Clara Rockmore Vocalise Rachmaninoff theremin"],["Bernard Herrmann, The Day the Earth Stood Still (1951)","Bernard Herrmann The Day the Earth Stood Still theremin"],["Samuel Hoffman, Music Out of the Moon (1947)","Samuel Hoffman Music Out of the Moon theremin"]],"questions":["Quelle difficulté y a-t-il à jouer juste sans touches ni repères ?","Quel effet produit un son qui glisse sans palier d'une note à l'autre ?"],"statut":"brouillon"},"roland-tr-808":{"origines":"La Roland TR-808 est une boîte à rythmes analogique sortie en 1980 au Japon.","contexte":"Elle ne fait pas de succès commercial immédiat, mais elle devient l'un des instruments les plus influents des musiques populaires : l'électro (Afrika Bambaataa, Planet Rock, 1982), le hip-hop, la house, puis la trap.","timbres":"Sons de batterie fabriqués par circuits analogiques : une grosse caisse longue et grave, un clap sec, des charlestons métalliques, des toms synthétiques.","reperes":[[1980,"Sortie de la TR-808."],[1982,"Afrika Bambaataa and the Soul Sonic Force, Planet Rock ; Marvin Gaye, Sexual Healing."]],"ecoute":[["Afrika Bambaataa, Planet Rock (1982)","Afrika Bambaataa Planet Rock"],["Marvin Gaye, Sexual Healing (1982)","Marvin Gaye Sexual Healing"],["Whodini, Magic's Wand (1982)","Whodini Magic's Wand"]],"questions":["Peux-tu entendre la grosse caisse qui dure longtemps, presque comme une note ?","Qu'est-ce qui rend ce son reconnaissable entre mille ?"],"statut":"brouillon"},"roland-tb-303":{"origines":"La Roland TB-303 est un séquenceur de basse analogique sorti en 1981, conçu pour accompagner des guitaristes.","contexte":"Elle ne rencontre pas son public et sa production s'arrête vers 1984. Des musiciens de Chicago la détournent à partir de 1987 : en réglant à la main le filtre résonnant, ils créent le son de l'acid house.","timbres":"Un seul oscillateur (dent de scie ou carré), un filtre passe-bas résonnant, des notes glissées (slide) et accentuées.","reperes":[[1981,"Sortie de la TB-303."],[1987,"Phuture, Acid Tracks."]],"ecoute":[["Phuture, Acid Tracks (1987)","Phuture Acid Tracks"],["Josh Wink, Higher State of Consciousness (1995)","Josh Wink Higher State of Consciousness"],["Hardfloor, Acperience 1 (1992)","Hardfloor Acperience 1"]],"questions":["Quelle partie du son change pendant qu'une note tient : la hauteur ou le timbre ?","Quel détournement d'usage cet instrument illustre-t-il ?"],"statut":"brouillon"},"roland-tr-909":{"origines":"La Roland TR-909 est une boîte à rythmes sortie en 1983. Elle est la première de Roland à utiliser le MIDI.","contexte":"Elle est en partie analogique (grosse caisse, caisse claire, toms) et en partie fondée sur des échantillons (charlestons, cymbales). Elle devient avec la TR-808 un outil central de la house et de la techno.","timbres":"Grosse caisse percutante, caisse claire nerveuse, charleston ouvert et fermé, clap.","reperes":[[1983,"Sortie de la TR-909."]],"ecoute":[],"questions":["Quelle différence entends-tu entre la grosse caisse de la 909 et celle de la 808 ?","Quelle partie de la batterie est la plus présente dans le morceau ?"],"statut":"brouillon"},"moog-modulaire":{"origines":"Le synthétiseur modulaire Moog est mis au point par Robert Moog au milieu des années 1960 aux États-Unis. Chaque fonction (oscillateur, filtre, enveloppe) est un module qu'on relie aux autres par des câbles.","contexte":"Le disque Switched-On Bach de Wendy Carlos (1968) le fait connaître au grand public. Le Minimoog (1970), plus petit et sans câbles, en démocratise le son auprès des groupes de rock, de funk et de jazz.","timbres":"Synthèse soustractive : on part d'un son riche (dent de scie, carré) que l'on filtre, avec un filtre en échelle caractéristique.","reperes":[[1964,"Robert Moog présente ses premiers modules."],[1968,"Wendy Carlos, Switched-On Bach."],[1970,"Lancement du Minimoog."]],"ecoute":[["Wendy Carlos, Brandenburg Concerto n° 3 (1968)","Wendy Carlos Switched-On Bach Brandenburg"],["Kraftwerk, Autobahn (1974)","Kraftwerk Autobahn"],["Keith Emerson, Lucky Man (1970)","Emerson Lake Palmer Lucky Man Moog solo"]],"questions":["Quel son vient de l'oscillateur, quel son vient du filtre ?","Pourquoi Bach s'adapte-t-il bien à un synthétiseur ?"],"statut":"brouillon"},"yamaha-dx7":{"origines":"Le Yamaha DX7 est un synthétiseur numérique sorti en 1983, fondé sur la synthèse FM de John Chowning.","contexte":"Doté de six opérateurs, polyphonique à seize voix et compatible avec le MIDI, il se vend à des centaines de milliers d'exemplaires et fixe le son de nombreux disques des années 1980. Programmer ses sons est difficile, si bien que beaucoup de musiciens utilisent ses préréglages d'usine.","timbres":"Pianos électriques très reconnaissables, cloches, basses, cordes et cuivres de synthèse.","reperes":[[1983,"Sortie du DX7."]],"ecoute":[],"questions":["Reconnais-tu le piano électrique dont le timbre est un peu cristallin ?","Pourquoi la plupart des musiciens ne changeaient-ils pas les sons d'usine ?"],"statut":"brouillon"},"fairlight-cmi":{"origines":"Le Fairlight CMI (Computer Musical Instrument) est un synthétiseur et échantillonneur sorti en 1979, conçu en Australie par Peter Vogel et Kim Ryrie.","contexte":"Un des premiers instruments à permettre d'enregistrer un son et de le rejouer au clavier. Très cher, il équipe quelques musiciens et studios, dont Peter Gabriel et Kate Bush (Never for Ever, 1980), avant que les échantillonneurs moins coûteux ne le remplacent.","timbres":"Sons échantillonnés de faible définition (8 bits à l'origine), au grain caractéristique ; sons de synthèse dessinés à l'écran.","reperes":[[1979,"Sortie du Fairlight CMI."],[1980,"Kate Bush emploie le Fairlight sur Never for Ever."]],"ecoute":[["Kate Bush, Babooshka (1980)","Kate Bush Babooshka"],["Art of Noise, Beat Box (1983)","Art of Noise Beat Box"]],"questions":["Quel est le son d'origine échantillonné, et que devient-il quand il est joué au clavier ?","Qu'est-ce que le grain du son raconte sur la technique de l'époque ?"],"statut":"brouillon"},"akai-mpc":{"origines":"L'Akai MPC (MIDI Production Center) est une série d'échantillonneurs et de séquenceurs lancée en 1988 avec la MPC60, conçue avec l'ingénieur américain Roger Linn.","contexte":"Ses seize pads sensibles à la frappe permettent de jouer des échantillons comme sur une batterie. Elle devient l'outil de nombreux producteurs de hip-hop, dont J Dilla.","production":"Échantillonnage, découpe du son sur les pads, séquençage avec une fonction de swing (quantification qui décale les notes d'un temps sur deux) : le « feeling » humain vient d'un réglage.","reperes":[[1988,"Sortie de la MPC60."],[1994,"Sortie de la MPC3000."]],"ecoute":[["J Dilla, Don't Cry (2006)","J Dilla Don't Cry Donuts"],["Common, The Light (2000)","Common The Light"],["DJ Shadow, Midnight in a Perfect World (1996)","DJ Shadow Midnight in a Perfect World"]],"questions":["À quoi sert le swing ? Que ressens-tu quand il est trop faible, trop fort ?","Comment jouer un échantillon comme un instrument ?"],"statut":"brouillon"},"tango":{"origines":"Le tango naît à la fin du XIXe siècle sur les deux rives du Río de la Plata, à Buenos Aires et à Montevideo, dans les quartiers populaires où se croisent immigrés européens et descendants d'Africains. Il emprunte à la milonga, à la habanera et au candombe.","contexte":"D'abord dansé dans les faubourgs et les maisons de plaisir, il est accueilli à Paris vers 1910 avant d'être reconnu à Buenos Aires. Le chanteur Carlos Gardel en fait une chanson populaire. En 2009, l'UNESCO inscrit le tango sur la liste du patrimoine culturel immatériel, pour l'Argentine et l'Uruguay.","rythme":"Pulsation marquée, accents sur chaque temps de la mesure à quatre temps, suspensions et glissés de la danse.","timbres":"Bandonéon (instrument à soufflet venu d'Allemagne), violon, piano, contrebasse, guitare ; le chant évoque la nostalgie, l'exil, l'amour perdu.","reperes":[[1916,"Gerardo Matos Rodríguez compose La cumparsita à Montevideo."],[1917,"Carlos Gardel enregistre Mi noche triste, souvent cité comme premier tango chanté."],[1935,"Mort de Carlos Gardel dans un accident d'avion à Medellín."],[2009,"Inscription du tango au patrimoine culturel immatériel de l'UNESCO."]],"ecoute":[["Carlos Gardel, Por una cabeza (1935)","Carlos Gardel Por una cabeza"],["Aníbal Troilo et Francisco Fiorentino, Garúa (1943)","Aníbal Troilo Garúa Fiorentino"],["Osvaldo Pugliese, La yumba (1946)","Osvaldo Pugliese La yumba"]],"questions":["Quel instrument à soufflet reconnais-tu, et comment sonne-t-il ?","Que raconte le texte, et comment la voix le dit-elle ?"],"statut":"brouillon"},"astor-piazzolla":{"origines":"Astor Piazzolla, né à Mar del Plata (Argentine) en 1921, mort à Buenos Aires en 1992, joue du bandonéon. Il passe son enfance à New York, où il découvre Bach et le jazz.","contexte":"À Paris en 1954, il étudie avec Nadia Boulanger, qui l'encourage à garder le tango dans sa musique. De retour à Buenos Aires, il invente le nuevo tango, qui mêle tango, jazz et écriture classique, ce qui lui vaut l'hostilité d'une partie du public.","reperes":[[1954,"Étude avec Nadia Boulanger à Paris."],[1960,"Création du Quinteto Nuevo Tango."],[1968,"María de Buenos Aires, « operita » sur un livret de Horacio Ferrer."],[1974,"Libertango."]],"ecoute":[["Astor Piazzolla, Adiós Nonino (1959)","Astor Piazzolla Adiós Nonino"],["Astor Piazzolla, Libertango (1974)","Astor Piazzolla Libertango"],["Astor Piazzolla, Balada para un loco (1969)","Astor Piazzolla Balada para un loco"]],"questions":["Quels éléments entends-tu venir du tango, lesquels du jazz ou de Bach ?","Pourquoi cette musique a-t-elle d'abord dérangé une partie du public argentin ?"],"statut":"brouillon"},"nuevo-tango":{"origines":"Le nuevo tango est le courant lancé par Astor Piazzolla à Buenos Aires à partir du milieu des années 1950.","contexte":"Il garde le bandonéon et le rythme du tango mais introduit des harmonies de jazz, des fugues, des dissonances et une écriture de chambre, pour une musique d'écoute plus que de danse.","timbres":"Quintette : bandonéon, violon, guitare électrique, piano, contrebasse.","reperes":[[1955,"Piazzolla fonde l'Octeto Buenos Aires."],[1960,"Premier Quinteto Nuevo Tango."],[1968,"María de Buenos Aires."]],"ecoute":[["Astor Piazzolla, Adiós Nonino (1959)","Astor Piazzolla Adiós Nonino"],["Astor Piazzolla, Michelangelo 70 (1969)","Astor Piazzolla Michelangelo 70"],["Astor Piazzolla, Oblivion","Astor Piazzolla Oblivion"]],"questions":["Peux-tu danser sur ce morceau ? Qu'est-ce qui le rend difficile à danser ?","Quel instrument fait l'ouverture ?"],"statut":"brouillon"},"cumbia":{"origines":"La cumbia naît sur la côte caraïbe de la Colombie, de la rencontre entre traditions amérindiennes (flûtes de gaita), africaines (tambours) et espagnoles (chants, danse).","contexte":"Dans les années 1940 et 1950, des orchestres comme celui de Lucho Bermúdez la transposent en musique de salon et de disque. Le label Discos Fuentes, fondé à Carthagène en 1934, en est un acteur central. Elle voyage ensuite dans toute l'Amérique latine et s'y transforme : cumbia mexicaine, péruvienne, argentine.","rythme":"Pulsation à deux temps, avec un motif de tambour et de güiro qui donne un balancement caractéristique.","timbres":"Gaitas, tambours (tambor alegre, llamador), maracas, güiro, puis accordéon, cuivres, claviers et guitare électrique selon les pays.","reperes":[[1934,"Fondation de Discos Fuentes à Carthagène."],[1950,"Lucho Bermúdez fait de la cumbia une musique de salon."]],"ecoute":[["Lucho Bermúdez, Colombia tierra querida","Lucho Bermúdez Colombia tierra querida"],["Totó la Momposina, La candela viva (1993)","Totó la Momposina La candela viva"]],"questions":["Quel instrument donne le motif répété qui balance la musique ?","Qu'est-ce qui change quand la cumbia passe d'un pays à un autre ?"],"statut":"brouillon"},"samba":{"origines":"La samba se forme à Rio de Janeiro au début du XXe siècle, dans les communautés noires, notamment autour de la Praça Onze et de la Cidade Nova, à partir de rythmes afro-brésiliens (batuque, lundu) et du maxixe.","contexte":"Pelo Telefone (1916-1917) est souvent cité comme première samba enregistrée. Les écoles de samba naissent à partir de 1928 (Deixa Falar, quartier d'Estácio). Sous Getúlio Vargas, la samba devient un symbole national.","rythme":"Mesure à deux temps, syncopes, ensemble de percussions : surdo (basse), tamborim, cuíca, agogô, pandeiro.","reperes":[[1917,"Pelo Telefone, enregistré par Donga et Mauro de Almeida, popularisé au carnaval."],[1928,"Fondation de Deixa Falar, première école de samba, à Estácio."],[1939,"Aquarela do Brasil, d'Ary Barroso."]],"ecoute":[["Noel Rosa, Com que roupa ? (1930)","Noel Rosa Com que roupa"],["Ary Barroso, Aquarela do Brasil (1939)","Ary Barroso Aquarela do Brasil"],["Cartola, As rosas não falam (1976)","Cartola As rosas não falam"]],"questions":["Quel instrument de percussion donne la basse, quel instrument donne les rythmes aigus ?","Pourquoi la samba est-elle devenue un symbole du Brésil entier ?"],"statut":"brouillon"},"bossa-nova":{"origines":"La bossa nova naît à Rio de Janeiro à la fin des années 1950, autour de João Gilberto, Antônio Carlos Jobim et Vinicius de Moraes.","contexte":"Dans les quartiers de la classe moyenne de Copacabana et d'Ipanema, de jeunes musiciens mêlent samba et harmonies de jazz, dans un style intime et chuchoté. Le concert de Carnegie Hall en 1962 et l'album Getz/Gilberto (1964) la font connaître dans le monde entier.","rythme":"Guitare qui joue un rythme syncopé de samba très épuré, avec les doigts, accompagnant un chant presque parlé.","harmonie":"Accords enrichis (septièmes, neuvièmes) et enchaînements empruntés au jazz.","reperes":[[1958,"João Gilberto enregistre Chega de Saudade (single)."],[1962,"Concert de bossa nova à Carnegie Hall ; Jobim et Moraes composent Garota de Ipanema."],[1964,"Getz/Gilberto, avec The Girl from Ipanema."]],"ecoute":[["João Gilberto, Chega de Saudade (1958)","João Gilberto Chega de Saudade"],["Stan Getz et João Gilberto, The Girl from Ipanema (1964)","Getz Gilberto The Girl from Ipanema"],["Antônio Carlos Jobim, Corcovado","Antônio Carlos Jobim Corcovado"]],"questions":["Comment la voix chuchotée change-t-elle la manière d'écouter ?","Quelles harmonies te rappellent le jazz ?"],"statut":"brouillon"},"tropicalia":{"origines":"La Tropicália est un mouvement artistique et musical brésilien de 1967-1968, mené par Caetano Veloso, Gilberto Gil, Gal Costa, Tom Zé, Os Mutantes et le chef d'orchestre Rogério Duprat.","contexte":"Sous la dictature militaire (à partir de 1964), ces artistes mêlent musique brésilienne traditionnelle, rock électrique, avant-garde et critique sociale. Le régime emprisonne Caetano Veloso et Gilberto Gil fin 1968 puis les envoie en exil à Londres en 1969.","timbres":"Guitares électriques, orchestrations d'avant-garde, effets de studio, instruments brésiliens.","reperes":[[1967,"Gilberto Gil et Caetano Veloso se présentent avec des guitares électriques au festival de la chanson."],[1968,"Album-manifeste Tropicália ou Panis et Circencis ; arrestation de Veloso et Gil en décembre."],[1969,"Départ en exil à Londres."]],"ecoute":[["Caetano Veloso, Tropicália (1968)","Caetano Veloso Tropicália 1968"],["Os Mutantes, Panis et Circenses (1968)","Os Mutantes Panis et Circenses"],["Gilberto Gil, Domingo no Parque (1967)","Gilberto Gil Domingo no Parque"]],"questions":["Quels éléments sont brésiliens, lesquels viennent du rock ?","Pourquoi une musique peut-elle être jugée dangereuse par un régime ?"],"statut":"brouillon"},"salsa":{"origines":"La salsa se forme à New York dans les années 1960 et 1970 parmi les musiciens portoricains et cubains, à partir du son cubain, du mambo, de la guaracha et de la plena, avec des influences du jazz.","contexte":"Le label Fania Records, fondé en 1964 par Johnny Pacheco et Jerry Masucci, rassemble les artistes (Celia Cruz, Héctor Lavoe, Willie Colón, Rubén Blades). Le mot « salsa » désigne un marketing plus qu'un rythme précis.","rythme":"Clave (motif de cinq coups en 3-2 ou 2-3), montuno de piano, conga, bongo, cloche, section de cuivres.","reperes":[[1964,"Fondation de Fania Records."],[1971,"Fania All Stars au Cheetah, à New York (concert enregistré)."],[1978,"Rubén Blades et Willie Colón, Siembra."]],"ecoute":[["Celia Cruz et Johnny Pacheco, Quimbara (1974)","Celia Cruz Johnny Pacheco Quimbara"],["Héctor Lavoe, El cantante (1978)","Héctor Lavoe El cantante"],["Willie Colón et Rubén Blades, Pedro Navaja (1978)","Willie Colón Rubén Blades Pedro Navaja"]],"questions":["Peux-tu taper la clave pendant que le morceau joue ?","Que raconte le texte de Pedro Navaja, et comment le conte-t-il ?"],"statut":"brouillon"},"reggaeton":{"origines":"Le reggaeton se forme dans les années 1990 à Porto Rico, à partir du reggae en espagnol venu de Panama, du dancehall jamaïcain et du hip-hop américain.","contexte":"Son rythme de base, le dembow, vient d'un riddim jamaïcain popularisé par Shabba Ranks (Dem Bow, 1990). Au début des années 2000, il passe de l'underground des quartiers de San Juan à l'industrie mondiale avec Daddy Yankee (Gasolina, 2004) puis, plus tard, Bad Bunny.","rythme":"Le dembow : grosse caisse sur chaque temps, caisse claire en motif syncopé répété (le « boom-ch-boom-chick »).","reperes":[[1990,"Shabba Ranks, Dem Bow."],[2004,"Daddy Yankee, Barrio Fino, avec Gasolina."]],"ecoute":[["Shabba Ranks, Dem Bow (1990)","Shabba Ranks Dem Bow"],["Daddy Yankee, Gasolina (2004)","Daddy Yankee Gasolina"],["Tego Calderón, Pa' que retozen","Tego Calderón Pa que retozen"]],"questions":["Peux-tu taper le motif syncopé de la caisse claire ?","En quoi le reggaeton partage-t-il avec le hip-hop et le reggae ?"],"statut":"brouillon"},"folklore-argentino":{"origines":"Le folklore argentin regroupe des danses et des chants régionaux : zamba, chacarera, gato, chamamé, carnavalito. Il vient de traditions criollas, amérindiennes et espagnoles, chaque province ayant ses formes.","contexte":"Dans les années 1960, le mouvement du Nuevo Cancionero (Manifiesto de 1963, à Mendoza, avec Armando Tejada Gómez et Mercedes Sosa) renouvelle le répertoire par la poésie et l'engagement. Le festival de Cosquín, en Córdoba, rassemble chaque janvier les artistes depuis 1961. Sous la dictature, Mercedes Sosa part en exil de 1979 à 1982.","timbres":"Guitare, bombo legüero (tambour), charango, quena, accordéon (chamamé), violon, voix.","reperes":[[1961,"Premier festival de Cosquín."],[1963,"Manifiesto del Nuevo Cancionero, à Mendoza."],[1964,"Ariel Ramírez, Misa criolla."],[1979,"Mercedes Sosa part en exil (jusqu'en 1982)."]],"ecoute":[["Mercedes Sosa, Gracias a la vida (1971)","Mercedes Sosa Gracias a la vida"],["Ariel Ramírez, Misa criolla : Kyrie (1964)","Ariel Ramírez Misa criolla Kyrie"],["Atahualpa Yupanqui, Los ejes de mi carreta","Atahualpa Yupanqui Los ejes de mi carreta"]],"questions":["Quels instruments reconnais-tu : guitare, tambour, flûte ?","Pourquoi un chant populaire peut-il devenir un chant de résistance ?"],"statut":"brouillon"},"son-cubano":{"origines":"Le son cubain naît à la fin du XIXe siècle dans l'est de Cuba (Oriente, région de Santiago), de la rencontre de la musique paysanne espagnole et des rythmes africains.","contexte":"Il monte vers La Havane dans les années 1910-1920 et devient, dans les années 1930 et 1940, la base du mambo, de la salsa et de nombreuses musiques latines. En 1997, l'album Buena Vista Social Club, enregistré à La Havane avec Ry Cooder, fait redécouvrir de vieux musiciens au monde entier.","rythme":"Clave, bongo, tres (guitare à trois doubles cordes), partie de cuivre ou de trompette, structure en deux temps : un chant puis un montuno en appel et réponse.","reperes":[[1997,"Buena Vista Social Club, album produit par Nick Gold avec Ry Cooder."],[1999,"Film Buena Vista Social Club de Wim Wenders."]],"ecoute":[["Compay Segundo, Chan Chan (1997)","Compay Segundo Chan Chan"],["Buena Vista Social Club, Dos gardenias (1997)","Buena Vista Social Club Dos gardenias"],["Trío Matamoros, Son de la loma","Trío Matamoros Son de la loma"]],"questions":["Quel instrument à cordes joue le motif répété (le tres) ?","Où commence l'appel et la réponse entre chanteur et chœur ?"],"statut":"brouillon"},"mariachi":{"origines":"Le mariachi est un ensemble mexicain de cordes et de trompettes, né dans l'ouest du pays, dans l'État de Jalisco, au XIXe siècle. L'UNESCO l'a inscrit au patrimoine culturel immatériel en 2011.","contexte":"Au XXe siècle, le cinéma et la radio en font un emblème du Mexique ; l'ensemble Mariachi Vargas de Tecalitlán, fondé en 1898, en est la référence. La place Garibaldi, à Mexico, est un lieu où les ensembles sont engagés à la fête.","timbres":"Violons, trompettes, guitare, vihuela, guitarrón (grosse guitare qui joue la basse), voix puissantes.","reperes":[[1898,"Fondation du Mariachi Vargas de Tecalitlán."],[2011,"Inscription du mariachi au patrimoine culturel immatériel de l'UNESCO."]],"ecoute":[["Mariachi Vargas de Tecalitlán, El son de la negra","Mariachi Vargas de Tecalitlán El son de la negra"],["Mariachi Vargas de Tecalitlán, Cielito lindo","Mariachi Vargas Cielito lindo"],["Jorge Negrete, ¡Ay, Jalisco, no te rajes! (1941)","Jorge Negrete Ay Jalisco no te rajes"]],"questions":["Quel instrument joue la basse ?","Pourquoi le cinéma a-t-il contribué à faire du mariachi un symbole national ?"],"statut":"brouillon"},"reggae":{"origines":"Le reggae naît en Jamaïque à la fin des années 1960, dans les quartiers pauvres de Kingston, après le ska et le rocksteady. Le mot apparaît avec le titre Do the Reggay (Toots and the Maytals, 1968).","contexte":"Il exprime les réalités sociales de l'île et la spiritualité rastafari. Bob Marley and the Wailers le font connaître dans le monde entier avec Catch a Fire (1973). En 2018, l'UNESCO inscrit la musique reggae de la Jamaïque au patrimoine culturel immatériel.","rythme":"Le one drop : le premier temps de la mesure reste vide, la caisse claire et la grosse caisse tombent sur le troisième temps ; la guitare marque les contretemps (skank).","harmonie":"Peu d'accords, basse mélodique au premier plan.","reperes":[[1968,"Toots and the Maytals, Do the Reggay."],[1973,"Bob Marley and the Wailers, Catch a Fire."],[1977,"Bob Marley and the Wailers, Exodus."],[1978,"One Love Peace Concert à Kingston."],[2018,"Inscription du reggae au patrimoine de l'UNESCO."]],"ecoute":[["Bob Marley and the Wailers, Get Up, Stand Up (1973)","Bob Marley Get Up Stand Up"],["Toots and the Maytals, Pressure Drop (1969)","Toots and the Maytals Pressure Drop"],["Burning Spear, Marcus Garvey (1975)","Burning Spear Marcus Garvey"]],"questions":["Quel temps de la mesure reste vide ? Comment le sens-tu ?","Quel est le rôle de la basse ?"],"statut":"brouillon"},"ska":{"origines":"Le ska naît en Jamaïque à la fin des années 1950 et au début des années 1960, du mélange du mento, du calypso, du rhythm and blues américain et du jazz.","contexte":"Il accompagne l'indépendance de la Jamaïque en 1962. Studio One (Coxsone Dodd) et les Skatalites, formés en 1964, en sont les figures. À la fin des années 1970, le label 2 Tone (The Specials, Madness, The Selecter) en fait au Royaume-Uni une musique mixte, noire et blanche, qui s'oppose au racisme.","rythme":"Tempo vif, guitare et piano sur les contretemps (« off-beat »), basse en marche.","timbres":"Section de cuivres, piano, guitare, batterie.","reperes":[[1962,"Indépendance de la Jamaïque."],[1964,"Formation des Skatalites ; The Guns of Navarone."],[1979,"The Specials, A Message to You, Rudy (label 2 Tone)."]],"ecoute":[["The Skatalites, Guns of Navarone (1964)","The Skatalites Guns of Navarone"],["Prince Buster, One Step Beyond","Prince Buster One Step Beyond"],["The Specials, A Message to You, Rudy (1979)","The Specials A Message to You Rudy"]],"questions":["Où tombent les accents : sur les temps ou entre les temps ?","Pourquoi le mouvement 2 Tone mêle-t-il des musiciens noirs et blancs ?"],"statut":"brouillon"},"dub":{"origines":"Le dub naît en Jamaïque à la fin des années 1960 : des ingénieurs du son, King Tubby et Lee « Scratch » Perry notamment, retravaillent des morceaux de reggae en studio en retirant des pistes, en ajoutant de l'écho et de la réverbération.","contexte":"Les faces B des disques proposent des versions instrumentales (versions) sur lesquelles les DJ de sound system posent leurs voix. L'ingénieur devient musicien : la table de mixage est un instrument. Le dub influence la jungle, le dubstep, le hip-hop et la musique électronique.","production":"Mixage en direct : on coupe la voix, on isole la basse et la batterie, on envoie des éléments dans des échos et des réverbérations.","reperes":[[1973,"Lee Perry ouvre son studio Black Ark à Kingston."],[1976,"Augustus Pablo, King Tubby Meets Rockers Uptown ; Lee Perry and the Upsetters, Super Ape."]],"ecoute":[["Augustus Pablo, King Tubby Meets Rockers Uptown (1976)","Augustus Pablo King Tubby Meets Rockers Uptown"],["Lee Perry and the Upsetters, Super Ape (1976)","Lee Perry Upsetters Super Ape"],["King Tubby, Dub from the Roots (1974)","King Tubby Dub from the Roots"]],"questions":["Quels instruments disparaissent, lesquels reviennent ?","Que fait l'écho : il répète, il allonge, il crée un espace ?"],"statut":"brouillon"},"dancehall":{"origines":"Le dancehall se développe en Jamaïque à la fin des années 1970 et surtout dans les années 1980, autour des soirées de sound system.","contexte":"En 1985, le titre Under Mi Sleng Teng de Wayne Smith, produit par Prince Jammy sur un orgue Casio, lance l'ère des riddims numériques. Les DJ (chanteurs-rappeurs jamaïcains) comme Yellowman, Shabba Ranks puis Beenie Man en sont les stars.","rythme":"Riddims numériques, tempo plus rapide que le reggae, rythmes percussifs.","timbres":"Claviers et boîtes à rythmes, voix scandées, basses profondes.","reperes":[[1985,"Wayne Smith, Under Mi Sleng Teng, produit par Prince Jammy."]],"ecoute":[["Wayne Smith, Under Mi Sleng Teng (1985)","Wayne Smith Under Mi Sleng Teng"],["Yellowman, Zungguzungguguzungguzeng (1983)","Yellowman Zungguzungguguzungguzeng"],["Shabba Ranks, Dem Bow (1990)","Shabba Ranks Dem Bow"]],"questions":["Qu'est-ce qui indique que le rythme est produit par une machine ?","Quel est le rôle du « DJ » jamaïcain par rapport à celui d'un DJ de club ?"],"statut":"brouillon"},"soca":{"origines":"La soca (soul of calypso) naît à Trinidad et Tobago dans les années 1970, avec Lord Shorty (Garfield Blackman), qui cherche à relancer le calypso avec des rythmes indiens et de la musique électronique.","contexte":"C'est la musique du Carnaval de Trinidad : tempo rapide, danse collective. Le titre Hot Hot Hot (1982), de l'artiste de Montserrat Arrow, la fait connaître dans le monde.","rythme":"Tempo rapide (autour de 120 à 130 battements par minute), basse et batterie très marquées.","reperes":[[1982,"Arrow, Hot Hot Hot."]],"ecoute":[["Arrow, Hot Hot Hot (1982)","Arrow Hot Hot Hot"],["Lord Shorty, Endless Vibrations","Lord Shorty Endless Vibrations"],["Machel Montano, Differentology","Machel Montano Differentology"]],"questions":["Quel est le tempo ? Que ressens-tu dans le corps ?","Que garde la soca du calypso, qu'est-ce qui change ?"],"statut":"brouillon"},"calypso":{"origines":"Le calypso (kaiso) vient de Trinidad et Tobago, où il se développe aux XIXe et XXe siècles chez les descendants des esclaves africains, dans les tentes à calypso du Carnaval.","contexte":"Chants satiriques, commentaires sur l'actualité politique et sociale, rivalités entre chanteurs. Lord Kitchener enregistre London Is the Place for Me en 1948, à l'arrivée du navire Empire Windrush. En 2018, l'UNESCO inscrit le calypso de Trinidad et Tobago au patrimoine culturel immatériel.","rythme":"Mesure à deux temps, syncopes, texte rimé qu'on comprend bien.","reperes":[[1948,"Lord Kitchener, London Is the Place for Me."],[1956,"Harry Belafonte, Calypso, album souvent cité comme premier LP à dépasser le million d'exemplaires aux États-Unis."],[2018,"Inscription du calypso au patrimoine de l'UNESCO."]],"ecoute":[["Lord Kitchener, London Is the Place for Me (1948)","Lord Kitchener London Is the Place for Me"],["Mighty Sparrow, Jean and Dinah (1956)","Mighty Sparrow Jean and Dinah"],["Harry Belafonte, Day-O (1956)","Harry Belafonte Day-O"]],"questions":["De quoi se moque le chanteur, et comment le dit-il ?","Pourquoi le texte compte-t-il autant que la musique ?"],"statut":"brouillon"},"fela-kuti":{"origines":"Fela Kuti, né en 1938 à Abeokuta (Nigeria), mort à Lagos en 1997, chanteur, saxophoniste, claviériste et chef d'orchestre, invente l'afrobeat. Il étudie la musique à Londres, au Trinity College of Music, de 1958 à 1963.","contexte":"Après un séjour à Los Angeles en 1969, où il découvre le mouvement des Black Panthers, il politise son répertoire. Il fonde la Kalakuta Republic, communauté et studio à Lagos, et joue au club Afrika Shrine. Ses chansons attaquent la corruption et l'armée. En 1977, l'armée attaque la Kalakuta Republic ; sa mère, Funmilayo Ransome-Kuti, grièvement blessée, meurt en 1978.","formes":"Morceaux de dix à trente minutes, longue introduction instrumentale, puis voix, en appel et réponse avec les choristes.","reperes":[[1969,"Séjour à Los Angeles et prise de conscience politique."],[1975,"Expensive Shit ; Water No Get Enemy."],[1976,"Zombie, qui dénonce la discipline militaire."],[1977,"L'armée attaque la Kalakuta Republic."],[1997,"Mort de Fela Kuti à Lagos."]],"ecoute":[["Fela Kuti, Zombie (1976)","Fela Kuti Zombie"],["Fela Kuti, Water No Get Enemy (1975)","Fela Kuti Water No Get Enemy"],["Fela Kuti, Expensive Shit (1975)","Fela Kuti Expensive Shit"]],"questions":["Comment la longue introduction instrumentale prépare-t-elle l'arrivée de la voix ?","De quoi le texte accuse-t-il les militaires, et comment le dit-il ?"],"statut":"brouillon"},"highlife":{"origines":"Le highlife naît au Ghana (alors Gold Coast) et au Nigeria au début du XXe siècle, à partir de musiques côtières africaines, de fanfares militaires et de jazz.","contexte":"Le trompettiste E. T. Mensah, surnommé « roi du highlife », en est une figure centrale au Ghana dans les années 1950. Après les indépendances (Ghana 1957, Nigeria 1960), le highlife accompagne l'élan national. Fela Kuti y fait ses débuts avec son groupe Koola Lobitos, qui joue du highlife-jazz, avant de fonder l'afrobeat.","timbres":"Guitares aux arpèges légers, cuivres, percussions, voix en choeur.","reperes":[[1957,"Indépendance du Ghana."],[1960,"Indépendance du Nigeria."]],"ecoute":[["E. T. Mensah, All for You","E. T. Mensah All for You"],["Osibisa, Woyaya (1971)","Osibisa Woyaya"],["Victor Olaiya, Omo Pupa","Victor Olaiya Omo Pupa"]],"questions":["Quels instruments viennent de la fanfare, lesquels de la tradition locale ?","Quel est le rôle des guitares ?"],"statut":"brouillon"},"rumba-congolaise":{"origines":"La rumba congolaise naît dans les années 1940-1950 à Léopoldville (Kinshasa) et à Brazzaville, en mêlant le son cubain, rapporté par disque, et des rythmes et langues congolais.","contexte":"Elle devient la bande son des indépendances : Joseph Kabasele (Grand Kallé) enregistre Indépendance Cha Cha en 1960. Franco et son TPOK Jazz (1956) dominent ensuite plusieurs décennies. En 2021, l'UNESCO inscrit la rumba congolaise au patrimoine culturel immatériel (Congo-Brazzaville et RDC).","rythme":"Mesure à deux temps, rythme souple, danse en couple.","timbres":"Guitares électriques en arpèges entrelacés, cuivres, section rythmique, voix en harmonie.","reperes":[[1956,"Franco fonde l'OK Jazz (futur TPOK Jazz)."],[1960,"Grand Kallé, Indépendance Cha Cha."],[2021,"Inscription de la rumba congolaise au patrimoine de l'UNESCO."]],"ecoute":[["Grand Kallé et l'African Jazz, Indépendance Cha Cha (1960)","Grand Kallé Indépendance Cha Cha"],["Franco et le TPOK Jazz, Mario (1985)","Franco TPOK Jazz Mario"],["Tabu Ley Rochereau, Pitié","Tabu Ley Rochereau Pitié"]],"questions":["Quels sons d'origine cubaine reconnais-tu ?","Comment les guitares se répondent-elles ?"],"statut":"brouillon"},"amapiano":{"origines":"L'amapiano apparaît en Afrique du Sud dans les années 2010, dans les townships de la région de Gauteng (Pretoria et Johannesburg).","contexte":"Né dans les soirées et sur les réseaux sociaux, il se répand en Afrique puis dans le monde après 2019 avec des artistes comme DJ Maphorisa et Kabza De Small (album Scorpion Kings, 2019).","rythme":"Tempo modéré (autour de 110 à 115 battements par minute), grosse caisse régulière, percussions syncopées.","timbres":"La basse du « log drum » (un son de percussion à hauteur définie, très grave), pianos jazzy, nappes de synthétiseur, voix douces.","reperes":[[2019,"DJ Maphorisa et Kabza De Small, Scorpion Kings."],[2022,"Uncle Waffles, Tanzania."]],"ecoute":[["DJ Maphorisa et Kabza De Small, Scorpion Kings (2019)","DJ Maphorisa Kabza De Small Scorpion Kings"],["Uncle Waffles, Tanzania (2022)","Uncle Waffles Tanzania"]],"questions":["Peux-tu repérer le son du « log drum » ?","Quelle différence entends-tu avec une house européenne ?"],"statut":"brouillon"},"gwoka":{"origines":"Le gwoka est l'ensemble des chants, des danses et des rythmes joués sur les tambours ka en Guadeloupe. Il est né dans les plantations, parmi les descendants d'esclaves africains.","contexte":"Longtemps méprisé, le gwoka est devenu un emblème culturel guadeloupéen. En 2014, l'UNESCO l'inscrit au patrimoine culturel immatériel. La veillée (léwoz) en est le cadre : un tambour boula (basse) et un tambour makè (soliste) dialoguent avec le chanteur et le chœur.","rythme":"Sept rythmes de base (toumblak, graj, kaladja, menndé, woulé, léwoz, padjanbèl), chacun avec sa danse.","reperes":[[2014,"Inscription du gwoka au patrimoine de l'UNESCO."]],"ecoute":[],"questions":["Quels sont les deux tambours et quel est le rôle de chacun ?","Comment le tambour soliste répond-il au chanteur ?"],"statut":"brouillon"},"hindustani":{"origines":"La musique classique hindoustanie est la tradition savante du nord de l'Inde, du Pakistan et du Bangladesh, née de l'ancienne musique indienne et des apports persans sous les cours moghols.","contexte":"Elle se transmet de maître à élève (guru-shishya), dans des lignées appelées gharanas. Elle est fondée sur le râga (mode mélodique associé à une humeur et à un moment du jour) et le tala (cycle rythmique). Ravi Shankar la fait connaître en Occident, notamment au festival de Monterey en 1967 et au Concert pour le Bangladesh en 1971.","melodie":"Un râga est un ensemble de notes avec des règles de montée et de descente, des notes importantes et des ornements.","rythme":"Le tala : cycle de temps (par exemple teental, seize temps) joué au tabla.","formes":"L'exposition lente du râga sans rythme (alap), puis des sections de plus en plus rapides avec le tabla.","timbres":"Sitar, sarod, bansuri (flûte), tabla, tanpura (bourdon) ou voix.","reperes":[[1967,"Ravi Shankar joue à Monterey."],[1971,"Concert pour le Bangladesh à New York, avec George Harrison."]],"ecoute":[["Ravi Shankar et Ali Akbar Khan, In Concert 1972 (1973)","Ravi Shankar Ali Akbar Khan In Concert 1972"],["Ravi Shankar, Bangla Dhun (Concert pour le Bangladesh, 1971)","Ravi Shankar Concert for Bangladesh Bangla Dhun"]],"questions":["Quel instrument tient la note de bourdon sous la mélodie ?","Que se passe-t-il quand le tabla entre : la musique change-t-elle de caractère ?"],"statut":"brouillon"},"carnatic":{"origines":"La musique carnatique est la tradition savante de l'Inde du Sud (Tamil Nadu, Karnataka, Andhra Pradesh, Kerala).","contexte":"Son répertoire repose sur trois compositeurs de la fin du XVIIIe et du début du XIXe siècle, la « trinité » : Tyagaraja, Muthuswami Dikshitar et Syama Sastri. Chaque année en décembre, la Music Season de Chennai réunit des centaines de concerts.","melodie":"Systèmes de râgas très codifiés (72 mélakartas) avec ornements (gamakas).","rythme":"Cycles rythmiques (talas) comptés à la main, jouées au mridangam, tambour à deux faces.","formes":"Le kriti, composition en plusieurs sections, et l'improvisation (alapana, kalpanaswara).","timbres":"Voix, veena, violon, flûte, mridangam, ghatam (pot en terre cuite).","reperes":[[1767,"Naissance de Tyagaraja, selon la tradition."],[1916,"Naissance de M. S. Subbulakshmi, grande chanteuse carnatique."]],"ecoute":[["M. S. Subbulakshmi, Bhaja Govindam","M. S. Subbulakshmi Bhaja Govindam"],["Tyagaraja, Endaro Mahanubhavulu (Pancharatna kriti)","Endaro Mahanubhavulu"],["Lalgudi Jayaraman, violon carnatique","Lalgudi Jayaraman violin"]],"questions":["Comment la voix orne-t-elle chaque note ?","Quel instrument à percussion accompagne le chanteur ?"],"statut":"brouillon"},"gamelan":{"origines":"Le gamelan est un ensemble instrumental de Java et de Bali (Indonésie), formé surtout de métallophones, de gongs, de tambours et de flûtes.","contexte":"Le gamelan accompagne les cérémonies, les danses, le théâtre d'ombres wayang. Debussy l'entend à l'Exposition universelle de Paris en 1889. En 2021, l'UNESCO inscrit le gamelan au patrimoine culturel immatériel.","melodie":"Deux systèmes d'accord : slendro (cinq notes à peu près égales) et pelog (sept notes, inégales), jamais identiques d'un gamelan à l'autre.","rythme":"Structure cyclique : les gongs marquent la fin d'un cycle (gongan) ; les instruments se superposent à des vitesses différentes.","timbres":"Bronze, gongs, saron, gender, bonang, kendang (tambours), suling (flûte).","reperes":[[1889,"Debussy entend un gamelan javanais à l'Exposition universelle de Paris."],[1903,"Debussy publie Pagodes, première des Estampes, au piano."],[2021,"Inscription du gamelan au patrimoine de l'UNESCO."]],"ecoute":[["Claude Debussy, Pagodes (1903)","Debussy Pagodes Estampes"],["Colin McPhee, Tabuh-Tabuhan (1936)","Colin McPhee Tabuh-Tabuhan"]],"questions":["Comment les gongs marquent-ils la fin d'un cycle ?","Quel effet produit l'accord légèrement différent d'un instrument à l'autre ?"],"statut":"brouillon"},"gagaku":{"origines":"Le gagaku est la musique de cour du Japon, héritée de musiques importées de Chine et de Corée entre les VIIe et Xe siècles et conservée par la cour impériale.","contexte":"Il se joue dans les cérémonies de la cour et dans certains sanctuaires. Les compositeurs du XXe siècle s'en inspirent : Toru Takemitsu (In an Autumn Garden, 1973) et Olivier Messiaen (Sept haïkaï, 1962) y font référence. L'UNESCO l'a inscrit en 2009.","timbres":"Sho (orgue à bouche), hichiriki (hautbois), ryuteki (flûte traversière), biwa et koto (cordes), tambours kakko et taiko.","formes":"Pièces instrumentales (kangen), pièces pour danse (bugaku) ; les tempos sont très lents.","reperes":[[1962,"Olivier Messiaen, Sept haïkaï."],[1973,"Toru Takemitsu, In an Autumn Garden."],[2009,"Inscription du gagaku au patrimoine de l'UNESCO."]],"ecoute":[["Toru Takemitsu, In an Autumn Garden (1973)","Takemitsu In an Autumn Garden"],["Olivier Messiaen, Sept haïkaï : Gagaku (1962)","Messiaen Sept haïkaï Gagaku"]],"questions":["Quel instrument produit des accords tenus et une couleur proche de l'orgue ?","Comment la lenteur change-t-elle ta manière d'écouter ?"],"statut":"brouillon"},"city-pop":{"origines":"La city pop est un style de pop japonaise de la fin des années 1970 et des années 1980, mêlant pop, soul, funk, jazz-fusion et disco, avec des paroles tournées vers la ville moderne.","contexte":"Elle accompagne l'essor économique du Japon (la « bulle » des années 1980), la voiture, le baladeur Walkman, les vacances. Redécouverte vers 2017 sur Internet, en particulier par un algorithme de recommandation de YouTube, elle devient un genre mondial de nostalgie.","timbres":"Synthétiseurs et DX7, basses funk, cuivres, guitares claires, voix douces, studio très soigné.","reperes":[[1977,"Taeko Ohnuki, Sunshower."],[1982,"Tatsuro Yamashita, For You."],[1984,"Mariya Takeuchi, Plastic Love."]],"ecoute":[["Mariya Takeuchi, Plastic Love (1984)","Mariya Takeuchi Plastic Love"],["Tatsuro Yamashita, Sparkle (1982)","Tatsuro Yamashita Sparkle"],["Taeko Ohnuki, Sunshower (1977)","Taeko Ohnuki Sunshower"]],"questions":["Quels éléments rappellent le funk ou le jazz ?","Pourquoi cette musique peut-elle évoquer une ville et une époque ?"],"statut":"brouillon"},"maqam":{"origines":"Le maqam (pluriel maqamat) est le système modal de la musique arabe, aussi présent en Turquie (makam), en Iran et en Asie centrale sous d'autres formes.","contexte":"Chaque maqam a une échelle de notes, des notes de repos, des chemins de mélodie, une couleur émotionnelle ; certains degrés se situent entre les notes du piano (quarts de ton). Les grandes figures du XXe siècle sont Oum Kalthoum, Mohammed Abdel Wahab, Fairouz.","melodie":"Familles principales : rast, bayati, hijaz, sikah, saba, nahawand, ajam, kurd.","formes":"Le taqsim est une improvisation libre sur un maqam, souvent à l'oud ou au qanun, avant ou à l'intérieur d'une pièce composée.","timbres":"Oud, qanun, nay (flûte), violon, riqq (tambourin), darbouka, voix.","reperes":[[1964,"Oum Kalthoum chante Enta Omri, composé par Mohammed Abdel Wahab."],[1969,"Oum Kalthoum chante Alf Leila wa Leila."]],"ecoute":[["Oum Kalthoum, Enta Omri (1964)","Oum Kalthoum Enta Omri"],["Fairouz, Li Beirut (1984)","Fairouz Li Beirut"],["Oum Kalthoum, Alf Leila wa Leila (1969)","Oum Kalthoum Alf Leila wa Leila"]],"questions":["Entends-tu des notes qui ne figurent pas sur un piano ?","Comment le chanteur répète-t-il une phrase en la changeant à chaque fois ?"],"statut":"brouillon"},"pansori":{"origines":"Le pansori est un genre coréen de récit chanté : un chanteur (sorikkun) et un joueur de tambour (gosu) racontent une histoire pendant plusieurs heures. Il apparaît aux XVIIe et XVIIIe siècles.","contexte":"Sur les cinq récits conservés, les plus connus sont Chunhyangga (Chunhyang), Simcheongga, Heungbuga, Jeokbyeokga et Sugungga. L'UNESCO a proclamé le pansori chef-d'oeuvre du patrimoine oral en 2003.","formes":"Alternance de parties chantées (sori), de récit parlé (aniri) et de gestes (ballim) ; le tambour marque les temps et encourage la voix par des interjections (chuimsae).","timbres":"Voix puissante, rauque, qui doit se forger par des années d'entraînement ; tambour buk.","reperes":[[2003,"Proclamation du pansori comme chef-d'oeuvre du patrimoine oral et immatériel de l'humanité par l'UNESCO."]],"ecoute":[["Pansori, Chunhyangga (extrait)","Pansori Chunhyangga"],["Pansori, Simcheongga (extrait)","Pansori Simcheongga"],["Ahn Sook-sun, pansori","Ahn Sook-sun pansori"]],"questions":["Quel est le rôle du joueur de tambour ?","Comment la voix passe-t-elle du parlé au chanté ?"],"statut":"brouillon"},"khoomei":{"origines":"Le chant diphonique, appelé khöömei en Mongolie et khoomei en Touva, fait entendre simultanément un bourdon grave et une mélodie d'harmoniques aiguës produits par une seule voix.","contexte":"Il est pratiqué chez les éleveurs de Mongolie, de Touva (Russie) et de l'Altaï. La Mongolie a obtenu l'inscription de son khöömei au patrimoine culturel immatériel de l'UNESCO en 2010. Plusieurs styles existent : khoomei, sygyt (harmonique aigu, sifflé), kargyraa (très grave).","melodie":"On forme des mélodies à partir des harmoniques du bourdon, en changeant la forme de la bouche.","timbres":"Voix seule, parfois avec igil, morin khuur ou doshpuluur.","reperes":[[2010,"Inscription du khöömei mongol au patrimoine culturel immatériel de l'UNESCO."]],"ecoute":[["Huun-Huur-Tu, Orphan's Lament","Huun-Huur-Tu Orphan's Lament"],["Chant diphonique mongol, khöömei","khöömei Mongolia throat singing"],["Sainkho Namtchylak, chant diphonique","Sainkho Namtchylak"]],"questions":["Peux-tu entendre deux sons en même temps sortir d'une seule voix ?","Comment le chanteur fait-il changer la mélodie aiguë ?"],"statut":"brouillon"},"raï":{"origines":"Le raï naît dans l'ouest de l'Algérie, à Oran et dans sa région, dans les années 1920-1930, chez les chanteuses populaires (cheikhates), notamment Cheikha Rimitti.","contexte":"Longtemps marginalisé pour ses textes sur l'amour, l'alcool et la liberté, il s'électrifie dans les années 1970-1980 (guitare, synthétiseur, boîte à rythmes). Le premier festival de raï a lieu à Oran en 1985. Cheb Khaled en devient la figure internationale : Didi (1992) puis Aïcha (1996), écrit par Jean-Jacques Goldman. Cheb Hasni est assassiné en 1994 pendant la guerre civile. L'UNESCO ins
