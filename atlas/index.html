.recherche-haut { position: relative; flex: 0 1 260px; } .recherche-haut input { width: 100%; font: 600 .9rem var(--f-txt); padding: 7px 14px; border-radius: 999px; border: 2px solid #fff; background: transparent; color: #fff; } .recherche-haut input::placeholder { color: #ccc; }

.graphe-wrap { border: 2px solid var(--noir); border-radius: 24px; background: #fff; margin-top: 12px; overflow: auto; } .graphe-wrap svg { display: block; width: 100%; height: auto; min-width: 640px; } .graphe-wrap text { font: 600 12px var(--f-txt); pointer-events: none; }

.champs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; } .champs label { font-weight: 600; font-size: .9rem; } .champs input[type=number] { width: 5.5em; padding: 6px 10px; border: 2px solid var(--noir); border-radius: 999px; font: 600 .95rem var(--f-txt); }
.sections { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; margin-top: 10px; } .sections section { background: #fff; border: 2px solid var(--noir); border-radius: 20px; padding: 12px 16px; } .sections h3 { font: 600 .8rem/1 ui-monospace, Menlo, monospace; text-transform: uppercase; letter-spacing: .06em; margin: 2px 0 8px; } .sections p { margin: 0; font-size: .96rem; }
.question { background: var(--acide); border-radius: 18px; padding: 10px 16px; margin-top: 8px; font-weight: 600; }
.etoile { font: inherit; }
.comparaison { background: #fff; border: 2px solid var(--noir); border-radius: 24px; padding: 16px 18px; margin-top: 12px; } .comparaison h3 { font: 400 1.25rem/1.15 var(--f-aff); margin: 0 0 6px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; } @media (max-width: 640px) { .duo { grid-template-columns: 1fr; } }

@font-face { font-family: "Archivo Variable"; src: url("../polices/archivo-variable-latin.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
@font-face { font-family: "Plex Mono Local"; src: url("../polices/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
/* Direction SIGNAL (même bandeau, mêmes tuiles que le Labo du site) : fond noir, titre condensé en deux lignes, vert acide, mono, angles droits. */
:root { --rouge: #FF5638; --f-cond: "Archivo Variable", "Archivo Black", Arial, sans-serif; --f-mono: "Plex Mono Local", ui-monospace, Menlo, monospace; }
header.haut nav a { border-radius: 0; font: 500 .8rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; }
header.haut .titre { font-family: var(--f-cond); font-stretch: 62%; font-weight: 900; text-transform: uppercase; font-size: 1.3rem; }
.bande, .fiche-tete { position: relative; background: var(--noir); color: var(--papier); margin: 0 -16px 20px; padding: clamp(18px, 3vw, 34px); padding-right: clamp(64px, 10vw, 120px); border-radius: 0; box-shadow: none; overflow: hidden; }
.bande::before, .fiche-tete::before { content: ""; position: absolute; top: 0; right: 0; width: clamp(40px, 7vw, 76px); height: clamp(46px, 8vw, 88px); background: var(--c, var(--acide)); }
.bande::after, .fiche-tete::after { content: ""; position: absolute; top: clamp(46px, 8vw, 88px); right: 0; width: clamp(12px, 2.2vw, 24px); height: clamp(22px, 4vw, 44px); background: var(--rouge); }
.bande .etiq, .fiche-tete .etiq { background: var(--acide); color: var(--noir); }
.bande h1, .fiche-tete h1 { font-family: var(--f-cond); font-weight: 900; font-stretch: 62%; font-size: clamp(2.4rem, 9vw, 5.6rem); line-height: .9; letter-spacing: -.005em; text-transform: uppercase; color: var(--papier); margin: 12px 0 10px; }
.bande h1 .l2, .fiche-tete h1 .l2 { color: var(--acide); }
.bande .lead, .fiche-tete p { color: #D3D2CA; font: 400 clamp(.84rem, 1.4vw, 1rem)/1.6 var(--f-mono); letter-spacing: .04em; max-width: 62ch; }
.fiche-tete .meta span { background: transparent; border: 1px solid #55554E; border-radius: 0; color: var(--papier); font: 500 .75rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; }
.recherche input { border-radius: 0; border-width: 2px; font-family: var(--f-mono); font-size: 1.05rem; letter-spacing: .02em; }
.suggestions a, .liens li, details.concept, .carte-wrap { border-radius: 0; }
.pastille { border-radius: 0; box-shadow: none; font: 500 .8rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.pastille:hover, .pastille:focus-visible { background: var(--acide); color: var(--noir); outline: none; }
.liens .nat { border-radius: 0; }
h2 { font-family: var(--f-cond); font-stretch: 75%; font-weight: 900; text-transform: uppercase; font-size: 1.7rem; letter-spacing: 0; border-top-width: 3px; }
.grille { gap: 0; border-top: 2px solid var(--noir); border-left: 2px solid var(--noir); }
.carte { position: relative; background: var(--papier); color: var(--noir); border-radius: 0; box-shadow: none; border-right: 2px solid var(--noir); border-bottom: 2px solid var(--noir); border-top: 10px solid var(--c, var(--noir)); min-height: 170px; gap: 8px; }
.carte:hover, .carte:focus-visible { transform: none; background: var(--acide); outline: none; }
.carte b { font-family: var(--f-cond); font-stretch: 75%; font-weight: 900; text-transform: uppercase; font-size: 1.35rem; line-height: 1; }
.carte span { opacity: .85; } .carte .suite { font: 500 .78rem var(--f-mono); letter-spacing: .1em; text-transform: uppercase; opacity: 1; }
@media (max-width: 640px) { .bande, .fiche-tete { margin: 0 -16px 16px; } }
.mini-etiq { font: 500 .66rem var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: #4B4A44; margin: 16px 0 0; }
.graphe-liste { border: 0; border-radius: 0; background: transparent; overflow: visible; max-height: none; padding: 0; }
.rel-groupe h2 { font: 500 .78rem var(--f-mono); letter-spacing: .1em; text-transform: uppercase; margin: 18px 0 6px; } .rel-groupe h2 .petit { margin-left: 6px; }
.rel { position: relative; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 12px 8px 24px; margin-top: 6px; background: #fff; color: var(--noir); text-decoration: none; border: 2px solid var(--noir); }

.rel.interp::before { background: repeating-linear-gradient(0deg, var(--c, var(--noir)) 0 6px, transparent 6px 10px); }   /* rayé : interprétation, plein : fait établi */ .rel b { flex: 1; font-weight: 600; } .rel small { font: 500 .64rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: #4B4A44; text-align: right; }
.rel:hover, .rel:focus-visible { background: var(--acide); outline: none; }
/* fiches détaillées : repères, bandeau de brouillon, liens pour aller plus loin */
.brouillon { background: #fff; border-left: 6px solid var(--rouge, #FF5638); padding: 8px 12px; margin: 8px 0 14px; font-size: .88rem; max-width: 80ch; }

.plus li .petit, .constats li .petit { flex: 1 1 220px; margin: 0; } .plus a, .constats a { color: var(--noir); text-underline-offset: 3px; } .plus a:hover, .constats a:hover { background: var(--acide, #D6FF00); }
.constats li { border-left: 8px solid var(--acide, #D6FF00); }
@media (max-width: 640px) { .reperes li { grid-template-columns: 54px 1fr; } .departs-liste { flex-wrap: nowrap; overflow-x: auto; margin-right: -16px; padding: 4px 16px 8px 0; gap: 6px; scrollbar-width: thin; } .departs-liste .pastille { flex: 0 0 auto; padding: 6px 10px; font-size: .7rem; border-width: 1.5px; }
  .legende { gap: 4px; margin-top: 14px; } .legende .pastille { padding: 3px 8px; font-size: .6rem; border-width: 1px; gap: 5px; } }

pose, le musicien choisit.","nature":"echo","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"microtonal","target":"spectral","texte":"Les harmoniques d'un son ne tombent pas sur les notes du piano : les spectraux notent donc des quarts de ton.","nature":"technique","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"minimalism","target":"hindustani","texte":"Terry Riley et La Monte Young ont étudié auprès du chanteur Pandit Pran Nath ; le bourdon, la durée et la répétition marquent leur musique.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":true},{"type":"INFLUENCED_BY","source":"minimalism","target":"african-traditions","texte":"Steve Reich a étudié les percussions du Ghana en 1970 ; les motifs qui se décalent dans Drumming (1971) en portent la trace.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":true},{"type":"INFLUENCED_BY","source":"minimalism","target":"gamelan","texte":"Steve Reich a aussi étudié le gamelan balinais ; les cycles et les motifs entrelacés se retrouvent dans ses pièces.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":true},{"type":"CROSSES_WITH","source":"techno","target":"minimalism","texte":"Répétition, motifs qui se transforment lentement, pulsation : la techno est souvent rapprochée du minimalisme, même si les deux mondes ne se sont pas toujours connus.","nature":"echo","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"CROSSES_WITH","source":"post-rock","target":"minimalism","texte":"Le post-rock fait évoluer lentement des motifs répétés et des textures avec des guitares, comme le minimalisme avec des instruments de salle de concert.","nature":"echo","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"CROSSES_WITH","source":"kraftwerk","target":"electronic-composition","texte":"Kraftwerk est souvent présenté comme l'héritier d'une tradition allemande de musique électronique de studio, dont Cologne et Stockhausen sont les noms connus, mais pour le grand public.","nature":"echo","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"synth-pop","target":"kraftwerk","texte":"Synthétiseurs, boîtes à rythmes et chant presque parlé : la new wave et la synth-pop britanniques prennent le modèle de Kraftwerk.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"hip-hop","target":"kraftwerk","texte":"Afrika Bambaataa reprend la mélodie et le rythme de Kraftwerk dans Planet Rock (1982) : un groupe allemand devient matière à danser au Bronx.","nature":"technique","statut":"interpretation","sources":[],"a_sourcer":true},{"type":"INFLUENCED_BY","source":"detroit-techno","target":"kraftwerk","texte":"Juan Atkins et ses amis écoutent Kraftwerk, le funk et la musique électronique européenne et en font une musique de machines, futuriste, pour Detroit.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":true},{"type":"INFLUENCED_BY","source":"detroit-techno","target":"funk","texte":"Le groove répété du funk, basse et boucle qui ne s'arrêtent pas, devient séquence jouée par des machines.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"house","target":"disco","texte":"La house naît dans les clubs de Chicago : pulsation à quatre temps, DJ, et boîte à rythmes à la place de l'orchestre disco.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"CROSSES_WITH","source":"techno","target":"house","texte":"Chicago et Detroit utilisent les mêmes machines et la même pulsation à quatre temps ; Detroit y met plus de futurisme et de séquences.","nature":"echo","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"trance","target":"techno","texte":"La trance garde la pulsation de la techno et y aporwave détourne aussi la musique d'ambiance des centres commerciaux.","nature":"echo","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"synthwave","target":"synth-pop","texte":"La synthwave recompose les synthétiseurs et les boîtes à rythmes des années 1980.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"synthwave","target":"new-wave","texte":"L'esthétique visuelle et sonore des années 1980, néons, synthétiseurs et musiques de film, est son décor.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"synth-pop","target":"fm-synthesis","texte":"Les synthétiseurs à synthèse FM (Yamaha DX7, 1983) donnent le son de beaucoup de productions pop des années 1980.","nature":"technique","statut":"interpretation","sources":[],"a_sourcer":true},{"type":"INFLUENCED_BY","source":"fm-synthesis","target":"sound-synthesis","texte":"La synthèse FM fait moduler la fréquence d'un son par un autre : un son simple devient très riche, avec peu de calcul.","nature":"technique","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"jungle","target":"sound-system","texte":"La culture sound system jamaïcaine, basses énormes, MC et disques gravés pour les fêtes, arrive à Londres et nourrit la jungle.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":true},{"type":"INFLUENCED_BY","source":"jungle","target":"sampling","texte":"Le même break de batterie échantillonné (l'Amen break) est accéléré et découpé pour faire la rythmique de la jungle.","nature":"technique","statut":"interpretation","sources":[],"a_sourcer":true},{"type":"INFLUENCED_BY","source":"drum-and-bass","target":"jungle","texte":"La drum and bass simplifie et durcit la jungle : breaks rapides et basses profondes.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"dubstep","target":"dub","texte":"L'espace, l'écho et la basse du dub jamaïcain se retrouvent dans le dubstep londonien.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"blues","target":"african-traditions","texte":"Rythmes, appel et réponse, chant expressif : des héritages africains, portés par les Africains déportés aux États-Unis, nourrissent le blues, le gospel et le jazz.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"jazz","target":"blues","texte":"Les blue notes, la forme en douze mesures et l'appel-réponse du blues passent dans le jazz.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"bossa-nova","target":"cool-jazz","texte":"Le jazz cool, aux timbres doux et aux harmonies riches, a nourri la bossa nova de Rio.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"jazz","target":"bossa-nova","texte":"L'album de Stan Getz et João Gilberto (1964) fait entrer la bossa nova dans le jazz américain.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":true},{"type":"INFLUENCED_BY","source":"british-rock","target":"chicago-blues","texte":"Les Rolling Stones, Eric Clapton et d'autres jeunes Britanniques reprennent le blues électrique de Chicago, et en font du rock.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"afrobeat","target":"jazz","texte":"Fela Kuti combine le highlife du Ghana et du Nigeria, le jazz et le funk de James Brown.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":true},{"type":"INFLUENCED_BY","source":"afrobeat","target":"highlife","texte":"Le highlife donne à l'afrobeat ses guitares et ses cuivres.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":true},{"type":"INFLUENCED_BY","source":"afrobeat","target":"funk","texte":"Le groove et les riffs répétés du funk de James Brown sont l'un des ingrédients de l'afrobeat.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":true},{"type":"INFLUENCED_BY","source":"hip-hop","target":"funk","texte":"Les breaks de batterie de James Brown et du funk, répétés par les DJ, deviennent la matière du hip-hop.","nature":"technique","statut":"interpretation","sources":[],"a_sourcer":true},{"type":"INFLUENCED_BY","source":"boom-bap","target":"jazz","texte":"Le boom bap échantillonne le jazz et la soul : une boucle de piano ou de contrebasse sous une batterie dure.","nature":"technique","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"boom-bap","target":"sampling","texte":"Le boom bap est fait d'échantillons découpés et rejoués sur une machine.","nature":"technique","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"CROSSES_WITH","source":"dub","target":"post-punk","texte":"Le post-punk britannique écoute le dub : basses profondes, écho et espace dans le mixage.","nature":"echo","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"post-punk","target":"dub","texte":"The Clash, Public Image Ltd et d'autres reprennent la basse et l'écho du dub.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"tropicalia","target":"psychedelic-rock","texte":"Les guitares électriques et le studio psychédélique des Beatles et d'autres nourrissent la Tropicália brésilienne.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"tropicalia","target":"samba","texte":"La Tropicália garde la samba et la bossa nova, qu'elle mélange au rock et à l'expérimentation.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"psychedelic-rock","target":"hindustani","texte":"George Harrison apprend le sitar avec Ravi Shankar (1965-1966) ; la musique indienne entre dans le rock avec les Beatles.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":true},{"type":"CROSSES_WITH","source":"fusion","target":"carnatic","texte":"Des projets comme Shakti, de John McLaughlin avec des musiciens indiens (1975), croisent le jazz et la musique de l'Inde du Sud.","nature":"echo","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"reggae","target":"ska","texte":"Le ska (1959) ralentit en rocksteady puis en reggae (vers 1968) en gardant l'offbeat, le coup sur le contretemps.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":true},{"type":"INFLUENCED_BY","source":"hip-hop","target":"sound-system","texte":"DJ Kool Herc, d'origine jamaïcaine, importe au Bronx la fête en plein air avec sound system, DJ et MC.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":true},{"type":"INFLUENCED_BY","source":"dancehall","target":"sound-system","texte":"Le dancehall naît du sound system : un chanteur ou un MC rapide sur un riddim, un rythme instrumental réutilisé.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"reggaeton","target":"dancehall","texte":"Le rythme dem bow et le chant rapide sur riddim venus de Jamaïque se mêlent à l'espagnol à Panama et à Porto Rico.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":true},{"type":"INFLUENCED_BY","source":"reggaeton","target":"hip-hop","texte":"Le reggaeton mêle les riddims du dancehall au rap et à la production hip-hop.","nature":"influence","statut":"interpretation","sources":[],"a_sourcer":false},{"type":"INFLUENCED_BY","source":"gwoka","target":"african-traditions","texte":"Le tambour ka du gwoka est un héritage africain transformé en Guadeloupe, pendant et après l'esclavag e par Schoenberg pour les hauteurs, aux durées, aux intensités et aux modes d'attaque.","statut":"interpretation","a_sourcer":true},{"de":"integral-serialism","vers":"electronic-composition","nature":"technique","texte":"Au studio de Cologne, Stockhausen applique la logique des paramètres au son fabriqué : chaque paramètre peut être calculé puis réalisé (Studie II, 1954).","statut":"interpretation","a_sourcer":true},{"de":"integral-serialism","vers":"spectral","nature":"reaction","texte":"Grisey et Murail reprochent en partie à la série de traiter le son comme une suite de chiffres ; ils partent de ce que le son est physiquement, son spectre, et de la durée que l'oreille perçoit.","statut":"interpretation","a_sourcer":false},{"de":"music-concrete","vers":"sampling","nature":"technique","texte":"Enregistrer, découper, boucler, transformer : le geste de Schaeffer (1948) se retrouve dans l'échantillonnage du hip-hop et de la house.","statut":"interpretation","a_sourcer":false},{"de":"music-concrete","vers":"industrial","nature":"echo","texte":"Bandes trafiquées et bruits de machines : la musique industrielle (années 1970) reprend le bruit comme matière, sans le cadre de la musique savante.","statut":"interpretation","a_sourcer":false},{"de":"electroacoustic","vers":"granular-synthesis","nature":"technique","texte":"L'idée de découper le son en très petits grains vient de la physique du son et de Xenakis ; Curtis Roads la rend utilisable par ordinateur.","statut":"interpretation","a_sourcer":false},{"de":"computer-music","vers":"spectral","nature":"technique","texte":"Les compositeurs spectraux analysent le son avec l'ordinateur (Grisey, Partiels, 1975, part de l'analyse d'un son de trombone).","statut":"interpretation","a_sourcer":true},{"de":"computer-music","vers":"glitch","nature":"technique","texte":"Le glitch fait de l'erreur numérique, un disque qui saute, un son haché, une matière musicale.","statut":"interpretation","a_sourcer":false},{"de":"aleatoric","vers":" es des années 1980.","statut":"interpretation","a_sourcer":false},{"de":"new-wave","vers":"synthwave","nature":"influence","texte":"L'esthétique visuelle et sonore des années 1980, néons, synthétiseurs et musiques de film, est son décor.","statut":"interpretation","a_sourcer":false},{"de":"fm-synthesis","vers":"synth-pop","nature":"technique","texte":"Les synthétiseurs à synthèse FM (Yamaha DX7, 1983) donnent le son de beaucoup de productions pop des années 1980.","statut":"interpretation","a_sourcer":true},{"de":"sound-synthesis","vers":"fm-synthesis","nature":"technique","texte":"La synthèse FM fait moduler la fréquence d'un son par un autre : un son simple devient très riche, avec peu de calcul.","statut":"interpretation","a_sourcer":false},{"de":"sound-system","vers":"jungle","nature":"influence","texte":"La culture sound system jamaïcaine, basses énormes, MC et disques gravés pour les fêtes, arrive à Londres et nourrit la jungle.","statut":"interpretation","a_sourcer":true},{"de":"sampling","vers":"jungle","nature":"technique","texte":"Le même break de batterie échantillonné (l'Amen break) est accéléré et découpé pour faire la rythmique de la jungle.","statut":"interpretation","a_sourcer":true},{"de":"jungle","vers":"drum-and-bass","nature":"influence","texte":"La drum and bass simplifie et durcit la jungle : breaks rapides et basses profondes.","statut":"interpretation","a_sourcer":false},{"de":"dub","vers":"dubstep","nature":"influence","texte":"L'espace, l'écho et la basse du dub jamaïcain se retrouvent dans le dubstep londonien.","statut":"interpretation","a_sourcer":false},{"de":"african-traditions","vers":"blues","nature":"influence","texte":"Rythmes, appel et réponse, chant expressif : des héritages africains, portés par les Africains déportés aux États-Unis, nourrissent le blues, le gospel et le jazz.","statut":"interpretation","a_sourcer":false},{"de":"blues","vers":"jazz","nature":"influence","texte":"Les blue notes, la forme en douze mesures et l'app influence","texte":"La cumbia villera garde les claviers et le rythme de la cumbia et y met les paroles des quartiers pauvres de Buenos Aires, à la fin des années 1990.","statut":"interpretation","a_sourcer":false},{"de":"rap","vers":"cumbia-villera","nature":"echo","texte":"Comme le rap, la villera raconte en langue crue la vie des quartiers marginalisés. Ce sont deux musiques différentes qui se répondent.","statut":"interpretation","a_sourcer":false},{"de":"house","vers":"amapiano","nature":"influence","texte":"L'amapiano marie la house sud-africaine, le piano et le jazz, avec la basse typique du log drum.","statut":"interpretation","a_sourcer":false},{"de":"house","vers":"gqom","nature":"influence","texte":"Le gqom de Durban garde la pulsation de la house mais la dépouille : peu de notes, des percussions lourdes.","statut":"interpretation","a_sourcer":false},{"de":"dancehall","vers":"afrobeats","nature":"echo","texte":"Les afrobeats actuels mêlent plusieurs influences, dont le dancehall, le hip-hop, le R&B et les rythmes ouest-africains.","statut":"interpretation","a_sourcer":false},{"de":"fela-kuti","vers":"afrobeats","nature":"echo","texte":"Il ne faut pas confondre l'afrobeat de Fela Kuti, né en 1968, et les afrobeats d'aujourd'hui, mais le premier a ouvert la voie à la reconnaissance des musiques nigérianes dans le monde.","statut":"interpretation","a_sourcer":false},{"de":"rnb","vers":"alternative-rnb","nature":"influence","texte":"Le R&B alternatif ouvre le chant du R&B à l'ambient et à l'électronique.","statut":"interpretation","a_sourcer":false},{"de":"hip-hop","vers":"french-rap","nature":"influence","texte":"Le rap français s'écrit en français et se développe dans les années 1980-1990 (IAM à Marseille, NTM en Seine-Saint-Denis).","statut":"interpretation","a_sourcer":false},{"de":"chanson-francaise","vers":"french-rap","nature":"echo","texte":"Le rap français hérite d'une tradition française où le texte et l'écriture comptent beaucoup.","statut":"interpretation","a_sourcer":false},{"de":"rap","vers":"trap","nature":"influence","texte":"La trap garde le rap mais le pose sur des machines : 808 graves, hi-hats rapides, sub-bass.","statut":"interpretation","a_sourcer":false},{"de":"trap","vers":"drill","nature":"influence","texte":"La drill assombrit la trap, avec 808 glissées et rythmes syncopés.","statut":"interpretation","a_sourcer":false},{"de":"hip-hop","vers":"kpop","nature":"influence","texte":"Seo Taiji and Boys (1992) apportent le rap, la danse et les sons du hip-hop américain à la pop coréenne ; l'industrie des idoles en fait un système.","statut":"interpretation","a_sourcer":true},{"de":"seo-taiji","vers":"kpop","nature":"influence","texte":"Nan Arayo (1992) mêle rap, danse et production de type new jack swing en Corée : les groupes d'idoles des années 1990 prennent ce modèle et en font une industrie.","statut":"interpretation","a_sourcer":true},{"de":"rnb","vers":"kpop","nature":"echo","texte":"La K-pop emprunte beaucoup à la production du R&B et du hip-hop américains.","statut":"interpretation","a_sourcer":false},{"de":"hip-hop","vers":"korean-hiphop","nature":"influence","texte":"Le hip-hop coréen adopte les techniques du MCing et du DJing et les adapte à la langue coréenne.","statut":"interpretation","a_sourcer":false},{"de":"korean-hiphop","vers":"kpop","nature":"influence","texte":"Les rappeurs coréens font partie des groupes de K-pop ; les deux scènes se croisent.","statut":"interpretation","a_sourcer":false},{"de":"cloud-rap","vers":"vaporwave","nature":"echo","texte":"Le cloud rap et la vaporwave aiment les samples ralentis, les textures aériennes et la nostalgie numérique.","statut":"interpretation","a_sourcer":false},{"de":"jpop","vers":"city-pop","nature":"influence","texte":"La city pop est une pop japonaise des années 1978-1990 faite avec des influences de disco, de funk et de jazz-fusion.","statut":"interpretation","a_sourcer":true},{"de":"disco","vers":"city-pop","nature":"influence","texte":"Disco, funk, soft rock et jazz-fusion américains nourrissent les productions japonaises de city pop.","statut":"interpretation","a_sourcer":false},{"de":"maqam","vers":"arabic-pop","nature":"influence","texte":"La pop arabe garde les modes du maqam et leurs ornements dans la mélodie.","statut":"interpretation","a_sourcer":false},{"de":"shoegaze","vers":"dream-pop","nature":"echo","texte":"Réverbération, voix noyées dans le mixage, textures : le shoegaze et la dream pop se répondent.","statut":"interpretation","a_sourcer":false},{"de":"punk","vers":"grunge","nature":"influence","texte":"Le grunge mêle l'énergie du punk et le poids du metal.","statut":"interpretation","a_sourcer":false},{"de":"heavy-metal","vers":"grunge","nature":"influence","texte":"La saturation des guitares du metal passe dans le grunge.","statut":"interpretation","a_sourcer":false}],"sources":[{"id":"grove","nom":"Grove Music Online (Oxford University Press)","genre":"encyclopédie universitaire","fiabilite":"élevée","url":"https://www.oxfordmusiconline.com"},{"id":"britannica","nom":"Encyclopaedia Britannica","genre":"encyclopédie générale","fiabilite":"moyenne à élevée","url":"https://www.britannica.com"},{"id":"ircam","nom":"Ircam, base de données Brahms","genre":"institution de recherche","fiabilite":"élevée","url":"https://brahms.ircam.fr"},{"id":"bnf","nom":"Bibliothèque nationale de France, data.bnf.fr","genre":"institution publique","fiabilite":"élevée","url":"https://data.bnf.fr"},{"id":"folkways","nom":"Smithsonian Folkways","genre":"archive sonore institutionnelle","fiabilite":"élevée","url":"https://folkways.si.edu"},{"id":"unesco","nom":"UNESCO, patrimoine culturel immatériel","genre":"institution internationale","fiabilite":"élevée","url":"https://ich.unesco.org"},{"id":"rilm","nom":"RILM Abstracts of Music Literature","genre":"bibliographie universitaire","fiabilite":"élevée","url":"https://www.rilm.org"},{"id":"musicbrainz","nom":"MusicBrainz","genre":"base communautaire ouverte","fiabilite":"moyenne : utile pour les dates et les discographies","url":"https://musicbrainz.org"},{"id":"discogs","nom":"Discogs","genre":"base communautaire et commerciale","fiabilite":"moyenne : utile pour les éditions, pas pour l'histoire des genres","url":"https://www.discogs.com"},{"id":"allmusic","nom":"AllMusic","genre":"base commerciale","fiabilite":"faible à moyenne : ses catégories sont celles d'une plateforme, pas de la musicologie","url":"https://www.allmusic.com"}],"concepts":[{"id":"serie","nom":"La série","texte":"Une série est un ordre fixe des douze notes de la gamme chromatique, qu'on utilise sans en répéter une avant que les onze autres soient passées. Schoenberg l'invente vers 1923 pour organiser la musique sans tonalité.","ecoute":"Cherche une mélodie qui ne revient jamais à une note de repos : aucune note n'est le centre.","mots":["série","organisation des hauteurs"],"cours":"3e-1"},{"id":"spectre","nom":"Le spectre","texte":"Un son est fait de plusieurs fréquences à la fois, la fondamentale et ses harmoniques ; l'ensemble s'appelle son spectre. C'est lui qui donne le timbre : le même la sonne autrement au violon et à la flûte.","ecoute":"Écoute un son tenu et essaie d'entendre, au-dessus de la note, d'autres notes plus aiguës qui l'accompagnent.","mots":["spectre","acoustique"],"cours":"3e-3"},{"id":"sampling","nom":"L'échantillonnage (sampling)","texte":"Prendre un morceau de son enregistré, une batterie, une voix, une phrase de piano, et le réutiliser pour faire autre chose. Il existe depuis les bandes de la musique concrète (1948) et devient courant avec les échantillonneurs numériques des années 1980.","ecoute":"Repère une boucle qui revient exactement la même, sous une voix ou sous un rythme : c'est souvent un échantillon.","mots":["sampling","échantillon"],"cours":"3e-2"},{"id":"boucle","nom":"La boucle","texte":"Un court motif répété indéfiniment, joué par un instrument, copié sur une bande ou répété par une machine. Elle crée une pulsation et fait entendre le moindre changement.","ecoute":"Compte combien de fois le motif revient, et repère ce qui s'ajoute dessus.","mots":["boucle","séquence"],"cours":"5e-3"},{"id":"boite-rythmes","nom":"La boîte à rythmes","texte":"Une machine qui joue des sons de batterie dans un ordre programmé. Les modèles de la marque Roland des années 1980, la TR-808 puis la TR-909, ont fixé les sons du hip-hop, de la house et de la techno.","ecoute":"Écoute un rythme parfaitement régulier, sans la petite irrégularité d'un batteur.","mots":["boîte à rythmes","percussions électroniques","machine"],"cours":null},{"id":"808","nom":"La 808","texte":"Le son de grosse caisse très grave et longue de la boîte à rythmes TR-808 ; en trap et en drill, on la fait glisser d'une hauteur à l'autre pour en faire une ligne de basse.","ecoute":"Écoute les basses très graves qui sonnent comme une note, pas seulement comme un coup.","mots":["808","808 glissées"],"cours":null},{"id":"backbeat","nom":"Le backbeat","texte":"Dans une mesure à quatre temps, on accentue les temps 2 et 4, au lieu des temps 1 et 3. C'est la caisse claire du rock and roll, du funk et de la soul.","ecoute":"Tape dans tes mains sur les temps 2 et 4 : ça tombe sur la caisse claire.","mots":["backbeat"],"cours":null},{"id":"appel-reponse","nom":"L'appel et la réponse","texte":"Une voix ou un instrument lance une phrase, un autre répond. Très présent dans les musiques africaines, il se retrouve dans le blues, le gospel, le jazz, le rap.","ecoute":"Repère qui parle et qui répond : le chanteur et la guitare, le soliste et le chœur.","mots":["call and response","appel-réponse"],"cours":null},{"id":"blue-notes","nom":"Les blue notes","texte":"Des notes un peu plus basses que celles de la gamme du piano, que les chanteurs et les guitaristes de blues glissent sur la tierce, la quinte et la septième.","ecoute":"Écoute une note qui n'est ni tout à fait majeure ni tout à fait mineure : elle sonne triste et joyeuse en même temps.","mots":["blue notes"],"cours":"4e-5"},{"id":"swing","nom":"Le swing","texte":"Au lieu de jouer deux croches égales, on allonge la première et on raccourcit la seconde, ce qui donne un balancement. C'est le trait du jazz, mais il existe dans d'autres musiques.","ecoute":"Essaie de taper « tchic-a, tchic-a » en alternant long-court, comme un balancement.","mots":["swing","shuffle","big band"],"cours":"4e-5"},{"id":"polyrythmie","nom":"La polyrythmie","texte":"Plusieurs rythmes différents joués ensemble, chacun gardant son cycle. On l'entend dans beaucoup de musiques d'Afrique, et chez Steve Reich ou Ligeti.","ecoute":"Essaie de suivre un seul rythme pendant que les autres jouent par-dessus.","mots":["polyrythmie"],"cours":"6e-4"},{"id":"syncope","nom":"La syncope","texte":"Une note commence sur un temps faible et se prolonge sur le temps fort : l'accent est décalé. Elle donne l'envie de bouger.","ecoute":"Cherche un rythme qui semble « tomber à côté » du temps tout en restant régulier.","mots":["syncopes","rythme syncopé","clave"],"cours":null},{"id":"groove","nom":"Le groove","texte":"L'impression d'un rythme qui roule et qui donne envie de danser : une basse, une batterie et des instruments qui jouent en accord, avec des accents bien placés. On le trouve dans le funk, la soul, le hip-hop, la house.","ecoute":"Demande-toi si tu bouges la tête sans l'avoir décidé.","mots":["groove","grooves"],"cours":null},{"id":"improvisation","nom":"L'improvisation","texte":"Inventer sa musique en la jouant. En jazz, elle suit une grille d'accords ; en free jazz, elle s'en libère ; dans la musique indienne, elle suit un raga.","ecoute":"Réécoute le même morceau deux fois : un solo improvisé n'est jamais identique.","mots":["improvisation"],"cours":"5e-5"},{"id":"processus","nom":"Le processus","texte":"Une musique faite d'une règle simple qui se déroule seule : un motif qui se décale peu à peu, un son qui s'allonge. Le minimalisme américain l'a rendue célèbre.","ecoute":"Essaie de décrire en une phrase la règle qui transforme la musique.","mots":["processus","algorithme"],"cours":"3e-4"},{"id":"hasard","nom":"Le hasard et l'indétermination","texte":"Laisser le hasard ou l'interprète décider d'une partie de la musique : tirer des notes au sort, laisser une partition ouverte. John Cage l'a systématisé après 1950.","ecoute":"Réécoute deux exécutions de la même pièce : elles ne sont pas identiques.","mots":["hasard","partition ouverte"],"cours":"3e-4"},{"id":"atonalite","nom":"L'atonalité","texte":"Une musique où aucune note n'est le centre : pas de note de repos, pas de gamme majeure ou mineure. Schoenberg la pratique à partir de 1908.","ecoute":"Cherche à fredonner la fin : si aucune note ne semble finir, c'est probablement atonal.","mots":["atonalité"],"cours":"3e-1"},{"id":"synthese","nom":"La synthèse sonore","texte":"Fabriquer un son à partir de rien avec des oscillateurs qui produisent des vibrations simples, des filtres qui les sculptent et des enveloppes qui règlent leur début et leur fin. Un synthétiseur combine ces éléments.","ecoute":"Écoute comment un son évolue : il s'ouvre, se ferme, glisse.","mots":["synthèse","synthèse sonore","synthétiseur","synthétiseurs","oscillateur","filtre","enveloppe"],"cours":"3e-3"},{"id":"granulaire","nom":"La synthèse granulaire","texte":"On découpe un son en grains de quelques centièmes de seconde, qu'on rejoue en nuage : plus ou moins nombreux, graves ou aigus, rapprochés ou éloignés. Le résultat est une texture, entre le son et le bruit.","ecoute":"Écoute un nuage de petits points sonores qui forment une matière.","mots":["microson"],"cours":null},{"id":"reverberation","nom":"La réverbération et l'écho","texte":"Un son dans une grande salle se prolonge en se mélangeant à ses propres reflets : c'est la réverbération. L'écho est une répétition distincte. Les studios les fabriquent avec des ressorts, des plaques ou des calculs.","ecoute":"Écoute la fin d'une note : elle s'éteint lentement ou brutalement ?","mots":["réverbération","écho","mur de son"],"cours":"5e-4"},{"id":"distorsion","nom":"La distorsion","texte":"On fait saturer un signal : la guitare ou la voix est amplifiée au-delà de ce que peut le circuit. Le son s'épaissit et gagne des harmoniques. Elle caractérise le rock, le metal, et certains sons de basse.","ecoute":"Écoute un son qui devient rugueux, sale, plus puissant.","mots":["distorsion"],"cours":"3e-2"},{"id":"riff","nom":"Le riff","texte":"Un court motif répété, souvent joué à la guitare ou à la basse, qui sert de signature à un morceau.","ecoute":"Essaie de fredonner le motif que la guitare joue au début.","mots":["riffs"],"cours":null},{"id":"flow","nom":"Le flow et la rime","texte":"Le flow est la manière dont un rappeur place ses mots sur le rythme : vitesse, accents, silences. La rime est le retour des mêmes sons en fin de vers.","ecoute":"Écoute où le rappeur tombe sur le temps et où il joue à côté.","mots":["flow","rime","rap","MCing"],"cours":"3e-2"},{"id":"djing","nom":"Le DJing","texte":"Passer et enchaîner des disques, puis les manipuler : les mixer, les ralentir, répéter un break avec deux platines. Le DJ devient musicien.","ecoute":"Écoute un passage où un disque s'arrête et un autre prend sa place sans trou.","mots":["DJing"],"cours":null},{"id":"breakbeat","nom":"Le break","texte":"Un court passage d'un disque où la batterie joue seule. Les DJ du Bronx le répètent avec deux platines pour faire danser plus longtemps ; il devient la base du hip-hop, de la jungle et de la drum and bass.","ecoute":"Écoute une batterie qui revient en boucle, très nette, sans le reste de la musique.","mots":["breakbeat"],"cours":null},{"id":"sub-bass","nom":"La sub-bass","texte":"Une basse si grave qu'on la sent dans la poitrine autant qu'on l'entend. Les systèmes de son des fêtes jamaïcaines, puis les clubs, l'ont rendue centrale.","ecoute":"Pose la main sur le haut-parleur : tu sens les vibrations avant d'entendre la note.","mots":["sub-bass"],"cours":null},{"id":"build-up","nom":"La montée","texte":"Un passage où l'énergie augmente, avec plus de notes, plus d'aigus, un rythme qui s'accélère, jusqu'au moment où tout retombe. C'est le moteur de la trance et de beaucoup de morceaux de danse.","ecoute":"Écoute comment la tension monte puis lâche d'un coup.","mots":["build-up"],"cours":null},{"id":"riddim","nom":"Le riddim, l'offbeat, le toasting","texte":"Le riddim est un rythme instrumental réutilisé par plusieurs chanteurs. L'offbeat accentue le contretemps. Le toasting est le chant parlé sur un rythme, né des sound systems jamaïcains.","ecoute":"Écoute une guitare qui tombe sur les contretemps, entre les battements.","mots":["riddim","offbeat","toasting","sound system"],"cours":null},{"id":"tambour-ka","nom":"Le tambour ka","texte":"Le tambour du gwoka guadeloupéen : un tambour tenu entre les genoux, sur lequel on joue des rythmes qui répondent à un danseur. Il est l'un des ancêtres du zouk.","ecoute":"Écoute un tambour qui répond aux gestes d'un danseur.","mots":["tambour ka","rythmes créoles"],"cours":null},{"id":"raga-tala","nom":"Le raga et le tala","texte":"Le raga est un mode de la musique indienne, avec ses notes, ses ornements et son humeur ; le tala est le cycle rythmique. Le musicien improvise dans ce cadre.","ecoute":"Écoute un bourdon continu sous une mélodie qui explore peu à peu ses notes.","mots":["raga","tala"],"cours":null},{"id":"maqam","nom":"Le maqam et les micro-intervalles","texte":"Le maqam est le système de modes de la musique arabe ; il utilise des intervalles plus petits que le demi-ton du piano. Chaque mode a ses notes et son caractère.","ecoute":"Écoute une note entre deux notes du piano.","mots":["micro-intervalles"],"cours":null},{"id":"heterophonie","nom":"Les cycles et l'hétérophonie","texte":"Dans le gamelan, plusieurs instruments jouent la même mélodie mais chacun avec ses variations, en même temps. Les gongs marquent la fin des cycles.","ecoute":"Écoute plusieurs instruments qui disent la même mélodie, un peu différemment.","mots":["hétérophonie","gong"],"cours":null},{"id":"drone","nom":"Le bourdon","texte":"Une note tenue très longtemps sous la musique, que jouent un instrument ou une voix. On la trouve dans la musique indienne, la cornemuse et dans les musiques savantes d'aujourd'hui.","ecoute":"Repère la note grave qui ne bouge pas pendant que la mélodie évolue.","mots":["durée"],"cours":"5e-1"},{"id":"temps-reel","nom":"Le temps réel et la spatialisation","texte":"Transformer le son pendant que l'instrumentiste joue, avec des capteurs, un ordinateur et plusieurs haut-parleurs qui entourent le public. On parle aussi de live electronics.","ecoute":"Écoute un son qui se déplace d'un haut-parleur à l'autre.","mots":["temps réel","capteurs","spatialisation","installation"],"cours":null},{"id":"objet-sonore","nom":"L'objet sonore et l'écoute réduite","texte":"Pierre Schaeffer propose d'écouter un son pour lui-même, sans penser à sa source : pas « un train », mais un son qui a un grain, une durée, une forme. C'est l'écoute réduite.","ecoute":"Ferme les yeux et décris le son avec les mots durée, hauteur, texture, sans nommer la source.","mots":["objet sonore","écoute réduite","sons fixés"],"cours":"3e-3"},{"id":"nostalgie","nom":"Le ralentissement et la nostalgie numérique","texte":"Ralentir un son le rend plus grave et plus long ; on y entend un souvenir. La vaporwave et le cloud rap s'en servent pour fabriquer une nostalgie d'objets numériques.","ecoute":"Écoute une chanson ralentie : que ressens-tu ?","mots":["ralentissement","nostalgie","nostalgie numérique"],"cours":null},{"id":"chorégraphie","nom":"La chorégraphie et l'industrie des idoles","texte":"En K-pop, le groupe est préparé pendant des années par une entreprise : chant, danse, langues, image. La chorégraphie est conçue en même temps que la musique et filmée pour circuler en vidéo.","ecoute":"Regarde un clip sans le son : la musique se devine-t-elle dans les gestes ?","mots":["chorégraphie","production collective"],"cours":"3e-5"},{"id":"do-it-yourself","nom":"Le DIY","texte":"Do it yourself : faire sa musique avec peu de moyens, l'enregistrer et la diffuser soi-même. Le punk, puis la musique électronique de chambre, l'ont popularisé.","ecoute":"Écoute un son brut, peu poli : c'est souvent un choix.","mots":["DIY"],"cours":null},{"id":"code","nom":"Le code et l'algorithme","texte":"Écrire une suite d'instructions que l'ordinateur exécute pour produire ou transformer des sons. Faust, le langage utilisé dans le Labo du site, est fait pour cela.","ecoute":"Essaie de décrire en mots simples les étapes que le programme répète.","mots":["code","algorithme","programmation"],"cours":"3e-4"}],"rubriques":[{"nom":"Écrire et composer","concepts":["serie","atonalite","processus","hasard","improvisation","code"]},{"nom":"Fabriquer et transformer le son","concepts":["spectre","synthese","granulaire","reverberation","distorsion","objet-sonore","temps-reel","drone"]},{"nom":"Rythme et groove","concepts":["backbeat","polyrythmie","syncope","groove","swing","boite-rythmes","808","breakbeat","riddim","boucle","build-up","sub-bass"]},{"nom":"Voix, texte, danse","concepts":["flow","appel-reponse","blue-notes","chorégraphie","riff"]},{"nom":"Produire et diffuser","concepts":["sampling","djing","do-it-yourself","nostalgie"]},{"nom":"Traditions et modes","concepts":["raga-tala","maqam","heterophonie","tambour-ka"]}],"parcours":[{"id":"schoenberg-spectral","titre":"De Schoenberg à la musique spectrale","intro":"Quatre-vingts ans de réponses : chaque génération reprend la question de la précédente, comment organiser les sons, et change le point de départ.","etapes":[{"id":"expressionism","texte":"Autour de 1908, la musique ose la dissonance et abandonne le centre tonal : l'atonalité."},{"id":"second-viennese","texte":"Schoenberg, Berg et Webern cherchent un ordre qui remplace la tonalité."},{"id":"serialism","texte":"La série fixe l'ordre des douze notes : un nouvel ordre, sans tonalité."},{"id":"integral-serialism","texte":"Boulez et Stockhausen étendent la série aux durées, aux intensités et aux attaques, après 1949."},{"id":"pierre-boulez","texte":"Boulez écrit, dirige, fonde l'Ircam en 1977 : le laboratoire où musique et science se rencontrent."},{"id":"spectral","texte":"Grisey et Murail reprochent à la série de ne pas écouter le son ; ils partent de son spectre. Le timbre devient la matière de la composition."}]},{"id":"stockhausen-vaporwave","titre":"De Stockhausen à la vaporwave","intro":"Des studios de la radio allemande aux chambres d'adolescents connectés : comment la musique faite avec des machines change de rapport au futur.","etapes":[{"id":"electronic-composition","texte":"Années 1950 : des compositeurs fabriquent des sons avec des oscillateurs, dans un studio de radio."},{"id":"kraftwerk","texte":"Kraftwerk fait de la musique de machines une pop : synthétiseurs, boîtes à rythmes, voix presque parlée."},{"id":"detroit-techno","texte":"À Detroit, Atkins, May et Saunderson croisent Kraftwerk et le funk : la techno, un futur en séquences."},{"id":"sampling","texte":"Les échantillonneurs rendent possible la reprise de n'importe quel son : la musique devient une matière de collage."},{"id":"vaporwave","texte":"Années 2010 : la vaporwave échantillonne le passé récent, le ralentit et le boucle ; le futur des machines est devenu un souvenir."}]},{"id":"blues-hiphop","titre":"Du blues au hip-hop","intro":"Un siècle de musiques afro-américaines : à chaque génération, des outils nouveaux pour dire la même chose.","etapes":[{"id":"blues","texte":"Le blues met en chant la vie des Noirs du Sud des États-Unis : blue notes, appel et réponse."},{"id":"rnb","texte":"Dans les villes, le blues s'électrifie et se met à danser : rhythm and blues, puis soul avec la voix du gospel."},{"id":"funk","texte":"James Brown fait de la musique une machine à groove : basse et batterie répétées."},{"id":"hip-hop","texte":"Au Bronx, les DJ répètent les breaks du funk avec deux platines ; des MC parlent dessus. Le hip-hop naît en 1973."},{"id":"boom-bap","texte":"Les échantillonneurs permettent de découper ces breaks : le boom bap est fait de boucles de soul et de jazz."},{"id":"trap","texte":"Dans les années 2000, la boucle d'échantillon cède la place à la machine : 808, hi-hats rapides."}]},{"id":"antilles-afrique","titre":"De l'Afrique aux Antilles : le zouk","intro":"Une musique de 1979, faite par des Antillais à Paris, avec des tambours venus d'Afrique et des machines.","etapes":[{"id":"african-traditions","texte":"Des tambours, des chants en appel et réponse, des rythmes qui traversent l'Atlantique."},{"id":"gwoka","texte":"En Guadeloupe, le tambour ka devient le centre d'une danse et d'un chant : le gwoka."},{"id":"kompa","texte":"À Haïti, le compas fait danser les Caraïbes ; il influence les Antilles françaises."},{"id":"zouk","texte":"Kassav' (1979) joue du tambour ka et du compas avec des synthétiseurs : le zouk touche tout le monde créole."}]},{"id":"kingston-seoul","titre":"De Kingston au Bronx à Séoul","intro":"Un DJ, une fête, une manière de parler sur un rythme : comment une pratique jamaïcaine fait le tour de la planète.","etapes":[{"id":"reggae","texte":"Jamaïque, 1968 : le reggae et son offbeat, la basse en avant."},{"id":"sound-system","texte":"Des camions de haut-parleurs, des DJ, des MC qui parlent sur le rythme : le toasting."},{"id":"hip-hop","texte":"DJ Kool Herc apporte cette fête au Bronx : DJ, MC, breakdance, graffiti. Le hip-hop est une culture, pas seulement une musique."},{"id":"korean-hiphop","texte":"En Corée, les années 1990 : des rappeurs adaptent le hip-hop au coréen."},{"id":"kpop","texte":"Seo Taiji and Boys (1992) puis l'industrie des idoles : rap, danse, production et image forment un système mondial."}]},{"id":"cumbia-villera","titre":"De la cumbia à la cumbia villera","intro":"Une danse colombienne devient la voix des quartiers pauvres de Buenos Aires.","etapes":[{"id" ur chute vite."],["Écouter","Un charleston","../sonora/library/index.html#charleston","Du bruit sans le grave."],["Composer","Le séquenceur du Studio","../sonora/studio/index.html","Poser des sons sur une grille de pas et les faire boucler."]],"vocaloid":[["Écouter","Quatre formes d'onde","../sonora/library/index.html#formes","Les sons de base de la synthèse."],["Expérimenter","Formes d'onde, harmoniques et spectre","../sonora/science/index.html#harmoniques-spectre","Une voix est un spectre d'harmoniques : la synthèse de voix chantée en recompose les timbres."]]},"cours":{"3e-1":["3e, séquence 1 : 1913 et la musique face à la guerre","#seq-3e-1"],"3e-2":["3e, séquence 2 : le temps de la contestation","#seq-3e-2"],"3e-3":["3e, séquence 3 : le son de synthèse et l'informatique musicale","#seq-3e-3"],"3e-4":["3e, séquence 4 : musique et mathématiques","#seq-3e-4"],"3e-5":["3e, séquence 5 : le XXIe siècle et l'arbre des genres","#seq-3e-5"],"4e-5":["4e, séquence 5 : la révolution industrielle et le disque","#seq-4e-5"],"5e-1":["5e, séquence 1 : du grégorien à Notre-Dame","#seq-5e-1"],"5e-3":["5e, séquence 3 : canon et imitation","#seq-5e-3"],"5e-4":["5e, séquence 4 : Renaissance, Réforme et Palestrina","#seq-5e-4"],"5e-5":["5e, séquence 5 : Monteverdi et la naissance de l'opéra","#seq-5e-5"],"6e-4":["6e, séquence 4 : traditions orales du monde","#seq-6e-4"]},"fiches":{"detroit-techno":{"origines":"Au début des années 1980, Juan Atkins, Derrick May et Kevin Saunderson, jeunes musiciens de la banlieue de Detroit, mêlent funk, electro, new wave et musique électronique européenne.","contexte":"Detroit, capitale de l'automobile, traverse un déclin industriel marqué dans les années 1980. On lit souvent cette musique de machines comme une manière d'imaginer un futur depuis une ville qui perd son industrie.","rythme":"Pulsation à quatre temps (4/4) jouée par une boîte à rythmes, avec des accents syncopés au charleston et aux percussions.","melodie":"Des motifs courts répétés par un séquenceur, souvent sur peu de notes.","harmonie":"Accords simples ou nappes de synthétiseur ; l'harmonie bouge peu et la tension vient des timbres et des couches.","timbres":"Synthétiseurs analogiques, boîtes à rythmes Roland (TR-808, TR-909), basses synthétiques.","production":"Studios de chambre, séquenceurs et boîtes à rythmes ; la musique circule par les DJ et par des labels indépendants.","formes":"Longs morceaux construits par ajout et retrait de couches, pensés pour être mixés par un DJ.","ecoute":[["Cybotron, Clear (1983)","Cybotron Clear 1983"],["Rhythim Is Rhythim, Strings of Life (1987)","Rhythim Is Rhythim Strings of Life"],["Kraftwerk, Trans-Europe Express (1977)","Kraftwerk Trans-Europe Express"]],"questions":["Dans la pulsation, qu'est-ce qui te fait penser au funk, qu'est-ce qui te fait penser à Kraftwerk ?","Quelles machines entends-tu : une boîte à rythmes, un synthétiseur, une voix ?"],"reperes":[],"statut":"brouillon"},"hip-hop":{"origines":"Lors d'une fête au Bronx en août 1973, DJ Kool Herc, né en Jamaïque, répète avec deux platines les breaks de batterie des disques de funk. On retient souvent cette date comme celle de la naissance du hip-hop.","contexte":"Le Bronx des années 1970 est durement touché par la crise économique. Les fêtes de rue, le DJing, le MCing, le breakdance et le graffiti sont des pratiques collectives, nées dans ces quartiers.","rythme":"Le break de batterie répété, en boucle ; ensuite des rythmes de boîte à rythmes.","melodie":"Le rap est un chant parlé-rythmé : la mélodie vient surtout des échantillons et des lignes de basse.","harmonie":"Boucles courtes de quelques accords, souvent prises à des disques de soul, de funk ou de jazz.","timbres":"Platines, samplers, boîtes à rythmes, voix.","production":"De deux platines et d'une table de mixage aux échantillonneurs et aux machines à pads comme la MPC.","formes":"Couplets en seize mesures, refrains, passages de scratch.","ecoute":[["The Sugarhill Gang, Rapper's Delight (1979)","Sugarhill Gang Rapper's Delight"],["Grandmaster Flash and the Furious Five, The Message (1982)","Grandmaster Flash The Message"],["IAM, Demain c'est loin (1997)","IAM Demain c'est loin"]],"questions":["Quelle partie du morceau est un échantillon, quelle partie est jouée ou chantée par les artistes ?","Que raconte le texte, et comment le rythme porte-t-il ce récit ?"],"reperes":[],"statut":"brouillon"},"zouk":{"origines":"En 1979, le groupe antillais Kassav', installé en région parisienne, mêle le gwoka, la biguine, le compas haïtien (kompa) et des synthétiseurs. Zouk veut dire fête en créole.","contexte":"Une musique faite par des musiciens des Antilles françaises en France, chantée en créole, qui circule ensuite dans les Caraïbes, en Afrique et en Europe.","rythme":"Tempo moyen à rapide, rythme porté par la batterie, la basse et le tambour ka.","melodie":"Mélodies chantées en créole, en phrases courtes avec des réponses des chœurs.","harmonie":"Harmonies simples et mouvantes.","timbres":"Synthétiseurs, cuivres, guitares, basse, tambour ka.","production":"Studios modernes de l'époque, avec claviers électroniques.","formes":"Couplets et refrains, avec des parties instrumentales dansantes.","ecoute":[["Kassav', Zouk-la sé sèl médikaman nou ni (1986)","Kassav Zouk la sé sèl médikaman nou ni"],["Gwoka : tambour ka","gwoka Guadeloupe tambour ka"]],"questions":["Quel est l'instrument qui vient du gwoka, quel est celui qui vient de la musique électronique ?","Quelle langue entends-tu, et pourquoi ce choix compte-t-il ?"],"reperes":[],"statut":"brouillon"},"cumbia-villera":{"origines":"À la fin des années 1990, dans les quartiers pauvres de Buenos Aires, des groupes comme Damas Gratis et Yerba Brava reprennent le rythme de la cumbia avec des claviers et des paroles très directes.","contexte":"L'Argentine traverse une grave crise économique entre 1998 et 2002. La villera met en chanson la vie des quartiers pauvres, la fête, la marginalité, avec un langage de la rue.","rythme":"Le rythme de la cumbia, dansant, avec une pulsation régulière et des percussions.","melodie":"Mélodies simples, chantées ou à moitié parlées.","harmonie":"Peu d'accords, répétés.","timbres":"Claviers, basse, percussions, voix.","production":"Enregistrements à petit budget, diffusés par les radios locales et les bals.","formes":"Couplets et refrains très dansants.","ecoute":[["Damas Gratis","Damas Gratis cumbia villera"],["Yerba Brava","Yerba Brava cumbia villera"]],"questions":["En quoi les paroles ressemblent-elles à celles du rap, en quoi la musique est-elle différente ?","Qu'est-ce qui, dans le rythme, vient de la cumbia colombienne ?"],"reperes":[],"statut":"brouillon"},"kpop":{"origines":"Seo Taiji and Boys (1992) apportent le rap et la danse du hip-hop américain à la pop coréenne ; dans les années 1990, des agences comme SM, YG et JYP organisent la formation de groupes d'idoles.","contexte":"Une industrie culturelle très organisée : des jeunes s'entraînent pendant des années au chant, à la danse, aux langues, puis un groupe débute avec une image préparée. Les clips et les chorégraphies circulent en ligne dans le monde entier.","rythme":"Rythmes de pop et de hip-hop électronique, souvent changeant dans un même morceau.","melodie":"Refrains très mémorisables, parfois en plusieurs langues.","harmonie":"Harmonies de pop, avec des passages inattendus.","timbres":"Voix en chœur, synthétiseurs, basses, parties rappées.","production":"Écriture collective avec des compositeurs de plusieurs pays ; production en studio très détaillée.","formes":"Morceaux composés de plusieurs sections contrastées, avec une partie de danse.","ecoute":[["Seo Taiji and Boys, Nan Arayo (1992)","Seo Taiji and Boys Nan Arayo"],["BTS, Dynamite (2020)","BTS Dynamite official MV"]],"questions":["Qu'entends-tu qui vient du hip-hop, du R&B, de la pop ?","Regarde le clip sans le son : que raconte la chorégraphie ?"],"reperes":[],"statut":"brouillon"},"spectral":{"origines":"Dans les années 1970, à Paris, autour de l'ensemble L'Itinéraire (fondé en 1973) et de l'Ircam, des compositeurs comme Gérard Grisey et Tristan Murail partent du spectre d'un son pour écrire.","contexte":"La génération précédente avait organisé la musique avec la série ou le hasard. Les spectraux veulent revenir à l'écoute et au son lui-même, avec l'aide de l'ordinateur pour l'analyser.","rythme":"Temps long, transformations lentes ; la durée est celle de la perception d'un son qui évolue.","melodie":"Peu de mélodies au sens classique : des lignes qui découlent des harmoniques.","harmonie":"Accords construits sur les harmoniques d'un son, avec des intervalles plus petits que le demi-ton.","timbres":"Orchestre ou ensemble, parfois avec électronique ; le mélange des timbres imite le spectre d'un son.","production":"Analyse du son par ordinateur, puis transcription en notes sur la partition.","formes":"Grandes formes continues où un son se transforme peu à peu.","ecoute":[["Gérard Grisey, Partiels (1975)","Grisey Partiels"],["Tristan Murail, Gondwana (1980)","Murail Gondwana"],["György Ligeti, Atmosphères (1961)","Ligeti Atmosphères"]],"questions":["Peux-tu entendre un accord se fondre en un seul timbre ?","En quoi cette musique semble-t-elle plus lente que celle que tu écoutes d'habitude ?"],"reperes":[],"statut":"brouillon"},"vaporwave":{"origines":"Entre 2010 et 2011, des producteurs sur Internet, dont Macintosh Plus (Floral Shoppe, 2011), ralentissent et bouclent des morceaux de pop, de jazz léger et de musique d'ambiance des années 1980-90.","contexte":"Une musique née sur des blogs et des plateformes de partage, avec un imaginaire d'objets numériques et de centres commerciaux des années 1980-90, vu avec nostalgie et ironie.","rythme":"Tempo très lent ; les boucles sont étirées.","melodie":"Les mélodies sont celles des morceaux échantillonnés, déformés par le ralentissement.","harmonie":"Accords de pop et de jazz léger, longuement tenus.","timbres":"Synthétiseurs et saxophones des années 1980, voix ralenties et graves, réverbération.","production":"Logiciels de montage : on ralentit, on change la hauteur, on ajoute de l'écho.","formes":"Boucles longues, sans vrai développement.","ecoute":[["Macintosh Plus, Floral Shoppe (2011)","Macintosh Plus Floral Shoppe"],["Mariya Takeuchi, Plastic Love (1984)","Mariya Takeuchi Plastic Love"]],"questions":["Écoute la source (Plastic Love) puis la version ralentie : que change le ralentissement ?","Pourquoi la nostalgie est-elle ici fabriquée avec des machines ?"],"reperes":[],"statut":"brouillon"},"afrobeat":{"origines":"À la fin des années 1960, Fela Kuti, à Lagos au Nigeria, associe le highlife, le jazz, le funk de James Brown et des rythmes yoruba pour créer l'afrobeat.","contexte":"Les textes de Fela Kuti critiquent le pouvoir militaire et la corruption. Sa musique, longue et collective, est un acte politique autant qu'un style.","rythme":"Un groove dense, avec batterie, percussions et guitares qui tissent des motifs superposés.","melodie":"Des phrases de cuivres et un chant en appel et réponse avec les chœurs.","harmonie":"Peu d'accords, répétés très longtemps ; l'intensité vient de la superposition des couches.","timbres":"Cuivres, guitares, orgue électrique, batterie, percussions.","production":"Enregistrements en groupe, au studio ou en concert, de morceaux de dix minutes ou plus.","formes":"De longues pièces avec une introduction instrumentale, puis le chant, puis les solos.","ecoute":[["Fela Kuti, Water No Get Enemy (1975)","Fela Kuti Water No Get Enemy"],["Burna Boy, Last Last (2022)","Burna Boy Last Last"]],"questions":["L'afrobeat (Fela Kuti) et les afrobeats (Burna Boy) : qu'ont-ils en commun, qu'est-ce qui les sépare ?","Quels instruments répètent le même motif, lesquels improvisent ?"],"reperes":[],"statut":"brouillon"},"blues":{"origines":"Le blues naît parmi les Afro-Américains du Sud des États-Unis, dans le delta du Mississippi et ses environs, à la fin du XIXe et au début du XXe siècle. Il prolonge les chants de travail, les hollers et les spirituals.","contexte":"Il s'écrit dans le Sud de la ségrégation, après l'abolition de l'esclavage, et dit le travail, la pauvreté, l'amour et le déplacement. Avec la Grande Migration vers le Nord, il gagne Chicago, où il s'électrifie.","rythme":"Pulsation à quatre temps, souvent en shuffle (croches ternaires, le premier temps long, le second court).","harmonie":"La grille classique compte douze mesures et trois accords (I, IV, V). Les notes bleues, tierce, quinte et septième légèrement abaissées, créent une ambiguïté entre majeur et mineur.","formes":"Les paroles suivent souvent le schéma AAB : une phrase, sa répétition, puis une réponse.","reperes":[[1912,"W. C. Handy publie Memphis Blues, l'un des premiers blues imprimés."],[1920,"Mamie Smith enregistre Crazy Blues, premier succès commercial du blues chanté par une femme noire."],[1936,"Robert Johnson enregistre à San Antonio la première de ses deux séances (la seconde a lieu en 1937)."],[1948,"Muddy Waters enregistre à Chicago, avec guitare électrique, le son du blues de Chicago."]],"ecoute":[["Bessie Smith, St. Louis Blues (1925)","Bessie Smith St. Louis Blues"],["Robert Johnson, Cross Road Blues (1936)","Robert Johnson Cross Road Blues"],["Muddy Waters, Hoochie Coochie Man (1954)","Muddy Waters Hoochie Coochie Man"]],"questions":["Peux-tu compter douze mesures avant que la grille revienne au début ?","Dans la mélodie, quelles notes te semblent « tristes » sans être tout à fait mineures ?"],"statut":"brouillon"},"jazz":{"origines":"Le jazz se forme à La Nouvelle-Orléans au tournant du XXe siècle, dans les communautés noires et créoles, à partir du blues, du ragtime, des fanfares et des chants religieux.","contexte":"Né dans une ville portuaire où se croisent des traditions africaines, caribéennes et européennes, il se diffuse par le disque (premiers enregistrements en 1917) et par les migrations vers Chicago et New York.","rythme":"Le swing : une pulsation régulière sur laquelle les croches sont jouées de façon inégale, avec des accents décalés, la syncope.","harmonie":"Accords de septième, enrichis par des neuvièmes, onzièmes et treizièmes ; les musiciens improvisent sur la grille d'un thème.","formes":"On expose un thème (le chorus), chacun improvise à son tour sur la grille, puis on reprend le thème.","reperes":[[1917,"L'Original Dixieland Jass Band enregistre le premier disque de jazz."],[1924,"Louis Armstrong rejoint l'orchestre de Fletcher Henderson à New York, puis enregistre ses Hot Five (1925-1928) à Chicago."],[1959,"Miles Davis enregistre Kind of Blue, l'un des disques de jazz les plus vendus."],[1965,"John Coltrane publie A Love Supreme, enregistré en décembre 1964."]],"ecoute":[["Louis Armstrong, West End Blues (1928)","Louis Armstrong West End Blues 1928"],["Duke Ellington, Mood Indigo (1930)","Duke Ellington Mood Indigo"],["Miles Davis, So What (1959)","Miles Davis So What"]],"questions":["Qui improvise, qui accompagne : peux-tu suivre le passage de l'un à l'autre ?","Le temps est-il joué « droit » ou « balancé » ? Tape-le du pied pour sentir la différence."],"statut":"brouillon"},"swing":{"origines":"Le swing désigne à la fois une manière de jouer la pulsation et, dans les années 1930, le jazz de grands orchestres dansants (big bands).","contexte":"Pendant la Grande Dépression, la radio et les salles de bal font des big bands la musique populaire des États-Unis ; on retient souvent le concert de Benny Goodman au Palomar Ballroom en 1935 comme le début de l'ère du swing.","rythme":"Contrebasse en noires régulières (walking bass), batterie qui marque le temps au charleston, souffle des cuivres et des anches en réponse.","formes":"Arrangements écrits pour sections (trompettes, trombones, saxophones) en réponse les unes aux autres, avec des solos improvisés.","reperes":[[1935,"Benny Goodman et son orchestre connaissent un grand succès au Palomar Ballroom de Los Angeles."],[1938,"Concert de Benny Goodman à Carnegie Hall, avec des musiciens noirs et blancs sur scène."],[1941,"Duke Ellington enregistre Take the 'A' Train, de Billy Strayhorn."]],"ecoute":[["Count Basie, One O'Clock Jump (1937)","Count Basie One O'Clock Jump"],["Duke Ellington, Take the A Train (1941)","Duke Ellington Take the A Train"],["Benny Goodman, Sing, Sing, Sing (1937)","Benny Goodman Sing Sing Sing"]],"questions":["Quelle section répond à quelle autre, dans l'arrangement ?","Peux-tu marcher en suivant la contrebasse ? Que ressens-tu ?"],"statut":"brouillon"},"bebop":{"origines":"Le bebop apparaît au début des années 1940 à New York, dans des clubs comme Minton's Playhouse et Monroe's Uptown House, autour de Charlie Parker, Dizzy Gillespie, Thelonious Monk, Bud Powell, Kenny Clarke et Max Roach.","contexte":"Des musiciens noirs cherchent une musique de petit ensemble, difficile, faite pour l'écoute plus que pour la danse, en réaction à l'industrie des big bands. Les enregistrements sont retardés en 1942-1944 par la grève des musiciens (American Federation of Musicians).","rythme":"Tempos très rapides ; la batterie garde le temps au cymbale ride et place des accents imprévus à la grosse caisse (les « bombes »).","harmonie":"Substitutions d'accords, notes chromatiques, quintes diminuées ; on improvise sur la grille d'un standard avec de nouvelles mélodies (contrafacts).","formes":"Un thème exposé à l'unisson par trompette et saxophone, des solos enchaînés, puis le thème.","reperes":[[1945,"Charlie Parker et Dizzy Gillespie enregistrent Salt Peanuts et Hot House ; Parker enregistre Ko-Ko en novembre."],[1947,"Thelonious Monk enregistre 'Round Midnight pour Blue Note (composé en 1944)."],[1951,"Bud Powell enregistre Un Poco Loco."]],"ecoute":[["Charlie Parker, Ko-Ko (1945)","Charlie Parker Ko-Ko 1945"],["Dizzy Gillespie, Salt Peanuts (1945)","Dizzy Gillespie Salt Peanuts"],["Bud Powell, Un Poco Loco (1951)","Bud Powell Un Poco Loco"]],"questions":["Le tempo te paraît-il dansable ? Pourquoi ce choix ?","Compare le solo de saxophone et le thème : qu'est-ce qui change ?"],"statut":"brouillon"},"cool-jazz":{"origines":"Le cool jazz se développe à la fin des années 1940 et dans les années 1950, aux États-Unis, en particulier à New York et sur la côte Ouest, après le bebop.","contexte":"Une partie des musiciens cherche un jazz plus détendu, plus écrit, plus clair dans les timbres, souvent associé au jazz blanc de la côte Ouest, mais Miles Davis, musicien noir, en est l'une des figures centrales.","timbres":"Sons feutrés, peu de vibrato, instruments inhabituels pour le jazz (cor, tuba, flûte) dans les arrangements de Gil Evans.","formes":"Arrangements écrits pour des formations de neuf à onze musiciens, avec des solos plus courts et plus lyriques.","reperes":[[1949,"Premières séances du neuvet de Miles Davis, avec des arrangements de Gil Evans et Gerry Mulligan (jusqu'en 1950)."],[1957,"Les enregistrements sont réunis sur l'album Birth of the Cool."],[1959,"Time Out, de Dave Brubeck, contient Take Five (de Paul Desmond), en 5/4."]],"ecoute":[["Miles Davis, Boplicity (1949)","Miles Davis Boplicity Birth of the Cool"],["Dave Brubeck Quartet, Take Five (1959)","Dave Brubeck Take Five"],["Chet Baker, My Funny Valentine (1954)","Chet Baker My Funny Valentine"]],"questions":["Quels instruments entends-tu qu'on n'attendrait pas dans un orchestre de jazz ?","Cette musique te semble-t-elle plus calme que le bebop ? Qu'est-ce qui produit cet effet ?"],"statut":"brouillon"},"hard-bop":{"origines":"Le hard bop se développe au milieu des années 1950 aux États-Unis, surtout à New York et à Philadelphie, autour d'Art Blakey, Horace Silver, Clifford Brown et Max Roach.","contexte":"Des musiciens noirs reviennent au blues, au gospel et au rhythm and blues pour donner au bebop une énergie plus directe. Le label Blue Note, fondé en 1939 par Alfred Lion et Francis Wolff, en est l'éditeur emblématique.","rythme":"Batterie puissante, walking bass, appels et réponses venus du gospel.","harmonie":"Mélodies bluesées, accords simples, tournures de l'église noire (le « funky »).","reperes":[[1954,"Art Blakey et Horace Silver enregistrent A Night at Birdland pour Blue Note, souvent cité comme acte de naissance du hard bop."],[1955,"Fondation des Jazz Messengers, dirigés ensuite par Art Blakey."],[1958,"Moanin' (Art Blakey and the Jazz Messengers, composition de Bobby Timmons)."]],"ecoute":[["Art Blakey and the Jazz Messengers, Moanin' (1958)","Art Blakey Jazz Messengers Moanin 1958"],["Horace Silver, Song for My Father (1964)","Horace Silver Song for My Father"],["Clifford Brown and Max Roach, Joy Spring (1954)","Clifford Brown Max Roach Joy Spring"]],"questions":["Repère les appels et les réponses entre la trompette et le saxophone.","Qu'est-ce qui te rappelle le blues dans cette mélodie ?"],"statut":"brouillon"},"modal-jazz":{"origines":"Le jazz modal apparaît à la fin des années 1950 : au lieu d'enchaîner de nombreux accords, on improvise longtemps sur un seul mode.","contexte":"Le théoricien George Russell publie en 1953 son Lydian Chromatic Concept of Tonal Organization, qui inspire Miles Davis. Celui-ci applique l'idée dans Milestones (1958) puis dans Kind of Blue (1959).","harmonie":"Dans So What, la forme alterne seize mesures sur mode de ré dorien, huit sur mode de mi bémol dorien, puis huit de nouveau sur ré dorien : les musiciens improvisent sur peu d'accords.","reperes":[[1953,"George Russell publie le Lydian Chromatic Concept of Tonal Organization."],[1958,"Miles Davis enregistre Milestones, l'un des premiers disques modaux."],[1959,"Kind of Blue, avec Bill Evans, John Coltrane, Cannonball Adderley, Paul Chambers, Wynton Kelly et Jimmy Cobb."]],"ecoute":[["Miles Davis, So What (1959)","Miles Davis So What"],["Miles Davis, Flamenco Sketches (1959)","Miles Davis Flamenco Sketches"],["John Coltrane, Impressions (1962)","John Coltrane Impressions"]],"questions":["Peux-tu entendre le moment où la musique monte d'un demi-ton dans So What ?","Pourquoi, avec moins d'accords, les musiciens peuvent-ils improviser plus librement ?"],"statut":"brouillon"},"free-jazz":{"origines":"Le free jazz se constitue à la fin des années 1950 et au début des années 1960, autour d'Ornette Coleman, de Cecil Taylor, puis d'Albert Ayler et de John Coltrane.","contexte":"Il naît dans un moment de luttes pour les droits civiques ; certains musiciens y voient une liberté sonore et politique, d'autres une rupture avec les formes héritées. Ornette Coleman lui donne son nom avec l'album Free Jazz (1960).","rythme":"La pulsation régulière n'est plus obligatoire : elle peut disparaître ou changer d'un instant à l'autre.","harmonie":"Pas de grille d'accords imposée ; les musiciens s'écoutent et réagissent, parfois à partir d'un simple motif.","reperes":[[1959,"Ornette Coleman, The Shape of Jazz to Come."],[1960,"Ornette Coleman enregistre Free Jazz: A Collective Improvisation avec un double quartet."],[1964,"Albert Ayler, Spiritual Unity."],[1965,"John Coltrane, Ascension."]],"ecoute":[["Ornette Coleman, Lonely Woman (1959)","Ornette Coleman Lonely Woman"],["Ornette Coleman, Free Jazz (1960)","Ornette Coleman Free Jazz 1960"],["Albert Ayler, Ghosts (1964)","Albert Ayler Ghosts"]],"questions":["Quand les musiciens jouent-ils ensemble, quand se séparent-ils ?","Entends-tu un thème ? Où revient-il ?"],"statut":"brouillon"},"fusion":{"origines":"Le jazz fusion se forme à la fin des années 1960 en mêlant jazz, rock, funk et instruments électriques.","contexte":"Miles Davis ouvre la voie avec In a Silent Way (1969) et Bitches Brew (1970). Des musiciens de son entourage fondent ensuite Weather Report (1970), Mahavishnu Orchestra (1971) et Return to Forever (1972).","timbres":"Piano électrique Fender Rhodes, guitare électrique, basse électrique, synthétiseurs, batterie rock.","production":"Le producteur Teo Macero monte à la bande des enregistrements de Miles Davis, ce qui fait du studio un outil de composition.","reperes":[[1969,"Miles Davis, In a Silent Way."],[1970,"Miles Davis, Bitches Brew ; fondation de Weather Report par Joe Zawinul, Wayne Shorter et Miroslav Vitouš."],[1973,"Herbie Hancock, Head Hunters, album de jazz-funk très vendu."]],"ecoute":[["Miles Davis, Bitches Brew (1970)","Miles Davis Bitches Brew"],["Weather Report, Birdland (1977)","Weather Report Birdland"],["Herbie Hancock, Chameleon (1973)","Herbie Hancock Chameleon"]],"questions":["Quels instruments sont électriques ? Lesquels sont acoustiques ?","Qu'est-ce qui te rappelle le rock, qu'est-ce qui te rappelle le jazz ?"],"statut":"brouillon"},"spiritual-jazz":{"origines":"Le jazz spirituel désigne un courant de la seconde moitié des années 1960 et des années 1970 où des musiciens noirs américains explorent la dimension religieuse et méditative du jazz.","contexte":"John Coltrane en est la figure de référence avec A Love Supreme (1965), suite en quatre parties dédiée à Dieu. Pharoah Sanders et Alice Coltrane prolongent cette recherche.","timbres":"Saxophones, harpe (chez Alice Coltrane), percussions, voix, longues improvisations.","reperes":[[1964,"John Coltrane enregistre A Love Supreme en décembre, avec McCoy Tyner, Jimmy Garrison et Elvin Jones ; l'album paraît en 1965."],[1969,"Pharoah Sanders, Karma, avec The Creator Has a Master Plan."],[1971,"Alice Coltrane, Journey in Satchidananda."]],"ecoute":[["John Coltrane, A Love Supreme, Part I : Acknowledgement (1965)","John Coltrane A Love Supreme Acknowledgement"],["Pharoah Sanders, The Creator Has a Master Plan (1969)","Pharoah Sanders The Creator Has a Master Plan"],["Alice Coltrane, Journey in Satchidananda (1971)","Alice Coltrane Journey in Satchidananda"]],"questions":["Quel est le rôle de la répétition dans cette musique ?","Qu'est-ce qui te fait penser à une prière ou à une cérémonie ?"],"statut":"brouillon"},"gospel":{"origines":"Le gospel désigne les chants religieux des églises afro-américaines, développés au XXe siècle à partir des spirituals, des hymnes et du blues.","contexte":"Le pasteur et compositeur Thomas A. Dorsey, ancien musicien de blues, est considéré comme le père du gospel moderne. Le gospel nourrit directement la soul, le rhythm and blues et le rock and roll.","rythme":"Mains qui frappent les contretemps, pulsation soutenue par l'orgue Hammond et le piano.","harmonie":"Harmonies simples enrichies, chœur en réponse à un soliste (appel et réponse).","reperes":[[1932,"Thomas A. Dorsey compose Take My Hand, Precious Lord."],[1947,"Mahalia Jackson enregistre Move On Up a Little Higher, succès considérable."],[1969,"Oh Happy Day, par les Edwin Hawkins Singers, atteint le public pop."]],"ecoute":[["Mahalia Jackson, Move On Up a Little Higher (1947)","Mahalia Jackson Move On Up a Little Higher"],["Sister Rosetta Tharpe, Strange Things Happening Every Day (1944)","Sister Rosetta Tharpe Strange Things Happening Every Day"],["Edwin Hawkins Singers, Oh Happy Day (1969)","Edwin Hawkins Singers Oh Happy Day"]],"questions":["Qui chante en solo, qui répond en chœur ?","Quel est le rôle de l'orgue ou du piano ?"],"statut":"brouillon"},"soul":{"origines":"La soul se forme dans les années 1950 et 1960 aux États-Unis en mêlant gospel, rhythm and blues et blues.","contexte":"Elle accompagne le mouvement des droits civiques. Deux maisons de disques structurent son histoire : Stax à Memphis (son plus rugueux) et Motown à Detroit (fondée en 1959 par Berry Gordy, son plus poli).","timbres":"Voix puissantes et expressives, section de cuivres, orgue, basse mélodique, batterie au groove marqué.","reperes":[[1959,"Berry Gordy fonde Motown à Detroit."],[1964,"Sam Cooke enregistre A Change Is Gonna Come (sorti à la fin de l'année, peu après sa mort)."],[1967,"Aretha Franklin enregistre Respect, reprise d'un titre d'Otis Redding."]],"ecoute":[["Sam Cooke, A Change Is Gonna Come (1964)","Sam Cooke A Change Is Gonna Come"],["Otis Redding, (Sittin' On) The Dock of the Bay (1968)","Otis Redding Dock of the Bay"],["Aretha Franklin, Respect (1967)","Aretha Franklin Respect"]],"questions":["Comment la voix exprime-t-elle l'émotion : par la force, par la douceur, par les cris ?","Quel est le rôle des cuivres ?"],"statut":"brouillon"},"funk":{"origines":"Le funk se forme dans la seconde moitié des années 1960 aux États-Unis, autour de James Brown, de Sly and the Family Stone, de The Meters et plus tard de Parliament-Funkadelic.","contexte":"Il prolonge la soul en donnant la première place au rythme. Le slogan « on the one » désigne l'accent mis sur le premier temps de la mesure.","rythme":"Basse et batterie en motifs syncopés répétés, guitare en notes courtes et sèches (rhythm guitar « chicken scratch »), peu de changements d'accords.","harmonie":"Souvent un seul accord pendant de longues sections : la tension vient du rythme.","reperes":[[1965,"James Brown, Papa's Got a Brand New Bag."],[1967,"James Brown, Cold Sweat, souvent cité comme acte de naissance du funk."],[1969,"Sly and the Family Stone, Thank You (Falettinme Be Mice Elf Agin), publié en fin d'année."]],"ecoute":[["James Brown, Cold Sweat (1967)","James Brown Cold Sweat"],["The Meters, Cissy Strut (1969)","The Meters Cissy Strut"],["Parliament, Give Up the Funk (Tear the Roof off the Sucker) (1975)","Parliament Give Up the Funk"]],"questions":["Où entends-tu le « un » du temps ?","Combien d'accords entends-tu ? Qu'est-ce qui rend la musique dansante malgré cela ?"],"statut":"brouillon"},"disco":{"origines":"Le disco naît au début des années 1970 dans les clubs de New York, de Philadelphie et de Chicago, notamment dans des clubs fréquentés par des communautés noires, latinos et gays.","contexte":"Les DJ enchaînent les disques sans interruption, ce qui transforme la piste de danse en espace collectif. Le film La Fièvre du samedi soir (1977) et l'album des Bee Gees en font un phénomène mondial. En 1979, la soirée Disco Demolition Night à Chicago marque un violent retour de bâton.","rythme":"Grosse caisse sur chaque temps (four on the floor), charleston ouvert
