crit le raï au patrimoine culturel immatériel en 2022.","timbres":"Voix expressive et ornée, gasba (flûte), derbouka, puis guitare, claviers.","reperes":[[1985,"Premier festival de raï à Oran."],[1992,"Khaled, Didi (album Khaled)."],[1994,"Assassinat de Cheb Hasni."],[2022,"Inscription du raï au patrimoine de l'UNESCO."]],"ecoute":[["Cheb Khaled, Didi (1992)","Cheb Khaled Didi"],["Khaled, Aïcha (1996)","Khaled Aïcha"],["Cheikha Rimitti, Charrak Gataa","Cheikha Rimitti Charrak Gataa"]],"questions":["Quels instruments sont traditionnels, lesquels sont modernes ?","Pourquoi cette musique a-t-elle longtemps été jugée scandaleuse ?"],"statut":"brouillon"},"bollywood-music":{"origines":"La musique de Bollywood est la musique des films en hindi de Mumbai. Le premier film parlant indien, Alam Ara (1931), comprend déjà des chansons.","contexte":"Les chansons sont chantées par des chanteurs de playback, très célèbres (Lata Mangeshkar, Mohammed Rafi, Kishore Kumar, Asha Bhosle), alors que les acteurs mouvent les lèvres. Les compositeurs (S. D. Burman, R. D. Burman, A. R. Rahman) mêlent musique classique indienne, folklore, jazz, disco et électronique.","formes":"Chaque film contient plusieurs numéros musicaux chantés et dansés, intégrés à l'intrigue.","reperes":[[1931,"Alam Ara, premier film parlant indien."],[1992,"A. R. Rahman compose la musique de Roja."],[2009,"A. R. Rahman reçoit deux Oscars pour Slumdog Millionaire, dont celui de la meilleure chanson (Jai Ho)."]],"ecoute":[["Lata Mangeshkar, Aayega Aanewala (1949)","Lata Mangeshkar Aayega Aanewala"],["R. D. Burman et Asha Bhosle, Piya Tu Ab To Aaja (1971)","Asha Bhosle Piya Tu Ab To Aaja"],["A. R. Rahman, Chaiyya Chaiyya (1998)","A. R. Rahman Chaiyya Chaiyya"]],"questions":["Qui chante : l'acteur ou une autre voix ? Que change le playback ?","Quels éléments viennent de la musique indienne, lesquels de la pop occidentale ?"],"statut":"brouillon"},"aboriginal-song":{"origines":"Les chants aborigènes d'Australie sont l'une des plus anciennes traditions musicales vivantes ; chaque peuple a ses chants, ses langues et ses instruments.","contexte":"Les chants des pistes (songlines) racontent le voyage d'êtres ancestraux à travers le territoire : chanter le chemin, c'est le connaître et le transmettre. Ces chants sont liés à des lieux, à des cérémonies et à des droits sur la terre, et certains ne peuvent être entendus que par des personnes initiées. Des artistes contemporains (Yothu Yindi, Gurrumul) portent ces langues dans la musique populaire.","timbres":"Voix, claves (bâtons frappés), didgeridoo dans le nord, tambours à main dans certaines régions.","reperes":[[1991,"Yothu Yindi, Treaty, un des premiers succès d'un groupe aborigène dans la pop mondiale."],[2008,"Gurrumul, premier album solo de Geoffrey Gurrumul Yunupingu."]],"ecoute":[["Yothu Yindi, Treaty (1991)","Yothu Yindi Treaty"],["Gurrumul, Wiyathul (2008)","Gurrumul Wiyathul"]],"questions":["Comment un chant peut-il servir de carte d'un territoire ?","Pourquoi certains chants ne sont-ils pas destinés à être enregistrés ou diffusés ?"],"statut":"brouillon"},"didgeridoo":{"origines":"Le didgeridoo (yidaki chez les Yolngu, en Terre d'Arnhem) est un instrument à vent des peuples aborigènes du nord de l'Australie, un long tube de bois d'eucalyptus creusé par les termites.","contexte":"On l'utilise dans des cérémonies. Le musicien produit un bourdon par la vibration des lèvres et le fait durer par la respiration circulaire (inspirer par le nez tout en soufflant l'air des joues).","timbres":"Un bourdon grave, sur lequel on module le timbre avec la langue, la bouche, la voix et des cris d'animaux.","reperes":[[1991,"Yothu Yindi, groupe de Terre d'Arnhem, popularise le yidaki dans la pop avec Treaty."]],"ecoute":[["Yothu Yindi, Treaty (1991)","Yothu Yindi Treaty"]],"questions":["Comment le musicien peut-il jouer sans s'arrêter pour respirer ?","Quel effet donne la voix mêlée au son de l'instrument ?"],"statut":"brouillon"},"maori-waiata":{"origines":"Le waiata désigne les chants des Maoris de Nouvelle-Zélande (Aotearoa), accompagnés ou non d'instruments traditionnels, les taonga pūoro.","contexte":"Il existe des waiata de deuil (waiata tangi), d'amour (waiata aroha), de louange ou de récits, souvent chantés en chœur lors de cérémonies d'accueil (pōwhiri). Il ne faut pas confondre le waiata, chanté, avec le haka, danse et chant martial ou cérémoniel. La langue maorie, te reo, a été découragée, voire punie, à l'école au XXe siècle, puis revitalisée.","timbres":"Voix en polyphonie, poi (boules attachées à des cordes), taonga pūoro (flûtes en os ou en bois, trompettes en coquille).","reperes":[],"ecoute":[["Pōkarekare Ana (chanson d'amour traditionnelle)","Pōkarekare Ana"],["Hirini Melbourne et Richard Nunns, taonga pūoro","Hirini Melbourne Richard Nunns taonga pūoro"]],"questions":["Quelle différence fais-tu entre un waiata et un haka ?","Pourquoi la transmission de la langue compte-t-elle autant que celle de la musique ?"],"statut":"brouillon"},"impressionism":{"origines":"L'impressionnisme musical désigne, en France, la musique de Claude Debussy et de Maurice Ravel autour de 1890 à 1920. Le mot vient de la critique de peinture (Impression, soleil levant, de Monet, 1872) ; Debussy refusait cette étiquette.","contexte":"Debussy entend un gamelan javanais à l'Exposition universelle de Paris en 1889. À l'opposé de la musique germanique de son temps, il cherche la couleur, le timbre et l'atmosphère plus que le développement thématique.","harmonie":"Gamme par tons, modes, gamme pentatonique, accords parallèles, accords enrichis qui ne se résolvent pas comme dans l'harmonie classique.","timbres":"Orchestre raffiné, instruments isolés (flûte, harpe, cor), pédale du piano.","reperes":[[1894,"Debussy, Prélude à l'après-midi d'un faune."],[1902,"Debussy, Pelléas et Mélisande (opéra)."],[1905,"Debussy, La mer."],[1912,"Ravel, Daphnis et Chloé, pour les Ballets russes."],[1928,"Ravel, Boléro."]],"ecoute":[["Debussy, Prélude à l'après-midi d'un faune (1894)","Debussy Prélude à l'après-midi d'un faune"],["Debussy, La mer : De l'aube à midi sur la mer (1905)","Debussy La mer De l'aube à midi sur la mer"],["Ravel, Daphnis et Chloé : Lever du jour (1912)","Ravel Daphnis et Chloé Lever du jour"]],"questions":["Peux-tu dire où est la mélodie, ou si c'est la couleur qui compte le plus ?","Quels instruments reconnais-tu, et que disent-ils de l'atmosphère ?"],"statut":"brouillon"},"second-viennese":{"origines":"La seconde école de Vienne désigne Arnold Schoenberg et ses deux élèves Alban Berg et Anton Webern, à Vienne dans la première moitié du XXe siècle.","contexte":"Ils poussent l'harmonie jusqu'à l'abandon de la tonalité (vers 1908-1909) puis inventent la méthode des douze sons (années 1920). Berg écrit les opéras Wozzeck (1925) et Lulu (inachevé, créé en 1937). Webern, aux pièces très brèves et dépouillées, est tué accidentellement par un soldat américain en 1945.","reperes":[[1909,"Schoenberg, Erwartung."],[1912,"Schoenberg, Pierrot lunaire."],[1925,"Création de Wozzeck, de Berg, à Berlin."],[1936,"Webern, Variations pour orchestre op. 30 (1940) ; pour piano op. 27 (1936)."]],"ecoute":[["Arnold Schoenberg, Pierrot lunaire (1912)","Schoenberg Pierrot lunaire"],["Alban Berg, Wozzeck (1925)","Berg Wozzeck"],["Anton Webern, Variations pour piano op. 27 (1936)","Webern Variations pour piano op. 27"]],"questions":["Peux-tu sentir une tonalité, un « centre » ? Que se passe-t-il quand il n'y en a plus ?","Qu'est-ce qui rend la musique de Webern si courte et si dépouillée ?"],"statut":"brouillon"},"dodecaphonism":{"origines":"Le dodécaphonisme est une méthode de composition à douze sons, mise au point par Arnold Schoenberg au début des années 1920 (Suite pour piano op. 25, 1921-1923). Josef Matthias Hauer avait proposé une idée voisine à Vienne dès 1919.","contexte":"Après l'abandon de la tonalité, Schoenberg cherche une règle qui donne une cohérence à la musique sans tonalité. Une série (ou « rangée ») contient les douze notes de la gamme chromatique une seule fois chacune.","melodie":"La rangée peut se jouer sous quatre formes : originale, renversée (en miroir des intervalles), rétrograde (à l'envers), rétrograde du renversement, et transposée sur chacune des douze notes.","reperes":[[1923,"Schoenberg achève la Suite pour piano op. 25, première œuvre entièrement dodécaphonique."],[1935,"Alban Berg, Concerto à la mémoire d'un ange (concerto pour violon), mêlant série et tonalité."]],"ecoute":[["Arnold Schoenberg, Suite pour piano op. 25 (1923)","Schoenberg Suite für Klavier op. 25"],["Alban Berg, Concerto pour violon (1935)","Berg Violin Concerto 1935"],["Anton Webern, Symphonie op. 21 (1928)","Webern Symphonie op. 21"]],"questions":["Peux-tu entendre une même note revenir trop tôt dans la mélodie ? Pourquoi la série l'interdit-elle ?","Compare la série à une règle de jeu : que permet-elle, que défend-elle ?"],"statut":"brouillon"},"schoenberg":{"origines":"Arnold Schoenberg, né à Vienne en 1874, mort à Los Angeles en 1951, est le compositeur qui rompt avec la tonalité (1908-1909) puis invente la méthode des douze sons (années 1920).","contexte":"Il fonde en 1918 à Vienne la Société d'exécutions musicales privées, pour présenter la musique nouvelle sans pression du public. Juif, il quitte l'Allemagne en 1933 devant la montée du nazisme et s'installe aux États-Unis. Il enseigne à Los Angeles, où il a notamment pour élève John Cage.","reperes":[[1899,"Verklärte Nacht (sextuor à cordes)."],[1909,"Erwartung."],[1912,"Pierrot lunaire, pour voix parlée-chantée (Sprechstimme) et cinq instruments."],[1933,"Émigration aux États-Unis."],[1947,"A Survivor from Warsaw."]],"ecoute":[["Schoenberg, Verklärte Nacht (1899)","Schoenberg Verklärte Nacht"],["Schoenberg, Pierrot lunaire (1912)","Schoenberg Pierrot lunaire"],["Schoenberg, A Survivor from Warsaw (1947)","Schoenberg A Survivor from Warsaw"]],"questions":["Qu'est-ce que la voix « parlée-chantée » de Pierrot lunaire ?","Qu'est-ce qui sépare l'avant (1899) de l'après (1912) dans la musique de Schoenberg ?"],"statut":"brouillon"},"serialism":{"origines":"Le sérialisme étend l'idée de série, née chez Schoenberg pour les hauteurs de notes, à d'autres paramètres du son : durées, intensités, timbres, modes d'attaque.","contexte":"Après 1945, une génération de compositeurs (Boulez, Stockhausen, Nono, Berio) se retrouve aux cours d'été de Darmstadt, en Allemagne, dès 1946, pour reconstruire la musique sur des bases neuves. Mode de valeurs et d'intensités (Messiaen, 1949) est souvent cité comme point de départ du sérialisme intégral.","reperes":[[1946,"Premiers cours d'été de Darmstadt."],[1949,"Messiaen, Mode de valeurs et d'intensités."],[1951,"Boulez, Structures Ia."]],"ecoute":[["Olivier Messiaen, Mode de valeurs et d'intensités (1949)","Messiaen Mode de valeurs et d'intensités"],["Pierre Boulez, Structures Ia (1951)","Boulez Structures Ia"],["Karlheinz Stockhausen, Kreuzspiel (1951)","Stockhausen Kreuzspiel"]],"questions":["Peux-tu entendre une logique, ou seulement des sons isolés ? Qu'est-ce qui change selon l'écoute ?","Quels paramètres (hauteur, durée, intensité) changent d'un son à l'autre ?"],"statut":"brouillon"},"pierre-boulez":{"origines":"Pierre Boulez, né à Montbrison en 1925, mort à Baden-Baden en 2016, est compositeur, chef d'orchestre et fondateur d'institutions.","contexte":"Élève d'Olivier Messiaen, il crée en 1954 les concerts du Domaine musical à Paris, dirige l'Orchestre de la BBC, le New York Philharmonic, et monte le Ring de Wagner à Bayreuth (1976, mise en scène de Patrice Chéreau). Il fonde l'Ircam à Paris en 1977 pour associer science et musique.","reperes":[[1951,"Structures Ia (deux pianos)."],[1955,"Le Marteau sans maître, sur des poèmes de René Char."],[1977,"Fondation de l'Ircam, ouvert à Paris."],[1981,"Répons, pour ensemble, solistes et électronique en temps réel."]],"ecoute":[["Boulez, Le Marteau sans maître (1955)","Boulez Le Marteau sans maître"],["Boulez, Répons (1981)","Boulez Répons"],["Boulez, Pli selon pli (1962)","Boulez Pli selon pli"]],"questions":["Qu'est-ce qui est écrit, qu'est-ce qui est transformé par l'électronique dans Répons ?","Pourquoi fonder un institut de recherche pour faire de la musique ?"],"statut":"brouillon"},"stockhausen":{"origines":"Karlheinz Stockhausen, né à Mödrath (Allemagne) en 1928, mort en 2007, travaille dans le studio électronique de la radio de Cologne (WDR) à partir de 1953.","contexte":"Il pousse très loin la composition de timbres et d'espaces : Gesang der Jünglinge (1955-1956) mêle voix d'enfant et sons électroniques en cinq groupes de haut-parleurs ; Gruppen (1955-1957) pour trois orchestres ; Hymnen (1966-1967) sur des hymnes nationaux ; Licht, cycle de sept opéras (1977-2003), un par jour de la semaine.","reperes":[[1956,"Gesang der Jünglinge."],[1960,"Kontakte (sons électroniques et instruments)."],[1968,"Stimmung, pour six voix."],[1993,"Helikopter-Streichquartett."]],"ecoute":[["Stockhausen, Gesang der Jünglinge (1956)","Stockhausen Gesang der Jünglinge"],["Stockhausen, Kontakte (1960)","Stockhausen Kontakte"],["Stockhausen, Stimmung (1968)","Stockhausen Stimmung"]],"questions":["Où sont placés les sons dans l'espace ? Comment le sais-tu ?","Quel lien fais-tu entre la voix d'enfant et les sons de synthèse ?"],"statut":"brouillon"},"john-cage":{"origines":"John Cage, né à Los Angeles en 1912, mort à New York en 1992, compose avec le hasard, le silence et les sons de l'environnement.","contexte":"Élève de Schoenberg, il invente le piano préparé (objets glissés entre les cordes). Sa rencontre avec la pensée zen et le Yi King (I Ching) le conduit à composer par tirages au sort. Il travaille avec le chorégraphe Merce Cunningham, son compagnon, pendant près de cinquante ans.","reperes":[[1946,"Début des Sonatas and Interludes, pour piano préparé (jusqu'en 1948)."],[1951,"Music of Changes, composée avec le Yi King ; Imaginary Landscape No. 4, pour douze radios."],[1952,"4'33\", créé à Woodstock par David Tudor le 29 août."],[1961,"Publication du livre Silence."]],"ecoute":[["Cage, Sonatas and Interludes (1946-1948)","Cage Sonatas and Interludes"],["Cage, 4'33\" (1952)","Cage 4'33"],["Cage, Imaginary Landscape No. 4 (1951)","Cage Imaginary Landscape No. 4"]],"questions":["Dans 4'33\", qu'entends-tu ? Qu'est-ce qui est musique ?","Qu'est-ce que le tirage au sort enlève au compositeur ? Qu'est-ce qu'il lui apporte ?"],"statut":"brouillon"},"aleatoric":{"origines":"La musique aléatoire, ou musique d'indétermination, laisse une part de l'œuvre au hasard ou au choix de l'interprète. Elle se développe à partir du début des années 1950 aux États-Unis avec John Cage, puis en Europe.","contexte":"On distingue le hasard au moment de la composition (Cage, Music of Changes, 1951) et l'indétermination au moment de l'exécution (Earle Brown, December 1952 ; Stockhausen, Klavierstück XI, 1956 ; Boulez, Troisième sonate, 1955-1957). En Pologne, Witold Lutosławski emploie un « aléatoire contrôlé » (Jeux vénitiens, 1961).","reperes":[[1951,"John Cage, Music of Changes."],[1952,"Earle Brown, December 1952, partition graphique."],[1956,"Stockhausen, Klavierstück XI."],[1963,"Début de Treatise, de Cornelius Cardew (jusqu'en 1967), partition graphique."]],"ecoute":[["Cage, Music of Changes (1951)","Cage Music of Changes"],["Lutosławski, Jeux vénitiens (1961)","Lutosławski Jeux vénitiens"],["Stockhausen, Klavierstück XI (1956)","Stockhausen Klavierstück XI"]],"questions":["Si l'interprète peut choisir, qui est l'auteur de l'œuvre ?","En quoi un tirage au sort est-il différent d'un choix d'interprète ?"],"statut":"brouillon"},"minimalism":{"origines":"Le minimalisme musical naît aux États-Unis au début des années 1960, avec La Monte Young, Terry Riley, Steve Reich et Philip Glass.","contexte":"En réaction à la complexité du sérialisme, ces compositeurs travaillent avec très peu de matériau, répété et transformé lentement. Beaucoup s'inspirent de musiques non occidentales : l'hindoustanie (Young et Riley étudient avec Pandit Pran Nath), les percussions africaines (Reich), le gamelan balinais.","rythme":"Pulsation régulière, motifs répétés, déphasages, processus qu'on entend se dérouler.","reperes":[[1960,"La Monte Young, Composition 1960 #7 : une quinte si-fa dièse « à tenir très longtemps »."],[1964,"Terry Riley, In C, créé à San Francisco."],[1967,"Steve Reich, Piano Phase."],[1976,"Philip Glass et Robert Wilson, Einstein on the Beach, créé à Avignon ; Reich, Music for 18 Musicians."]],"ecoute":[["Terry Riley, In C (1964)","Terry Riley In C"],["Steve Reich, Music for 18 Musicians (1976)","Steve Reich Music for 18 Musicians"],["Philip Glass, Einstein on the Beach : Knee Play 1 (1976)","Philip Glass Einstein on the Beach Knee Play 1"]],"questions":["Qu'est-ce qui change lentement, qu'est-ce qui reste identique ?","Que ressens-tu après dix minutes de répétition ?"],"statut":"brouillon"},"steve-reich":{"origines":"Steve Reich, né à New York en 1936, est l'un des fondateurs du minimalisme américain. Il découvre le déphasage en 1965 en laissant deux magnétophones jouer la même boucle à des vitesses très légèrement différentes.","contexte":"Il étudie les percussions d'Afrique de l'Ouest à Accra (Ghana) en 1970, puis le gamelan balinais, ce qui nourrit Drumming (1970-1971). Dans Different Trains (1988), il superpose les voix de témoins de la Shoah à un quatuor à cordes qui imite leurs intonations.","reperes":[[1965,"It's Gonna Rain."],[1966,"Come Out, sur la voix de Daniel Hamm, l'un des « Harlem Six », battu par la police."],[1967,"Piano Phase."],[1976,"Music for 18 Musicians."],[1988,"Different Trains."]],"ecoute":[["Steve Reich, Piano Phase (1967)","Steve Reich Piano Phase"],["Steve Reich, Come Out (1966)","Steve Reich Come Out"],["Steve Reich, Different Trains (1988)","Steve Reich Different Trains"]],"questions":["Comment deux instruments qui jouent la même chose peuvent-ils finir par produire un nouveau rythme ?","Dans Different Trains, comment la parole devient-elle mélodie ?"],"statut":"brouillon"},"iannis-xenakis":{"origines":"Iannis Xenakis, né en 1922 à Brăila (Roumanie) dans une famille grecque, mort à Paris en 2001, est à la fois compositeur, ingénieur et architecte.","contexte":"Résistant pendant la guerre en Grèce, condamné à mort, il s'enfuit en France en 1947 et travaille dans l'agence de Le Corbusier. Il applique les probabilités et les mathématiques à la composition (Metastaseis, 1953-1954 ; Pithoprakta, 1955-1956), invente l'UPIC (1977), système qui transforme un dessin en son, et conçoit avec Le Corbusier le pavillon Philips de l'Exposition de Bruxelles (1958).","reperes":[[1954,"Metastaseis, pour orchestre."],[1958,"Concret PH, pour le pavillon Philips."],[1963,"Musiques formelles, son livre théorique."],[1971,"Persepolis, au festival de Shiraz."],[1977,"Premier UPIC."]],"ecoute":[["Xenakis, Metastaseis (1954)","Xenakis Metastaseis"],["Xenakis, Pithoprakta (1956)","Xenakis Pithoprakta"],["Xenakis, Persepolis (1971)","Xenakis Persepolis"]],"questions":["Comment un nuage de sons peut-il se décrire par des statistiques ?","Qu'est-ce que la musique doit à l'architecture dans le pavillon Philips ?"],"statut":"brouillon"},"gyorgy-ligeti":{"origines":"György Ligeti, né en 1923 en Transylvanie (Roumanie), de langue hongroise, quitte la Hongrie en 1956 après l'insurrection et s'installe en Autriche puis en Allemagne ; il meurt à Vienne en 2006.","contexte":"Il invente la micropolyphonie : de nombreuses voix presque identiques qui se superposent pour former des nuages de sons (Atmosphères, 1961). Le cinéma de Stanley Kubrick reprend Atmosphères, Lux aeterna et Requiem dans 2001, l'Odyssée de l'espace (1968). Plus tard, il écrit pour piano des Études très rythmées, influencées par la polyrythmie africaine et par Conlon Nancarrow.","reperes":[[1961,"Atmosphères, pour orchestre."],[1962,"Poème symphonique pour cent métronomes."],[1966,"Lux aeterna, pour seize voix."],[1978,"Le Grand Macabre, opéra."],[1985,"Début des Études pour piano (premier livre)."]],"ecoute":[["Ligeti, Atmosphères (1961)","Ligeti Atmosphères"],["Ligeti, Lux aeterna (1966)","Ligeti Lux aeterna"],["Ligeti, Poème symphonique pour cent métronomes (1962)","Ligeti Poème symphonique cent métronomes"]],"questions":["Peux-tu distinguer chaque voix, ou n'entends-tu qu'un nuage ?","Pourquoi cette musique est-elle bien adaptée à l'espace et à l'inquiétude ?"],"statut":"brouillon"},"music-concrete":{"origines":"La musique concrète est née à Paris en 1948, avec Pierre Schaeffer, ingénieur de la Radiodiffusion française, qui compose directement avec des sons enregistrés (bruits de trains, de casseroles) plutôt qu'avec des notes écrites.","contexte":"Schaeffer travaille avec des disques, puis des bandes magnétiques : boucles (sillon fermé), lecture à l'envers, changement de vitesse, découpes. Le Groupe de recherches de musique concrète est fondé en 1951, puis le GRM en 1958. Pierre Henry en est un compositeur majeur.","production":"On enregistre un son (objet sonore), on l'isole de sa cause, on le transforme et on le monte avec d'autres.","reperes":[[1948,"Pierre Schaeffer, Cinq études de bruits, diffusées à la radio."],[1950,"Symphonie pour un homme seul, de Pierre Schaeffer et Pierre Henry."],[1958,"Fondation du Groupe de recherches musicales (GRM)."],[1967,"Pierre Henry, Messe pour le temps présent, pour Maurice Béjart."]],"ecoute":[["Pierre Schaeffer, Étude aux chemins de fer (1948)","Pierre Schaeffer Étude aux chemins de fer"],["Pierre Schaeffer et Pierre Henry, Symphonie pour un homme seul (1950)","Schaeffer Henry Symphonie pour un homme seul"],["Pierre Henry, Variations pour une porte et un soupir (1963)","Pierre Henry Variations pour une porte et un soupir"]],"questions":["Quel est le son d'origine ? Peux-tu l'oublier pour écouter seulement sa forme ?","Que change un son à l'envers ou ralenti ?"],"statut":"brouillon"},"pierre-schaeffer":{"origines":"Pierre Schaeffer, né à Nancy en 1910, mort en 1995, ingénieur, écrivain et compositeur, fonde la musique concrète en 1948 et le Groupe de recherches musicales (GRM) en 1958.","contexte":"Son Traité des objets musicaux (1966) propose une manière d'écouter : l'écoute réduite, qui consiste à laisser de côté la cause d'un son (le train, la porte) pour n'en entendre que les qualités (hauteur, grain, forme dans le temps). L'objet sonore devient l'unité de sa pensée.","reperes":[[1948,"Études de bruits, première musique concrète."],[1950,"Symphonie pour un homme seul, avec Pierre Henry."],[1958,"Fondation du GRM."],[1966,"Traité des objets musicaux."]],"ecoute":[["Schaeffer, Étude aux chemins de fer (1948)","Schaeffer Étude aux chemins de fer"],["Schaeffer et Henry, Symphonie pour un homme seul (1950)","Schaeffer Henry Symphonie pour un homme seul"]],"questions":["Qu'est-ce qu'écouter un son « pour lui-même » ?","Peux-tu décrire un bruit sans nommer sa source ?"],"statut":"brouillon"},"electroacoustic":{"origines":"La musique électroacoustique rassemble les musiques faites avec des sons enregistrés ou électroniques, fixés sur bande puis sur support numérique, ou mêlés à des instruments en direct.","contexte":"Après la musique concrète parisienne (1948) et la musique électronique de Cologne (studio de la radio WDR, 1951), des studios ouvrent partout : Milan (RAI, 1955, avec Luciano Berio et Bruno Maderna), Varsovie, Tokyo, New York. Edgard Varèse compose Poème électronique (1958) pour plus de trois cents haut-parleurs dans le pavillon Philips de l'Exposition de Bruxelles.","reperes":[[1951,"Ouverture du studio de musique électronique de la radio de Cologne."],[1955,"Ouverture du Studio di Fonologia de la RAI, à Milan."],[1958,"Edgard Varèse, Poème électronique ; Luciano Berio, Thema (Omaggio a Joyce)."]],"ecoute":[["Edgard Varèse, Poème électronique (1958)","Varèse Poème électronique"],["Luciano Berio, Thema (Omaggio a Joyce) (1958)","Berio Thema Omaggio a Joyce"],["Karlheinz Stockhausen, Gesang der Jünglinge (1956)","Stockhausen Gesang der Jünglinge"]],"questions":["Comment l'espace (les haut-parleurs) fait-il partie de la musique ?","Quelle différence entre un son enregistré et un son synthétisé ?"],"statut":"brouillon"},"acousmatic":{"origines":"L'acousmatique désigne une musique qu'on écoute sans voir la source du son, par haut-parleurs seuls. Le mot vient des acousmaticiens, disciples de Pythagore qui écoutaient leur maître caché derrière un rideau.","contexte":"On attribue à Jérôme Peignot l'emploi du mot en 1955 pour la musique concrète ; Pierre Schaeffer le reprend. François Bayle conçoit en 1974, au GRM, l'Acousmonium : un orchestre de haut-parleurs répartis dans la salle, que le compositeur joue en direct. Le Britannique Denis Smalley théorise en 1986 la spectromorphologie.","reperes":[[1955,"Emploi du mot « acousmatique » par Jérôme Peignot."],[1974,"Premier Acousmonium, de François Bayle, au GRM."],[1975,"Bernard Parmegiani, De natura sonorum."],[1986,"Denis Smalley, texte sur la spectromorphologie."]],"ecoute":[["Bernard Parmegiani, De natura sonorum (1975)","Parmegiani De natura sonorum"],["Francis Dhomont, Forêt profonde (1996)","Francis Dhomont Forêt profonde"]],"questions":["Que change l'absence d'interprète sur scène ?","Comment le compositeur peut-il « jouer » les haut-parleurs dans la salle ?"],"statut":"brouillon"},"microtonal":{"origines":"La musique microtonale emploie des intervalles plus petits que le demi-ton de notre piano. Elle existe depuis longtemps dans de nombreuses traditions (maqam, shruti indiens, gamelan) et revient dans la musique occidentale au XXe siècle.","contexte":"Alois Hába (Tchécoslovaquie) compose en quarts de ton dès les années 1920 et signe l'opéra Matka (1931). Harry Partch, aux États-Unis, construit ses propres instruments et une gamme de quarante-trois sons par octave (Genesis of a Music, 1949). Les compositeurs spectraux notent des quarts de ton pour reproduire les harmoniques d'un son.","reperes":[[1931,"Alois Hába, opéra Matka, en quarts de ton."],[1949,"Harry Partch, Genesis of a Music."],[1978,"György Ligeti, Passacaglia ungherese, pour clavecin accordé en tempérament mésotonique."]],"ecoute":[["Harry Partch, Delusion of the Fury (1966)","Harry Partch Delusion of the Fury"],["György Ligeti, Passacaglia ungherese (1978)","Ligeti Passacaglia ungherese"]],"questions":["Entends-tu des notes entre celles du piano ? Que provoque cette impression ?","Pourquoi la division de l'octave en douze n'est-elle qu'un choix parmi d'autres ?"],"statut":"brouillon"},"noise-music":{"origines":"La noise est une musique qui fait du bruit sa matière principale. Son ancêtre est le manifeste L'arte dei rumori (1913) du futuriste Luigi Russolo, qui construit les intonarumori, machines à produire des bruits.","contexte":"Dans les années 1970 et 1980, Throbbing Gristle et d'autres groupes de musique industrielle utilisent le bruit comme provocation. Au Japon, la scène « japanoise » (Merzbow, Masami Akita, depuis 1979 ; Hijokaidan ; Boredoms) pousse le bruit à des volumes et densités extrêmes.","timbres":"Larsen, distorsion, pédales d'effets, synthétiseurs analogiques, objets amplifiés, voix criée.","reperes":[[1913,"Luigi Russolo, manifeste L'arte dei rumori."],[1977,"Throbbing Gristle, The Second Annual Report."],[1996,"Merzbow, Pulse Demon."]],"ecoute":[["Merzbow, Pulse Demon (1996)","Merzbow Pulse Demon"],["Throbbing Gristle, Hamburger Lady (1978)","Throbbing Gristle Hamburger Lady"]],"questions":["À partir de quand un bruit devient-il musique ?","Que cherche l'auditeur dans une musique volontairement agressive ?"],"statut":"brouillon"},"drone-music":{"origines":"La musique de drone repose sur des sons tenus très longtemps, des bourdons, qui font passer le temps et l'harmonie au second plan.","contexte":"La Monte Young la fonde dans la scène new-yorkaise des années 1960 (Theatre of Eternal Music, avec Marian Zazeela, John Cale), liée à l'étude de la musique hindoustanie. Éliane Radigue compose avec un synthétiseur ARP des pièces lentes (Trilogie de la mort, 1988-1993). Pauline Oliveros théorise l'écoute profonde (Deep Listening, 1989). Plus tard, des groupes de rock comme Sunn O))) en tirent des musiques lourdes.","reperes":[[1964,"La Monte Young commence The Well-Tuned Piano."],[1989,"Pauline Oliveros, Deep Listening, enregistré dans une citerne à Port Townsend."],[1993,"Éliane Radigue achève la Trilogie de la mort."]],"ecoute":[["Éliane Radigue, Kyema (Trilogie de la mort) (1988)","Éliane Radigue Kyema Trilogie de la mort"],["Pauline Oliveros, Deep Listening (1989)","Pauline Oliveros Deep Listening"],["La Monte Young, The Well-Tuned Piano","La Monte Young The Well-Tuned Piano"]],"questions":["Qu'est-ce qui change dans un son tenu longtemps ?","Que fait l'écoute quand rien ne semble bouger ?"],"statut":"brouillon"},"free-improvisation":{"origines":"L'improvisation libre, ou non idiomatique, est une musique improvisée sans grille, ni genre, ni forme imposés. Elle se forme au milieu des années 1960 en Europe, indépendamment du free jazz.","contexte":"Le groupe AMM naît à Londres en 1965 ; Spontaneous Music Ensemble la même année ; Musica Elettronica Viva à Rome en 1966 ; Peter Brötzmann et Evan Parker forgent un jeu instrumental étendu. Derek Bailey fonde le label Incus (1970) et le collectif Company (1976).","formes":"Pas de thème ni de partition : les musiciens construisent la forme ensemble, par l'écoute.","reperes":[[1965,"Formation d'AMM à Londres."],[1968,"Peter Brötzmann, Machine Gun."],[1970,"Fondation du label Incus par Derek Bailey, Evan Parker et Tony Oxley."],[1976,"Premier Company de Derek Bailey."]],"ecoute":[["AMM, AMMMusic (1966)","AMM AMMMusic 1966"],["Peter Brötzmann, Machine Gun (1968)","Peter Brötzmann Machine Gun"],["Derek Bailey, Company (1976)","Derek Bailey Company 1976"]],"questions":["Comment les musiciens décident-ils d'un début, d'une fin, d'un changement ?","En quoi cette improvisation est-elle différente de celle d'un solo de jazz ?"],"statut":"brouillon"},"live-coding":{"origines":"Le live coding est une pratique où l'on écrit du code en public pour produire de la musique ou des images en direct, l'écran de l'ordinateur étant projeté.","contexte":"Le collectif TOPLAP se forme en 2004. Parmi les environnements : SuperCollider (James McCartney, 1996), ChucK, Sonic Pi (Sam Aaron, 2012, pensé pour l'enseignement) et TidalCycles (Alex McLean). Les soirées « algorave » apparaissent à partir de 2011-2012.","formes":"Une boucle est écrite, relancée, modifiée pendant le morceau : la forme émerge du code qu'on change en direct.","reperes":[[2004,"Fondation de TOPLAP."],[2012,"Sam Aaron publie les premières versions de Sonic Pi."]],"ecoute":[["Algorave, extrait de soirée","Algorave live coding"],["Sonic Pi, démonstration de Sam Aaron","Sam Aaron Sonic Pi live coding"]],"questions":["Le code est-il une partition, un instrument, ou les deux ?","Que change le fait de montrer son code au public ?"],"statut":"brouillon"},"gerard-grisey":{"origines":"Gérard Grisey, né à Belfort en 1946, mort à Paris en 1998 à 52 ans, est l'un des fondateurs de la musique spectrale. Élève d'Olivier Messiaen, il est pensionnaire de la Villa Médicis (1972-1974).","contexte":"En 1973, avec Tristan Murail, Hugues Dufourt et Michaël Lévinas, il fonde l'ensemble L'Itinéraire. Il part de l'analyse acoustique du son (spectre, harmoniques) pour composer : Partiels (1975) s'ouvre sur l'analyse d'un mi grave de trombone, dont les harmoniques sont orchestrées.","reperes":[[1974,"Périodes, premier volet des Espaces acoustiques."],[1975,"Partiels."],[1985,"Achèvement des Espaces acoustiques (cycle de six pièces)."],[1996,"Vortex Temporum."]],"ecoute":[["Grisey, Partiels (1975)","Grisey Partiels"],["Grisey, Vortex Temporum (1996)","Grisey Vortex Temporum"],["Grisey, Les Espaces acoustiques (1974-1985)","Grisey Les Espaces acoustiques"]],"questions":["Peux-tu entendre un son se décomposer en harmoniques ?","Comment le temps du son (une respiration, un souffle) devient-il le temps de la musique ?"],"statut":"brouillon"},"tristan-murail":{"origines":"Tristan Murail, né en 1947 au Havre, est avec Gérard Grisey l'autre fondateur de la musique spectrale. Il est pensionnaire de la Villa Médicis (1971-1973).","contexte":"Il travaille à l'Ircam, où il utilise l'ordinateur pour analyser des sons et en dériver des harmonies : modulation en anneau, synthèse. Il a enseigné à l'université Columbia, à New York, de 1997 à 2011.","reperes":[[1980,"Gondwana, pour orchestre."],[1982,"Désintégrations, pour ensemble et bande."],[1995,"Le Partage des eaux."]],"ecoute":[["Murail, Gondwana (1980)","Murail Gondwana"],["Murail, Désintégrations (1982)","Murail Désintégrations"],["Murail, Le Partage des eaux (1995)","Murail Le Partage des eaux"]],"questions":["Comment un son de cloche peut-il devenir un accord d'orchestre ?","Qu'est-ce que l'ordinateur permet d'analyser que l'oreille entend mal ?"],"statut":"brouillon"},"brian-eno":{"origines":"Brian Eno, né en 1948 en Angleterre, est d'abord synthétiste du groupe Roxy Music (1971-1973), puis compositeur, producteur et théoricien.","contexte":"Il invente la musique ambient (Discreet Music, 1975 ; Ambient 1: Music for Airports, 1978), produit David Bowie (Low, 1977) et U2 (The Joshua Tree, 1987), et publie avec Peter Schmidt les Oblique Strategies (1975), cartes de propositions pour sortir d'une impasse créative. Il s'intéresse à la musique générative, qui se fabrique par des règles (application Bloom, 2008).","reperes":[[1975,"Another Green World ; Discreet Music ; Oblique Strategies."],[1978,"Ambient 1: Music for Airports."],[1981,"My Life in the Bush of Ghosts, avec David Byrne."]],"ecoute":[["Brian Eno, 1/1 (Music for Airports) (1978)","Brian Eno Music for Airports 1/1"],["Brian Eno, Discreet Music (1975)","Brian Eno Discreet Music"],["David Bowie, Warszawa (1977)","David Bowie Warszawa Low"]],"questions":["Quelle différence entre composer une mélodie et composer un système qui produit des sons ?","À quoi servent les Oblique Strategies ?"],"statut":"brouillon"},"luciano-berio":{"origines":"Luciano Berio, né en 1925 à Oneglia (Italie), mort à Rome en 2003, fonde avec Bruno Maderna le Studio di Fonologia de la radio italienne (RAI), à Milan, en 1955.","contexte":"Il travaille sur la voix, le langage et l'électronique. Les Sequenze, une série de pièces pour instrument seul commencée avec la flûte en 1958, explorent les limites de la technique de chaque instrument. Sinfonia (1968-1969) superpose voix, orchestre, un extrait de Mahler et des textes de Samuel Beckett et Claude Lévi-Strauss.","reperes":[[1955,"Fondation du Studio di Fonologia à Milan."],[1958,"Thema (Omaggio a Joyce) ; Sequenza I, pour flûte."],[1961,"Visage, pour bande magnétique et voix de Cathy Berberian."],[1968,"Début de Sinfonia (achevée en 1969)."]],"ecoute":[["Berio, Thema (Omaggio a Joyce) (1958)","Berio Thema Omaggio a Joyce"],["Berio, Visage (1961)","Berio Visage Cathy Berberian"],["Berio, Sinfonia, 3e mouvement (1968)","Berio Sinfonia third movement"]],"questions":["Quel lien entends-tu entre la voix parlée et la voix chantée ?","Pourquoi citer Mahler dans une œuvre contemporaine ?"],"statut":"brouillon"},"kaija-saariaho":{"origines":"Kaija Saariaho, née à Helsinki en 1952, morte à Paris en 2023, travaille à l'Ircam à partir de 1982 et s'installe à Paris.","contexte":"Sa musique s'attache au timbre, aux transitions entre son et bruit, et au mélange d'instruments et d'électronique. Son opéra L'Amour de loin, sur un livret d'Amin Maalouf, est créé au festival de Salzbourg en 2000.","reperes":[[1986,"Lichtbogen."],[1987,"Nymphéa (Jardin secret III), pour quatuor à cordes et électronique."],[1994,"Six Japanese Gardens, pour percussion et bande."],[2000,"Création de L'Amour de loin à Salzbourg."]],"ecoute":[["Saariaho, Lichtbogen (1986)","Saariaho Lichtbogen"],["Saariaho, Nymphéa (1987)","Saariaho Nymphéa Jardin secret III"],["Saariaho, L'Amour de loin (2000)","Saariaho L'Amour de loin"]],"questions":["Quand le son d'un archet devient-il bruit, quand redevient-il note ?","Comment l'électronique prolonge-t-elle les instruments ?"],"statut":"brouillon"},"helmut-lachenmann":{"origines":"Helmut Lachenmann, né à Stuttgart en 1935, étudie avec Luigi Nono à Venise de 1958 à 1960.","contexte":"Il invente une « musique concrète instrumentale » : les instruments acoustiques ne jouent pas des notes mais des bruits qu'ils produisent par friction, souffle, percussion de la caisse. Le geste devient l'objet de la musique. Pression (1969-1970), pour violoncelle, en est un exemple fondateur.","reperes":[[1969,"Pression, pour violoncelle seul (1969-1970)."],[1972,"Gran Torso, quatuor à cordes (1971-1972)."],[1996,"Das Mädchen mit den Schwefelhölzern, « musique avec images » (1990-1996)."]],"ecoute":[["Lachenmann, Pression (1970)","Lachenmann Pression"],["Lachenmann, Gran Torso (1972)","Lachenmann Gran Torso"],["Lachenmann, Salut für Caudwell (1977)","Lachenmann Salut für Caudwell"]],"questions":["Quel geste du musicien produit ce bruit ?","Qu'est-ce qui reste de l'instrument quand on n'entend plus de notes ?"],"statut":"brouillon"},"taylor-swift":{"origines":"Taylor Swift, née en 1989 à West Reading (Pennsylvanie), s'installe à Nashville à quatorze ans pour devenir auteure-compositrice. Son premier album paraît en 2006, dans la country.","contexte":"Elle quitte la country pour la pop avec 1989 (2014), puis explore le folk avec Folklore et Evermore (2020), écrits avec Aaron Dessner et Jack Antonoff. Après la vente de son ancien label en 2019, ses six premiers albums appartiennent à un autre propriétaire : elle les réenregistre (Taylor's Version, depuis 2021) pour en retrouver la maîtrise. Sa tournée Eras (2023-2024) compte parmi les plus lucratives de l'histoire.","formes":"Chansons narratives en couplets et refrains, avec un pont qui change de point de vue ; une écriture autobiographique et des récits de fiction.","reperes":[[2006,"Premier album, Taylor Swift."],[2008,"Fearless."],[2014,"1989, album de pop électronique."],[2020,"Folklore, album de folk, enregistré pendant le confinement."],[2021,"Premier réenregistrement : Fearless (Taylor's Version)."],[2023,"Début de l'Eras Tour."]],"ecoute":[["Taylor Swift, Love Story (2008)","Taylor Swift Love Story"],["Taylor Swift, Blank Space (2014)","Taylor Swift Blank Space"],["Taylor Swift, cardigan (2020)","Taylor Swift cardigan"]],"questions":["Quelle différence entends-tu entre la country de 2008 et la pop de 2014 : les instruments, le rythme, la voix ?","Pourquoi réenregistrer ses propres chansons ? Que dit cette histoire de la propriété d'une œuvre ?"],"statut":"brouillon"},"madonna":{"origines":"Madonna Louise Ciccone, née en 1958 à Bay City (Michigan), s'installe à New York en 1978 pour danser. Elle fréquente les clubs et publie son premier album, Madonna, en 1983.","contexte":"À l'époque de la chaîne MTV, elle fait du clip un art et de la mise en scène de soi un moyen d'expression. Elle puise dans la culture des clubs : disco, house, voguing, danse de la scène des bals noirs et latinos de New York. Certaines de ses œuvres, comme le clip de Like a Prayer (1989), provoquent la condamnation de responsables religieux.","production":"Collaborations avec des producteurs d'époques différentes : Nile Rodgers (Like a Virgin, 1984), Patrick Leonard (Like a Prayer, 1989), William Orbit (Ray of Light, 1998).","reperes":[[1982,"Premier single, Everybody."],[1984,"Like a Virgin."],[1989,"Like a Prayer."],[1990,"Vogue."],[1998,"Ray of Light, album de musique électronique avec William Orbit."]],"ecoute":[["Madonna, Holiday (1983)","Madonna Holiday"],["Madonna, Vogue (1990)","Madonna Vogue"],["Madonna, Ray of Light (1998)","Madonna Ray of Light"]],"questions":["Le clip prolonge-t-il la chanson ou est-ce une œuvre à part ?","D'où viennent les gestes du voguing, et qui les a inventés ?"],"statut":"brouillon"},"orelsan":{"origines":"Aurélien Cotentin, dit Orelsan, né en 1982 à Alençon, grandit à Caen. Il publie des morceaux sur Internet avant son premier album, Perdu d'avance (2009).","contexte":"Son rap raconte une jeunesse de province, loin de la mythologie des grandes villes, avec ironie et autodérision. Il forme avec Gringe le duo Casseurs Flowters (album en 2013) et tourne avec lui le film Comment c'est loin (2015). Plusieurs de ses textes, comme Sale pute (2009), ont provoqué des plaintes d'associations et un débat sur la liberté de création.","formes":"Chansons-récits à la première personne, souvent comiques ou mélancoliques, avec un flow clair et une écriture très dense en images du quotidien.","reperes":[[2009,"Perdu d'avance."],[2011,"Le chant des sirènes."],[2013,"Album du duo Casseurs Flowters."],[2015,"Film Comment c'est loin."],[2017,"La fête est finie."],[2021,"Civilisation."]],"ecoute":[["Orelsan, Suicide social (2011)","Orelsan Suicide social"],["Orelsan, Basique (2017)","Orelsan Basique"],["Orelsan, L'odeur de l'essence (2017)","Orelsan L'odeur de l'essence"]],"questions":["Comment l'ironie change-t-elle ce que dit le texte ?","Qu'est-ce qu'un rappeur de province raconte que ne raconte pas un rappeur de la capitale ?"],"statut":"brouillon"},"bad-bunny":{"origines":"Benito Antonio Martínez Ocasio, né en 1994 à Vega Baja (Porto Rico), publie ses premiers titres sur SoundCloud vers 2016, avant de signer avec un label.","contexte":"Il fait de la trap latine et du reggaeton un langage mondial en espagnol, sans passer à l'anglais. El Último Tour del Mundo (2020) est le premier album entièrement en espagnol à atteindre la première place du classement américain Billboard 200. Un Verano Sin Ti (2022), l'album le plus écouté de l'année sur Spotify, est le premier album en espagnol nommé pour l'album de l'année aux Grammy Awards. Debí tirar más fotos (2025) puise dans la plena et la musique jíbara de Porto Rico et parle de l'avenir de l'île.","rythme":"Dembow du reggaeton, puis mambo, bossa, plena et rythmes caribéens selon les titres.","reperes":[[2016,"Soy peor."],[2018,"X 100pre, premier album."],[2020,"YHLQMDLG ; El Último Tour del Mundo."],[2022,"Un Verano Sin Ti."],[2025,"Debí tirar más fotos."]],"ecoute":[["Bad Bunny, Soy peor (2016)","Bad Bunny Soy peor"],["Bad Bunny et Jhay Cortez, Dákiti (2020)","Bad Bunny Dákiti"],["Bad Bunny et Chencho Corleone, Me porto bonito (2022)","Bad Bunny Me porto bonito"]],"questions":["Pourquoi garder l'espagnol quand on s'adresse à un public mondial ?","Quels rythmes entends-tu venir du reggaeton, lesquels d'ailleurs ?"],"statut":"brouillon"},"yan-maresz":{"origines":"Yan Maresz, né à Monaco en 1966, se forme d'abord au jazz, à Berklee (Boston), puis à la composition à la Juilliard School (New York) et travaille ensuite à l'Ircam, à Paris.","contexte":"Sa musique emploie les moyens de l'électronique de l'Ircam et la virtuosité des instrumentistes, avec une écriture issue de la musique contemporaine et un rapport à l'énergie et au rythme que lui donne le jazz.","reperes":[[1995,"Metallics, pour trompette et électronique."]],"ecoute":[["Yan Maresz, Metallics (1995)","Yan Maresz Metallics"]],"questions":["Quels sons sont joués par l'instrument, lesquels par l'électronique ?","Qu'est-ce que le jazz apporte à l'écriture d'un compositeur contemporain ?"],"statut":"brouillon"},"nirvana":{"origines":"Nirvana naît à Aberdeen, petite ville de l'État de Washington, en 1987, autour du chanteur et guitariste Kurt Cobain et du bassiste Krist Novoselic. Le batteur Dave Grohl rejoint le groupe en 1990.","contexte":"Le groupe vient de la scène de Seattle et du label Sub Pop. Avec Nevermind (1991), le grunge, jusque-là une musique locale, devient une musique mondiale. Kurt Cobain, qui supporte mal cette célébrité, meurt en avril 1994 ; Dave Grohl fonde ensuite les Foo Fighters.","formes":"Beaucoup de chansons alternent des couplets calmes, à la voix presque murmurée, et des refrains très forts, guitares saturées et voix criée : le contraste entre le calme et le bruit. Cobain citait le groupe Pixies comme influence.","reperes":[[1989,"Bleach, premier album, chez Sub Pop."],[1991,"Nevermind, dont Smells Like Teen Spirit."],[1993,"In Utero, enregistré avec Steve Albini."],[1994,"MTV Unplugged in New York ; mort de Kurt Cobain."]],"ecoute":[["Nirvana, Smells Like Teen Spirit (1991)","Nirvana Smells Like Teen Spirit"],["Nirvana, Come as You Are (1991)","Nirvana Come as You Are"],["Nirvana, About a Girl, MTV Unplugged (1994)","Nirvana About a Girl Unplugged"]],"questions":["À quel moment la chanson passe-t-elle du calme au bruit ? Qu'est-ce qui change : la voix, la guitare, la batterie ?","Pourquoi une chanson aussi violente a-t-elle plu à des millions de personnes ?"],"statut":"brouillon"},"beyonce":{"origines":"Beyoncé Knowles, née en 1981 à Houston (Texas), chante très jeune dans le groupe Destiny's Child, dont le premier album paraît en 1998. Elle commence sa carrière solo en 2003 avec Dangerously in Love et le titre Crazy in Love.","contexte":"Elle fait de l'album un projet complet : textes, images, danse et références historiques. En décembre 2013, elle publie par surprise un album entièrement visuel, sans annonce préalable. Lemonade (2016) est accompagné d'un film. Cowboy Carter (2024) revient sur la place des artistes noirs dans la country.","production":"Elle écrit et produit avec de nombreux collaborateurs, et soigne la scène : la prestation Homecoming à Coachella (2018) reprend l'esprit des fanfares des universités noires américaines.","reperes":[[1997,"Premier single de Destiny's Child, No, No, No."],[2003,"Dangerously in Love."],[2013,"Album Beyoncé, publié par surprise, entièrement en images."],[2016,"Lemonade."],[2018,"Concert Homecoming à Coachella."],[2022,"Renaissance."],[2024,"Cowboy Carter."]],"ecoute":[["Beyoncé, Crazy in Love (2003)","Beyoncé Crazy in Love"],["Beyoncé, Formation (2016)","Beyoncé Formation"],["Beyoncé, Break My Soul (2022)","Beyoncé Break My Soul"]],"questions":["Pourquoi publier un album sans l'annoncer ? Qu'est-ce que cela change pour l'auditeur ?","Que gagne une chanson quand elle est pensée avec des images ?"],"statut":"brouillon"},"billie-eilish":{"origines":"Billie Eilish, née en 2001 à Los Angeles, écrit et enregistre avec son frère Finneas O'Connell dans une chambre de la maison familiale. Son premier titre, Ocean Eyes (2015), paraît quand elle a treize ans.","contexte":"Son premier album, When We All Fall Asleep, Where Do We Go? (2019), contient bad guy ; en 2020, elle remporte les quatre grands Grammy Awards (album, enregistrement, chanson de l'année et meilleur nouvel artiste). Elle est la première depuis 1981 à réussir ce quadruplé.","timbres":"Voix murmurée et très proche du micro (ASMR, chuchotements), basses profondes, rythmes minimaux ; un son né de la production de chambre (bedroom pop), qui n'a pas besoin d'un grand studio.","reperes":[[2015,"Ocean Eyes."],[2019,"When We All Fall Asleep, Where Do We Go?"],[2021,"Happier Than Ever."],[2022,"Oscar de la meilleure chanson pour No Time to Die ; Oscar à nouveau en 2024 pour What Was I Made For?"],[2024,"Hit Me Hard and Soft."]],"ecoute":[["Billie Eilish, bad guy (2019)","Billie Eilish bad guy"],["Billie Eilish, when the party's over (2018)","Billie Eilish when the party's over"],["Billie Eilish, What Was I Made For? (2023)","Billie Eilish What Was I Made For"]],"questions":["Entends-tu la voix très près de ton oreille ? Comment cela change-t-il l'intimité de la chanson ?","Peut-on faire un grand disque sans grand studio ? Qu'en dit cet exemple ?"],"statut":"brouillon"},"aya-nakamura":{"origines":"Aya Nakamura, née en 1995 à Bamako (Mali), grandit à Aulnay-sous-Bois, en Seine-Saint-Denis. Elle publie ses premiers titres en 2016-2017.","contexte":"Djadja (2018) devient numéro un en France et fait d'elle l'artiste francophone la plus écoutée au monde. Son français mêle argot, mots d'origine africaine et tournures de ses quartiers, avec des refrains très simples. En 2024, l'annonce de sa participation à la cérémonie d'ouverture des Jeux olympiques de Paris, qu'elle chante avec la Garde républicaine, suscite des attaques racistes et un large soutien.","rythme":"Rythmes d'afrobeats et de R&B, tempo modéré, basse mélodique.","reperes":[[2017,"Journal intime, premier EP."],[2018,"Djadja ; album Nakamura."],[2021,"Album AYA."],[2022,"Pookie."],[2024,"Cérémonie d'ouverture des Jeux olympiques de Paris."]],"ecoute":[["Aya Nakamura, Djadja (2018)","Aya Nakamura Djadja"],["Aya Nakamura, Copines (2018)","Aya Nakamura Copines"],["Aya Nakamura, Pookie (2022)","Aya Nakamura Pookie"]],"questions":["Quels mots de la chanson reconnais-tu comme de l'argot ? Que dit le choix des mots sur celle qui chante ?","Pourquoi une chanson en français peut-elle être écoutée dans le monde entier ?"],"statut":"brouillon"},"jul":{"origines":"Jul, rappeur marseillais né en 1990, publie son premier album, Dans ma paranoïa, en 2014, puis Je trouve pas le sommeil en 2015.","contexte":"Il se distingue par une production très abondante (plusieurs albums certaines années), qu'il réalise lui-même, et par un chant mélodique sur des voix traitées à l'auto-tune. Son succès se fait en dehors des médias traditionnels, par Internet, les plateformes et le bouche-à-oreille.","production":"Autoproduction : il compose la musique, écrit et enregistre rapidement, sans passer par les grandes maisons de disques.","reperes":[[2014,"Dans ma paranoïa."],[2015,"Je trouve pas le sommeil."]],"ecoute":[["Jul, Je trouve pas le sommeil (2015)","Jul Je trouve pas le sommeil"]],"questions":["Pourquoi publier beaucoup de disques peut-il être un choix artistique ?","Qu'est-ce que l'auto-tune ajoute ou retire à une voix ?"],"statut":"brouillon"},"rap-marseillais":{"origines":"Marseille a l'une des plus anciennes scènes de rap de France, nourrie de la diversité de la ville portuaire : communautés comoriennes, algériennes, italiennes et arméniennes, entre autres.","contexte":"IAM, avec L'école du micro d'argent (1997), et la Fonky Family (Si Dieu veut..., 1998) installent le rap marseillais dans les années 1990, avec un rap d'écriture et de récit. Soprano, venu du groupe Psy 4 de la Rime, connaît le grand succès dans les années 2000 et 2010. Depuis les années 2010, Jul, SCH et Naps portent une nouvelle génération.","reperes":[[1997,"IAM, L'école du micro d'argent."],[1998,"Fonky Family, Si Dieu veut..."],[2007,"Soprano, Puisqu'il faut vivre."],[2014,"Jul, Dans ma paranoïa ; Soprano, Cosmopolitanie."],[2015,"SCH, A7."]],"ecoute":[["IAM, Demain c'est loin (1997)","IAM Demain c'est loin"],["Soprano, Cosmopolitanie (2014)","Soprano Cosmopolitanie"]],"questions":["Quelle différence entends-tu entre le rap de 1997 et celui d'aujourd'hui : la voix, le rythme, la production ?","Qu'est-ce qu'une ville apporte à sa musique ?"],"statut":"brouillon"},"drill-francais":{"origines":"La drill naît à Chicago au début des années 2010, passe à Londres (UK drill) puis à New York et en France à partir de la fin des années 2010.","contexte":"En France, elle est portée par de jeunes rappeurs, comme Gazo, et par des collectifs. Ses textes, souvent très violents, suscitent des débats sur la responsabilité des artistes, la liberté de création et la manière dont la musique raconte la réalité des quartiers.","rythme":"Tempo lent, grosse caisse en motifs syncopés et glissants, roulements de charleston.","timbres":"Basses profondes, voix grave et posée, ambiances sombres.","reperes":[[2012,"Chief Keef, I Don't Like, à Chicago."],[2018,"Premiers titres de drill en France, selon la presse spécialisée."]],"ecoute":[],"questions":["Un texte violent est-il un témoignage, une fiction, une provocation ? Comment le sait-on ?","Qu'est-ce que le rythme lent et la voix grave donnent comme ambiance ?"],"statut":"brouillon"},"tiktok-musique":{"origines":"TikTok est le nom international de Douyin, application de vidéos courtes lancée en Chine en 2016. Elle fusionne en 2018 avec Musical.ly, qui permettait de faire de la danse en playback sur des extraits de chansons.","contexte":"Un titre devient populaire quand les utilisateurs le reprennent dans leurs propres vidéos : danses, défis, montages. Ce n'est plus seulement la radio qui choisit. Des titres anciens retrouvent le succès, comme Dreams de Fleetwood Mac (1977) en 2020 après une vidéo largement vue, ou Running Up That Hill de Kate Bush (1985) en 2022 grâce à la série Stranger Things. On observe que de nombreux titres sont écrits ou découpés pour que l'extrait accrocheur arrive vite.","formes":"Le morceau devient un extrait de quelques secondes : refrain, riff ou mot-clé répété. La version complète passe au second plan.","reperes":[[2016,"Lancement de Douyin en Chine."],[2018,"Fusion de Musical.ly avec TikTok."],[2019,"Old Town Road (Lil Nas X), devenu viral sur TikTok puis premier du classement américain."],[2020,"Say So (Doja Cat) ; Dreams (Fleetwood Mac) retrouve le succès."],[2022,"Running Up That Hill (Kate Bush) retrouve le succès."]],"ecoute":[["Lil Nas X, Old Town Road (2019)","Lil Nas X Old Town Road"],["Doja Cat, Say So (2019)","Doja Cat Say So"],["Fleetwood Mac, Dreams (1977)","Fleetwood Mac Dreams"]],"questions":["Un titre devient-il célèbre parce qu'il est bon, ou parce qu'il est repris ? Qu'en penses-tu ?","Qu'est-ce qui change dans une chanson quand on ne garde que quinze secondes ?"],"statut":"brouillon"},"sped-up":{"origines":"À Houston, dans les années 1990, DJ Screw ralentit des disques de rap et les mélange, dans le style dit chopped and screwed. En 2001, deux Norvégiens créent le nightcore, qui accélère des titres de pop et de dance.","contexte":"Sur TikTok et YouTube, des versions accélérées (sped up) ou ralenties avec beaucoup de réverbération (slowed and reverb) de titres connus circulent à côté des originaux, parfois plus écoutées que ceux-ci.","melodie":"Accélérer un enregistrement de 25 % monte sa hauteur d'environ quatre demi-tons : la voix devient plus aiguë en même temps que le tempo augmente. Ralentir fait l'inverse. C'est le même effet que la commande Vitesse de SONORA Pistes, par opposition à la transposition sans changer la durée.","reperes":[[1990,"DJ Screw, à Houston, popularise le ralenti."],[2001,"Naissance du nightcore, en Norvège."]],"ecoute":[],"questions":["Pourquoi la voix change-t-elle de timbre quand on accélère le morceau ?","Une version accélérée est-elle une nouvelle œuvre, une copie, un remix ?"],"statut":"brouillon"},"phonk":{"origines":"Le phonk reprend le son du rap de Memphis des années 1990 (Three 6 Mafia, par exemple) : voix samplées, cloches, basses saturées, ambiance sombre. Des producteurs d'Internet le relancent vers 2010.","contexte":"Dans les années 2020, des versions très rapides, souvent accompagnées de vidéos de voitures qui dérapent (drift), se répandent sur TikTok et YouTube, avec des producteurs comme le Français Kordhell (Murder in My Mind, 2022). Le phonk dit brésilien s'appuie aussi sur le funk carioca et ses rythmes.","rythme":"Tempo rapide dans les versions récentes ; cloche (cowbell) répétée en motif, grosse caisse puissante.","reperes":[[1997,"Three 6 Mafia, Tear da Club Up '97."],[2022,"Kordhell, Murder in My Mind."]],"ecoute":[["Three 6 Mafia, Tear da Club Up '97 (1997)","Three 6 Mafia Tear da Club Up 97"],["Kordhell, Murder in My Mind (2022)","Kordhell Murder in My Mind"]],"questions":["Quel son reconnais-tu comme une cloche ? À quoi ressemble son motif ?","Comment un style des années 1990 peut-il devenir celui d'une vidéo des années 2020 ?"],"statut":"brouillon"},"lofi-hiphop":{"origines":"Le lo-fi hip-hop est un hip-hop instrumental doux, aux sons volontairement un peu abîmés (craquements de disque, légère saturation), hérité de producteurs comme le Japonais Nujabes et l'Américain J Dilla.","contexte":"Vers 2015, des chaînes YouTube diffusent en continu des playlists de lo-fi, avec une image animée (un personnage qui étudie, par exemple), pour travailler, réviser ou se détendre. La musique est écoutée en fond plutôt qu'avec attention.","rythme":"Tempo lent, autour de 70 à 90 battements par minute, rythmes de boîte à rythmes légèrement décalés.","timbres":"Piano ou guitare jazzy, samples de disques, craquements, légère saturation, filtre passe-bas qui assombrit le son.","reperes":[[2005,"Nujabes, Modal Soul."],[2006,"J Dilla, Donuts."],[2015,"Premières chaînes YouTube de lo-fi en continu."]],"ecoute":[["Nujabes, Aruarian Dance (2004)","Nujabes Aruarian Dance"],["J Dilla, Don't Cry (2006)","J Dilla Don't Cry"]],"questions":["Quel défaut de son entends-tu volontairement ? Pourquoi le garder ?","Écoute-t-on cette musique en la regardant ou en travaillant ? Qu'est-ce que cela change ?"],"statut":"brouillon"},"grime":{"origines":"Le grime naît à Londres, dans les quartiers de l'est (Bow, Tower Hamlets), au début des années 2000. Il vient du garage britannique, de la jungle et du dancehall.","contexte":"Il se diffuse par les radios pirates et les clubs avant de gagner la télévision. Dizzee Rascal remporte le Mercury Prize en 2003 avec Boy in da Corner ; Skepta le remporte en 2016 avec Konnichiwa ; Stormzy publie en 2017 le premier album de grime numéro un des ventes britanniques.","rythme":"Environ 140 battements par minute, rythme cassé et sec, basses synthétiques.","reperes":[[2002,"Wiley, Eskimo, instrumental fondateur."],[2003,"Dizzee Rascal, Boy in da Corner."],[2016,"Skepta, Konnichiwa."],[2017,"Stormzy, Gang Signs and Prayer."]],"ecoute":[["Dizzee Rascal, I Luv U (2003)","Dizzee Rascal I Luv U"],["Skepta, That's Not Me (2014)","Skepta That's Not Me"],["Stormzy, Shut Up (2015)","Stormzy Shut Up"]],"questions":["Quelle est la vitesse du flow par rapport à celle du rap américain que tu connais ?","Quel rôle ont joué les radios pirates ?"],"statut":"brouillon"},"kendrick-lamar":{"origines":"Kendrick Lamar, né en 1987 à Compton, près de Los Angeles, publie son premier album majeur, good kid, m.A.A.d city, en 2012.","contexte":"To Pimp a Butterfly (2015) mêle jazz, funk et poésie ; Alright en devient un chant des manifestations contre les violences policières aux États-Unis. DAMN. (2017) reçoit en 2018 le prix Pulitzer de la musique. En 2024, sa chanson Not Like Us, au centre d'un conflit avec Drake, rencontre un énorme succès ; il se produit à la mi-temps du Super Bowl en février 2025.","formes":"Albums-récits, voix qui changent de personnage, textes denses, collaborations avec des musiciens de jazz comme Kamasi Washington.","reperes":[[2012,"good kid, m.A.A.d city."],[2015,"To Pimp a Butterfly."],[2017,"DAMN."],[2018,"Prix Pulitzer de la musique pour DAMN."],[2024,"Not Like Us."],[2025,"Mi-temps du Super Bowl."]],"ecoute":[["Kendrick Lamar, Alright (2015)","Kendrick Lamar Alright"],["Kendrick Lamar, HUMBLE. (2017)","Kendrick Lamar HUMBLE"],["Kendrick Lamar, Not Like Us (2024)","Kendrick Lamar Not Like Us"]],"questions":["Quels instruments de jazz ou de funk repères-tu ?","Comment une chanson devient-elle un chant de protestation ?"],"statut":"brouillon"},"travis-scott":{"origines":"Travis Scott, né en 1991 à Houston, publie Rodeo en 2015 puis Astroworld en 2018, du nom d'un parc d'attractions de Houston fermé en 2005.","contexte":"Son son est fondé sur l'auto-tune, les effets de studio et des productions très travaillées. En avril 2020, son concert dans le jeu vidéo Fortnite, vu par des millions de joueurs, ouvre une nouvelle manière d'organiser un concert : en ligne, avec des effets impossibles en vrai.","reperes":[[2015,"Rodeo."],[2018,"Astroworld, dont Sicko Mode."],[2020,"Concert Astronomical dans Fortnite."]],"ecoute":[["Travis Scott, Sicko Mode (2018)","Travis Scott Sicko Mode"],["Travis Scott, Goosebumps (2016)","Travis Scott Goosebumps"]],"questions":["Qu'est-ce qu'un concert dans un jeu vidéo peut faire que la scène ne peut pas faire ?","Où entends-tu l'auto-tune, et que fait-il à la voix ?"],"statut":"brouillon"},"the-weeknd":{"origines":"The Weeknd, nom de scène d'Abel Tesfaye, né en 1990 à Toronto de parents éthiopiens, publie en 2011 trois mixtapes en ligne, dont House of Balloons.","contexte":"Il passe du R&B sombre à une pop de synthétiseurs inspirée des années 1980 : Blinding Lights (2019), de l'album After Hours (2020), est l'un des titres les plus écoutés des plateformes. Il se produit à la mi-temps du Super Bowl en février 2021.","timbres":"Synthétiseurs analogiques, boîtes à rythmes, voix aiguë en falsetto, réverbération.","reperes":[[2011,"House of Balloons."],[2016,"Starboy."],[2020,"After Hours, dont Blinding Lights."],[2021,"Mi-temps du Super Bowl."]],"ecoute":[["The Weeknd, Blinding Lights (2019)","The Weeknd Blinding Lights"],["The Weeknd, Starboy (2016)","The Weeknd Starboy"],["The Weeknd, The Hills (2015)","The Weeknd The Hills"]],"questions":["Quels sons te rappellent les années 1980 ?","Pourquoi une musique d'il y a quarante ans revient-elle aujourd'hui ?"],"statut":"brouillon"},"dua-lipa":{"origines":"Dua Lipa, née à Londres en 1995 de parents originaires du Kosovo, publie son premier album en 2017.","contexte":"Future Nostalgia (2020) fait revenir la disco et le funk des années 1970 et 1980 dans la pop d'aujourd'hui, avec des basses chaudes et des rythmes à quatre temps. Levitating en est l'un des grands succès.","rythme":"Grosse caisse sur chaque temps, tempo vers 110 à 125 battements par minute, comme la disco et la house.","reperes":[[2017,"Premier album, Dua Lipa."],[2020,"Future Nostalgia."],[2024,"Radical Optimism."]],"ecoute":[["Dua Lipa, Don't Start Now (2019)","Dua Lipa Don't Start Now"],["Dua Lipa, Levitating (2020)","Dua Lipa Levitating"],["Dua Lipa, Houdini (2023)","Dua Lipa Houdini"]],"questions":["Quel instrument mène la chanson : la basse, la batterie, les cordes ?","Qu'est-ce qui, dans cette chanson, vient du disco ?"],"statut":"brouillon"},"ariana-grande":{"origines":"Ariana Grande, née en 1993 en Floride, est d'abord connue comme actrice dans des séries pour adolescents. Elle publie son premier album, Yours Truly, en 2013.","contexte":"Après l'attentat de Manchester, à la fin d'un de ses concerts, en mai 2017, elle organise un concert de soutien aux victimes. thank u, next (2019) fait de ses ruptures et de sa vie privée la matière de ses chansons. Elle joue Glinda dans le film Wicked (2024).","melodie":"Une voix très étendue, avec des notes très aiguës en voix de tête, et des ornements du R&B.","reperes":[[2013,"Yours Truly."],[2017,"Concert One Love Manchester."],[2019,"thank u, next."],[2024,"Film Wicked ; album Eternal Sunshine."]],"ecoute":[["Ariana Grande, thank u, next (2018)","Ariana Grande thank u next"],["Ariana Grande, 7 rings (2019)","Ariana Grande 7 rings"],["Ariana Grande, Bang Bang (2014)","Ariana Grande Bang Bang"]],"questions":["Jusqu'où monte la voix ? Qu'est-ce que cela demande ?","Une chanson sur sa vie privée parle-t-elle à tout le monde ? Pourquoi ?"],"statut":"brouillon"},"olivia-rodrigo":{"origines":"Olivia Rodrigo, née en 2003 en Californie, est d'abord actrice dans une série télévisée pour adolescents. Elle publie en janvier 2021 son premier single, drivers license.","contexte":"Le titre, une ballade au piano sur une rupture, devient numéro un dans de nombreux pays. Sour (2021) mêle ballades et rock inspiré du pop punk et des groupes des années 1990 (Paramore, Hole, Green Day) : good 4 u en est l'exemple.","reperes":[[2021,"drivers license ; album Sour."],[2023,"Guts."]],"ecoute":[["Olivia Rodrigo, drivers license (2021)","Olivia Rodrigo drivers license"],["Olivia Rodrigo, good 4 u (2021)","Olivia Rodrigo good 4 u"],["Olivia Rodrigo, vampire (2023)","Olivia Rodrigo vampire"]],"questions":["Quelle partie est au piano, laquelle est rock ?","Que reconnais-tu du pop punk des années 2000 ?"],"statut":"brouillon"},"vocaloid":{"origines":"Vocaloid est un logiciel de synthèse de voix chantée, développé à partir de 2003 avec Yamaha. Hatsune Miku, une voix et un personnage lancés en 2007 par Crypton Future Media, en devient le visage.","contexte":"Des milliers d'amateurs écrivent des chansons pour Miku et les publient en ligne : certains deviennent des artistes à part entière, comme ryo (groupe supercell) ou Kenshi Yonezu, qui a commencé par des titres Vocaloid. Des concerts avec un hologramme de Miku remplissent des salles.","timbres":"Voix synthétique aiguë, très précise, qui peut chanter des passages impossibles pour un humain.","reperes":[[2003,"Premiers travaux Vocaloid avec Yamaha."],[2007,"Hatsune Miku."],[2008,"World Is Mine (ryo)."]],"ecoute":[["ryo (supercell), World Is Mine (2008)","supercell World Is Mine Hatsune Miku"],["Hatsune Miku, Senbonzakura (2011)","Hatsune Miku Senbonzakura"]],"questions":["Qui est l'auteur d'une chanson chantée par une voix de synthèse ?","Qu'entends-tu qu'une voix humaine ne ferait pas ?"],"statut":"brouillon"},"jeu-video-musique":{"origines":"La musique de jeu vidéo naît avec les premières consoles. Les puces sonores ne peuvent produire que quelques sons à la fois, ce qui oblige à écrire des mélodies très claires, comme celles de Koji Kondo pour Super Mario Bros. (1985).","contexte":"La musique est écrite pour être jouée en boucle, sans lasser, et pour s'adapter à ce que fait le joueur. Elle évolue vers l'orchestre, puis vers des paysages sonores calmes comme ceux de Minecraft par C418 (2011). Des jeux comme Fortnite accueillent des concerts : Travis Scott en 2020.","formes":"La boucle : une phrase qui revient sans fin ; la musique adaptative, qui change selon l'action.","reperes":[[1985,"Super Mario Bros., musique de Koji Kondo."],[2011,"Minecraft, Volume Alpha, par C418."],[2015,"Undertale, par Toby Fox."],[2020,"Concert de Travis Scott dans Fortnite."]],"ecoute":[["Koji Kondo, Super Mario Bros. Theme (1985)","Koji Kondo Super Mario Bros Theme"],["C418, Sweden (2011)","C418 Sweden Minecraft"],["Toby Fox, Megalovania (2015)","Toby Fox Megalovania"]],"questions":["Peux-tu chanter la mélodie de Mario ? Pourquoi est-elle si facile à retenir ?","Quelle différence entre une musique de film et une musique de jeu ?"],"statut":"brouillon"},"newjeans":{"origines":"NewJeans, cinq jeunes chanteuses, débute en 2022 sous la direction de la maison ADOR, filiale du groupe HYBE.","contexte":"Le groupe se distingue des codes habituels de la K-pop (chorégraphies spectaculaires, production très chargée) par une pop sobre, qui s'inspire du R&B, du club et de la house des années 1990 et 2000, et par une image qui évoque l'esthétique des années 2000. Attention, Hype Boy et Ditto (2022) sont ses titres de référence.","reperes":[[2022,"Début ; Attention, Hype Boy, Ditto."]],"ecoute":[["NewJeans, Attention (2022)","NewJeans Attention"],["NewJeans, Hype Boy (2022)","NewJeans Hype Boy"],["NewJeans, Ditto (2022)","NewJeans Ditto"]],"questions":["Qu'est-ce qui rend ce son moins « chargé » que d'autres K-pop ?","Quels éléments viennent des années 1990 ?"],"statut":"brouillon"},"burna-boy":{"origines":"Burna Boy, de son vrai nom Damini Ogulu, né en 1991 à Port Harcourt (Nigeria), grandit dans une famille liée à la musique : son grand-père a été le premier manager de Fela Kuti.","contexte":"Il mêle afrobeats, dancehall, hip-hop et référence à l'afrobeat de Fela, et se présente comme son héritier (son album Twice as Tall, 2020, reçoit le Grammy du meilleur album de musique du monde). Il remplit les stades de Londres et de Paris.","reperes":[[2019,"African Giant."],[2020,"Twice as Tall."],[2022,"Love, Damini ; Last Last."]],"ecoute":[["Burna Boy, Ye (2018)","Burna Boy Ye"],["Burna Boy, Anybody (2019)","Burna Boy Anybody"],["Burna Boy, Last Last (2022)","Burna Boy Last Last"]],"questions":["Quels rythmes entends-tu venir de la musique de Fela, lesquels du rap ?","Qu'est-ce qu'un héritage musical, et comment le transmet-on ?"],"statut":"brouillon"},"karol-g":{"origines":"Karol G, née en 1991 à Medellín (Colombie), débute dans le reggaeton urbain avant de s'imposer dans le monde entier à partir de 2017-2019.","contexte":"Dans un genre longtemps dominé par les hommes, elle devient l'une de ses premières   cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId, pos(e)); dep = 0; if (ptr.size === 2) { const [a, b] = [...ptr.values()]; pince = Math.hypot(a[0] - b[0], a[1] - b[1]); } dernier = pos(e); });
  cv.addEventListener("pointermove", e => { const [x, y] = pos(e);
    if (ptr.has(e.pointerId)) { ptr.set(e.pointerId, [x, y]);
      if (ptr.size === 2) { const [a, b] = [...ptr.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pince > 0) zoomer(d / pince, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); pince = d; dep = 99; }
      else if (dernier) { const dx = x - dernier[0], dy = y - dernier[1]; dep += Math.abs(dx) + Math.abs(dy); if (dep > 4) { VUE.tx += dx; VUE.ty += dy; dessinerFrise(); cv.style.cursor = "grabbing"; } dernier = [x, y]; } }
    else { const p = trouve(x, y), id = p ? p.id : null; if (id !== VUE.survol) { VUE.survol = id; cv.style.cursor = id ? "pointer" : "grab"; dessinerFrise(); } } });
  const fin = e => { const [x, y] = pos(e); const etait = ptr.has(e.pointerId); ptr.delete(e.pointerId); if (ptr.size < 2) pince = 0; cv.style.cursor = "grab";
    if (etait && ptr.size === 0 && dep <= 4) { const p = trouve(x, y); if (p) { FRISE.sel = p.id; dessinerFrise(); detailFrise(); } else if (FRISE.sel) { FRISE.sel = null; dessinerFrise(); detailFrise(); } } dernier = ptr.size ? [...ptr.values()][0] : null; };
  cv.addEventListener("pointerup", fin); cv.addEventListener("pointercancel", e => { ptr.delete(e.pointerId); pince = 0; });
  cv.addEventListener("wheel", e => { e.preventDefault(); const [x, y] = pos(e); zoomer(Math.exp(-e.deltaY * (e.ctrlKey ? 0.012 : 0.0018)), x, y); }, { passive: false });
  cv.addEventListener("dblclick", e => { const [x, y] = pos(e); zoomer(2, x, y); });
  cv.addEventListener("keydown", e => { const p = 60; if (e.key === "+" || e.key === "=") zoomer(1.4); else if (e.key === "-") zoomer(1 / 1.4); else if (e.key === "ArrowLeft") { VUE.tx += p; dessinerFrise(); } else if (e.key === "ArrowRight") { VUE.tx -= p; dessinerFrise(); } else if (e.key === "ArrowUp") { VUE.ty += p; dessinerFrise(); } else if (e.key === "ArrowDown") { VUE.ty -= p; dessinerFrise(); } else if (e.key === "0") { toutVoir(); dessinerFrise(); } else return; e.preventDefault(); });
  cw.querySelector(".frise-ctrl").addEventListener("click", e => { const z = e.target.closest("[data-z]"); if (!z) return; const m = z.dataset.z; if (m === "in") zoomer(1.5); else if (m === "out") zoomer(1 / 1.5); else if (m === "all") { toutVoir(true); dessinerFrise(); } else if (m === "now") { toutVoir(false); dessinerFrise(); } else if (m === "sel" && FRISE.sel) { centrerSur(FRISE.sel, 1.2); dessinerFrise(); } });
  if (!window.__friseResize) { window.__friseResize = true; window.addEventListener("resize", () => { if ($("#cw canvas")) { VUE.w = 0; dessinerFrise(); } }); }
}
function detailFrise() {
  const e = FRISE.sel && E[FRISE.sel]; if (!e) { $("#detail").innerHTML = `<p class="petit">Choisis une étiquette pour voir son histoire.</p>`; return; }
  $("#detail").innerHTML = `<div class="fiche-tete" style="--c:${coul(e)}"><h3 style="font:400 1.5rem var(--f-aff)">${esc(e.name)}</h3><div class="meta"><span>${esc(periode(e))}</span><span>${esc(e.region)}</span></div><p>${esc(e.description)}</p><div class="pastilles"><a class="pastille clair" href="#e/${e.id}">Comprendre cette musique &#8250;</a></div></div>`;
}
function brancherFrise() {
  $("#filtres").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { const f = b.dataset.f; if (FRISE.fam.has(f)) { if (FRISE.fam.size > 1) FRISE.fam.delete(f); } else FRISE.fam.add(f); b.setAttribute("aria-pressed", FRISE.fam.has(f)); dessinerFrise(); });
  $("#groupes").querySelectorAll("[data-g]").forEach(b => b.onclick = () => { const g = b.dataset.g; if (FRISE.groupes.has(g)) { if (FRISE.groupes.size > 1) FRISE.groupes.delete(g); } else FRISE.groupes.add(g); b.setAttribute("aria-pressed", FRISE.groupes.has(g)); dessinerFrise(); });
  $("#tout").onclick = () => { FRISE.tout = !FRISE.tout; $("#tout").setAttribute("aria-pressed", FRISE.tout); dessinerFrise(); };
  $("#de").onchange = () => { FRISE.de = Math.max(1890, Math.min(+$("#de").value || 1890, FRISE.a)); $("#de").value = FRISE.de; dessinerFrise(); };
  $("#a").onchange = () => { FRISE.a = Math.min(2030, Math.max(+$("#a").value || 2030, FRISE.de)); $("#a").value = FRISE.a; dessinerFrise(); };

/* ---------- Carte mondiale ---------- */
const MONDE = { fam: new Set(D.families.map(f => f.id)), sel: null, terres: null };
function vueMonde(sel) { if (sel && E[sel]) { MONDE.sel = sel; MONDE.fam.add(E[sel].family); }
  return `<span class="etiq">Carte mondiale</span><h1>Où les musiques sont nées</h1><p class="lead">Chaque point est une musique placée là où elle est née ou s'est développée. ${D.entries.filter(e => e.geo).length} entrées ont un lieu ; les autres, comme les genres internationaux, n'en ont pas.</p>
  <div class="pastilles" id="mfiltres">${D.families.map(f => `<button type="button" class="pastille" data-f="${f.id}" style="--c:${COUL[f.id]}" aria-pressed="${MONDE.fam.has(f.id)}">${esc(f.name.split(",")[0])}</button>`).join("")}</div>
  <div class="monde-wrap"><svg id="msvg" viewBox="0 0 ${D.carte.w} ${D.carte.h}" role="group" aria-label="Carte du monde des musiques"><rect width="${D.carte.w}" height="${D.carte.h}" fill="#dfe9f0"/><path id="terres" class="terre" d=""/><g id="mpts"></g></svg></div>
  <div id="detail" style="margin-top:14px"></div><h2>La liste</h2><div class="pastilles" id="mliste"></div>`;
}
function dessinerMonde() {
  const L = D.entries.filter(e => e.geo && MONDE.fam.has(e.family));
  const dec = {}; // petit décalage quand plusieurs points tombent au même endroit
  $("#mpts").innerHTML = L.map(e => { const k = e.geo.join(","); const n = dec[k] = (dec[k] || 0) + 1; const a = n * 2.4, dx = n > 1 ? Math.cos(a) * 5 * Math.ceil(n / 6) : 0, dy = n > 1 ? Math.sin(a) * 5 * Math.ceil(n / 6) : 0;
    return `<g class="pt-monde${e.id === MONDE.sel ? " sel" : ""}" tabindex="0" role="button" aria-label="${esc(e.name)}, ${esc(e.region)}" data-id="${e.id}"><circle cx="${e.geo[0] + dx}" cy="${e.geo[1] + dy}" r="${e.id === MONDE.sel ? 8 : 5}" fill="${COUL[e.family]}"/></g>`; }).join("");
  $("#mliste").innerHTML = L.map(e => `<a class="pastille clair" href="#e/${e.id}">${esc(e.name)}</a>`).join("");
  document.querySelectorAll(".pt-monde").forEach(n => { const go = () => { MONDE.sel = n.dataset.id; dessinerMonde(); detailMonde(); }; n.onclick = go; n.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } }; });
}
function detailMonde() { const e = MONDE.sel && E[MONDE.sel]; $("#detail").innerHTML = e ? `<div class="fiche-tete" style="--c:${coul(e)}"><h3 style="font:400 1.5rem var(--f-aff)">${esc(e.name)}</h3><div class="meta"><span>${esc(e.region)}</span><span>${esc(periode(e))}</span></div><p>${esc(e.description)}</p><div class="pastilles"><a class="pastille clair" href="#e/${e.id}">Comprendre cette musique &#8250;</a></div></div>` : `<p class="petit">Choisis un point pour voir la musique.</p>`; }
function brancherMonde() {
  const fond = d => { MONDE.terres = d.terres; $("#terres").setAttribute("d", d.terres); };
  if (MONDE.terres) fond({ terres: MONDE.terres }); else fetch("../monde/carte.json").then(r => r.json()).then(d => { if ($("#terres")) fond(d); }).catch(() => {});
  $("#mfiltres").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { const f = b.dataset.f; if (MONDE.fam.has(f)) { if (MONDE.fam.size > 1) MONDE.fam.delete(f); } else MONDE.fam.add(f); b.setAttribute("aria-pressed", MONDE.fam.has(f)); dessinerMonde(); });
  dessinerMonde(); detailMonde();
