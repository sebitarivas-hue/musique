rialism","texte":"Après 1945, la série sert à toute une génération (cours d'été de Darmstadt) à reconstruire la musique sur des bases neuves.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"integral-serialism","target":"serialism","texte":"Boulez et Stockhausen étendent la série, inventée par Schoenberg pour les hauteurs, aux durées, aux intensités et aux modes d'attaque.","statut":"etabli","nature":"technique"},{"type":"INFLUENCED_BY","source":"electronic-composition","target":"integral-serialism","texte":"Au studio de Cologne, Stockhausen applique la logique des paramètres au son fabriqué : chaque paramètre peut être calculé puis réalisé (Studie II, 1954).","statut":"etabli","nature":"technique"},{"type":"EMERGED_FROM","source":"spectral","target":"integral-serialism","texte":"Grisey et Murail reprochent en partie à la série de traiter le son comme une suite de chiffres ; ils partent de ce que le son est physiquement, son spectre, et de la durée que l'oreille perçoit.","statut":"interpretation","nature":"reaction"},{"type":"INFLUENCED_BY","source":"sampling","target":"music-concrete","texte":"Enregistrer, découper, boucler, transformer : le geste de Schaeffer (1948) se retrouve dans l'échantillonnage du hip-hop et de la house.","statut":"interpretation","nature":"technique"},{"type":"CROSSES_WITH","source":"industrial","target":"music-concrete","texte":"Bandes trafiquées et bruits de machines : la musique industrielle (années 1970) reprend le bruit comme matière, sans le cadre de la musique savante.","statut":"interpretation","nature":"echo"},{"type":"INFLUENCED_BY","source":"granular-synthesis","target":"electroacoustic","texte":"L'idée de découper le son en très petits grains vient de la physique du son et de Xenakis ; Curtis Roads la rend utilisable par ordinateur.","statut":"interpretation","nature":"technique"},{"type":"INFLUENCED_BY","source":"spectral","target":"computer-music","texte":"Les compositeurs spectraux analysent le son avec l'ordinateur (Grisey, Partiels, 1975, part de l'analyse d'un son de trombone).","statut":"etabli","nature":"technique"},{"type":"INFLUENCED_BY","source":"glitch","target":"computer-music","texte":"Le glitch fait de l'erreur numérique, un disque qui saute, un son haché, une matière musicale.","statut":"interpretation","nature":"technique"},{"type":"INFLUENCED_BY","source":"ambient","target":"aleatoric","texte":"Brian Eno travaille avec des processus et du hasard, hérités de Cage et du minimalisme, pour faire une musique qu'on peut écouter de près ou comme un décor.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"algorithmic","target":"aleatoric","texte":"Le hasard contrôlé de Cage et les probabilités de Xenakis ouvrent la voie à la musique faite par règles et par calcul.","statut":"interpretation","nature":"technique"},{"type":"CROSSES_WITH","source":"idm","target":"algorithmic","texte":"Des musiciens comme Autechre programment des processus qui génèrent les rythmes : la machine propose, le musicien choisit.","statut":"interpretation","nature":"echo"},{"type":"INFLUENCED_BY","source":"microtonal","target":"spectral","texte":"Les harmoniques d'un son ne tombent pas sur les notes du piano : les spectraux notent donc des quarts de ton.","statut":"interpretation","nature":"technique"},{"type":"INFLUENCED_BY","source":"minimalism","target":"hindustani","texte":"Terry Riley et La Monte Young ont étudié auprès du chanteur Pandit Pran Nath ; le bourdon, la durée et la répétition marquent leur musique.","statut":"etabli","nature":"influence"},{"type":"INFLUENCED_BY","source":"minimalism","target":"african-traditions","texte":"Steve Reich a étudié les percussions du Ghana en 1970 ; les motifs qui se décalent dans Drumming (1971) en portent la trace.","statut":"etabli","nature":"influence"},{"type":"INFLUENCED_BY","source":"minimalism","target":"gamelan","texte":"Steve Reich a aussi étudié le gamelan balinais ; les cycles et les motifs entrelacés se retrouvent dans ses pièces.","statut":"etabli","nature":"influence"},{"type":"CROSSES_WITH","source":"techno","target":"minimalism","texte":"Répétition, motifs qui se transforment lentement, pulsation : la techno est souvent rapprochée du minimalisme, même si les deux mondes ne se sont pas toujours connus.","statut":"interpretation","nature":"echo"},{"type":"CROSSES_WITH","source":"post-rock","target":"minimalism","texte":"Le post-rock fait évoluer lentement des motifs répétés et des textures avec des guitares, comme le minimalisme avec des instruments de salle de concert.","statut":"interpretation","nature":"echo"},{"type":"CROSSES_WITH","source":"kraftwerk","target":"electronic-composition","texte":"Kraftwerk est souvent présenté comme l'héritier d'une tradition allemande de musique électronique de studio, dont Cologne et Stockhausen sont les noms connus, mais pour le grand public.","statut":"interpretation","nature":"echo"},{"type":"INFLUENCED_BY","source":"synth-pop","target":"kraftwerk","texte":"Synthétiseurs, boîtes à rythmes et chant presque parlé : la new wave et la synth-pop britanniques prennent le modèle de Kraftwerk.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"hip-hop","target":"kraftwerk","texte":"Afrika Bambaataa reprend la mélodie et le rythme de Kraftwerk dans Planet Rock (1982) : un groupe allemand devient matière à danser au Bronx.","statut":"etabli","nature":"technique"},{"type":"INFLUENCED_BY","source":"detroit-techno","target":"kraftwerk","texte":"Juan Atkins et ses amis écoutent Kraftwerk, le funk et la musique électronique européenne et en font une musique de machines, futuriste, pour Detroit.","statut":"etabli","nature":"influence"},{"type":"INFLUENCED_BY","source":"detroit-techno","target":"funk","texte":"Le groove répété du funk, basse et boucle qui ne s'arrêtent pas, devient séquence jouée par des machines.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"house","target":"disco","texte":"La house naît dans les clubs de Chicago : pulsation à quatre temps, DJ, et boîte à rythmes à la place de l'orchestre disco.","statut":"interpretation","nature":"influence"},{"type":"CROSSES_WITH","source":"techno","target":"house","texte":"Chicago et Detroit utilisent les mêmes machines et la même pulsation à quatre temps ; Detroit y met plus de futurisme et de séquences.","statut":"interpretation","nature":"echo"},{"type":"INFLUENCED_BY","source":"trance","target":"techno","texte":"La trance garde la pulsation de la techno et y ajoute de longues montées mélodiques.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"idm","target":"techno","texte":"L'IDM prend les machines de la techno et des breaks complexes pour une musique faite pour l'écoute plutôt que pour la danse.","statut":"interpretation","nature":"influence"},{"type":"CROSSES_WITH","source":"vaporwave","target":"detroit-techno","texte":"Detroit rêvait le futur avec des machines ; la vaporwave regarde avec nostalgie un futur des années 1980-90 qui n'est pas arrivé, en ralentissant et bouclant des échantillons. Il n'y a pas de filiation directe : c'est un retournement.","statut":"interpretation","nature":"echo"},{"type":"INFLUENCED_BY","source":"vaporwave","target":"sampling","texte":"Ralentir, boucler, déformer des morceaux de pop, de jazz léger et de musique d'ambiance des années 1980-90 : la vaporwave est faite d'échantillons.","statut":"interpretation","nature":"technique"},{"type":"INFLUENCED_BY","source":"vaporwave","target":"city-pop","texte":"La city pop japonaise est l'une des sources d'échantillons les plus utilisées par la vaporwave et ses cousines.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"vaporwave","target":"internet-music","texte":"La vaporwave naît et circule sur Internet : forums, blogs, plateformes de partage.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"hyperpop","target":"internet-music","texte":"L'hyperpop se construit entre amis qui s'écoutent et se répondent en ligne ; la voix traitée et la saturation sont poussées à l'extrême.","statut":"interpretation","nature":"influence"},{"type":"CROSSES_WITH","source":"vaporwave","target":"ambient","texte":"Textures, durée, musique d'ambiance : la vaporwave détourne aussi la musique d'ambiance des centres commerciaux.","statut":"interpretation","nature":"echo"},{"type":"INFLUENCED_BY","source":"synthwave","target":"synth-pop","texte":"La synthwave recompose les synthétiseurs et les boîtes à rythmes des années 1980.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"synthwave","target":"new-wave","texte":"L'esthétique visuelle et sonore des années 1980, néons, synthétiseurs et musiques de film, est son décor.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"synth-pop","target":"fm-synthesis","texte":"Les synthétiseurs à synthèse FM (Yamaha DX7, 1983) donnent le son de beaucoup de productions pop des années 1980.","statut":"etabli","nature":"technique"},{"type":"INFLUENCED_BY","source":"fm-synthesis","target":"sound-synthesis","texte":"La synthèse FM fait moduler la fréquence d'un son par un autre : un son simple devient très riche, avec peu de calcul.","statut":"interpretation","nature":"technique"},{"type":"INFLUENCED_BY","source":"jungle","target":"sound-system","texte":"La culture sound system jamaïcaine, basses énormes, MC et disques gravés pour les fêtes, arrive à Londres et nourrit la jungle.","statut":"etabli","nature":"influence"},{"type":"INFLUENCED_BY","source":"jungle","target":"sampling","texte":"Le même break de batterie échantillonné (l'Amen break) est accéléré et découpé pour faire la rythmique de la jungle.","statut":"etabli","nature":"technique"},{"type":"INFLUENCED_BY","source":"drum-and-bass","target":"jungle","texte":"La drum and bass simplifie et durcit la jungle : breaks rapides et basses profondes.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"dubstep","target":"dub","texte":"L'espace, l'écho et la basse du dub jamaïcain se retrouvent dans le dubstep londonien.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"blues","target":"african-traditions","texte":"Rythmes, appel et réponse, chant expressif : des héritages africains, portés par les Africains déportés aux États-Unis, nourrissent le blues, le gospel et le jazz.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"jazz","target":"blues","texte":"Les blue notes, la forme en douze mesures et l'appel-réponse du blues passent dans le jazz.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"bossa-nova","target":"cool-jazz","texte":"Le jazz cool, aux timbres doux et aux harmonies riches, a nourri la bossa nova de Rio.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"jazz","target":"bossa-nova","texte":"L'album de Stan Getz et João Gilberto (1964) fait entrer la bossa nova dans le jazz américain.","statut":"etabli","nature":"influence"},{"type":"INFLUENCED_BY","source":"british-rock","target":"chicago-blues","texte":"Les Rolling Stones, Eric Clapton et d'autres jeunes Britanniques reprennent le blues électrique de Chicago, et en font du rock.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"afrobeat","target":"jazz","texte":"Fela Kuti combine le highlife du Ghana et du Nigeria, le jazz et le funk de James Brown.","statut":"etabli","nature":"influence"},{"type":"INFLUENCED_BY","source":"afrobeat","target":"highlife","texte":"Le highlife donne à l'afrobeat ses guitares et ses cuivres.","statut":"etabli","nature":"influence"},{"type":"INFLUENCED_BY","source":"afrobeat","target":"funk","texte":"Le groove et les riffs répétés du funk de James Brown sont l'un des ingrédients de l'afrobeat.","statut":"etabli","nature":"influence"},{"type":"INFLUENCED_BY","source":"hip-hop","target":"funk","texte":"Les breaks de batterie de James Brown et du funk, répétés par les DJ, deviennent la matière du hip-hop.","statut":"etabli","nature":"technique"},{"type":"INFLUENCED_BY","source":"boom-bap","target":"jazz","texte":"Le boom bap échantillonne le jazz et la soul : une boucle de piano ou de contrebasse sous une batterie dure.","statut":"interpretation","nature":"technique"},{"type":"INFLUENCED_BY","source":"boom-bap","target":"sampling","texte":"Le boom bap est fait d'échantillons découpés et rejoués sur une machine.","statut":"interpretation","nature":"technique"},{"type":"CROSSES_WITH","source":"dub","target":"post-punk","texte":"Le post-punk britannique écoute le dub : basses profondes, écho et espace dans le mixage.","statut":"interpretation","nature":"echo"},{"type":"INFLUENCED_BY","source":"post-punk","target":"dub","texte":"The Clash, Public Image Ltd et d'autres reprennent la basse et l'écho du dub.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"tropicalia","target":"psychedelic-rock","texte":"Les guitares électriques et le studio psychédélique des Beatles et d'autres nourrissent la Tropicália brésilienne.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"tropicalia","target":"samba","texte":"La Tropicália garde la samba et la bossa nova, qu'elle mélange au rock et à l'expérimentation.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"psychedelic-rock","target":"hindustani","texte":"George Harrison apprend le sitar avec Ravi Shankar (1965-1966) ; la musique indienne entre dans le rock avec les Beatles.","statut":"etabli","nature":"influence"},{"type":"CROSSES_WITH","source":"fusion","target":"carnatic","texte":"Des projets comme Shakti, de John McLaughlin avec des musiciens indiens (1975), croisent le jazz et la musique de l'Inde du Sud.","statut":"interpretation","nature":"echo"},{"type":"INFLUENCED_BY","source":"reggae","target":"ska","texte":"Le ska (1959) ralentit en rocksteady puis en reggae (vers 1968) en gardant l'offbeat, le coup sur le contretemps.","statut":"etabli","nature":"influence"},{"type":"INFLUENCED_BY","source":"hip-hop","target":"sound-system","texte":"DJ Kool Herc, d'origine jamaïcaine, importe au Bronx la fête en plein air avec sound system, DJ et MC.","statut":"etabli","nature":"influence"},{"type":"INFLUENCED_BY","source":"dancehall","target":"sound-system","texte":"Le dancehall naît du sound system : un chanteur ou un MC rapide sur un riddim, un rythme instrumental réutilisé.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"reggaeton","target":"dancehall","texte":"Le rythme dem bow et le chant rapide sur riddim venus de Jamaïque se mêlent à l'espagnol à Panama et à Porto Rico.","statut":"etabli","nature":"influence"},{"type":"INFLUENCED_BY","source":"reggaeton","target":"hip-hop","texte":"Le reggaeton mêle les riddims du dancehall au rap et à la production hip-hop.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"gwoka","target":"african-traditions","texte":"Le tambour ka du gwoka est un héritage africain transformé en Guadeloupe, pendant et après l'esclavage.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"zouk","target":"gwoka","texte":"Le gwoka et son tambour ka nourrissent le zouk de Kassav' (1979).","statut":"etabli","nature":"influence"},{"type":"INFLUENCED_BY","source":"zouk","target":"kompa","texte":"Le compas haïtien (kompa) est une influence majeure du zouk, avec le gwoka.","statut":"etabli","nature":"influence"},{"type":"CROSSES_WITH","source":"coupedecale","target":"zouk","texte":"Le coupé-décalé naît à Abidjan et dans la diaspora ivoirienne de Paris ; il mêle plusieurs musiques, dont le zouk et le ndombolo.","statut":"interpretation","nature":"echo"},{"type":"INFLUENCED_BY","source":"rumba-congolaise","target":"latin-american-music","texte":"Des disques de son cubain diffusés au Congo dans les années 1930-1940 inspirent la rumba congolaise, qui les réinvente.","statut":"etabli","nature":"influence"},{"type":"INFLUENCED_BY","source":"cumbia","target":"african-traditions","texte":"La cumbia colombienne mêle tambours d'origine africaine, flûtes indigènes et mélodie européenne.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"samba","target":"african-traditions","texte":"Les héritages afro-brésiliens, batuque et lundu, sont à l'origine de la samba.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"tango","target":"african-traditions","texte":"Le candombe des Afro-Uruguayens et Argentins fait partie des sources du tango.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"cumbia-villera","target":"cumbia","texte":"La cumbia villera garde les claviers et le rythme de la cumbia et y met les paroles des quartiers pauvres de Buenos Aires, à la fin des années 1990.","statut":"interpretation","nature":"influence"},{"type":"CROSSES_WITH","source":"cumbia-villera","target":"rap","texte":"Comme le rap, la villera raconte en langue crue la vie des quartiers marginalisés. Ce sont deux musiques différentes qui se répondent.","statut":"interpretation","nature":"echo"},{"type":"INFLUENCED_BY","source":"amapiano","target":"house","texte":"L'amapiano marie la house sud-africaine, le piano et le jazz, avec la basse typique du log drum.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"gqom","target":"house","texte":"Le gqom de Durban garde la pulsation de la house mais la dépouille : peu de notes, des percussions lourdes.","statut":"interpretation","nature":"influence"},{"type":"CROSSES_WITH","source":"afrobeats","target":"dancehall","texte":"Les afrobeats actuels mêlent plusieurs influences, dont le dancehall, le hip-hop, le R&B et les rythmes ouest-africains.","statut":"interpretation","nature":"echo"},{"type":"CROSSES_WITH","source":"afrobeats","target":"fela-kuti","texte":"Il ne faut pas confondre l'afrobeat de Fela Kuti, né en 1968, et les afrobeats d'aujourd'hui, mais le premier a ouvert la voie à la reconnaissance des musiques nigérianes dans le monde.","statut":"interpretation","nature":"echo"},{"type":"INFLUENCED_BY","source":"alternative-rnb","target":"rnb","texte":"Le R&B alternatif ouvre le chant du R&B à l'ambient et à l'électronique.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"french-rap","target":"hip-hop","texte":"Le rap français s'écrit en français et se développe dans les années 1980-1990 (IAM à Marseille, NTM en Seine-Saint-Denis).","statut":"interpretation","nature":"influence"},{"type":"CROSSES_WITH","source":"french-rap","target":"chanson-francaise","texte":"Le rap français hérite d'une tradition française où le texte et l'écriture comptent beaucoup.","statut":"interpretation","nature":"echo"},{"type":"INFLUENCED_BY","source":"trap","target":"rap","texte":"La trap garde le rap mais le pose sur des machines : 808 graves, hi-hats rapides, sub-bass.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"drill","target":"trap","texte":"La drill assombrit la trap, avec 808 glissées et rythmes syncopés.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"kpop","target":"hip-hop","texte":"Seo Taiji and Boys (1992) apportent le rap, la danse et les sons du hip-hop américain à la pop coréenne ; l'industrie des idoles en fait un système.","statut":"etabli","nature":"influence"},{"type":"INFLUENCED_BY","source":"kpop","target":"seo-taiji","texte":"Nan Arayo (1992) mêle rap, danse et production de type new jack swing en Corée : les groupes d'idoles des années 1990 prennent ce modèle et en font une industrie.","statut":"etabli","nature":"influence"},{"type":"CROSSES_WITH","source":"kpop","target":"rnb","texte":"La K-pop emprunte beaucoup à la production du R&B et du hip-hop américains.","statut":"interpretation","nature":"echo"},{"type":"INFLUENCED_BY","source":"korean-hiphop","target":"hip-hop","texte":"Le hip-hop coréen adopte les techniques du MCing et du DJing et les adapte à la langue coréenne.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"kpop","target":"korean-hiphop","texte":"Les rappeurs coréens font partie des groupes de K-pop ; les deux scènes se croisent.","statut":"interpretation","nature":"influence"},{"type":"CROSSES_WITH","source":"vaporwave","target":"cloud-rap","texte":"Le cloud rap et la vaporwave aiment les samples ralentis, les textures aériennes et la nostalgie numérique.","statut":"interpretation","nature":"echo"},{"type":"INFLUENCED_BY","source":"city-pop","target":"jpop","texte":"La city pop est une pop japonaise des années 1978-1990 faite avec des influences de disco, de funk et de jazz-fusion.","statut":"etabli","nature":"influence"},{"type":"INFLUENCED_BY","source":"city-pop","target":"disco","texte":"Disco, funk, soft rock et jazz-fusion américains nourrissent les productions japonaises de city pop.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"arabic-pop","target":"maqam","texte":"La pop arabe garde les modes du maqam et leurs ornements dans la mélodie.","statut":"interpretation","nature":"influence"},{"type":"CROSSES_WITH","source":"dream-pop","target":"shoegaze","texte":"Réverbération, voix noyées dans le mixage, textures : le shoegaze et la dream pop se répondent.","statut":"interpretation","nature":"echo"},{"type":"INFLUENCED_BY","source":"grunge","target":"punk","texte":"Le grunge mêle l'énergie du punk et le poids du metal.","statut":"interpretation","nature":"influence"},{"type":"INFLUENCED_BY","source":"grunge","target":"heavy-metal","texte":"La saturation des guitares du metal passe dans le grunge.","statut":"interpretation","nature":"influence },{"type":"CROSSES_WITH","source":"roland-tr-909","target":"techno","texte":"","statut":"interpretation"},{"type":"CROSSES_WITH","source":"yamaha-dx7","target":"synth-pop","texte":"","statut":"interpretation"}],"liens":[{"de":"western-classical","vers":"impressionism","nature":"influence","texte":"Debussy et Ravel gardent l'orchestre et la partition, mais font de la couleur du timbre et de l'harmonie l'enjeu principal.","statut":"interpretation"},{"de":"gamelan","vers":"impressionism","nature":"influence","texte":"Debussy entend un gamelan javanais à l'Exposition universelle de Paris en 1889 ; les gongs et les timbres métalliques marquent sa manière d'écrire pour le piano et l'orchestre.","statut":"etabli"},{"de":"impressionism","vers":"spectral","nature":"echo","texte":"Le timbre et la résonance comme matière de la musique, déjà au centre chez Debussy, deviennent le point de départ de Grisey et Murail.","statut":"interpretation"},{"de":"serialism","vers":"postwar-avantgarde","nature":"influence","texte":"Après 1945, la série sert à toute une génération (cours d'été de Darmstadt) à reconstruire la musique sur des bases neuves.","statut":"interpretation"},{"de":"serialism","vers":"integral-serialism","nature":"technique","texte":"Boulez et Stockhausen étendent la série, inventée par Schoenberg pour les hauteurs, aux durées, aux intensités et aux modes d'attaque.","statut":"etabli"},{"de":"integral-serialism","vers":"electronic-composition","nature":"technique","texte":"Au studio de Cologne, Stockhausen applique la logique des paramètres au son fabriqué : chaque paramètre peut être calculé puis réalisé (Studie II, 1954).","statut":"etabli"},{"de":"integral-serialism","vers":"spectral","nature":"reaction","texte":"Grisey et Murail reprochent en partie à la série de traiter le son comme une suite de chiffres ; ils partent de ce que le son est physiquement, son spectre, et de la durée que l'oreille perçoit.","statut":"interpretation"},{"de":"music-concrete","vers":"sampling","nature":"technique","texte":"Enregistrer, découper, boucler, transformer : le geste de Schaeffer (1948) se retrouve dans l'échantillonnage du hip-hop et de la house.","statut":"interpretation"},{"de":"music-concrete","vers":"industrial","nature":"echo","texte":"Bandes trafiquées et bruits de machines : la musique industrielle (années 1970) reprend le bruit comme matière, sans le cadre de la musique savante.","statut":"interpretation"},{"de":"electroacoustic","vers":"granular-synthesis","nature":"technique","texte":"L'idée de découper le son en très petits grains vient de la physique du son et de Xenakis ; Curtis Roads la rend utilisable par ordinateur.","statut":"interpretation"},{"de":"computer-music","vers":"spectral","nature":"technique","texte":"Les compositeurs spectraux analysent le son avec l'ordinateur (Grisey, Partiels, 1975, part de l'analyse d'un son de trombone).","statut":"etabli"},{"de":"computer-music","vers":"glitch","nature":"technique","texte":"Le glitch fait de l'erreur numérique, un disque qui saute, un son haché, une matière musicale.","statut":"interpretation"},{"de":"aleatoric","vers":"ambient","nature":"influence","texte":"Brian Eno travaille avec des processus et du hasard, hérités de Cage et du minimalisme, pour faire une musique qu'on peut écouter de près ou comme un décor.","statut":"interpretation"},{"de":"aleatoric","vers":"algorithmic","nature":"technique","texte":"Le hasard contrôlé de Cage et les probabilités de Xenakis ouvrent la voie à la musique faite par règles et par calcul.","statut":"interpretation"},{"de":"algorithmic","vers":"idm","nature":"echo","texte":"Des musiciens comme Autechre programment des processus qui génèrent les rythmes : la machine propose, le musicien choisit.","statut":"interpretation"},{"de":"spectral","vers":"microtonal","nature":"technique","texte":"Les harmoniques d'un son ne tombent pas sur les notes du piano : les spectraux notent donc des quarts de ton.","statut":"interpretation"},{"de":"hindustani","vers":"minimalism","nature":"influence","texte":"Terry Riley et La Monte Young ont étudié auprès du chanteur Pandit Pran Nath ; le bourdon, la durée et la répétition marquent leur musique.","statut":"etabli"},{"de":"african-traditions","vers":"minimalism","nature":"influence","texte":"Steve Reich a étudié les percussions du Ghana en 1970 ; les motifs qui se décalent dans Drumming (1971) en portent la trace.","statut":"etabli"},{"de":"gamelan","vers":"minimalism","nature":"influence","texte":"Steve Reich a aussi étudié le gamelan balinais ; les cycles et les motifs entrelacés se retrouvent dans ses pièces.","statut":"etabli"},{"de":"minimalism","vers":"techno","nature":"echo","texte":"Répétition, motifs qui se transforment lentement, pulsation : la techno est souvent rapprochée du minimalisme, même si les deux mondes ne se sont pas toujours connus.","statut":"interpretation"},{"de":"minimalism","vers":"post-rock","nature":"echo","texte":"Le post-rock fait évoluer lentement des motifs répétés et des textures avec des guitares, comme le minimalisme avec des instruments de salle de concert.","statut":"interpretation"},{"de":"electronic-composition","vers":"kraftwerk","nature":"echo","texte":"Kraftwerk est souvent présenté comme l'héritier d'une tradition allemande de musique électronique de studio, dont Cologne et Stockhausen sont les noms connus, mais pour le grand public.","statut":"interpretation"},{"de":"kraftwerk","vers":"synth-pop","nature":"influence","texte":"Synthétiseurs, boîtes à rythmes et chant presque parlé : la new wave et la synth-pop britanniques prennent le modèle de Kraftwerk.","statut":"interpretation"},{"de":"kraftwerk","vers":"hip-hop","nature":"technique","texte":"Afrika Bambaataa reprend la mélodie et le rythme de Kraftwerk dans Planet Rock (1982) : un groupe allemand devient matière à danser au Bronx.","statut":"etabli"},{"de":"kraftwerk","vers":"detroit-techno","nature":"influence","texte":"Juan Atkins et ses amis écoutent Kraftwerk, le funk et la musique électronique européenne et en font une musique de machines, futuriste, pour Detroit.","statut":"etabli"},{"de":"funk","vers":"detroit-techno","nature":"influence","texte":"Le groove répété du funk, basse et boucle qui ne s'arrêtent pas, devient séquence jouée par des machines.","statut":"interpretation"},{"de":"disco","vers":"house","nature":"influence","texte":"La house naît dans les clubs de Chicago : pulsation à quatre temps, DJ, et boîte à rythmes à la place de l'orchestre disco.","statut":"interpretation"},{"de":"house","vers":"techno","nature":"echo","texte":"Chicago et Detroit utilisent les mêmes machines et la même pulsation à quatre temps ; Detroit y met plus de futurisme et de séquences.","statut":"interpretation"},{"de":"techno","vers":"trance","nature":"influence","texte":"La trance garde la pulsation de la techno et y ajoute de longues montées mélodiques.","statut":"interpretation"},{"de":"techno","vers":"idm","nature":"influence","texte":"L'IDM prend les machines de la techno et des breaks complexes pour une musique faite pour l'écoute plutôt que pour la danse.","statut":"interpretation"},{"de":"detroit-techno","vers":"vaporwave","nature":"echo","texte":"Detroit rêvait le futur avec des machines ; la vaporwave regarde avec nostalgie un futur des années 1980-90 qui n'est pas arrivé, en ralentissant et bouclant des échantillons. Il n'y a pas de filiation directe : c'est un retournement.","statut":"interpretation"},{"de":"sampling","vers":"vaporwave","nature":"technique","texte":"Ralentir, boucler, déformer des morceaux de pop, de jazz léger et de musique d'ambiance des années 1980-90 : la vaporwave est faite d'échantillons.","statut":"interpretation"},{"de":"city-pop","vers":"vaporwave","nature":"influence","texte":"La city pop japonaise est l'une des sources d'échantillons les plus utilisées par la vaporwave et ses cousines.","statut":"interpretation"},{"de":"internet-music","vers":"vaporwave","nature":"influence","texte":"La vaporwave naît et circule sur Internet : forums, blogs, plateformes de partage.","statut":"interpretation"},{"de":"internet-music","vers":"hyperpop","nature":"influence","texte":"L'hyperpop se construit entre amis qui s'écoutent et se répondent en ligne ; la voix traitée et la saturation sont poussées à l'extrême.","statut":"interpretation"},{"de":"ambient","vers":"vaporwave","nature":"echo","texte":"Textures, durée, musique d'ambiance : la vaporwave détourne aussi la musique d'ambiance des centres commerciaux.","statut":"interpretation"},{"de":"synth-pop","vers":"synthwave","nature":"influence","texte":"La synthwave recompose les synthétiseurs et les boîtes à rythmes des années 1980.","statut":"interpretation"},{"de":"new-wave","vers":"synthwave","nature":"influence","texte":"L'esthétique visuelle et sonore des années 1980, néons, synthétiseurs et musiques de film, est son décor.","statut":"interpretation"},{"de":"fm-synthesis","vers":"synth-pop","nature":"technique","texte":"Les synthétiseurs à synthèse FM (Yamaha DX7, 1983) donnent le son de beaucoup de productions pop des années 1980.","statut":"etabli"},{"de":"sound-synthesis","vers":"fm-synthesis","nature":"technique","texte":"La synthèse FM fait moduler la fréquence d'un son par un autre : un son simple devient très riche, avec peu de calcul.","statut":"interpretation"},{"de":"sound-system","vers":"jungle","nature":"influence","texte":"La culture sound system jamaïcaine, basses énormes, MC et disques gravés pour les fêtes, arrive à Londres et nourrit la jungle.","statut":"etabli"},{"de":"sampling","vers":"jungle","nature":"technique","texte":"Le même break de batterie échantillonné (l'Amen break) est accéléré et découpé pour faire la rythmique de la jungle.","statut":"etabli"},{"de":"jungle","vers":"drum-and-bass","nature":"influence","texte":"La drum and bass simplifie et durcit la jungle : breaks rapides et basses profondes.","statut":"interpretation"},{"de":"dub","vers":"dubstep","nature":"influence","texte":"L'espace, l'écho et la basse du dub jamaïcain se retrouvent dans le dubstep londonien.","statut":"interpretation"},{"de":"african-traditions","vers":"blues","nature":"influence","texte":"Rythmes, appel et réponse, chant expressif : des héritages africains, portés par les Africains déportés aux États-Unis, nourrissent le blues, le gospel et le jazz.","statut":"interpretation"},{"de":"blues","vers":"jazz","nature":"influence","texte":"Les blue notes, la forme en douze mesures et l'appel-réponse du blues passent dans le jazz.","statut":"interpretation"},{"de":"cool-jazz","vers":"bossa-nova","nature":"influence","texte":"Le jazz cool, aux timbres doux et aux harmonies riches, a nourri la bossa nova de Rio.","statut":"interpretation"},{"de":"bossa-nova","vers":"jazz","nature":"influence","texte":"L'album de Stan Getz et João Gilberto (1964) fait entrer la bossa nova dans le jazz américain.","statut":"etabli"},{"de":"chicago-blues","vers":"british-rock","nature":"influence","texte":"Les Rolling Stones, Eric Clapton et d'autres jeunes Britanniques reprennent le blues électrique de Chicago, et en font du rock.","statut":"interpretation"},{"de":"jazz","vers":"afrobeat","nature":"influence","texte":"Fela Kuti combine le highlife du Ghana et du Nigeria, le jazz et le funk de James Brown.","statut":"etabli"},{"de":"highlife","vers":"afrobeat","nature":"influence","texte":"Le highlife donne à l'afrobeat ses guitares et ses cuivres.","statut":"etabli"},{"de":"funk","vers":"afrobeat","nature":"influence","texte":"Le groove et les riffs répétés du funk de James Brown sont l'un des ingrédients de l'afrobeat.","statut":"etabli"},{"de":"funk","vers":"hip-hop","nature":"technique","texte":"Les breaks de batterie de James Brown et du funk, répétés par les DJ, deviennent la matière du hip-hop.","statut":"etabli"},{"de":"jazz","vers":"boom-bap","nature":"technique","texte":"Le boom bap échantillonne le jazz et la soul : une boucle de piano ou de contrebasse sous une batterie dure.","statut":"interpretation"},{"de":"sampling","vers":"boom-bap","nature":"technique","texte":"Le boom bap est fait d'échantillons découpés et rejoués sur une machine.","statut":"interpretation"},{"de":"post-punk","vers":"dub","nature":"echo","texte":"Le post-punk britannique écoute le dub : basses profondes, écho et espace dans le mixage.","statut":"interpretation"},{"de":"dub","vers":"post-punk","nature":"influence","texte":"The Clash, Public Image Ltd et d'autres reprennent la basse et l'écho du dub.","statut":"interpretation"},{"de":"psychedelic-rock","vers":"tropicalia","nature":"influence","texte":"Les guitares électriques et le studio psychédélique des Beatles et d'autres nourrissent la Tropicália brésilienne.","statut":"interpretation"},{"de":"samba","vers":"tropicalia","nature":"influence","texte":"La Tropicália garde la samba et la bossa nova, qu'elle mélange au rock et à l'expérimentation.","statut":"interpretation"},{"de":"hindustani","vers":"psychedelic-rock","nature":"influence","texte":"George Harrison apprend le sitar avec Ravi Shankar (1965-1966) ; la musique indienne entre dans le rock avec les Beatles.","statut":"etabli"},{"de":"carnatic","vers":"fusion","nature":"echo","texte":"Des projets comme Shakti, de John McLaughlin avec des musiciens indiens (1975), croisent le jazz et la musique de l'Inde du Sud.","statut":"interpretation"},{"de":"ska","vers":"reggae","nature":"influence","texte":"Le ska (1959) ralentit en rocksteady puis en reggae (vers 1968) en gardant l'offbeat, le coup sur le contretemps.","statut":"etabli"},{"de":"sound-system","vers":"hip-hop","nature":"influence","texte":"DJ Kool Herc, d'origine jamaïcaine, importe au Bronx la fête en plein air avec sound system, DJ et MC.","statut":"etabli"},{"de":"sound-system","vers":"dancehall","nature":"influence","texte":"Le dancehall naît du sound system : un chanteur ou un MC rapide sur un riddim, un rythme instrumental réutilisé.","statut":"interpretation"},{"de":"dancehall","vers":"reggaeton","nature":"influence","texte":"Le rythme dem bow et le chant rapide sur riddim venus de Jamaïque se mêlent à l'espagnol à Panama et à Porto Rico.","statut":"etabli"},{"de":"hip-hop","vers":"reggaeton","nature":"influence","texte":"Le reggaeton mêle les riddims du dancehall au rap et à la production hip-hop.","statut":"interpretation"},{"de":"african-traditions","vers":"gwoka","nature":"influence","texte":"Le tambour ka du gwoka est un héritage africain transformé en Guadeloupe, pendant et après l'esclavage.","statut":"interpretation"},{"de":"gwoka","vers":"zouk","nature":"influence","texte":"Le gwoka et son tambour ka nourrissent le zouk de Kassav' (1979).","statut":"etabli"},{"de":"kompa","vers":"zouk","nature":"influence","texte":"Le compas haïtien (kompa) est une influence majeure du zouk, avec le gwoka.","statut":"etabli"},{"de":"zouk","vers":"coupedecale","nature":"echo","texte":"Le coupé-décalé naît à Abidjan et dans la diaspora ivoirienne de Paris ; il mêle plusieurs musiques, dont le zouk et le ndombolo.","statut":"interpretation"},{"de":"latin-american-music","vers":"rumba-congolaise","nature":"influence","texte":"Des disques de son cubain diffusés au Congo dans les années 1930-1940 inspirent la rumba congolaise, qui les réinvente.","statut":"etabli"},{"de":"african-traditions","vers":"cumbia","nature":"influence","texte":"La cumbia colombienne mêle tambours d'origine africaine, flûtes indigènes et mélodie européenne.","statut":"interpretation"},{"de":"african-traditions","vers":"samba","nature":"influence","texte":"Les héritages afro-brésiliens, batuque et lundu, sont à l'origine de la samba.","statut":"interpretation"},{"de":"african-traditions","vers":"tango","nature":"influence","texte":"Le candombe des Afro-Uruguayens et Argentins fait partie des sources du tango.","statut":"interpretation"},{"de":"cumbia","vers":"cumbia-villera","nature":"influence","texte":"La cumbia villera garde les claviers et le rythme de la cumbia et y met les paroles des quartiers pauvres de Buenos Aires, à la fin des années 1990.","statut":"interpretation"},{"de":"rap","vers":"cumbia-villera","nature":"echo","texte":"Comme le rap, la villera raconte en langue crue la vie des quartiers marginalisés. Ce sont deux musiques différentes qui se répondent.","statut":"interpretation"},{"de":"house","vers":"amapiano","nature":"influence","texte":"L'amapiano marie la house sud-africaine, le piano et le jazz, avec la basse typique du log drum.","statut":"interpretation"},{"de":"house","vers":"gqom","nature":"influence","texte":"Le gqom de Durban garde la pulsation de la house mais la dépouille : peu de notes, des percussions lourdes.","statut":"interpretation"},{"de":"dancehall","vers":"afrobeats","nature":"echo","texte":"Les afrobeats actuels mêlent plusieurs influences, dont le dancehall, le hip-hop, le R&B et les rythmes ouest-africains.","statut":"interpretation"},{"de":"fela-kuti","vers":"afrobeats","nature":"echo","texte":"Il ne faut pas confondre l'afrobeat de Fela Kuti, né en 1968, et les afrobeats d'aujourd'hui, mais le premier a ouvert la voie à la reconnaissance des musiques nigérianes dans le monde.","statut":"interpretation"},{"de":"rnb","vers":"alternative-rnb","nature":"influence","texte":"Le R&B alternatif ouvre le chant du R&B à l'ambient et à l'électronique.","statut":"interpretation"},{"de":"hip-hop","vers":"french-rap","nature":"influence","texte":"Le rap français s'écrit en français et se développe dans les années 1980-1990 (IAM à Marseille, NTM en Seine-Saint-Denis).","statut":"interpretation"},{"de":"chanson-francaise","vers":"french-rap","nature":"echo","texte":"Le rap français hérite d'une tradition française où le texte et l'écriture comptent beaucoup.","statut":"interpretation"},{"de":"rap","vers":"trap","nature":"influence","texte":"La trap garde le rap mais le pose sur des machines : 808 graves, hi-hats rapides, sub-bass.","statut":"interpretation"},{"de":"trap","vers":"drill","nature":"influence","texte":"La drill assombrit la trap, avec 808 glissées et rythmes syncopés.","statut":"interpretation"},{"de":"hip-hop","vers":"kpop","nature":"influence","texte":"Seo Taiji and Boys (1992) apportent le rap, la danse et les sons du hip-hop américain à la pop coréenne ; l'industrie des idoles en fait un système.","statut":"etabli"},{"de":"seo-taiji","vers":"kpop","nature":"influence","texte":"Nan Arayo (1992) mêle rap, danse et production de type new jack swing en Corée : les groupes d'idoles des années 1990 prennent ce modèle et en font une industrie.","statut":"etabli"},{"de":"rnb","vers":"kpop","nature":"echo","texte":"La K-pop emprunte beaucoup à la production du R&B et du hip-hop américains.","statut":"interpretation"},{"de":"hip-hop","vers":"korean-hiphop","nature":"influence","texte":"Le hip-hop coréen adopte les techniques du MCing et du DJing et les adapte à la langue coréenne.","statut":"interpretation"},{"de":"korean-hiphop","vers":"kpop","nature":"influence","texte":"Les rappeurs coréens font partie des groupes de K-pop ; les deux scènes se croisent.","statut":"interpretation"},{"de":"cloud-rap","vers":"vaporwave","nature":"echo","texte":"Le cloud rap et la vaporwave aiment les samples ralentis, les textures aériennes et la nostalgie numérique.","statut":"interpretation"},{"de":"jpop","vers":"city-pop","nature":"influence","texte":"La city pop est une pop japonaise des années 1978-1990 faite avec des influences de disco, de funk et de jazz-fusion.","statut":"etabli"},{"de":"disco","vers":"city-pop","nature":"influence","texte":"Disco, funk, soft rock et jazz-fusion américains nourrissent les productions japonaises de city pop.","statut":"interpretation"},{"de":"maqam","vers":"arabic-pop","nature":"influence","texte":"La pop arabe garde les modes du maqam et leurs ornements dans la mélodie.","statut":"interpretation"},{"de":"shoegaze","vers":"dream-pop","nature":"echo","texte":"Réverbération, voix noyées dans le mixage, textures : le shoegaze et la dream pop se répondent.","statut":"interpretation"},{"de":"punk","vers":"grunge","nature":"influence","texte":"Le grunge mêle l'énergie du punk et le poids du metal.","statut":"interpretation"},{"de":"heavy-metal","vers":"grunge","nature":"influence","texte":"La saturation des guitares du metal passe dans le grunge.","statut":"interpretation"}],"sources":[{"id":"grove","nom":"Grove Music Online (Oxford University Press)","genre":"encyclopédie universitaire","fiabilite":"élevée","url":"https://www.oxfordmusiconline.com"},{"id":"britannica","nom":"Encyclopaedia Britannica","genre":"encyclopédie générale","fiabilite":"moyenne à élevée","url":"https://www.britannica.com"},{"id":"ircam","nom":"Ircam, base de données Brahms","genre":"institution de recherche","fiabilite":"élevée","url":"https://brahms.ircam.fr"},{"id":"bnf","nom":"Bibliothèque nationale de France, data.bnf.fr","genre":"institution publique","fiabilite":"élevée","url":"https://data.bnf.fr"},{"id":"folkways","nom":"Smithsonian Folkways","genre":"archive sonore institutionnelle","fiabilite":"élevée","url":"https://folkways.si.edu"},{"id":"unesco","nom":"UNESCO, patrimoine culturel immatériel","genre":"institution internationale","fiabilite":"élevée","url":"https://ich.unesco.org"},{"id":"rilm","nom":"RILM Abstracts of Music Literature","genre":"bibliographie universitaire","fiabilite":"élevée","url":"https://www.rilm.org"},{"id":"musicbrainz","nom":"MusicBrainz","genre":"base communautaire ouverte","fiabilite":"moyenne : utile pour les dates et les discographies","url":"https://musicbrainz.org"},{"id":"discogs","nom":"Discogs","genre":"base communautaire et commerciale","fiabilite":"moyenne : utile pour les éditions, pas pour l'histoire des genres","url":"https://www.discogs.com"},{"id":"allmusic","nom":"AllMusic","genre":"base commerciale","fiabilite":"faible à moyenne : ses catégories sont celles d'une plateforme, pas de la musicologie","url":"https://www.allmusic.com"}],"concepts":[{"id":"serie","nom":"La série","texte":"Une série est un ordre fixe des douze notes de la gamme chromatique, qu'on utilise sans en répéter une avant que les onze autres soient passées. Schoenberg l'invente vers 1923 pour organiser la musique sans tonalité.","ecoute":"Cherche une mélodie qui ne revient jamais à une note de repos : aucune note n'est le centre.","mots":["série","organisation des hauteurs"],"cours":"3e-1"},{"id":"spectre","nom":"Le spectre","texte":"Un son est fait de plusieurs fréquences à la fois, la fondamentale et ses harmoniques ; l'ensemble s'appelle son spectre. C'est lui qui donne le timbre : le même la sonne autrement au violon et à la flûte.","ecoute":"Écoute un son tenu et essaie d'entendre, au-dessus de la note, d'autres notes plus aiguës qui l'accompagnent.","mots":["spectre","acoustique"],"cours":"3e-3"},{"id":"sampling","nom":"L'échantillonnage (sampling)","texte":"Prendre un morceau de son enregistré, une batterie, une voix, une phrase de piano, et le réutiliser pour faire autre chose. Il existe depuis les bandes de la musique concrète (1948) et devient courant avec les échantillonneurs numériques des années 1980.","ecoute":"Repère une boucle qui revient exactement la même, sous une voix ou sous un rythme : c'est souvent un échantillon.","mots":["sampling","échantillon"],"cours":"3e-2"},{"id":"boucle","nom":"La boucle","texte":"Un court motif répété indéfiniment, joué par un instrument, copié sur une bande ou répété par une machine. Elle crée une pulsation et fait entendre le moindre changement.","ecoute":"Compte combien de fois le motif revient, et repère ce qui s'ajoute dessus.","mots":["boucle","séquence"],"cours":"5e-3"},{"id":"boite-rythmes","nom":"La boîte à rythmes","texte":"Une machine qui joue des sons de batterie dans un ordre programmé. Les modèles de la marque Roland des années 1980, la TR-808 puis la TR-909, ont fixé les sons du hip-hop, de la house et de la techno.","ecoute":"Écoute un rythme parfaitement régulier, sans la petite irrégularité d'un batteur.","mots":["boîte à rythmes","percussions électroniques","machine"],"cours":null},{"id":"808","nom":"La 808","texte":"Le son de grosse caisse très grave et longue de la boîte à rythmes TR-808 ; en trap et en drill, on la fait glisser d'une hauteur à l'autre pour en faire une ligne de basse.","ecoute":"Écoute les basses très graves qui sonnent comme une note, pas seulement comme un coup.","mots":["808","808 glissées"],"cours":null},{"id":"backbeat","nom":"Le backbeat","texte":"Dans une mesure à quatre temps, on accentue les temps 2 et 4, au lieu des temps 1 et 3. C'est la caisse claire du rock and roll, du funk et de la soul.","ecoute":"Tape dans tes mains sur les temps 2 et 4 : ça tombe sur la caisse claire.","mots":["backbeat"],"cours":null},{"id":"appel-reponse","nom":"L'appel et la réponse","texte":"Une voix ou un instrument lance une phrase, un autre répond. Très présent dans les musiques africaines, il se retrouve dans le blues, le gospel, le jazz, le rap.","ecoute":"Repère qui parle et qui répond : le chanteur et la guitare, le soliste et le chœur.","mots":["call and response","appel-réponse"],"cours":null},{"id":"blue-notes","nom":"Les blue notes","texte":"Des notes un peu plus basses que celles de la gamme du piano, que les chanteurs et les guitaristes de blues glissent sur la tierce, la quinte et la septième.","ecoute":"Écoute une note qui n'est ni tout à fait majeure ni tout à fait mineure : elle sonne triste et joyeuse en même temps.","mots":["blue notes"],"cours":"4e-5"},{"id":"swing","nom":"Le swing","texte":"Au lieu de jouer deux croches égales, on allonge la première et on raccourcit la seconde, ce qui donne un balancement. C'est le trait du jazz, mais il existe dans d'autres musiques.","ecoute":"Essaie de taper « tchic-a, tchic-a » en alternant long-court, comme un balancement.","mots":["swing","shuffle","big band"],"cours":"4e-5"},{"id":"polyrythmie","nom":"La polyrythmie","texte":"Plusieurs rythmes différents joués ensemble, chacun gardant son cycle. On l'entend dans beaucoup de musiques d'Afrique, et chez Steve Reich ou Ligeti.","ecoute":"Essaie de suivre un seul rythme pendant que les autres jouent par-dessus.","mots":["polyrythmie"],"cours":"6e-4"},{"id":"syncope","nom":"La syncope","texte":"Une note commence sur un temps faible et se prolonge sur le temps fort : l'accent est décalé. Elle donne l'envie de bouger.","ecoute":"Cherche un rythme qui semble « tomber à côté » du temps tout en restant régulier.","mots":["syncopes","rythme syncopé","clave"],"cours":null},{"id":"groove","nom":"Le groove","texte":"L'impression d'un rythme qui roule et qui donne envie de danser : une basse, une batterie et des instruments qui jouent en accord, avec des accents bien placés. On le trouve dans le funk, la soul, le hip-hop, la house.","ecoute":"Demande-toi si tu bouges la tête sans l'avoir décidé.","mots":["groove","grooves"],"cours":null},{"id":"improvisation","nom":"L'improvisation","texte":"Inventer sa musique en la jouant. En jazz, elle suit une grille d'accords ; en free jazz, elle s'en libère ; dans la musique indienne, elle suit un raga.","ecoute":"Réécoute le même morceau deux fois : un solo improvisé n'est jamais identique.","mots":["improvisation"],"cours":"5e-5"},{"id":"processus","nom":"Le processus","texte":"Une musique faite d'une règle simple qui se déroule seule : un motif qui se décale peu à peu, un son qui s'allonge. Le minimalisme américain l'a rendue célèbre.","ecoute":"Essaie de décrire en une phrase la règle qui transforme la musique.","mots":["processus","algorithme"],"cours":"3e-4"},{"id":"hasard","nom":"Le hasard et l'indétermination","texte":"Laisser le hasard ou l'interprète décider d'une partie de la musique : tirer des notes au sort, laisser une partition ouverte. John Cage l'a systématisé après 1950.","ecoute":"Réécoute deux exécutions de la même pièce : elles ne sont pas identiques.","mots":["hasard","partition ouverte"],"cours":"3e-4"},{"id":"atonalite","nom":"L'atonalité","texte":"Une musique où aucune note n'est le centre : pas de note de repos, pas de gamme majeure ou mineure. Schoenberg la pratique à partir de 1908.","ecoute":"Cherche à fredonner la fin : si aucune note ne semble finir, c'est probablement atonal.","mots":["atonalité"],"cours":"3e-1"},{"id":"synthese","nom":"La synthèse sonore","texte":"Fabriquer un son à partir de rien avec des oscillateurs qui produisent des vibrations simples, des filtres qui les sculptent et des enveloppes qui règlent leur début et leur fin. Un synthétiseur combine ces éléments.","ecoute":"Écoute comment un son évolue : il s'ouvre, se ferme, glisse.","mots":["synthèse","synthèse sonore","synthétiseur","synthétiseurs","oscillateur","filtre","enveloppe"],"cours":"3e-3"},{"id":"granulaire","nom":"La synthèse granulaire","texte":"On découpe un son en grains de quelques centièmes de seconde, qu'on rejoue en nuage : plus ou moins nombreux, graves ou aigus, rapprochés ou éloignés. Le résultat est une texture, entre le son et le bruit.","ecoute":"Écoute un nuage de petits points sonores qui forment une matière.","mots":["microson"],"cours":null},{"id":"reverberation","nom":"La réverbération et l'écho","texte":"Un son dans une grande salle se prolonge en se mélangeant à ses propres reflets : c'est la réverbération. L'écho est une répétition distincte. Les studios les fabriquent avec des ressorts, des plaques ou des calculs.","ecoute":"Écoute la fin d'une note : elle s'éteint lentement ou brutalement ?","mots":["réverbération","écho","mur de son"],"cours":"5e-4"},{"id":"distorsion","nom":"La distorsion","texte":"On fait saturer un signal : la guitare ou la voix est amplifiée au-delà de ce que peut le circuit. Le son s'épaissit et gagne des harmoniques. Elle caractérise le rock, le metal, et certains sons de basse.","ecoute":"Écoute un son qui devient rugueux, sale, plus puissant.","mots":["distorsion"],"cours":"3e-2"},{"id":"riff","nom":"Le riff","texte":"Un court motif répété, souvent joué à la guitare ou à la basse, qui sert de signature à un morceau.","ecoute":"Essaie de fredonner le motif que la guitare joue au début.","mots":["riffs"],"cours":null},{"id":"flow","nom":"Le flow et la rime","texte":"Le flow est la manière dont un rappeur place ses mots sur le rythme : vitesse, accents, silences. La rime est le retour des mêmes sons en fin de vers.","ecoute":"Écoute où le rappeur tombe sur le temps et où il joue à côté.","mots":["flow","rime","rap","MCing"],"cours":"3e-2"},{"id":"djing","nom":"Le DJing","texte":"Passer et enchaîner des disques, puis les manipuler : les mixer, les ralentir, répéter un break avec deux platines. Le DJ devient musicien.","ecoute":"Écoute un passage où un disque s'arrête et un autre prend sa place sans trou.","mots":["DJing"],"cours":null},{"id":"breakbeat","nom":"Le break","texte":"Un court passage d'un disque où la batterie joue seule. Les DJ du Bronx le répètent avec deux platines pour faire danser plus longtemps ; il devient la base du hip-hop, de la jungle et de la drum and bass.","ecoute":"Écoute une batterie qui revient en boucle, très nette, sans le reste de la musique.","mots":["breakbeat"],"cours":null},{"id":"sub-bass","nom":"La sub-bass","texte":"Une basse si grave qu'on la sent dans la poitrine autant qu'on l'entend. Les systèmes de son des fêtes jamaïcaines, puis les clubs, l'ont rendue centrale.","ecoute":"Pose la main sur le haut-parleur : tu sens les vibrations avant d'entendre la note.","mots":["sub-bass"],"cours":null},{"id":"build-up","nom":"La montée","texte":"Un passage où l'énergie augmente, avec plus de notes, plus d'aigus, un rythme qui s'accélère, jusqu'au moment où tout retombe. C'est le moteur de la trance et de beaucoup de morceaux de danse.","ecoute":"Écoute comment la tension monte puis lâche d'un coup.","mots":["build-up"],"cours":null},{"id":"riddim","nom":"Le riddim, l'offbeat, le toasting","texte":"Le riddim est un rythme instrumental réutilisé par plusieurs chanteurs. L'offbeat accentue le contretemps. Le toasting est le chant parlé sur un rythme, né des sound systems jamaïcains.","ecoute":"Écoute une guitare qui tombe sur les contretemps, entre les battements.","mots":["riddim","offbeat","toasting","sound system"],"cours":null},{"id":"tambour-ka","nom":"Le tambour ka","texte":"Le tambour du gwoka guadeloupéen : un tambour tenu entre les genoux, sur lequel on joue des rythmes qui répondent à un danseur. Il est l'un des ancêtres du zouk.","ecoute":"Écoute un tambour qui répond aux gestes d'un danseur.","mots":["tambour ka","rythmes créoles"],"cours":null},{"id":"raga-tala","nom":"Le raga et le tala","texte":"Le raga est un mode de la musique indienne, avec ses notes, ses ornements et son humeur ; le tala est le cycle rythmique. Le musicien improvise dans ce cadre.","ecoute":"Écoute un bourdon continu sous une mélodie qui explore peu à peu ses notes.","mots":["raga","tala"],"cours":null},{"id":"maqam","nom":"Le maqam et les micro-intervalles","texte":"Le maqam est le système de modes de la musique arabe ; il utilise des intervalles plus petits que le demi-ton du piano. Chaque mode a ses notes et son caractère.","ecoute":"Écoute une note entre deux notes du piano.","mots":["micro-intervalles"],"cours":null},{"id":"heterophonie","nom":"Les cycles et l'hétérophonie","texte":"Dans le gamelan, plusieurs instruments jouent la même mélodie mais chacun avec ses variations, en même temps. Les gongs marquent la fin des cycles.","ecoute":"Écoute plusieurs instruments qui disent la même mélodie, un peu différemment.","mots":["hétérophonie","gong"],"cours":null},{"id":"drone","nom":"Le bourdon","texte":"Une note tenue très longtemps sous la musique, que jouent un instrument ou une voix. On la trouve dans la musique indienne, la cornemuse et dans les musiques savantes d'aujourd'hui.","ecoute":"Repère la note grave qui ne bouge pas pendant que la mélodie évolue.","mots":["durée"],"cours":"5e-1"},{"id":"temps-reel","nom":"Le temps réel et la spatialisation","texte":"Transformer le son pendant que l'instrumentiste joue, avec des capteurs, un ordinateur et plusieurs haut-parleurs qui entourent le public. On parle aussi de live electronics.","ecoute":"Écoute un son qui se déplace d'un haut-parleur à l'autre.","mots":["temps réel","capteurs","spatialisation","installation"],"cours":null},{"id":"objet-sonore","nom":"L'objet sonore et l'écoute réduite","texte":"Pierre Schaeffer propose d'écouter un son pour lui-même, sans penser à sa source : pas « un train », mais un son qui a un grain, une durée, une forme. C'est l'écoute réduite.","ecoute":"Ferme les yeux et décris le son avec les mots durée, hauteur, texture, sans nommer la source.","mots":["objet sonore","écoute réduite","sons fixés"],"cours":"3e-3"},{"id":"nostalgie","nom":"Le ralentissement et la nostalgie numérique","texte":"Ralentir un son le rend plus grave et plus long ; on y entend un souvenir. La vaporwave et le cloud rap s'en servent pour fabriquer une nostalgie d'objets numériques.","ecoute":"Écoute une chanson ralentie : que ressens-tu ?","mots":["ralentissement","nostalgie","nostalgie numérique"],"cours":null},{"id":"chorégraphie","nom":"La chorégraphie et l'industrie des idoles","texte":"En K-pop, le groupe est préparé pendant des années par une entreprise : chant, danse, langues, image. La chorégraphie est conçue en même temps que la musique et filmée pour circuler en vidéo.","ecoute":"Regarde un clip sans le son : la musique se devine-t-elle dans les gestes ?","mots":["chorégraphie","production collective"],"cours":"3e-5"},{"id":"do-it-yourself","nom":"Le DIY","texte":"Do it yourself : faire sa musique avec peu de moyens, l'enregistrer et la diffuser soi-même. Le punk, puis la musique électronique de chambre, l'ont popularisé.","ecoute":"Écoute un son brut, peu poli : c'est souvent un choix.","mots":["DIY"],"cours":null},{"id":"code","nom":"Le code et l'algorithme","texte":"Écrire une suite d'instructions que l'ordinateur exécute pour produire ou transformer des sons. Faust, le langage utilisé dans le Labo du site, est fait pour cela.","ecoute":"Essaie de décrire en mots simples les étapes que le programme répète.","mots":["code","algorithme","programmation"],"cours":"3e-4"}],"rubriques":[{"nom":"Écrire et composer","concepts":["serie","atonalite","processus","hasard","improvisation","code"]},{"nom":"Fabriquer et transformer le son","concepts":["spectre","synthese","granulaire","reverberation","distorsion","objet-sonore","temps-reel","drone"]},{"nom":"Rythme et groove","concepts":["backbeat","polyrythmie","syncope","groove","swing","boite-rythmes","808","breakbeat","riddim","boucle","build-up","sub-bass"]},{"nom":"Voix, texte, danse","concepts":["flow","appel-reponse","blue-notes","chorégraphie","riff"]},{"nom":"Produire et diffuser","concepts":["sampling","djing","do-it-yourself","nostalgie"]},{"nom":"Traditions et modes","concepts":["raga-tala","maqam","heterophonie","tambour-ka"]}],"parcours":[{"id":"schoenberg-spectral","titre":"De Schoenberg à la musique spectrale","intro":"Quatre-vingts ans de réponses : chaque génération reprend la question de la précédente, comment organiser les sons, et change le point de départ.","etapes":[{"id":"expressionism","texte":"Autour de 1908, la musique ose la dissonance et abandonne le centre tonal : l'atonalité."},{"id":"second-viennese","texte":"Schoenberg, Berg et Webern cherchent un ordre qui remplace la tonalité."},{"id":"serialism","texte":"La série fixe l'ordre des douze notes : un nouvel ordre, sans tonalité."},{"id":"integral-serialism","texte":"Boulez et Stockhausen étendent la série aux durées, aux intensités et aux attaques, après 1949."},{"id":"pierre-boulez","texte":"Boulez écrit, dirige, fonde l'Ircam en 1977 : le laboratoire où musique et science se rencontrent."},{"id":"spectral","texte":"Grisey et Murail reprochent à la série de ne pas écouter le son ; ils partent de son spectre. Le timbre devient la matière de la composition."}]},{"id":"stockhausen-vaporwave","titre":"De Stockhausen à la vaporwave","intro":"Des studios de la radio allemande aux chambres d'adolescents connectés : comment la musique faite avec des machines change de rapport au futur.","etapes":[{"id":"electronic-composition","texte":"Années 1950 : des compositeurs fabriquent des sons avec des oscillateurs, dans un studio de radio."},{"id":"kraftwerk","texte":"Kraftwerk fait de la musique de machines une pop : synthétiseurs, boîtes à rythmes, voix presque parlée."},{"id":"detroit-techno","texte":"À Detroit, Atkins, May et Saunderson croisent Kraftwerk et le funk : la techno, un futur en séquences."},{"id":"sampling","texte":"Les échantillonneurs rendent possible la reprise de n'importe quel son : la musique devient une matière de collage."},{"id":"vaporwave","texte":"Années 2010 : la vaporwave échantillonne le passé récent, le ralentit et le boucle ; le futur des machines est devenu un souvenir."}]},{"id":"blues-hiphop","titre":"Du blues au hip-hop","intro":"Un siècle de musiques afro-américaines : à chaque génération, des outils nouveaux pour dire la même chose.","etapes":[{"id":"blues","texte":"Le blues met en chant la vie des Noirs du Sud des États-Unis : blue notes, appel et réponse."},{"id":"rnb","texte":"Dans les villes, le blues s'électrifie et se met à danser : rhythm and blues, puis soul avec la voix du gospel."},{"id":"funk","texte":"James Brown fait de la musique une machine à groove : basse et batterie répétées."},{"id":"hip-hop","texte":"Au Bronx, les DJ répètent les breaks du funk avec deux platines ; des MC parlent dessus. Le hip-hop naît en 1973."},{"id":"boom-bap","texte":"Les échantillonneurs permettent de découper ces breaks : le boom bap est fait de boucles de soul et de jazz."},{"id":"trap","texte":"Dans les années 2000, la boucle d'échantillon cède la place à la machine : 808, hi-hats rapides."}]},{"id":"antilles-afrique","titre":"De l'Afrique aux Antilles : le zouk","intro":"Une musique de 1979, faite par des Antillais à Paris, avec des tambours venus d'Afrique et des machines.","etapes":[{"id":"african-traditions","texte":"Des tambours, des chants en appel et réponse, des rythmes qui traversent l'Atlantique."},{"id":"gwoka","texte":"En Guadeloupe, le tambour ka devient le centre d'une danse et d'un chant : le gwoka."},{"id":"kompa","texte":"À Haïti, le compas fait danser les Caraïbes ; il influence les Antilles françaises."},{"id":"zouk","texte":"Kassav' (1979) joue du tambour ka et du compas avec des synthétiseurs : le zouk touche tout le monde créole."}]},{"id":"kingston-seoul","titre":"De Kingston au Bronx à Séoul","intro":"Un DJ, une fête, une manière de parler sur un rythme : comment une pratique jamaïcaine fait le tour de la planète.","etapes":[{"id":"reggae","texte":"Jamaïque, 1968 : le reggae et son offbeat, la basse en avant."},{"id":"sound-system","texte":"Des camions de haut-parleurs, des DJ, des MC qui parlent sur le rythme : le toasting."},{"id":"hip-hop","texte":"DJ Kool Herc apporte cette fête au Bronx : DJ, MC, breakdance, graffiti. Le hip-hop est une culture, pas seulement une musique."},{"id":"korean-hiphop","texte":"En Corée, les années 1990 : des rappeurs adaptent le hip-hop au coréen."},{"id":"kpop","texte":"Seo Taiji and Boys (1992) puis l'industrie des idoles : rap, danse, production et image forment un système mondial."}]},{"id":"cumbia-villera","titre":"De la cumbia à la cumbia villera","intro":"Une danse colombienne devient la voix des quartiers pauvres de Buenos Aires.","etapes":[{"id":"african-traditions","texte":"Les tambours d'origine africaine arrivent en Amérique avec l'esclavage."},{"id":"cumbia","texte":"En Colombie, la cumbia mêle ces tambours, des flûtes indigènes et la mélodie européenne."},{"id":"cumbia-santafesina","texte":"En Argentine, la cumbia s'installe, avec des claviers et un son local."},{"id":"cumbia-villera","texte":"À la fin des années 1990, la cumbia villera raconte la vie des quartiers pauvres, avec des claviers et un rythme de cumbia. Le rap raconte aussi ces vies, autrement."}]}],"cours":{"3e-1":["3e, séquence 1 : 1913 et la musique face à la guerre","#seq-3e-1"],"3e-2":["3e, séquence 2 : le temps de la contestation","#seq-3e-2"],"3e-3":["3e, séquence 3 : le son de synthèse et l'informatique musicale","#seq-3e-3"],"3e-4":["3e, séquence 4 : musique et mathématiques","#seq-3e-4"],"3e-5":["3e, séquence 5 : le XXIe siècle et l'arbre des genres","#seq-3e-5"],"4e-5":["4e, séquence 5 : la révolution industrielle et le disque","#seq-4e-5"],"5e-1":["5e, séquence 1 : du grégorien à Notre-Dame","#seq-5e-1"],"5e-3":["5e, séquence 3 : canon et imitation","#seq-5e-3"],"5e-4":["5e, séquence 4 : Renaissance, Réforme et Palestrina","#seq-5e-4"],"5e-5":["5e, séquence 5 : Monteverdi et la naissance de l'opéra","#seq-5e-5"],"6e-4":["6e, séquence 4 : traditions orales du monde","#seq-6e-4"]},"fiches":{"detroit-techno":{"origines":"Au début des années 1980, Juan Atkins, Derrick May et Kevin Saunderson, jeunes musiciens de la banlieue de Detroit, mêlent funk, electro, new wave et musique électronique européenne.","contexte":"Detroit, capitale de l'automobile, traverse un déclin industriel marqué dans les années 1980. On lit souvent cette musique de machines comme une manière d'imaginer un futur depuis une ville qui perd son industrie.","rythme":"Pulsation à quatre temps (4/4) jouée par une boîte à rythmes, avec des accents syncopés au charleston et aux percussions.","melodie":"Des motifs courts répétés par un séquenceur, souvent sur peu de notes.","harmonie":"Accords simples ou nappes de synthétiseur ; l'harmonie bouge peu et la tension vient des timbres et des couches.","timbres":"Synthétiseurs analogiques, boîtes à rythmes Roland (TR-808, TR-909), basses synthétiques.","production":"Studios de chambre, séquenceurs et boîtes à rythmes ; la musique circule par les DJ et par des labels indépendants.","formes":"Longs morceaux construits par ajout et retrait de couches, pensés pour être mixés par un DJ.","ecoute":[["Cybotron, Clear (1983)","Cybotron Clear 1983"],["Rhythim Is Rhythim, Strings of Life (1987)","Rhythim Is Rhythim Strings of Life"],["Kraftwerk, Trans-Europe Express (1977)","Kraftwerk Trans-Europe Express"]],"questions":["Dans la pulsation, qu'est-ce qui te fait penser au funk, qu'est-ce qui te fait penser à Kraftwerk ?","Quelles machines entends-tu : une boîte à rythmes, un synthétiseur, une voix ?"]},"hip-hop":{"origines":"Lors d'une fête au Bronx en août 1973, DJ Kool Herc, né en Jamaïque, répète avec deux platines les breaks de batterie des disques de funk. On retient souvent cette date comme celle de la naissance du hip-hop.","contexte":"Le Bronx des années 1970 est durement touché par la crise économique. Les fêtes de rue, le DJing, le MCing, le breakdance et le graffiti sont des pratiques collectives, nées dans ces quartiers.","rythme":"Le break de batterie répété, en boucle ; ensuite des rythmes de boîte à rythmes.","melodie":"Le rap est un chant parlé-rythmé : la mélodie vient surtout des échantillons et des lignes de basse.","harmonie":"Boucles courtes de quelques accords, souvent prises à des disques de soul, de funk ou de jazz.","timbres":"Platines, samplers, boîtes à rythmes, voix.","production":"De deux platines et d'une table de mixage aux échantillonneurs et aux machines à pads comme la MPC.","formes":"Couplets en seize mesures, refrains, passages de scratch.","ecoute":[["The Sugarhill Gang, Rapper's Delight (1979)","Sugarhill Gang Rapper's Delight"],["Grandmaster Flash and the Furious Five, The Message (1982)","Grandmaster Flash The Message"],["IAM, Demain c'est loin (1997)","IAM Demain c'est loin"]],"questions":["Quelle partie du morceau est un échantillon, quelle partie est jouée ou chantée par les artistes ?","Que raconte le texte, et comment le rythme porte-t-il ce récit ?"]},"zouk":{"origines":"En 1979, le groupe antillais Kassav', installé en région parisienne, mêle le gwoka, la biguine, le compas haïtien (kompa) et des synthétiseurs. Zouk veut dire fête en créole.","contexte":"Une musique faite par des musiciens des Antilles françaises en France, chantée en créole, qui circule ensuite dans les Caraïbes, en Afrique et en Europe.","rythme":"Tempo moyen à rapide, rythme porté par la batterie, la basse et le tambour ka.","melodie":"Mélodies chantées en créole, en phrases courtes avec des réponses des chœurs.","harmonie":"Harmonies simples et mouvantes.","timbres":"Synthétiseurs, cuivres, guitares, basse, tambour ka.","production":"Studios modernes de l'époque, avec claviers électroniques.","formes":"Couplets et refrains, avec des parties instrumentales dansantes.","ecoute":[["Kassav', Zouk-la sé sèl médikaman nou ni (1986)","Kassav Zouk la sé sèl médikaman nou ni"],["Gwoka : tambour ka","gwoka Guadeloupe tambour ka"]],"questions":["Quel est l'instrument qui vient du gwoka, quel est celui qui vient de la musique électronique ?","Quelle langue entends-tu, et pourquoi ce choix compte-t-il ?"]},"cumbia-villera":{"origines":"À la fin des années 1990, dans les quartiers pauvres de Buenos Aires, des groupes comme Damas Gratis et Yerba Brava reprennent le rythme de la cumbia avec des claviers et des paroles très directes.","contexte":"L'Argentine traverse une grave crise économique entre 1998 et 2002. La villera met en chanson la vie des quartiers pauvres, la fête, la marginalité, avec un langage de la rue.","rythme":"Le rythme de la cumbia, dansant, avec une pulsation régulière et des percussions.","melodie":"Mélodies simples, chantées ou à moitié parlées.","harmonie":"Peu d'accords, répétés.","timbres":"Claviers, basse, percussions, voix.","production":"Enregistrements à petit budget, diffusés par les radios locales et les bals.","formes":"Couplets et refrains très dansants.","ecoute":[["Damas Gratis","Damas Gratis cumbia villera"],["Yerba Brava","Yerba Brava cumbia villera"]],"questions":["En quoi les paroles ressemblent-elles à celles du rap, en quoi la musique est-elle différente ?","Qu'est-ce qui, dans le rythme, vient de la cumbia colombienne ?"]},"kpop":{"origines":"Seo Taiji and Boys (1992) apportent le rap et la danse du hip-hop américain à la pop coréenne ; dans les années 1990, des agences comme SM, YG et JYP organisent la formation de groupes d'idoles.","contexte":"Une industrie culturelle très organisée : des jeunes s'entraînent pendant des années au chant, à la danse, aux langues, puis un groupe débute avec une image préparée. Les clips et les chorégraphies circulent en ligne dans le monde entier.","rythme":"Rythmes de pop et de hip-hop électronique, souvent changeant dans un même morceau.","melodie":"Refrains très mémorisables, parfois en plusieurs langues.","harmonie":"Harmonies de pop, avec des passages inattendus.","timbres":"Voix en chœur, synthétiseurs, basses, parties rappées.","production":"Écriture collective avec des compositeurs de plusieurs pays ; production en studio très détaillée.","formes":"Morceaux composés de plusieurs sections contrastées, avec une partie de danse.","ecoute":[["Seo Taiji and Boys, Nan Arayo (1992)","Seo Taiji and Boys Nan Arayo"],["BTS, Dynamite (2020)","BTS Dynamite official MV"]],"questions":["Qu'entends-tu qui vient du hip-hop, du R&B, de la pop ?","Regarde le clip sans le son : que raconte la chorégraphie ?"]},"spectral":{"origines":"Dans les années 1970, à Paris, autour de l'ensemble L'Itinéraire (fondé en 1973) et de l'Ircam, des compositeurs comme Gérard Grisey et Tristan Murail partent du spectre d'un son pour écrire.","contexte":"La génération précédente avait organisé la musique avec la série ou le hasard. Les spectraux veulent revenir à l'écoute et au son lui-même, avec l'aide de l'ordinateur pour l'analyser.","rythme":"Temps long, transformations lentes ; la durée est celle de la perception d'un son qui évolue.","melodie":"Peu de mélodies au sens classique : des lignes qui découlent des harmoniques.","harmonie":"Accords construits sur les harmoniques d'un son, avec des intervalles plus petits que le demi-ton.","timbres":"Orchestre ou ensemble, parfois avec électronique ; le mélange des timb /* ---------- Famille et arbre des genres ---------- */

/* ---------- Graphe des influences autour d'une entrée ---------- */

function dessinerGraphe(id) {

  const droite = [...ent.filter(r => FILI.includes(r.type)).map(r => [r.source, r]), ...ent.filter(r => r.type === "SUBGENRE_OF").map(r => [r.source, r])];
  const bas = [...sor.filter(r => /^USES/.test(r.type)).map(r => [r.target, r]), ...ent.filter(r => /^USES/.test(r.type)).map(r => [r.source, r])];
  const haut = [...sor.filter(r => r.type === "CROSSES_WITH").map(r => [r.target, r]), ...ent.filter(r => r.type === "CROSSES_WITH").map(r => [r.source, r])];
  const W = 1000, rows = Math.max(gauche.length, droite.length, 2), H = 130 + rows * 44 + (haut.length ? 60 : 0) + (bas.length ? 60 : 0), cy = (haut.length ? 60 : 0) + 65 + rows * 22;
  const pos = {}, cx = W / 2; const colonne = (L, x) => L.forEach(([i], k) => { pos[i] = [x, cy + (k - (L.length - 1) / 2) * 44]; });
  colonne(gauche, 130); colonne(droite, W - 130);
  const ligne = (L, y) => L.forEach(([i], k) => { if (!pos[i]) pos[i] = [cx + (k - (L.length - 1) / 2) * 190, y]; });
  ligne(haut, 34); ligne(bas, H - 34); pos[id] = [cx, cy];

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphe des relations de ${esc(e.name)}"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>`;
  gauche.forEach(([i, r]) => svg += arete(i, id, r)); droite.forEach(([i, r]) => svg += arete(id, i, r));
  haut.forEach(([i, r]) => svg += arete(id, i, r)); bas.forEach(([i, r]) => svg += arete(id, i, r));

  const gw = $("#gw"); gw.innerHTML = svg;
  gw.querySelectorAll(".noeud").forEach(n => { const go = () => { location.hash = "#graphe/" + n.dataset.id; }; n.onclick = go; n.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } }; });

/* ---------- Frise : le temps en abscisse, une ligne par famille ---------- */
const AN0 = 1890, AN1 = 2030, PX = 9.4, LIGNE = 30, MARGE = 120;
const FRISE = { sel: null, fam: new Set(D.families.map(f => f.id)), groupes: new Set(Object.keys(GROUPES_TYPE)), tout: false, de: 1890, a: 2030 };
function dansFrise(e) { const g = Object.entries(GROUPES_TYPE).find(([, t]) => t.includes(e.type)); return FRISE.fam.has(e.family) && (!g || FRISE.groupes.has(g[0])) && e.period.start <= FRISE.a && (e.period.end || 2030) >= FRISE.de; }
function disposer() {
  const pos = {}, lignes = [];
  D.families.filter(f => FRISE.fam.has(f.id)).forEach(f => {
    const L = D.entries.filter(e => e.family === f.id && dansFrise(e)).sort((a, b) => a.period.start - b.period.start || a.name.localeCompare(b.name)); const rangs = [];
    L.forEach(e => { const w = Math.max(54, e.name.length * 6.4 + 18), x = MARGE + (Math.max(e.period.start, AN0) - AN0) * PX; let r = rangs.findIndex(fin => fin + 6 <= x); if (r < 0) { r = rangs.length; rangs.push(0); } rangs[r] = x + w; pos[e.id] = { x, w, r, f: f.id }; });
    lignes.push([f, Math.max(1, rangs.length)]);
  });
  let y = 36; const fy = {}; lignes.forEach(([f, n]) => { fy[f.id] = [y, n]; y += n * LIGNE + 22; });
  Object.values(pos).forEach(p => { p.y = fy[p.f][0] + p.r * LIGNE; });
  return { pos, fy, haut: y + 10 };
}
function vueFrise(sel) {
  if (sel && E[sel]) { FRISE.sel = sel; FRISE.fam.add(E[sel].family); }
  return `<span class="etiq">Frise chronologique</span><h1>Le temps des musiques</h1><p class="lead">Chaque étiquette est placée à sa date de départ. Touche-en une : son passé et son avenir s'allument.</p>
  <div class="pastilles" id="filtres">${D.families.map(f => `<button type="button" class="pastille" data-f="${f.id}" style="--c:${COUL[f.id]}" aria-pressed="${FRISE.fam.has(f.id)}">${esc(f.name.split(",")[0])}</button>`).join("")}</div>
  <div class="pastilles" id="groupes">${Object.keys(GROUPES_TYPE).map(g => `<button type="button" class="pastille clair" data-g="${g}" aria-pressed="${FRISE.groupes.has(g)}">${g}</button>`).join("")}<button type="button" class="pastille clair" id="tout" aria-pressed="${FRISE.tout}">Toutes les filiations</button></div>
  <div class="champs"><label for="de">De</label><input id="de" type="number" min="1890" max="2030" step="10" value="${FRISE.de}"><label for="a">à</label><input id="a" type="number" min="1890" max="2030" step="10" value="${FRISE.a}"></div>
  <div class="carte-wrap" id="cw"></div><div id="detail" style="margin-top:14px"></div>`;
}
function dessinerFrise() {
  const { pos, fy, haut } = disposer(), larg = MARGE + (AN1 - AN0) * PX + 40, sel = FRISE.sel && pos[FRISE.sel] ? FRISE.sel : null;
  const allum = sel ? new Set([...remonte(sel, true), ...remonte(sel, false)]) : null;
  const aretes = D.relations.filter(r => FILI.includes(r.type) || r.type === "SUBGENRE_OF").map(r => [r.target, r.source, r.type === "SUBGENRE_OF" ? "p" : r.statut]).filter(([a, b]) => pos[a] && pos[b]);
  const cx = (id, s) => pos[id].x + (s ? pos[id].w : 0), cy = id => pos[id].y + 11, vis = aretes.filter(([a, b]) => FRISE.tout || (allum && allum.has(a) && allum.has(b)));
  let svg = `<svg width="${larg}" height="${haut}" role="group" aria-label="Frise des musiques">`;
  for (let a = 1900; a <= 2020; a += 10) svg += `<line x1="${MARGE + (a - AN0) * PX}" x2="${MARGE + (a - AN0) * PX}" y1="22" y2="${haut}" stroke="#ddd" stroke-width="${a % 50 ? 1 : 2}"/><text x="${MARGE + (a - AN0) * PX + 3}" y="16" fill="#555">${a}</text>`;
  D.families.filter(f => FRISE.fam.has(f.id)).forEach(f => { svg += `<text x="6" y="${fy[f.id][0] + 15}" style="font:600 12px var(--f-txt)" fill="${COUL[f.id]}">${esc(f.name.split(",")[0].split(" ").slice(0, 2).join(" "))}</text>`; });
  vis.forEach(([a, b, n]) => { const x1 = cx(a, 1), y1 = cy(a), x2 = cx(b, 0), y2 = cy(b), m = Math.max(30, Math.abs(x2 - x1) / 2); svg += `<path class="lien-svg" d="M${x1},${y1} C${x1 + m},${y1} ${x2 - m},${y2} ${x2},${y2}" stroke="${n === "p" ? "#999" : "#11110F"}" ${n === "interpretation" ? 'stroke-dasharray="5 4"' : ""} opacity="${n === "p" ? .5 : .9}"/>`; });
  D.entries.forEach(e => { const p = pos[e.id]; if (!p) return; const f = allum && !allum.has(e.id);
    svg += `<g class="noeud${e.id === sel ? " sel" : ""}${f ? " fondu" : ""}" tabindex="0" role="button" aria-label="${esc(e.name)}, ${e.period.start}" data-id="${e.id}"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="22" rx="11" fill="${COUL[e.family]}"/><text x="${p.x + 9}" y="${p.y + 15}" fill="#fff">${esc(e.name)}</text></g>`; });
  $("#cw").innerHTML = svg + "</svg>";
  $("#cw").querySelectorAll(".noeud").forEach(n => { const go = () => { FRISE.sel = n.dataset.id; dessinerFrise(); detailFrise(); }; n.onclick = go; n.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } }; });
  if (sel) { const p = pos[sel], cw = $("#cw"); cw.scrollLeft = Math.max(0, p.x - cw.clientWidth / 3); }
}
function detailFrise() {
  const e = FRISE.sel && E[FRISE.sel]; if (!e) { $("#detail").innerHTML = `<p class="petit">Choisis une étiquette pour voir son histoire.</p>`; return; }
  $("#detail").innerHTML = `<div class="fiche-tete" style="--c:${coul(e)}"><h3 style="font:400 1.5rem var(--f-aff)">${esc(e.name)}</h3><div class="meta"><span>${esc(periode(e))}</span><span>${esc(e.region)}</span></div><p>${esc(e.description)}</p><div class="pastilles"><a class="pastille clair" href="#e/${e.id}">Comprendre cette musique &#8250;</a></div></div>`;

function brancherFrise() {
